a{color:var(--accent)}

.vf-btns{display:flex; gap:8px}
.vf-btns button{

.vf-btns button[data-choice="true"]{border-color:var(--tag-true)}

.vf-reveal.correct .verdict{background:var(--tag-true); color:#fff}
.vf-reveal.incorrect .verdict{background:var(--tag-false); color:#fff}
.vf-reset{margin-top:6px; background:none; border:1px solid var(--accent); color:var(--accent); padding:10px 16px; border-radius:8px; font-size:13px; cursor:pointer}

.tools-cat h3{font-size:15px; margin:20px 0 8px; display:flex; align-items:center; gap:8px}
.tools-cat h3:first-child{margin-top:4px}
.tool{background:var(--bg-raised); border:1px solid var(--line); border-radius:9px; padding:11px 13px; margin-bottom:8px}
.tool a{font-weight:700; font-size:14px; text-decoration:none; display:block; margin-bottom:3px}
.tool p{margin:0; font-size:12.5px; color:var(--ink-soft)}

.plan-row{display:grid; grid-template-columns:auto 1fr; gap:10px; padding:10px 0; border-bottom:1px solid var(--line)}

.plan-row .what b{display:block; font-size:14px; margin-bottom:2px}
.plan-row .what p{margin:0; font-size:12.5px; color:var(--ink-soft)}

.obj-list{padding-left:18px; margin:0; font-size:13.5px}
.obj-list li{margin-bottom:6px}

footer.note{font-size:11.5px; color:var(--ink-soft); text-align:center; margin-top:30px; padding-bottom:10px}
.topback{display:inline-block; font-size:12.5px; color:var(--accent); text-decoration:none; margin:10px 0 2px}
.topback:hover{text-decoration:underline}

function saveProgress(){
  try{ localStorage.setItem("dd_progress_v1", JSON.stringify(progress)); }catch(e){}

}
function getModProg(id){
  if(!progress[id]) progress[id] = {vf:{}};
  if(!progress[id].vf) progress[id].vf = {};
  return progress[id];
}

/* ---- V/F ---- */
function vfHtml(m){
  var mp = getModProg(m.id);
  var answered = Object.keys(mp.vf).length;
  var correct = 0;
  Object.keys(mp.vf).forEach(function(k){ if(mp.vf[k].correct) correct++; });
  var html = '<div class="vf-score"><span class="big">'+correct+'/'+m.vf.length+'</span><span>acertos'+(answered?(' · '+answered+' respondidas'):'')+'</span></div>';
  m.vf.forEach(function(item, i){
    var saved = mp.vf[i];
    html += '<div class="vf-q" data-idx="'+i+'"><p class="stmt">'+item[0]+'</p>';
    html += '<div class="vf-btns">'+
      '<button data-choice="true" onclick="DD.answerVf(\''+m.id+'\','+i+',true)">Verdadeiro</button>'+
      '<button data-choice="false" onclick="DD.answerVf(\''+m.id+'\','+i+',false)">Falso</button>'+
      '</div>';
    var revealClass = "vf-reveal";
    if(saved) revealClass += " show " + (saved.correct?"correct":"incorrect");
    html += '<div class="'+revealClass+'" id="reveal-'+i+'">';
    if(saved){
      html += vfRevealContent(item, saved);
    }
    html += '</div></div>';
  });
  html += '<button class="vf-reset" onclick="DD.resetVf(\''+m.id+'\')">Reiniciar esta rodada</button>';
  return html;
}
function vfRevealContent(item, saved){
  var verdictTxt = item[1] ? "VERDADEIRO" : "FALSO";
  var c = saved.correct ? "Você acertou." : "Você errou — resposta certa: "+verdictTxt+".";
  return '<span class="verdict">'+verdictTxt+'</span><p style="margin:4px 0 0">'+c+' '+item[2]+'</p>';
}
function initVf(m){} // interaction via inline onclick
function answerVf(modId, idx, choice){
  var m = modules.filter(function(x){return x.id===modId})[0];
  var mp = getModProg(modId);
  if(mp.vf[idx]) return; // already answered, locked
  var item = m.vf[idx];
  var correct = (choice === item[1]);
  mp.vf[idx] = {choice:choice, correct:correct};
  saveProgress();
  // re-render just this question + score
  var qEl = document.querySelector('.vf-q[data-idx="'+idx+'"]');
  var reveal = document.getElementById("reveal-"+idx);
  reveal.className = "vf-reveal show " + (correct?"correct":"incorrect");
  reveal.innerHTML = vfRevealContent(item, mp.vf[idx]);
  // update score header
  var answered = Object.keys(mp.vf).length;
  var correctCt = 0;
  Object.keys(mp.vf).forEach(function(k){ if(mp.vf[k].correct) correctCt++; });
  var scoreEl = document.querySelector(".vf-score");
  if(scoreEl) scoreEl.innerHTML = '<span class="big">'+correctCt+'/'+m.vf.length+'</span><span>acertos · '+answered+' respondidas</span>';
}
function resetVf(modId){
  progress[modId] = {vf:{}};
  saveProgress();
  renderModule();
}

/* ---------- RENDER: TOOLS ---------- */
function renderTools(){
  var html = '<h2 style="margin:0 0 4px">Caixa de Ferramentas</h2>';
  html += '<p class="lede">Sites e extensões reais para aplicar em sala — todos gratuitos para uso básico.</p>';
  tools.forEach(function(cat){
    html += '<div class="tools-cat"><h3>'+cat.cat+'</h3>';
    cat.items.forEach(function(t){
      html += '<div class="tool"><a href="https://'+t[1]+'" target="_blank" rel="noopener">'+t[0]+'</a><p class="mono" style="margin-bottom:4px;color:var(--accent);font-size:11px">'+t[1]+'</p><p>'+t[2]+'</p></div>';
    });
    html += '</div>';
  });
  document.getElementById("main").innerHTML = html;
}

/* ---------- RENDER: TEACHER GUIDE ---------- */
function renderGuide(){
  var html = '<h2 style="margin:0 0 4px">Guia do Professor</h2>';
  html += '<p class="lede">Sequência sugerida para uma oficina de aproximadamente 3h30 (ou dividida em 4 encontros de 50 min, um por módulo).</p>';
  html += '<div class="card"><p class="tagline">Objetivos de aprendizagem</p><ul class="obj-list">';
  objectives.forEach(function(o){ html += "<li>"+o+"</li>"; });
  html += '</ul></div>';
  html += '<div class="card" style="margin-top:14px"><p class="tagline">Roteiro sugerido</p>';
  planRows.forEach(function(r){
    html += '<div class="plan-row"><div class="when">'+r[0]+'</div><div class="what"><p>'+r[1]+'</p></div></div>';
  });
  html += '</div>';
  html += '<div class="card" style="margin-top:14px"><p class="tagline">Avaliação</p>'+
    '<p style="margin:0">Use a pontuação do V/F de cada módulo como termômetro de compreensão (não como nota final) e peça que cada grupo entregue por escrito as respostas do estudo de caso (PBL) do seu módulo — isso avalia aplicação, não só memorização.</p></div>';
  document.getElementById("main").innerHTML = html;
}

/* ---------- MAIN RENDER ---------- */
function render(){
  renderTabs();
  if(state.view==="home") renderHome();
  else if(state.view==="module") renderModule();
  else if(state.view==="tools") renderTools();
  else if(state.view==="guide") renderGuide();
}

window.DD = {go:go, openModule:openModule, setDrawer:setDrawer, flipCard:flipCard, fcNav:fcNav, answerVf:answerVf, resetVf:resetVf};

if(window.claude && window.claude.hot){
  window.claude.hot.ready ? window.claude.hot.ready(function(data){ if(data&&data.state) state=data.state; render(); }) : render();
  if(window.claude.hot.snapshot) window.claude.hot.snapshot(function(){ return {state:state}; });
}else{
  render();
}

window.PROGRESSO_ID = "detetives-digitais-v1";
window.PROGRESSO_DADOS = function(){
  var feitas=0, total=0, pontos=0, correctas=0, detalhe={};
  modules.forEach(function(m){
    var mp = getModProg(m.id);
    var respondidas = Object.keys(mp.vf).length;
    var acertos = 0;
    Object.keys(mp.vf).forEach(function(k){ if(mp.vf[k].correct) acertos++; });
    feitas += respondidas; total += m.vf.length; correctas += acertos;
    detalhe[m.id] = respondidas + "/" + m.vf.length + " (" + acertos + " certas)";
  });
  pontos = feitas*10 + correctas*5;
  return { feitas: feitas, total: total, pontos: pontos, detalhe: detalhe };
};
})();
