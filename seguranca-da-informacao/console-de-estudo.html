<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Console SegInfo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
:root{
  --bg:#F2F5F4; --surface:#FFFFFF; --sunk:#E8EEEC; --ink:#15222A; --muted:#566870; --line:#D6DFDC;
  --accent:#1F5135; --accent-ink:#FFFFFF; --accent-soft:#E3EEE7; --amber:#A96400; --amber-soft:#F7E7CC;
  --ok:#23734A; --ok-soft:#DDF0E4; --bad:#B0281F; --bad-soft:#F8DEDB;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --cond:"IBM Plex Sans Condensed","IBM Plex Sans",system-ui,sans-serif;
  --r:10px;
  --blue:#2F6FCF; --sc-wall:#E4ECEA; --sc-floor:#C9D3D0; --sc-glass:#BFDDF0; --sc-wood:#C9A47A; --sc-metal:#9AA7AD; --sc-dark:#3A4A52; --sc-screen:#7FB8D9;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0E1618; --surface:#152125; --sunk:#1B2A2F; --ink:#E3ECEA; --muted:#93A6A9; --line:#29393E;
    --accent:#6BAA68; --accent-ink:#12241A; --accent-soft:#1A2D20; --amber:#E6A640; --amber-soft:#3A2D14;
    --ok:#5CC98B; --ok-soft:#173526; --bad:#F07A70; --bad-soft:#3D1D1A;
    --blue:#6FA4F2; --sc-wall:#1B2A2F; --sc-floor:#24363C; --sc-glass:#2C4A5C; --sc-wood:#7A5E3E; --sc-metal:#5E6E75; --sc-dark:#0B1316; --sc-screen:#2F6E8F;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0E1618; --surface:#152125; --sunk:#1B2A2F; --ink:#E3ECEA; --muted:#93A6A9; --line:#29393E;
  --accent:#6BAA68; --accent-ink:#12241A; --accent-soft:#1A2D20; --amber:#E6A640; --amber-soft:#3A2D14;
  --ok:#5CC98B; --ok-soft:#173526; --bad:#F07A70; --bad-soft:#3D1D1A;
  --blue:#6FA4F2; --sc-wall:#1B2A2F; --sc-floor:#24363C; --sc-glass:#2C4A5C; --sc-wood:#7A5E3E; --sc-metal:#5E6E75; --sc-dark:#0B1316; --sc-screen:#2F6E8F;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55}
button,textarea,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:grid;grid-template-columns:280px minmax(0,1fr);min-height:100%}
/* sidebar */
.side{background:var(--surface);border-right:1px solid var(--line);padding:20px 14px 24px;position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column;gap:18px}
.brand{padding:0 8px;display:flex;flex-direction:column;gap:2px}
.brand .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.brand h1{font-family:var(--cond);font-weight:700;font-size:22px;line-height:1.1;margin:0;text-wrap:balance}
.brand p{margin:0;color:var(--muted);font-size:12.5px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav .grp{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:10px 8px 4px}
.nav button{all:unset;cursor:pointer;display:grid;grid-template-columns:30px 1fr auto;align-items:center;gap:8px;padding:7px 8px;border-radius:8px;font-size:14px}
.nav button:hover{background:var(--sunk)}
.nav button[aria-current="true"]{background:var(--accent-soft);color:var(--ink)}
.nav button:focus-visible{outline:2px solid var(--accent)}
.nav .num{font-family:var(--mono);font-size:12px;color:var(--muted);text-align:center}
.nav button[aria-current="true"] .num{color:var(--accent);font-weight:600}
.nav .pct{font-family:var(--mono);font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.nav .ico{width:30px;text-align:center;font-family:var(--mono);color:var(--muted)}
.side .foot{margin-top:auto;padding:0 8px;display:flex;flex-direction:column;gap:8px;font-size:12.5px;color:var(--muted)}
.switch{display:flex;align-items:center;gap:8px;cursor:pointer}
.switch input{accent-color:var(--accent);width:16px;height:16px}
/* main */
main{padding-block:28px 64px;padding-inline:clamp(16px,4vw,48px);max-width:1080px;width:100%}
.mhead{display:flex;flex-direction:column;gap:6px;margin-bottom:18px}
.mhead .eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.06em;color:var(--accent);text-transform:uppercase}
.mhead h2{font-family:var(--cond);font-weight:700;font-size:clamp(26px,3.4vw,36px);line-height:1.1;margin:0;text-wrap:balance}
.mhead p{margin:0;color:var(--muted);max-width:68ch}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:22px;overflow-x:auto;scrollbar-width:thin}
.tabs button{all:unset;cursor:pointer;padding:10px 14px;font-weight:500;font-size:14px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;display:flex;gap:8px;align-items:center}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tabs button:focus-visible{outline:2px solid var(--accent)}
.tabs .ct{font-family:var(--mono);font-size:11px;background:var(--sunk);border-radius:99px;padding:1px 7px;color:var(--muted);font-variant-numeric:tabular-nums}
.tabs button[aria-selected="true"] .ct{background:var(--accent-soft);color:var(--accent)}
.intro{background:var(--sunk);border-radius:var(--r);padding:12px 16px;color:var(--muted);font-size:14px;margin-bottom:18px;max-width:78ch}
.intro b{color:var(--ink)}
/* resumo */
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.rcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.rcard h4{margin:0;font-family:var(--cond);font-size:17px;font-weight:600}
.rcard p{margin:0;font-size:14px;color:var(--muted)}
.sec-t{font-family:var(--mono);font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:26px 0 10px}
/* items */
.list{display:flex;flex-direction:column;gap:12px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.item.done{border-color:color-mix(in srgb,var(--accent) 40%,var(--line))}
.qrow{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start}
.qn{font-family:var(--mono);font-size:12px;color:var(--accent);background:var(--accent-soft);border-radius:6px;padding:2px 7px;font-weight:600;font-variant-numeric:tabular-nums;margin-top:2px}
.q{font-weight:500;margin:0}
textarea{width:100%;min-height:74px;resize:vertical;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 11px;font-size:14px;line-height:1.5}
textarea:focus{border-color:var(--accent);outline:none}
.ctrl{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.chk{display:flex;gap:7px;align-items:center;font-size:13.5px;color:var(--muted);cursor:pointer}
.chk input{accent-color:var(--accent);width:16px;height:16px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 14px;font-weight:500;font-size:14px}
.btn:hover:not(:disabled){border-color:var(--accent)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.pri:hover:not(:disabled){filter:brightness(1.08)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.hint{font-size:12.5px;color:var(--muted)}
.ans{background:var(--accent-soft);border-radius:8px;padding:12px 14px;font-size:14.5px;display:flex;flex-direction:column;gap:6px}
.ans .lbl{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-weight:600}
.ans.ok{background:var(--ok-soft)} .ans.ok .lbl{color:var(--ok)}
.ans.bad{background:var(--bad-soft)} .ans.bad .lbl{color:var(--bad)}
.rate{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px;color:var(--muted)}
.rate button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:3px 11px;font-size:13px}
.rate button[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
/* vf */
.vf{display:flex;gap:6px}
.vf button{min-width:52px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 12px;font-family:var(--mono);font-weight:600}
.vf button[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.vf button:disabled{cursor:default}
/* flash */
.deck{display:flex;flex-direction:column;align-items:center;gap:14px}
.fc{width:min(620px,100%);aspect-ratio:16/9;max-width:100%;perspective:1400px;cursor:pointer;border:none;background:none;padding:0}
.fc .in{position:relative;width:100%;height:100%;transition:transform .5s cubic-bezier(.2,.7,.2,1);transform-style:preserve-3d}
.fc.flip .in{transform:rotateY(180deg)}
.fc .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:14px;border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 28px;text-align:center;gap:10px}
.fc .front{background:var(--surface)}
.fc .back{background:var(--accent-soft);transform:rotateY(180deg)}
.fc .tag{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.fc .term{font-family:var(--cond);font-size:clamp(24px,4vw,36px);font-weight:700;line-height:1.1;text-wrap:balance}
.fc .def{font-size:clamp(15px,2vw,18px);line-height:1.5;max-width:46ch}
.deckbar{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center}
.pos{font-family:var(--mono);font-size:13px;color:var(--muted);min-width:64px;text-align:center;font-variant-numeric:tabular-nums}
.dots{display:flex;gap:4px;flex-wrap:wrap;justify-content:center;max-width:620px}
.dots span{width:10px;height:10px;border-radius:3px;background:var(--sunk);border:1px solid var(--line)}
.dots span.k{background:var(--ok);border-color:var(--ok)} .dots span.n{background:var(--amber);border-color:var(--amber)} .dots span.cur{outline:2px solid var(--accent);outline-offset:1px}
/* pbl */
.pbl h4{margin:0;font-family:var(--cond);font-size:19px;font-weight:600}
.pbl .cen{margin:0;background:var(--sunk);border-radius:8px;padding:10px 14px;font-size:14.5px}
.pbl ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:3px;font-size:14.5px}
.kicker{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--amber);font-weight:600}
/* dashboard */
.hero{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:18px;margin-bottom:22px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;display:flex;flex-direction:column;gap:10px}
.panel h3{margin:0;font-family:var(--cond);font-size:19px;font-weight:600}
.panel p{margin:0}
.big{font-family:var(--cond);font-weight:700;font-size:48px;line-height:1;font-variant-numeric:tabular-nums}
.bar{height:8px;background:var(--sunk);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .4s}
.legend{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 16px;font-size:13.5px}
.legend div{display:flex;gap:8px;align-items:baseline}
.legend b{font-family:var(--mono);font-size:12px;color:var(--accent)}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.mcard{all:unset;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.mcard:hover{border-color:var(--accent)}
.mcard:focus-visible{outline:2px solid var(--accent)}
.mcard .n{font-family:var(--mono);font-size:12px;color:var(--accent)}
.mcard h4{margin:0;font-family:var(--cond);font-size:17px;font-weight:600;line-height:1.2}
.mcard .src{font-size:12px;color:var(--muted)}
.mcard .meta{display:flex;justify-content:space-between;font-family:var(--mono);font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.ementa{font-size:14px;color:var(--muted)}
/* labs */
.lab{background:var(--surface);border:1px dashed color-mix(in srgb,var(--accent) 55%,var(--line));border-radius:var(--r);padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.lab h4{margin:0;font-family:var(--cond);font-size:18px;font-weight:600}
.lab label{font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.lab input[type=text]{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-family:var(--mono);font-size:14px;width:100%}
.lab input[type=range]{accent-color:var(--accent);width:100%}
.out{font-family:var(--mono);font-size:14px;background:var(--sunk);border-radius:8px;padding:10px 12px;word-break:break-all;min-height:40px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.bf{overflow-x:auto;max-height:230px;overflow-y:auto;border:1px solid var(--line);border-radius:8px}
.bf table{border-collapse:collapse;width:100%;font-family:var(--mono);font-size:12.5px}
.bf td{padding:4px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.bf td:first-child{color:var(--muted);width:40px;font-variant-numeric:tabular-nums}
mark{background:var(--amber-soft);color:var(--ink);border-radius:2px}
/* simulado */
.score{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.cola h3{font-family:var(--cond);font-size:20px;margin:24px 0 8px}
.cola dl{margin:0;display:grid;grid-template-columns:minmax(150px,220px) 1fr;gap:6px 18px;font-size:14px}
.cola dt{font-weight:600}
.cola dd{margin:0;color:var(--muted)}
/* ===== Interativo ===== */
.vz-toc{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.vz-toc a{display:flex;gap:8px;align-items:center;text-decoration:none;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:5px 12px 5px 6px;font-size:13.5px}
.vz-toc a span{font-family:var(--mono);font-size:11px;background:var(--accent-soft);color:var(--accent);border-radius:99px;padding:1px 7px}
.vz-toc a:hover{border-color:var(--accent)}
.vz-card{gap:8px;scroll-margin-top:16px}
.vz-h{margin:0;font-family:var(--cond);font-size:21px;font-weight:600;line-height:1.2}
.vz-d{margin:0 0 6px;color:var(--muted);font-size:14.5px;max-width:72ch}
.vz-body{display:flex;flex-direction:column;gap:12px}
.vz-scene{width:100%;overflow-x:auto}
.vz-svg{width:100%;height:auto;display:block;max-width:100%}
.vz-row{display:flex;gap:18px;align-items:flex-start;flex-wrap:wrap}
.vz-row>.vz-scene{flex:1 1 320px}
.vz-col{flex:1 1 240px;display:flex;flex-direction:column;gap:10px;min-width:0}
.vz-lab{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.vz-lab input[type=text]{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-family:var(--mono);font-size:15px;width:100%}
.vz-lab input[type=range]{accent-color:var(--accent);width:100%}
/* svg parts */
.vz-node rect{fill:var(--surface);stroke:var(--line);stroke-width:1.5;transition:fill .3s,stroke .3s}
.vz-node.on rect{fill:var(--accent-soft);stroke:var(--accent);stroke-width:2.5}
.vz-step [data-n]{transition:opacity .3s}
.vz-step .dim{opacity:.28}
.vz-lbl{fill:var(--ink);font:500 13px var(--sans)}
.vz-lbl.b{font-weight:700;font-size:14px}
.vz-sm{fill:var(--muted);font:12px var(--sans)}
.vz-sm2{fill:var(--ink);font:12.5px var(--sans)}
.vz-ico{font-size:22px}
.vz-ico.sm{font-size:16px}
.vz-big{fill:var(--accent);font:700 30px var(--cond)}
.vz-edge{stroke:var(--muted);stroke-width:2;fill:none;transition:stroke .3s}
.vz-edge.dash{stroke-dasharray:5 5}
.vz-edge.on{stroke:var(--accent);stroke-width:3}
.vz-arrow{fill:var(--muted)}
.vz-badge rect{fill:var(--amber-soft);stroke:var(--amber);stroke-width:2}
.vz-badge:not(.on){opacity:0}
.vz-badge.on{opacity:1}
/* hotspots */
.vz-hs{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start}
.vz-hs>.vz-scene,.vz-hs>.vz-mail{flex:2 1 340px}
.vz-side{flex:1 1 220px;display:flex;flex-direction:column;gap:10px;min-width:0}
.vz-count{font-family:var(--mono);font-size:12px;color:var(--accent)}
.vz-info{background:var(--sunk);border-radius:8px;padding:12px 14px;font-size:14px;min-height:110px}
.vz-info h5{margin:6px 0 4px;font-family:var(--cond);font-size:18px}
.vz-info p{margin:0 0 4px}
.vz-tag{display:inline-block;font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:99px;background:var(--accent-soft);color:var(--accent)}
.vz-leg{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px;color:var(--muted)}
.vz-leg span{display:flex;gap:5px;align-items:center}
.vz-leg i{width:10px;height:10px;border-radius:50%;background:var(--kc)}
.k-ativo{--kc:var(--blue)}.k-vuln{--kc:var(--amber)}.k-ameaca{--kc:var(--bad)}.k-controle{--kc:var(--ok)}
.vz-tag.k-ativo,.vz-tag.k-vuln,.vz-tag.k-ameaca,.vz-tag.k-controle{background:var(--kc);color:#fff}
.vz-mk{cursor:pointer;outline:none}
.vz-mk-c{fill:var(--accent);stroke:var(--surface);stroke-width:3;transition:fill .3s}
.vz-mk-t{fill:var(--accent-ink);font:700 13px var(--mono);pointer-events:none}
.vz-mk:not(.found) .vz-mk-c{animation:vzpulse 1.8s ease-in-out infinite}
.vz-mk.found .vz-mk-c{fill:var(--kc)}
.vz-mk.found .vz-mk-t{fill:#fff}
.vz-mk.cur .vz-mk-c,.vz-mk:focus-visible .vz-mk-c{stroke:var(--ink);stroke-width:3}
@keyframes vzpulse{0%,100%{stroke-width:3}50%{stroke-width:8}}
/* scene drawing */
.sc-wall{fill:var(--sc-wall)}.sc-floor{fill:var(--sc-floor)}.sc-glass{fill:var(--sc-glass)}.sc-glass.open{opacity:.7}
.sc-frame{fill:none;stroke:var(--sc-dark);stroke-width:3}.sc-door{fill:var(--sc-wood);stroke:var(--sc-dark);stroke-width:2}
.sc-dark{fill:var(--sc-dark)}.sc-metal{fill:var(--sc-metal)}.sc-wood{fill:var(--sc-wood)}.sc-screen{fill:var(--sc-screen)}.sc-obj{fill:var(--surface);stroke:var(--sc-dark);stroke-width:2}
.sc-person{fill:#8E6FB0}.sc-postit{fill:#F4D35E}.sc-folder{fill:#E8B64A}.sc-usb{fill:#3B7DD8}.sc-ext{fill:#D64545}.sc-led{fill:#4CD07D}
.sc-lock{fill:#D9A93B}.sc-lockarc{fill:none;stroke:#D9A93B;stroke-width:2.5}
.sc-cloud{fill:#9AA7B5}.sc-rain{stroke:#5E8FC6;stroke-width:2.5;stroke-linecap:round}
.sc-cable{fill:none;stroke:#E0A030;stroke-width:3}
.sc-tiny{font:700 9px var(--mono);fill:#2a2a2a}
/* sorter */

<script>
const MODS=[];
MODS.push({
id:"m1", titulo:"Introdução à Segurança da Informação", curto:"Introdução",
fonte:"Slides 01 · SEC2026 (3–35)",
objetivo:"Entender por que a segurança da informação importa, qual o valor da informação para as organizações, quem são os invasores e como a criptografia nasceu para proteger mensagens.",
resumo:[
["Por que se preocupar?","A informação é um dos ativos de maior valor das organizações. Transações bancárias, e-commerce e troca de dados sigilosos acontecem pela internet, e ninguém está 100% seguro nela."],
["Evolução","Do papel trancado em armários (segurança física) aos mainframes (segurança centralizada) e às redes distribuídas, que exigem equipes cada vez mais especializadas."],
["Valor × esforço","O esforço para proteger uma informação depende do valor que ela tem. Antivírus sozinho não basta: é preciso um plano de segurança."],
["Mitos","“Isso nunca vai acontecer conosco”, “segurança é problema da TI”, “Linux não pega vírus”, “nosso parceiro é confiável, pode liberar o acesso”."],
["Invasores","Hacker (conhecimento profundo, cria técnicas), Cracker (age para causar dano ou lucrar) e Script Kiddie (pouco conhecimento, usa ferramentas prontas)."],
["Criptografia","Kryptós (oculto) + gráphein (escrita). Torna a informação ilegível a quem não está autorizado e garante a Confidencialidade. Exemplo clássico: a Cifra de César."]
],
lab:"cesar",
caderno:[
{q:"Explique com suas palavras por que a informação é considerada um dos ativos mais valiosos de uma organização. Dê dois exemplos.",r:"Porque decisões, operações, vendas e relacionamento com clientes dependem dela; sua perda, vazamento ou alteração causa prejuízo financeiro, legal e de imagem. Exemplos: cadastro de clientes de uma loja; planilha de custos e preços de uma empresa; histórico médico em um hospital."},
{q:"Descreva a evolução da segurança da informação desde a era do papel até as redes atuais.",r:"Na era do papel, proteger era trancar documentos e restringir o acesso físico. Com os computadores de grande porte, a segurança ficou mais sofisticada, porém centralizada. Com as redes e a internet, os dados passaram a circular por muitos sistemas, e a complexidade exigiu equipes especializadas e controles técnicos, físicos e administrativos."},
{q:"Por que “usar um bom antivírus” não é suficiente para uma empresa estar segura?",r:"O antivírus trata só uma parte das ameaças (malware conhecido). Não cobre engenharia social, senhas fracas, configuração errada, falhas humanas, desastres físicos, falta de backup ou de política. Segurança exige um conjunto de controles (pessoas, processos e tecnologia) planejados a partir dos riscos."},
{q:"Escolha três mitos sobre segurança apresentados na aula e refute cada um.",r:"Exemplos: “Nunca fomos atacados” — muitos ataques passam despercebidos; ausência de evidência não é evidência de ausência. “Segurança é responsabilidade da TI” — todos os usuários manipulam informação e podem ser a porta de entrada (phishing). “Linux não pega vírus” — existe malware para Linux, e servidores Linux são alvos frequentes."},
{q:"Diferencie Hacker, Cracker e Script Kiddie quanto a conhecimento e intenção.",r:"Hacker: alto conhecimento de programação e SO, cria as próprias técnicas, costuma compartilhar conhecimento e, na maioria dos casos, não causa danos. Cracker: usa técnicas de invasão para obter vantagem ou causar dano (roubo de dados, cartões, espionagem, destruição). Script Kiddie: pouco conhecimento, usa ferramentas de terceiros e explora falhas já conhecidas, geralmente só para “dizer que invadiu”."},
{q:"Qual a origem da palavra criptografia e qual pilar da segurança ela garante principalmente?",r:"Do grego kryptós (oculto, escondido) + gráphein (escrita): “escrita oculta”. Garante principalmente a Confidencialidade, tornando a mensagem ilegível para quem não tem a chave."},
{q:"Cifre a palavra SEGURANCA usando a Cifra de César com deslocamento 3.",r:"S→V, E→H, G→J, U→X, R→U, A→D, N→Q, C→F, A→D. Resultado: VHJXUDQFD."},
{q:"Decifre a mensagem “LIV” sabendo que foi cifrada com César deslocamento 3.",r:"Volta 3 posições em cada letra: L→I, I→F, V→S. Resultado: IFS."},
{q:"Por que a Cifra de César é considerada fraca hoje? Quantas chaves possíveis ela tem no alfabeto de 26 letras?",r:"Tem apenas 25 deslocamentos úteis (26 contando o zero), então um atacante testa todos em segundos (força bruta). Além disso, preserva a frequência das letras, o que permite análise de frequência."},
{q:"A frase “O esforço para proteger a informação depende do valor da informação” tem qual implicação prática para um gestor?",r:"Que não se protege tudo igual: primeiro identificam-se os ativos e seu valor; informações críticas recebem controles mais fortes (criptografia, acesso restrito, backup redundante), e informações públicas recebem controles mínimos. Isso evita gastar demais onde não precisa e de menos onde é crítico."},
{q:"Responda ao questionário da aula: “Se a sua TI parasse, o que aconteceria?” Pense em uma escola e descreva os impactos.",r:"Resposta pessoal. Exemplo: sem SUAP/sistema acadêmico não se lançam notas nem frequência; sem internet não há e-mail nem ambiente virtual; secretaria não emite documentos; aulas de laboratório param. Mostra a dependência da TI e a necessidade de disponibilidade e plano de contingência."},
{q:"Por que sistemas muito complexos ou cheios de funcionalidades tendem a ter mais falhas de segurança?",r:"Quanto mais código, integrações e opções, maior a superfície de ataque e a chance de erro de programação ou configuração. Além disso, a pressão por desempenho e prazo faz a segurança ficar em segundo plano."}
],
flash:[
{f:"Criptografia",b:"Técnica que torna a informação ilegível para pessoas não autorizadas. Do grego kryptós (oculto) + gráphein (escrita)."},
{f:"Cifra de César",b:"Cifra de substituição em que cada letra é trocada pela letra N posições à frente no alfabeto (César usava 3)."},
{f:"Hacker",b:"Pessoa com grande conhecimento técnico que tenta quebrar a segurança de sistemas; cria técnicas próprias e costuma compartilhar conhecimento."},
{f:"Cracker",b:"Invasor que age para obter vantagem ou causar dano: roubo de dados, cartões, espionagem industrial, destruição."},
{f:"Script Kiddie",b:"Usuário com pouco conhecimento que usa ferramentas prontas de outras pessoas e explora falhas já conhecidas."},
{f:"Ativo de informação",b:"Tudo que tem valor para a organização e contém, processa ou transmite informação: papel, discos, sistemas e até a memória das pessoas."},
{f:"Plano de segurança",b:"Conjunto planejado de medidas que responde: quais são as ameaças, quais tecnologias usar e como educar os usuários."},
{f:"Mito “segurança é da TI”",b:"Falso: todos que manipulam informação são responsáveis; o elo humano é o alvo preferido da engenharia social."},

pbl:[
{t:"A padaria que achava que não era alvo",c:"A Padaria Sabor do Sertão vende pelo Instagram e recebe pedidos por WhatsApp. O dono diz: “Somos pequenos, nenhum hacker vai querer nossos dados”. Os pedidos ficam numa planilha compartilhada com link público, com nome, endereço e telefone dos clientes.",p:["Quais mitos aparecem na fala do dono?","Que informações têm valor ali e para quem?","Proponha 4 medidas simples e baratas."],r:"Mitos: “isso nunca vai acontecer conosco” e “não somos alvo”. Ataques automatizados não escolhem tamanho. Valor: dados pessoais dos clientes (servem para golpes e phishing), faturamento e reputação. Medidas: retirar o link público e compartilhar só com pessoas específicas; ativar verificação em duas etapas no WhatsApp e no Instagram; fazer backup semanal da planilha; orientar funcionários sobre golpes de falso cliente e links suspeitos."},
{t:"Mensagem secreta do grêmio",c:"O grêmio estudantil quer combinar a data de um evento surpresa usando a Cifra de César e publicou no mural: “IHVWDVHAWD”.",p:["Descubra a mensagem testando deslocamentos (use o laboratório da aba Resumo).","Quantas tentativas no máximo seriam necessárias?","Proponha uma forma melhor de manter o segredo."],r:"Com deslocamento 3, voltando cada letra: I→F, H→E, V→S, W→T, D→A, V→S, H→E, A→X, W→T, D→A = FESTASEXTA (“festa sexta”). No máximo 25 tentativas quebram qualquer Cifra de César, então ela não protege de verdade: qualquer colega descobre. Melhor: usar um canal com criptografia moderna (app com criptografia ponta a ponta, grupo fechado) e limitar quem sabe a data."},
{t:"Quem invadiu o site?",c:"O site de um campus foi alterado e passou a exibir uma mensagem “hackeado by X” com a imagem de um meme. A investigação mostrou que foi usada uma ferramenta pública que explorava uma falha antiga do CMS, sem nenhuma outra ação.",p:["Qual perfil de invasor é mais provável? Justifique.","Qual falha de gestão permitiu o ataque?","Que ações a equipe deve tomar agora?"],r:"Perfil provável: Script Kiddie — ferramenta pronta, falha conhecida, objetivo de exibição, sem roubo. Falha de gestão: CMS desatualizado (falta de gerenciamento de patches). Ações: restaurar o site do backup, atualizar o CMS e plugins, trocar senhas, revisar logs, verificar se não ficou backdoor e criar rotina mensal de atualização."},
{t:"Diagnóstico de maturidade",c:"Use as 4 perguntas do questionário da aula (TI parada, informações seguras, item mais importante, próximo investimento) para entrevistar um comércio do seu bairro.",p:["Registre as respostas do entrevistado.","Classifique a maturidade: baixa, média ou alta.","Escreva 3 recomendações priorizadas."],r:"Rubrica: (1) as 4 perguntas aplicadas e respostas registradas; (2) classificação justificada — respostas “d” (avaliação de risco, política, treinamento) indicam maturidade maior; (3) recomendações priorizadas começando por avaliação de riscos e conscientização, depois backup e controles técnicos. Não há resposta única: avalie coerência entre diagnóstico e recomendações."}
]

MODS.push({
id:"m2", titulo:"Conceitos Fundamentais e Terminologia", curto:"Conceitos",
fonte:"Slides 02 · SEC2026 (36–43, 60–62, 73–76)",
objetivo:"Dominar o vocabulário básico da área (ativo, ameaça, vulnerabilidade, ataque, incidente, controle e risco) e conhecer o Cubo de McCumber como modelo para pensar a segurança.",
resumo:[
["Ativo","Qualquer recurso que contém, processa ou transmite informação e tem valor: servidores, bancos de dados, documentos, pessoas."],
["Vulnerabilidade","Fraqueza ou falha que pode ser explorada. Pode surgir no projeto, na implementação, na operação ou no gerenciamento."],
["Ameaça","Circunstância com potencial de causar dano. ISO/IEC 27002: causa potencial de um incidente indesejado."],
["Ataque × Incidente","Ataque é a ação maliciosa para comprometer um ativo. Incidente é a ocorrência efetiva do ataque, a exploração da vulnerabilidade."],
["Controle","Medida para reduzir o risco. Tipos: preventivo (evita), detectivo (identifica) e corretivo (recupera)."],
["Cubo de McCumber (1991)","Três dimensões: princípios (C, I, D), estados da informação (processamento, armazenamento, transmissão) e medidas (tecnologia, políticas e procedimentos, conscientização/educação)."]
],
caderno:[
{q:"Defina ativo e liste 5 ativos de informação de uma escola.",r:"Ativo é qualquer recurso de valor que contém, processa ou transmite informação. Na escola: sistema acadêmico, diários de classe, servidor de arquivos, notebooks da coordenação, os próprios servidores e professores (conhecimento), fichas de matrícula em papel, rede Wi-Fi."},
{q:"Explique a diferença entre ameaça e vulnerabilidade com um exemplo do cotidiano.",r:"Vulnerabilidade é a fraqueza (uma janela sem tranca); ameaça é o que pode explorá-la (um ladrão no bairro, uma chuva forte). Em TI: senha “123456” é a vulnerabilidade; um atacante fazendo força bruta é a ameaça."},
{q:"Qual a diferença entre ataque e incidente?",r:"Ataque é a ação maliciosa (tentativa de comprometer). Incidente é a ocorrência concreta, quando o ataque é bem-sucedido ou gera um evento de segurança que afeta a organização, como a exploração de uma vulnerabilidade."},
{q:"Classifique cada controle como preventivo, detectivo ou corretivo: (a) câmera de segurança; (b) backup restaurado após ransomware; (c) firewall bloqueando porta; (d) alarme de intrusão; (e) catraca com crachá.",r:"(a) detectivo (também dissuasivo); (b) corretivo; (c) preventivo; (d) detectivo; (e) preventivo."},
{q:"Por que se diz que “a existência de uma vulnerabilidade implica uma ameaça”?",r:"Porque uma fraqueza conhecida ou existente pode, em algum momento, ser descoberta e explorada por alguém ou algo. Se existe a porta aberta, existe o potencial de alguém entrar; o risco nasce da combinação entre ambas."},
{q:"Desenhe o Cubo de McCumber e nomeie as três faces com seus três elementos cada.",r:"Face 1 – Princípios: Confidencialidade, Integridade, Disponibilidade. Face 2 – Estados da informação: Processamento, Armazenamento, Transmissão. Face 3 – Medidas de segurança: Tecnologia; Políticas e Procedimentos; Conscientização, Treinamento e Educação. São 27 células combinando as três dimensões."},
{q:"Dê um exemplo de uma “célula” do Cubo de McCumber (um item de cada face) aplicado à realidade.",r:"Exemplo: Confidencialidade + Transmissão + Tecnologia = usar HTTPS/TLS para que as notas dos alunos não sejam lidas em trânsito. Outro: Disponibilidade + Armazenamento + Políticas = política de backup diário do servidor."},
{q:"Defina exploit e explique sua relação com vulnerabilidade.",r:"Exploit é um código ou técnica preparada para explorar uma vulnerabilidade conhecida. A vulnerabilidade é a falha; o exploit é a “chave” que a aproveita para obter acesso ou causar dano."},
{q:"O que é risco e como ele se relaciona com ameaça, vulnerabilidade e ativo?",r:"Risco é a possibilidade de uma ameaça explorar uma vulnerabilidade e causar impacto em um ativo. Informalmente: Risco = Probabilidade × Impacto. Sem ativo de valor, sem vulnerabilidade ou sem ameaça, o risco diminui."},
{q:"Por que a medida “conscientização, treinamento e educação” está no mesmo nível de importância que a tecnologia no Cubo?",r:"Porque o fator humano é explorado constantemente (phishing, engenharia social, senhas fracas). Firewalls não impedem um usuário de entregar a senha num e-mail falso; só a conscientização reduz esse risco."},
{q:"Cite três exemplos de ameaças naturais e três de ameaças humanas.",r:"Naturais: enchente, raio, incêndio, terremoto. Humanas: invasor externo, funcionário insatisfeito, erro de um operador que apaga uma tabela, furto de notebook."},
{q:"Relacione: um funcionário deixou a senha num post-it no monitor. Identifique o ativo, a vulnerabilidade, a ameaça e um controle.",r:"Ativo: a conta e os dados que ela acessa. Vulnerabilidade: senha exposta fisicamente. Ameaça: visitante, colega mal-intencionado ou pessoal de limpeza que vê a senha. Controle: política de mesa limpa, treinamento e autenticação em dois fatores."}
],

pbl:[
{t:"Laboratório de informática sem dono",c:"O laboratório do campus tem 30 PCs com a mesma senha de administrador (“lab123”), pendrives entram e saem livremente e não há registro de quem usa cada máquina.",p:["Liste ativos, vulnerabilidades e ameaças.","Monte uma tabela com pelo menos 1 controle preventivo, 1 detectivo e 1 corretivo.","Qual ação você faria primeiro? Por quê?"],r:"Ativos: PCs, softwares licenciados, trabalhos dos alunos, rede do campus. Vulnerabilidades: senha única e fraca, autoexecução de mídias removíveis, ausência de registro. Ameaças: malware via pendrive, aluno instalando programas, alteração de configurações. Controles: preventivo — senha forte e única e bloqueio de autoexecução; detectivo — log de login por usuário e antivírus com relatório; corretivo — imagem padrão para restaurar as máquinas (congelamento). Primeira ação: trocar a senha de administrador, pois é a vulnerabilidade de maior impacto e menor custo."},
{t:"Monte o seu Cubo",c:"Sua equipe deve proteger o sistema de notas do campus usando o Cubo de McCumber.",p:["Escolha 6 células diferentes do cubo.","Para cada célula, descreva uma medida concreta.","Apresente em forma de cartaz."],r:"Exemplos esperados: C+Transmissão+Tecnologia = HTTPS; I+Armazenamento+Tecnologia = hash/log de alteração de notas; D+Armazenamento+Políticas = backup diário; C+Processamento+Conscientização = não deixar sessão aberta; I+Processamento+Políticas = só o professor da disciplina lança nota; D+Transmissão+Tecnologia = link de internet redundante. Avalie se cada medida combina de fato os três elementos escolhidos."},
{t:"O post-it e o estagiário",c:"Um estagiário encontrou a senha do servidor em um post-it e, por curiosidade, entrou e apagou sem querer uma pasta de relatórios. Não havia backup recente.",p:["Isso foi um ataque, um incidente ou os dois? Justifique.","Identifique as vulnerabilidades envolvidas.","Proponha controles para cada vulnerabilidade."],r:"Foi um incidente de segurança (houve dano à integridade e à disponibilidade); pode não ser um ataque intencional, mas houve acesso não autorizado. Vulnerabilidades: senha exposta, conta sem controle de privilégio, ausência de backup. Controles: política de mesa limpa e senhas em cofre; contas individuais com mínimo privilégio; backup automático com teste de restauração; treinamento de estagiários."},

MODS.push({
id:"m3", titulo:"Os Três Pilares da Segurança", curto:"Pilares CID",
fonte:"Slides 03 · SEC2026 (39, 47–59, 84–86)",
objetivo:"Compreender Confidencialidade, Integridade e Disponibilidade, os princípios complementares (autenticidade, não-repúdio, controle de acesso e auditoria) e usar hash e certificados digitais para garantir integridade e autenticidade.",
resumo:[
["Confidencialidade","Informação acessível apenas a pessoas autorizadas. Controles: criptografia, controle de acesso, autenticação forte (2FA)."],
["Integridade","Informação não alterada de forma não autorizada, intencional ou acidental. Controles: hash criptográfico, assinatura digital, auditoria de mudanças."],
["Disponibilidade","Informação acessível quando necessário para quem é autorizado. Controles: redundância, backup e recuperação, monitoramento, manutenção."],
["Princípios complementares","Autenticidade (origem identificada), Não-repúdio (autor não pode negar), Controle de acesso (permitir ou negar), Auditoria (o que foi feito, por quem e quando)."],
["Hash","Algoritmo que mapeia dados de tamanho variável para um resumo de tamanho fixo. MD5 (128 bits) e SHA-1 (160 bits) são inseguros; SHA-256 e SHA-512 (SHA-2) e SHA-3 são recomendados."],
["Ataques e pilares","Interceptar a mensagem fere a confidencialidade; modificá-la fere a integridade; derrubar a conexão fere a disponibilidade."]
],
lab:"hash",
caderno:[
{q:"Defina cada pilar da tríade CID e dê um controle para cada um.",r:"Confidencialidade: só autorizados acessam (criptografia). Integridade: a informação não é alterada sem autorização (hash / assinatura digital). Disponibilidade: a informação está acessível quando necessário (backup e redundância)."},
{q:"Para os objetos carro, celular e conta bancária, descreva o que seria a quebra de C, I e D em cada um (atividade da aula).",r:"Carro — C: alguém lê o histórico de localização do GPS; I: adulteram o hodômetro; D: roubam o carro ou a bateria descarrega. Celular — C: alguém lê suas mensagens; I: um app altera contatos; D: celular bloqueado por ransomware. Conta bancária — C: vazamento do saldo e extrato; I: transferência não autorizada altera o saldo; D: app do banco fora do ar."},
{q:"Um atacante intercepta, altera e depois derruba uma conexão. Quais pilares foram atingidos em cada etapa?",r:"Interceptar: confidencialidade. Alterar: integridade. Derrubar a conexão: disponibilidade."},
{q:"Diferencie autenticidade de não-repúdio.",r:"Autenticidade garante que a origem ou o autor da mensagem é quem diz ser. Não-repúdio garante que o autor não pode negar depois que enviou a mensagem ou realizou a ação. A assinatura digital oferece os dois."},
{q:"O que é uma função hash e quais propriedades a tornam útil para verificar integridade?",r:"É um algoritmo que transforma dados de qualquer tamanho em um resumo de tamanho fixo. Propriedades: determinística (mesma entrada, mesmo hash), pequena mudança na entrada gera hash totalmente diferente (efeito avalanche), é de mão única (não se volta ao original) e resistente a colisões."},
{q:"Por que MD5 e SHA-1 não são mais recomendados?",r:"Porque são vulneráveis a ataques de colisão: é possível gerar dois arquivos diferentes com o mesmo hash, o que permite falsificar um arquivo mantendo o hash “válido”."},
{q:"Escreva o comando para validar o hash SHA-256 de um arquivo no Windows e explique como interpretar o resultado.",r:"certutil -hashfile C:\\Users\\Aluno\\Downloads\\arquivo.iso SHA256. Compara-se o hash exibido com o publicado pelo site oficial: se forem idênticos, o arquivo está íntegro; se diferirem, o arquivo foi corrompido ou adulterado e não deve ser usado."},
{q:"Em um banco, quais pilares costumam ser mais críticos? E em uma universidade? Por quê?",r:"Banco: integridade e auditoria (um centavo errado ou uma transação sem rastro é grave), seguidos de confidencialidade e disponibilidade. Universidade: integridade (notas, diplomas) e disponibilidade (sistemas acadêmicos no período de matrícula). A prioridade depende do negócio."},
{q:"Explique o que é autenticação de dois fatores (2FA) e cite os três tipos de fator.",r:"É exigir duas provas de identidade de categorias diferentes. Fatores: algo que você sabe (senha, PIN), algo que você tem (celular, token), algo que você é (biometria). Reforça a confidencialidade mesmo se a senha vazar."},
{q:"Como a assinatura digital combina hash e criptografia?",r:"Calcula-se o hash do documento e cifra-se esse hash com a chave privada do autor. Quem recebe decifra com a chave pública e compara com o hash que ele mesmo calcula: se forem iguais, o documento é íntegro (integridade) e veio do dono da chave (autenticidade e não-repúdio)."},
{q:"O que é auditoria como princípio de segurança?",r:"É a capacidade de verificar as atividades do sistema e determinar o que foi feito, por quem, quando e o que foi afetado, por meio de logs e trilhas de auditoria."},
{q:"Cite duas medidas para garantir disponibilidade de um site de inscrições em época de alto acesso.",r:"Redundância (mais de um servidor com balanceamento de carga ou nuvem com autoescalonamento), CDN e proteção contra DDoS, monitoramento com alertas e backup com plano de recuperação testado."}
],

vf:[
{a:"Interceptar uma mensagem em trânsito, sem alterá-la, é um ataque à integridade.",v:false,j:"Falso. Apenas ler sem autorização é ataque à confidencialidade; alterar é que fere a integridade."},

pbl:[
{t:"A ISO que veio do espelho",c:"Um professor baixou a ISO de uma distribuição Linux de um site espelho não oficial para instalar no laboratório. O site oficial publica o SHA-256 da imagem. Após a instalação, as máquinas começaram a enviar tráfego estranho.",p:["Qual pilar foi comprometido e como isso poderia ter sido evitado?","Descreva o passo a passo de validação no Windows e no Linux.","Que política o laboratório deveria adotar?"],r:"Pilar: integridade (e autenticidade da origem). Evitaria-se comparando o hash do arquivo com o hash oficial antes de instalar. Windows: certutil -hashfile imagem.iso SHA256; Linux: sha256sum imagem.iso; comparar com o valor do site oficial. Política: baixar só de fontes oficiais, validar hash e, se disponível, a assinatura GPG, e registrar a validação antes de instalar."},
{t:"Tríade na sala de aula",c:"Em grupos, escolham 3 objetos ou serviços do dia a dia (carro, celular, conta bancária, ou outros) e analisem a quebra de cada pilar.",p:["Preencha uma matriz 3×3 (objeto × pilar).","Para cada quebra, proponha um controle.","Apresente o caso mais crítico."],r:"Rubrica: matriz completa com 9 células coerentes (C = acesso indevido, I = alteração indevida, D = indisponibilidade); controle adequado para cada célula (ex.: senha/biometria para C, hash/log para I, backup/redundância para D); justificativa do caso mais crítico considerando impacto."},
{t:"Nota alterada no sistema",c:"Um aluno alega que sua nota foi alterada de 8,5 para 5,0 depois do fechamento do diário. O professor diz que não mexeu. O sistema não guarda histórico de alterações.",p:["Quais princípios de segurança faltaram?","Como provar quem alterou a nota?","Desenhe uma solução técnica e de processo."],r:"Faltaram integridade, auditoria e não-repúdio. Sem logs não é possível provar quem alterou. Solução: trilha de auditoria (usuário, data, hora, valor antigo e novo, IP), bloqueio de edição após fechamento com fluxo de solicitação formal, autenticação individual forte (2FA) e, opcionalmente, hash por registro para detectar adulteração direta no banco."},
{t:"Black Friday fora do ar",c:"Uma loja virtual regional ficou 6 horas fora do ar na Black Friday. Era um único servidor, sem monitoramento, e o backup mais recente tinha 15 dias.",p:["Qual pilar foi afetado e qual o impacto?","Proponha uma arquitetura mínima de alta disponibilidade.","Defina uma política de backup (frequência, local, teste)."],r:"Pilar: disponibilidade; impacto: vendas perdidas, reputação e possível perda de dados de pedidos. Arquitetura: 2 servidores ou nuvem com balanceador, banco com réplica, CDN, monitoramento com alerta por celular. Backup: diário (ou contínuo para o banco), regra 3-2-1 (3 cópias, 2 mídias, 1 fora do local) e teste de restauração mensal."}
]

MODS.push({
id:"m4", titulo:"Ciclo de Vida da Informação", curto:"Ciclo de vida",
fonte:"Slides 04 · SEC2026 (41)",
objetivo:"Identificar as cinco fases do ciclo de vida da informação e os três estados dos dados, aplicando os controles adequados a cada fase.",
resumo:[
["1. Criação / Aquisição","Classificar a informação, definir o nível de sensibilidade e implementar os controles iniciais."],
["2. Processamento","Dados em uso. Aplicar controles de integridade, manter logs de acesso e monitorar modificações."],
["3. Armazenamento","Dados em repouso. Criptografia em repouso, backups e controle de acesso físico e lógico."],
["4. Transmissão","Dados em trânsito. Criptografia em trânsito (TLS, VPN), autenticação e não-repúdio."],
["5. Destruição","Descarte seguro (sobrescrita, desmagnetização, trituração), documentar o processo e cumprir requisitos legais."],
["Estados dos dados","Em processo (sendo usados), em repouso (armazenados) e em trânsito (trafegando entre sistemas)."]
],
caderno:[
{q:"Liste, em ordem, as cinco fases do ciclo de vida da informação.",r:"1) Criação/Aquisição; 2) Processamento; 3) Armazenamento; 4) Transmissão; 5) Destruição."},
{q:"Por que a classificação da informação deve acontecer já na fase de criação?",r:"Porque o nível de sensibilidade define todos os controles das fases seguintes (quem acessa, se precisa de criptografia, como transmitir e como destruir). Classificar depois deixa a informação desprotegida no intervalo."},
{q:"Explique a diferença entre dados em repouso, em trânsito e em processo, com um exemplo de cada.",r:"Em repouso: armazenados (planilha salva no HD, banco de dados em disco). Em trânsito: trafegando pela rede (e-mail sendo enviado, formulário web sendo submetido). Em processo: sendo usados por uma operação (registro sendo atualizado na memória do servidor)."},
{q:"Qual a diferença entre criptografia em repouso e criptografia em trânsito?",r:"Em repouso protege o dado armazenado (ex.: BitLocker, banco com TDE), útil se o disco for furtado. Em trânsito protege o dado enquanto trafega (ex.: HTTPS/TLS, VPN), útil contra interceptação na rede."},
{q:"Cite três métodos de destruição segura de informação para meios diferentes.",r:"Papel: trituradora de corte cruzado ou incineração. HD magnético: sobrescrita múltipla, desmagnetização (degausser) ou destruição física. SSD e pendrive: comando de apagamento seguro do fabricante ou destruição física. Obs.: apenas “apagar” ou “formatar” não é destruição segura."},
{q:"Por que é importante documentar o processo de destruição?",r:"Para provar conformidade legal e regulatória (LGPD, contratos), ter rastreabilidade (o que, quando, por quem e como foi destruído) e evitar que mídias “perdidas” sejam reutilizadas com dados."},
{q:"Na fase de processamento, por que manter logs de acesso?",r:"Para saber quem acessou ou modificou a informação e quando, apoiar a integridade, detectar abusos e servir de evidência em auditorias e investigações."},
{q:"Descreva o ciclo de vida de uma ficha de matrícula de aluno, fase a fase, com um controle em cada.",r:"Criação: aluno preenche e a ficha é classificada como confidencial (dados pessoais). Processamento: secretaria digita no sistema com login individual e log. Armazenamento: banco com backup e acesso restrito; papel em arquivo trancado. Transmissão: envio ao sistema via HTTPS; nunca por e-mail aberto. Destruição: após o prazo legal de guarda, triturar o papel e eliminar do sistema com registro."},
{q:"O que significa “autenticação e não-repúdio” na fase de transmissão?",r:"Garantir que as partes que se comunicam são quem dizem ser (certificados digitais, TLS) e que o remetente não pode negar o envio (assinatura digital, registros)."},
{q:"Por que formatar um pendrive antes de doá-lo não é suficiente?",r:"A formatação rápida apenas remove a tabela de arquivos; os dados continuam no meio e podem ser recuperados com ferramentas gratuitas (ex.: PhotoRec). É preciso sobrescrever ou destruir."},
{q:"Relacione as fases do ciclo de vida com os estados do Cubo de McCumber.",r:"Processamento ↔ dados em processo; Armazenamento ↔ dados em repouso; Transmissão ↔ dados em trânsito. Criação e Destruição são as extremidades do ciclo, que o Cubo não detalha, mas que exigem classificação e descarte seguros."},
{q:"Cite um requisito regulatório que influencia a fase de destruição.",r:"A LGPD determina a eliminação dos dados pessoais após o término do tratamento (salvo hipóteses de guarda legal); normas de arquivo público e prazos fiscais definem por quanto tempo certos documentos devem ser guardados antes de destruídos."}
],
flash:[
{f:"Ciclo de vida da informação",b:"Criação/Aquisição → Processamento → Armazenamento → Transmissão → Destruição."},
{f:"Criação/Aquisição",b:"Classificar, definir sensibilidade e aplicar controles iniciais."},
{f:"Processamento",b:"Dados em uso: controles de integridade, logs de acesso e monitoramento de modificações."},
{f:"Armazenamento",b:"Dados em repouso: criptografia em repouso, backup e controle de acesso físico/lógico."},
{f:"Transmissão",b:"Dados em trânsito: TLS/VPN, autenticação e não-repúdio."},

{f:"Dados em repouso",b:"Armazenados em memória, HD, SSD ou pendrive."},

pbl:[
{t:"O computador doado",c:"O campus vai doar 20 computadores antigos da secretaria para uma ONG. Eles guardaram por anos documentos de alunos e servidores.",p:["Quais riscos a doação traz?","Crie um procedimento de sanitização passo a passo.","Crie um modelo de termo de destruição."],r:"Riscos: vazamento de dados pessoais (violação da LGPD), dano à imagem, uso dos dados em golpes. Procedimento: inventariar as máquinas; fazer backup do que precisa ser mantido; sanitizar o disco (sobrescrita completa com ferramenta como DBAN/nwipe ou secure erase para SSD) ou retirar e destruir os discos; verificar por amostragem com ferramenta de recuperação; registrar. Termo: nº de patrimônio, número de série do disco, método, data, responsável, testemunha e assinatura."},
{t:"Mapa do ciclo da nota",c:"Mapeie o ciclo de vida completo de uma nota de prova, desde a correção até o arquivamento final do diário.",p:["Desenhe o fluxo com as 5 fases.","Em cada fase indique o estado do dado e dois controles.","Aponte o ponto mais vulnerável."],r:"Criação: professor corrige (classificação: interno/confidencial). Processamento: lançamento no sistema com login e log. Armazenamento: banco com backup e acesso por perfil. Transmissão: HTTPS entre navegador e servidor; boletim para o responsável por canal autenticado. Destruição: provas em papel trituradas após o prazo de guarda. Ponto vulnerável comum: planilhas intermediárias no pendrive ou no e-mail pessoal do professor."},
{t:"Home office da coordenação",c:"A coordenadora leva para casa, num pendrive, uma planilha com dados de alunos com necessidades de acompanhamento, e envia versões por WhatsApp.",p:["Em quais fases do ciclo há falhas?","Classifique essa informação.","Proponha um fluxo seguro."],r:"Falhas: armazenamento (pendrive sem criptografia, pode ser perdido), transmissão (WhatsApp pessoal, sem controle institucional) e destruição (cópias espalhadas sem controle). Classificação: confidencial (dados pessoais sensíveis). Fluxo seguro: planilha no drive institucional com acesso restrito e 2FA, acesso remoto via VPN ou nuvem institucional, compartilhamento por link com permissão nominal, sem cópias locais, e eliminação das cópias antigas."},
{t:"Laboratório de recuperação",c:"Com autorização do professor, use um pendrive de teste: copie arquivos, formate e tente recuperá-los com uma ferramenta gratuita. Depois, sobrescreva e tente de novo.",p:["Registre quantos arquivos foram recuperados em cada caso.","Explique o resultado.","Escreva uma orientação de 5 linhas para a comunidade escolar."],r:"Resultado esperado: após formatação rápida, a maioria dos arquivos é recuperada; após sobrescrita completa, praticamente nenhum. Explicação: formatar remove o índice, não o conteúdo. Orientação: nunca doar ou descartar mídias apenas formatadas; usar ferramenta de apagamento seguro; destruir fisicamente mídias com dados confidenciais; registrar o descarte; em dúvida, procurar a TI."}
]

MODS.push({
id:"m5", titulo:"Classificação da Informação e LGPD", curto:"Classificação",
fonte:"Slides 05 · SEC2026 (79–81, 129)",
objetivo:"Classificar informações em níveis de sensibilidade, associar os controles adequados a cada nível e conhecer os 10 princípios da LGPD e os direitos básicos do titular.",
resumo:[
["Público","Pode ser divulgada sem restrições (marketing, editais publicados). Controles mínimos."],
["Interno","Uso exclusivo dentro da organização (políticas internas, procedimentos). Acesso restrito a funcionários."],
["Confidencial","Sensível; poderia prejudicar a organização (dados financeiros, planos estratégicos, dados de clientes). Acesso restrito e criptografia."],
["Secreto / Altamente confidencial","Crítica; a divulgação causaria danos severos (segredos comerciais, P&D). Acesso mínimo, criptografia forte, monitoramento."],
["LGPD – 10 princípios","Finalidade, Adequação, Necessidade, Livre acesso, Qualidade dos dados, Transparência, Segurança, Prevenção, Não discriminação, Responsabilização e prestação de contas."],
["Direitos do titular","Confirmação e acesso aos dados, correção, anonimização ou eliminação, portabilidade, informação sobre compartilhamento e revogação do consentimento."]
],
caderno:[
{q:"Liste os quatro níveis de classificação vistos em aula, do menos ao mais restrito, com um exemplo de cada.",r:"Público (cardápio do refeitório no site); Interno (manual de procedimentos da secretaria); Confidencial (folha de pagamento, dados de alunos); Secreto/Altamente confidencial (prova do vestibular antes da aplicação, código-fonte de um produto inovador)."},
{q:"Classifique: (a) edital de processo seletivo publicado; (b) prova antes da aplicação; (c) lista de ramais internos; (d) CPF e endereço dos alunos; (e) plano estratégico do campus em elaboração.",r:"(a) Público; (b) Secreto/Altamente confidencial; (c) Interno; (d) Confidencial (dado pessoal); (e) Confidencial."},
{q:"Por que a classificação da informação é a base para escolher os controles de segurança?",r:"Porque aplicar o mesmo controle a tudo é caro e ineficiente. A classificação indica o impacto de um vazamento e, assim, quanto investir: informação pública precisa de controles mínimos, informação secreta precisa de acesso mínimo, criptografia forte e monitoramento."},
{q:"Explique o princípio da Necessidade da LGPD e dê um exemplo de violação.",r:"O tratamento deve se limitar ao mínimo de dados necessários para a finalidade. Violação: uma loja pedir CPF, data de nascimento e renda só para enviar um cupom por e-mail."},
{q:"Diferencie os princípios de Finalidade e Adequação.",r:"Finalidade: o tratamento deve ter propósito legítimo, específico e informado ao titular. Adequação: o tratamento deve ser compatível com essa finalidade informada. Ex.: coletar e-mail para enviar boletim (finalidade) e não usá-lo para vender a terceiros (adequação)."},
{q:"O que diz o princípio da Responsabilização e prestação de contas?",r:"O agente de tratamento deve demonstrar que adotou medidas eficazes para cumprir a LGPD, ou seja, não basta cumprir, é preciso conseguir provar (documentação, registros, políticas)."},
{q:"Um supermercado onde você compra teve seus dados vazados. Quais direitos você tem e o que pode fazer?",r:"Direito à informação e à segurança dos dados. Você pode pedir esclarecimentos sobre quais dados foram expostos e quais medidas foram tomadas, solicitar a correção ou eliminação dos seus dados e registrar reclamação na ANPD (Autoridade Nacional de Proteção de Dados) ou no Procon."},
{q:"O que é dado pessoal e o que é dado pessoal sensível segundo a LGPD? Dê exemplos.",r:"Dado pessoal: informação relacionada a pessoa natural identificada ou identificável (nome, CPF, e-mail, IP). Sensível: origem racial ou étnica, convicção religiosa, opinião política, filiação sindical, dados de saúde, vida sexual, genéticos ou biométricos. Exigem proteção maior."},
{q:"Quais controles você aplicaria a uma informação classificada como Confidencial?",r:"Acesso restrito por perfil (mínimo privilégio), criptografia em repouso e em trânsito, logs de acesso, termo de confidencialidade para quem acessa, rótulo “CONFIDENCIAL” em documentos e descarte seguro."},
{q:"Explique o princípio da Transparência.",r:"O titular deve receber informações claras, precisas e facilmente acessíveis sobre o tratamento dos seus dados e sobre quem são os agentes de tratamento (ex.: política de privacidade clara no site)."},
{q:"Quem é o titular, o controlador e o operador na LGPD?",r:"Titular: a pessoa a quem os dados se referem. Controlador: quem toma as decisões sobre o tratamento (ex.: a escola). Operador: quem realiza o tratamento em nome do controlador (ex.: empresa do sistema acadêmico contratada)."},
{q:"Uma mesma informação pode mudar de classificação ao longo do tempo? Dê um exemplo.",r:"Sim. A prova do vestibular é secreta antes da aplicação e pode se tornar pública depois (gabarito divulgado). Um balanço financeiro é confidencial até a publicação oficial."}
],

pbl:[
{t:"Inventário da secretaria",c:"A secretaria acadêmica quer uma matriz de classificação para seus documentos: editais, fichas de matrícula, atestados médicos de alunos, atas de conselho de classe, listas de ramais, relatórios financeiros.",p:["Classifique cada documento.","Associe controles a cada nível.","Crie rótulos visuais (cores) para os documentos."],r:"Edital: Público. Lista de ramais: Interno. Ata de conselho de classe: Confidencial. Relatório financeiro antes de publicação: Confidencial. Ficha de matrícula: Confidencial (dados pessoais). Atestado médico: Confidencial com dado sensível (saúde), tratar como mais restrito. Controles: público (revisão antes de publicar); interno (acesso só a servidores); confidencial (acesso por perfil, criptografia, log, armário trancado); sensível (acesso nominal mínimo). Rótulos: verde, azul, laranja, vermelho."},
{t:"O formulário exagerado",c:"O grêmio criou um Google Forms para inscrição num torneio de futsal que pede: nome, CPF, RG, endereço completo, religião, tipo sanguíneo, renda familiar e foto.",p:["Quais princípios da LGPD estão sendo feridos?","Quais dados são realmente necessários?","Reescreva o formulário e crie um aviso de privacidade."],r:"Feridos: necessidade (dados em excesso), adequação, finalidade e, pela religião e dados de saúde (sensíveis), segurança e prevenção. Necessários: nome, turma, contato e, talvez, contato de emergência. Tipo sanguíneo só se houver justificativa, com consentimento. Aviso: “Coletamos nome, turma e contato apenas para organizar o torneio; os dados serão apagados 30 dias após o evento; dúvidas: [e-mail do grêmio]”."},
{t:"Vazamento no supermercado",c:"Você recebe um SMS: “Seus dados foram expostos em incidente no Supermercado Bom Preço”. Dias depois, recebe ligações de golpistas que sabem seu nome e CPF.",p:["Quais direitos seus foram atingidos?","Escreva um pedido formal ao supermercado com base na LGPD.","Que cuidados você deve tomar agora?"],r:"Direitos: segurança dos dados, informação clara sobre o incidente e livre acesso. Pedido: identificar-se, citar a LGPD e solicitar quais dados foram expostos, desde quando, medidas adotadas, com quem foram compartilhados e, se desejar, a eliminação dos dados não necessários. Cuidados: desconfiar de ligações e links, não confirmar dados, ativar 2FA, monitorar CPF (Registrato do Banco Central) e registrar reclamação na ANPD ou Procon."},
{t:"Auditoria de perfil em mídia social",c:"Em duplas, analisem um perfil fictício de rede social (criado pelo professor) com data de nascimento, escola, endereço em fotos, rotina de academia e check-ins.",p:["Classifique cada informação exposta.","Aponte os riscos (golpe, perseguição, engenharia social).","Proponha configurações de privacidade."],r:"Rubrica: identificar dados pessoais expostos e classificá-los (público por escolha × deveria ser restrito); relacionar riscos concretos (senha baseada em data de nascimento, golpe do falso parente, localização da rotina); recomendações: perfil privado, remover localização e check-ins em tempo real, ocultar data de nascimento, revisar quem vê as fotos e marcações."}
]

MODS.push({
id:"m6", titulo:"Monitoramento Contínuo", curto:"Monitoramento",
fonte:"Slides 06 · SEC2026 (142, 188–189)",
objetivo:"Entender como a auditoria de acesso, a detecção de anomalias, os alertas em tempo real e os relatórios de conformidade mantêm a segurança viva no dia a dia, com apoio de logs e IDS.",
resumo:[
["Auditoria de acesso","Registrar quem acessa qual informação e quando: logs detalhados, rastreabilidade completa e conformidade auditável."],
["Detecção de anomalias","Identificar padrões anormais de acesso: análise comportamental, detecção de desvios e machine learning."],
["Alertas em tempo real","Notificar tentativas de acesso não autorizado: notificação imediata, resposta rápida e escalonamento automático."],
["Relatórios de conformidade","Demonstrar aderência a políticas e regulamentações: relatórios periódicos e evidências para auditoria."],
["IDS","Sistema de detecção de intrusão: descobre quando a rede está recebendo acessos não autorizados que indicam ação de um atacante."],
["Por que é contínuo","Invasores tentam desabilitar a auditoria e apagar logs para ocultar rastros. Monitorar sempre, com logs protegidos, é o que permite perceber."]
],
caderno:[
{q:"Quais são os quatro componentes do monitoramento contínuo apresentados em aula?",r:"Auditoria de acesso, detecção de anomalias, alertas em tempo real e relatórios de conformidade."},
{q:"Que informações mínimas um log de acesso deve registrar?",r:"Quem (usuário/conta), o quê (recurso ou dado acessado e ação realizada), quando (data e hora sincronizadas), de onde (IP, dispositivo) e o resultado (sucesso ou falha)."},
{q:"O que é uma anomalia de acesso? Dê três exemplos.",r:"É um comportamento que foge do padrão normal. Exemplos: login às 3h da manhã de uma conta que só trabalha de dia; acesso do Brasil e da Rússia com 10 minutos de diferença; um usuário baixando 5.000 registros quando costuma consultar 20."},
{q:"Como o machine learning ajuda na detecção de anomalias?",r:"Aprende o comportamento normal (linha de base) de usuários e sistemas a partir de dados históricos e sinaliza desvios estatísticos que regras fixas não detectariam, reduzindo o trabalho manual de análise."},
{q:"O que é escalonamento automático de alertas?",r:"Quando um alerta não é tratado no tempo definido, ou tem gravidade alta, ele é automaticamente encaminhado ao nível seguinte (ex.: do técnico de plantão para o coordenador de segurança)."},
{q:"Diferencie IDS de firewall.",r:"O firewall filtra e bloqueia tráfego segundo regras (preventivo). O IDS analisa o tráfego ou os eventos e alerta sobre atividade suspeita (detectivo). Um IPS é um IDS que também bloqueia."},
{q:"Por que os invasores tentam apagar ou desabilitar logs? Como se proteger?",r:"Para ocultar rastros e evitar a detecção (etapa de ocultação na anatomia do ataque). Proteção: enviar logs em tempo real a um servidor central separado (syslog/SIEM), com acesso restrito, integridade por hash e alerta quando a auditoria é desligada."},
{q:"Para que servem os relatórios de conformidade?",r:"Para demonstrar, com evidências, que a organização cumpre políticas internas, normas (ISO 27001) e leis (LGPD) em auditorias internas e externas, e para acompanhar indicadores ao longo do tempo."},
{q:"O que são falso positivo e falso negativo em monitoramento?",r:"Falso positivo: o sistema alerta, mas não havia ataque (gera ruído e cansaço de alertas). Falso negativo: havia ataque e o sistema não alertou (mais perigoso)."},
{q:"Explique a relação entre monitoramento contínuo e o pilar de integridade.",r:"Monitorar modificações e manter trilhas de auditoria permite detectar alterações não autorizadas e identificar o responsável, preservando e comprovando a integridade dos dados."},
{q:"Cite duas ferramentas ou tipos de solução usadas no monitoramento.",r:"SIEM (ex.: Wazuh, Splunk) para centralizar e correlacionar logs; IDS/IPS (ex.: Snort, Suricata); monitoramento de disponibilidade (Zabbix, Nagios)."},
{q:"Proponha três alertas em tempo real para o sistema acadêmico de um campus.",r:"(1) 5 ou mais tentativas de login falhas na mesma conta em 5 minutos; (2) alteração de nota após fechamento do diário; (3) exportação em massa de dados de alunos ou login de país incomum."}
],
flash:[
{f:"Monitoramento contínuo",b:"Acompanhamento permanente dos acessos e eventos para detectar e responder rapidamente a incidentes."},
{f:"Log",b:"Registro de eventos: quem, o quê, quando, de onde e com que resultado."},
{f:"Trilha de auditoria",b:"Sequência de registros que permite reconstruir as ações realizadas sobre um recurso."},
{f:"Rastreabilidade",b:"Capacidade de identificar a origem e o responsável por cada ação."},
{f:"Anomalia",b:"Padrão de comportamento que foge da linha de base normal."},
{f:"Análise comportamental",b:"Estudo do comportamento habitual de usuários e sistemas para identificar desvios."},
{f:"IDS",b:"Sistema de Detecção de Intrusão: identifica e alerta sobre acessos não autorizados."},
{f:"IPS",b:"Sistema de Prevenção de Intrusão: detecta e também bloqueia a atividade maliciosa."},
{f:"SIEM",b:"Plataforma que centraliza, correlaciona e analisa logs de várias fontes, gerando alertas."},
{f:"Falso positivo",b:"Alerta disparado sem que haja ataque real."},
{f:"Escalonamento",b:"Encaminhar o alerta a um nível superior de resposta conforme gravidade ou tempo sem tratamento."},
{f:"Relatório de conformidade",b:"Documento periódico com evidências de aderência a políticas e regulamentações."}
],

pbl:[
{t:"A madrugada do servidor",c:"Os logs do servidor de e-mail do campus mostram: 1.200 tentativas de login falhas entre 2h e 3h, vindas de 40 IPs diferentes, e um login bem-sucedido na conta do diretor às 3h07, seguido do envio de 800 e-mails.",p:["Interprete os eventos em ordem.","Que alertas deveriam ter disparado e quando?","Monte um plano de resposta para as próximas 24h."],r:"Interpretação: ataque de força bruta distribuído (password spraying), sucesso na conta do diretor e uso para spam/phishing. Alertas: após N falhas por minuto; login de IP incomum em horário atípico; envio em massa. Resposta: bloquear a conta e trocar a senha, encerrar sessões, bloquear os IPs, avisar os destinatários sobre o phishing, verificar regras de encaminhamento criadas pelo invasor, ativar 2FA, preservar logs e registrar o incidente."},
{t:"Painel de monitoramento do campus",c:"Sua equipe deve propor um painel (dashboard) de monitoramento para a TI do campus.",p:["Escolha 6 indicadores.","Defina para cada um o limite que gera alerta.","Defina quem recebe cada alerta e o escalonamento."],r:"Exemplos: logins falhos por minuto (>20 → alerta); disponibilidade do sistema acadêmico (<99% no dia); uso de disco dos servidores (>85%); backups que falharam (qualquer); tráfego de saída anômalo (>3x a média); contas administrativas criadas (qualquer). Destinatários: técnico de plantão, depois coordenador de TI após 30 min sem tratamento, e direção em incidentes críticos. Avalie coerência entre indicador, limite e responsável."},
{t:"Quem apagou o arquivo?",c:"Um arquivo de projeto sumiu da pasta compartilhada. Não havia auditoria habilitada. Três pessoas tinham acesso de escrita.",p:["Por que não é possível saber o responsável?","Que configuração de auditoria você habilitaria?","Como evitar que isso volte a acontecer?"],r:"Sem trilha de auditoria não há rastreabilidade nem não-repúdio. Habilitar auditoria de acesso a objetos (no Windows, política de auditoria em arquivos, eventos 4663/4660; no Linux, auditd) registrando exclusão e modificação. Prevenção: versionamento ou lixeira de rede, backup diário, permissões mínimas (quem precisa só ler não escreve) e envio dos logs para servidor central."},
{t:"Falsos alarmes demais",c:"O IDS do campus gera 3.000 alertas por dia, e a equipe (2 técnicos) passou a ignorá-los. Um ataque real passou despercebido.",p:["Explique o problema de “fadiga de alertas”.","Proponha como reduzir falsos positivos.","Como priorizar os alertas restantes?"],r:"Fadiga de alertas: excesso de falsos positivos faz a equipe ignorar tudo, gerando falsos negativos na prática. Redução: ajustar (tunar) regras ao ambiente, criar exceções para tráfego legítimo conhecido, correlacionar eventos num SIEM, desabilitar assinaturas irrelevantes. Priorização: classificar por severidade e criticidade do ativo, tratar primeiro alertas em servidores críticos e contas privilegiadas, e automatizar respostas simples."}
]

MODS.push({
id:"m7", titulo:"Malware, Ataques e Engenharia Social", curto:"Ataques",
fonte:"SEC2026 (19–23, 44–46, 63–76, 84–101, 130–149)",
objetivo:"Reconhecer os principais tipos de código malicioso, diferenciar ataques passivos e ativos, identificar phishing e compreender as etapas da anatomia de um ataque até o DDoS.",
resumo:[
["Malware","Programas feitos para executar ações danosas. Infectam via vulnerabilidades, mídias removíveis, páginas maliciosas, ação direta ou arquivos infectados."],
["Tipos","Vírus (precisa do hospedeiro), Bot/Botnet (zumbis controlados remotamente), Spyware (keylogger, screenlogger, adware), Backdoor, Cavalo de Troia, Rootkit."],
["Passivo × Ativo","Passivo: bisbilhota e monitora, sem alterar; difícil de detectar, foco em prevenção (criptografia). Ativo: modifica o fluxo ou cria um fluxo falso."],
["Phishing","Tentativa de obter senhas, cartões e outros dados se passando por alguém confiável. É engenharia social."],
["Anatomia do ataque","Footprinting → Scanning → Enumeração → Invasão → Escalada de privilégios → Acesso à informação → Ocultação de rastros → Backdoors → DoS."],
["DDoS","Ataque coordenado de múltiplas fontes: atacante → masters → agentes (zumbis) → vítima inundada de pacotes."]
],
caderno:[
{q:"Diferencie vírus de cavalo de Troia.",r:"Vírus se propaga inserindo cópias de si em outros programas e arquivos e depende da execução do hospedeiro. Cavalo de Troia se disfarça de programa legítimo (jogo, cartão virtual), executa funções maliciosas escondidas e não se replica."},
{q:"O que é um bot e o que é uma botnet? Para que as botnets são usadas?",r:"Bot é um programa que permite ao invasor controlar remotamente o computador infectado (zumbi) via IRC, web ou P2P. Botnet é uma rede de centenas ou milhares de zumbis. Usos: DDoS, spam em massa e camuflar o atacante."},
{q:"Explique keylogger, screenlogger e adware.",r:"Keylogger: captura as teclas digitadas (senhas). Screenlogger: captura a tela e a posição do cursor a cada clique (contorna teclados virtuais). Adware: exibe propagandas, às vezes coletando hábitos de navegação."},
{q:"O que é um rootkit e por que ele é tão perigoso?",r:"Conjunto de programas que esconde arquivos, processos e conexões do invasor, substituindo partes legítimas do SO e atuando no nível do usuário e do kernel com privilégios de root. É perigoso porque o sistema “mente” para o administrador, dificultando a detecção."},
{q:"Diferencie ataque passivo de ataque ativo e dê um exemplo de cada.",r:"Passivo: apenas observa ou intercepta, sem alterar (sniffing de rede, análise de tráfego); difícil de detectar. Ativo: altera, injeta, repete ou interrompe (modificação de mensagem, falsificação de identidade, DoS)."},
{q:"Liste 5 indícios de que um e-mail é phishing.",r:"Remetente com domínio estranho ou parecido (@app0llo.com); senso de urgência ou ameaça (“sua conta será bloqueada”); links que, ao passar o mouse, mostram endereço diferente; erros de português; pedido de senha ou dados bancários; anexos inesperados (.exe, .zip); saudação genérica."},
{q:"Descreva as três primeiras etapas da anatomia de um ataque.",r:"Footprinting: reconhecimento, coleta de informações públicas (domínios, IPs, nomes, e-mails, engenharia social). Scanning: descobrir sistemas ativos, portas abertas e SO (nmap, ping, traceroute). Enumeração: coleta intrusiva, com consultas diretas para identificar contas válidas, compartilhamentos, versões de serviços e vulnerabilidades."},
{q:"O que é escalada de privilégios?",r:"Depois de obter acesso como usuário comum, o invasor explora falhas (exploits, buffer overflow, trojans) para conseguir privilégios de administrador ou root e controlar todo o sistema."},
{q:"Descreva os papéis em um DDoS: atacante, master, agente e vítima.",r:"Atacante: coordena o ataque. Master: recebe os parâmetros e comanda os agentes. Agente: máquina comprometida que efetivamente envia o tráfego. Vítima: alvo inundado de pacotes, que fica congestionado e indisponível."},
{q:"Quais são as três fases de um DDoS?",r:"(1) Intrusão em massa: ferramentas automáticas comprometem muitas máquinas e obtêm root. (2) Instalação do software DDoS nas máquinas invadidas, montando a rede de ataque. (3) Lançamento do flood de pacotes contra a vítima."},
{q:"O que é defacement? Qual pilar ele fere?",r:"Alteração do conteúdo de um site (página principal trocada por mensagem do invasor). Fere a integridade e também a imagem da organização."},
{q:"Cite 4 tipos de Trojan e o que cada um faz.",r:"Downloader: baixa outros malwares da internet. Dropper: instala malwares embutidos em seu próprio código. Backdoor: abre acesso remoto. Banker: coleta dados bancários. (Outros: DoS, Destrutivo, Clicker, Proxy, Spy.)"}
],
flash:[
{f:"Malware",b:"Código malicioso desenvolvido para executar ações danosas em um computador."},
{f:"Vírus",b:"Propaga-se inserindo cópias em outros arquivos; depende da execução do hospedeiro."},
{f:"Cavalo de Troia",b:"Programa aparentemente legítimo que executa funções maliciosas ocultas; não se replica."},

{f:"Rootkit",b:"Esconde arquivos, processos e conexões do invasor; atua no kernel e no nível do usuário."},

{f:"Keylogger",b:"Spyware que captura e armazena as teclas digitadas."},

{f:"Footprinting",b:"Primeira etapa do ataque: reconhecimento e coleta de informações sobre o alvo."},
{f:"Scanning",b:"Varredura para descobrir sistemas ativos, portas abertas e SO (ex.: nmap)."},

pbl:[
{t:"O e-mail da @Apollo",c:"Um cliente encaminhou um e-mail que parece da @Apollo: “Sua assinatura expira HOJE. Clique aqui e atualize seu cartão para não perder o acesso”. O remetente é suporte@apo1lo-seguranca.com e o link aponta para http://apollo-login.xyz.",p:["Liste todos os indícios de phishing.","Qual deve ser a orientação ao cliente?","Proponha uma campanha de conscientização de 1 semana."],r:"Indícios: domínio com “1” no lugar de “l” e diferente do oficial; urgência (“HOJE”); pedido de cartão; link para domínio .xyz e sem HTTPS; possível saudação genérica. Orientação: não clicar, não responder, acessar o site digitando o endereço oficial, reportar ao suporte real e excluir. Campanha: dia 1 cartaz “passe o mouse antes de clicar”; dia 2 quiz; dia 3 simulação controlada de phishing; dia 4 análise dos resultados; dia 5 premiação e dicas."},
{t:"A rede de hotéis",c:"Uma rede mundial de hotéis teve os dados de 3 milhões de hóspedes expostos. Os invasores usaram o login de um funcionário. O hotel diz que senhas e dados financeiros não foram acessados.",p:["Que tipo de ataque provavelmente ocorreu para obter o login?","Quais controles teriam limitado o dano?","O que os hóspedes devem fazer?"],r:"Provável phishing ou reaproveitamento de senha vazada (engenharia social / credential stuffing). Controles: 2FA, mínimo privilégio (um funcionário não precisava acessar todos os 3 milhões de registros), monitoramento de anomalias (exportação em massa), segmentação do banco e treinamento. Hóspedes: desconfiar de e-mails e ligações citando a reserva, trocar senhas reutilizadas, ativar 2FA e acompanhar comunicados oficiais."},
{t:"Linha do tempo de uma invasão",c:"Recebendo cartões embaralhados com eventos (pesquisa no LinkedIn por funcionários, nmap no IP do servidor, descoberta de versão antiga do Apache, uso de exploit, obtenção de root, cópia do banco, limpeza do log, instalação de rootkit), a equipe deve reconstruir o ataque.",p:["Ordene os eventos e nomeie a etapa de cada um.","Para cada etapa, indique um controle que teria detectado ou impedido.","Em qual etapa a defesa é mais barata?"],r:"Ordem: LinkedIn = footprinting; nmap = scanning; versão do Apache = enumeração; exploit = invasão; root = escalada de privilégios; cópia do banco = acesso à informação; limpeza de log = ocultação de rastros; rootkit = backdoor/manutenção do acesso. Controles: conscientização sobre exposição pública; IDS detectando varredura; ocultar banners e atualizar o Apache; patch e WAF; mínimo privilégio; criptografia do banco e DLP; logs em servidor remoto; verificação de integridade (rkhunter/AIDE). Mais barata: nas primeiras etapas (atualizar e reduzir superfície)."},
{t:"eLearning em risco",c:"Uma plataforma de eLearning usada por várias empresas teve dados pessoais de alunos expostos. Investigação: senha padrão do painel administrativo, plugin desatualizado e ausência de logs.",p:["Quais exploits ou falhas foram usados?","Classifique cada falha (configuração, software, processo).","Monte um checklist de segurança para plataformas de ensino."],r:"Falhas: senha default (configuração), plugin com vulnerabilidade conhecida (software/gestão de patches), sem logs (processo/monitoramento). Checklist: trocar credenciais padrão; 2FA para administradores; atualizar núcleo e plugins mensalmente; remover plugins não usados; HTTPS; backup testado; logs centralizados; mínimo privilégio para professores; política de privacidade e LGPD."}
]
});
