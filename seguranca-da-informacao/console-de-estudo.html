id:"m8", titulo:"Vulnerabilidades e Gestão de Riscos", curto:"Vulnerab. & Riscos",
fonte:"SEC2026 (77–78, 103–128, 171–175)",
objetivo:"Identificar vulnerabilidades críticas e frequentes (senhas padrão, configurações erradas, backdoors, falhas TCP/IP) e aplicar os fundamentos de análise e gerenciamento de riscos.",
resumo:[
["Vulnerabilidade","Falha ou fraqueza que pode ocorrer no projeto, na implementação, na operação ou no gerenciamento, explorável para violar a política de segurança."],
["Críticas","Formatação de strings, travessia de diretórios, senhas padrão (cisco/cisco, SNMP public, administrator). Podem levar a execução remota e escalada de privilégios."],
["Configurações erradas","Pressa, inexperiência ou displicência. Ex.: FTP “seguro” com conta anonymous esquecida; senhas de uma instituição coletadas por 3 meses."],
["Backdoors e TCP/IP","Backdoor conhecido indica que a rede já foi atacada. Buffer overflow: dados além do limite do buffer sobrescrevem a memória."],
["Risco","Evento incerto que, se ocorrer, afeta objetivos. Gerenciar = identificar, avaliar (estimar) e controlar (minimizar). “Não se protege do que não se conhece.”"],
["Análise de risco","Considera bens, ameaças e vulnerabilidades e as propriedades CIDA; compara com o nível de risco aceitável; agrega riscos pequenos e considera requisitos legais e contratuais."]
],
caderno:[
{q:"Em quais fases do ciclo de um sistema uma vulnerabilidade pode surgir? Dê um exemplo para cada.",r:"Projeto: protocolo que envia senha em texto claro. Implementação: programador não valida o tamanho da entrada (buffer overflow). Operação: usuário anota a senha. Gerenciamento: administrador não aplica atualizações."},
{q:"Por que senhas padrão (default) são consideradas vulnerabilidades críticas?",r:"Porque são documentadas publicamente pelos fabricantes (ex.: cisco/cisco, SNMP “public”, admin/admin), e basta uma busca para um atacante entrar. Administradores frequentemente esquecem de alterá-las."},
{q:"Explique o ataque de travessia de diretórios (directory traversal).",r:"A aplicação mapeia o pedido do usuário para um caminho de arquivo local sem validar; o atacante usa sequências como ../../ para sair do diretório permitido (ex.: /home/userX) e ler arquivos de outros locais, como /etc/passwd."},
{q:"O que é buffer overflow?",r:"É quando um programa escreve mais dados em um buffer (área de memória) do que ele comporta, sobrescrevendo áreas vizinhas. Um atacante pode usar isso para travar o programa ou executar o próprio código."},
{q:"Relate o caso do FTP anônimo visto em aula e a lição que ele traz.",r:"Um administrador configurou um FTP “seguro” para um web designer e esqueceu ativa a conta padrão anonymous. Um atacante coletou por 3 meses o arquivo de senhas de uma instituição financeira. Lição: revisar configurações, desativar contas padrão e monitorar acessos."},
{q:"Por que encontrar um backdoor conhecido na rede é um sinal grave?",r:"Porque backdoors geralmente são instalados após um ataque bem-sucedido para garantir novo acesso; significa que a rede já foi comprometida e outros ativos podem estar afetados."},
{q:"Defina risco e as três bases do gerenciamento de riscos.",r:"Risco é um evento ou condição incerta que, se ocorrer, tem efeitos (positivos ou negativos) sobre ao menos um objetivo. Bases: identificação (conhecer), avaliação (estimar probabilidade e impacto) e controle (minimizar)."},
{q:"Monte uma matriz de risco 3×3 (probabilidade × impacto) e posicione: queda de energia, vazamento de dados de alunos e meteoro atingindo o campus.",r:"Queda de energia: probabilidade alta, impacto médio → risco alto. Vazamento de dados: probabilidade média, impacto alto → risco alto. Meteoro: probabilidade baixíssima, impacto alto → risco baixo (aceitar). A matriz orienta o que tratar primeiro."},
{q:"Quais são as quatro estratégias clássicas de tratamento de risco?",r:"Mitigar (reduzir com controles, ex.: nobreak); Transferir (seguro, terceirização); Evitar (eliminar a atividade que gera o risco); Aceitar (conviver quando o custo do controle supera o impacto)."},
{q:"O que significa “agregação de riscos pequenos e médios”?",r:"Vários riscos individualmente aceitáveis podem, somados, resultar em um risco total significativo, que precisa ser tratado."},
{q:"Dê um exemplo de como um risco de disponibilidade é reduzido com um controle técnico.",r:"Risco: sistema fora do ar por queda de energia. Controle: sistema ininterrupto de energia (nobreak/UPS) e gerador. Exemplo citado em aula."},
{q:"O que significa a sigla CIDA na análise de risco?",r:"Confidencialidade, Integridade, Disponibilidade e Autenticidade: as propriedades de segurança consideradas ao avaliar o impacto dos riscos."}
],

pbl:[
{t:"Caça às senhas padrão",c:"O campus tem 12 switches, 3 roteadores, 20 access points, 4 impressoras de rede e 2 câmeras IP instaladas por empresas diferentes nos últimos anos. Ninguém sabe se as senhas foram trocadas.",p:["Planeje um levantamento (inventário) seguro.","Defina uma política de credenciais para equipamentos.","Estime o risco antes e depois."],r:"Levantamento: com autorização formal, inventariar IP/modelo/local; consultar manuais para as credenciais padrão; testar apenas nos próprios equipamentos; registrar. Política: trocar todas as senhas padrão na instalação; senhas únicas por equipamento guardadas em cofre de senhas; desabilitar SNMP public (usar SNMPv3); desativar serviços web/telnet desnecessários; revisão semestral. Risco antes: alto (probabilidade alta, impacto alto); depois: baixo/médio."},
{t:"Matriz de riscos do laboratório IFMaker",c:"O laboratório maker tem impressoras 3D, kits de robótica, notebooks e um servidor com projetos dos alunos. Fica no térreo, perto de um bebedouro, e é usado à noite.",p:["Identifique pelo menos 8 riscos.","Classifique-os numa matriz probabilidade × impacto.","Escolha uma estratégia de tratamento para cada um."],r:"Riscos possíveis: furto de notebooks, vazamento de água do bebedouro, queda de energia durante impressão, incêndio por superaquecimento, perda dos projetos sem backup, malware via pendrive, acesso de pessoas não autorizadas à noite, dano a equipamentos por mau uso. Tratamentos: mitigar (armário com chave, backup, nobreak, extintor, controle de acesso), transferir (seguro patrimonial), aceitar riscos baixos. Avalie coerência entre a posição na matriz e a estratégia."},
{t:"A atualização adiada",c:"A TI adiou por 8 meses a atualização do servidor web porque “está funcionando e não pode parar”. Um scanner público mostra que a versão tem uma vulnerabilidade crítica com exploit disponível.",p:["Analise o risco de adiar × o risco de atualizar.","Proponha um processo de gestão de patches.","Como convencer a direção?"],r:"Adiar: probabilidade alta (exploit público), impacto alto (invasão, vazamento, defacement). Atualizar: risco de indisponibilidade breve, controlável com janela de manutenção e backup. Processo: inventário de software; monitorar boletins (CVE); classificar por severidade; testar em homologação; janela de manutenção; backup antes; aplicar; validar; registrar. Críticos em até 7 dias. Direção: mostrar custo de um incidente (imagem, LGPD, horas paradas) versus 1 hora planejada de manutenção."},
{t:"Relatório de vulnerabilidades",c:"Em um ambiente de laboratório isolado (máquina virtual preparada pelo professor), a equipe usa uma ferramenta de varredura de vulnerabilidades (ex.: OpenVAS) e recebe 25 achados.",p:["Classifique os achados por severidade.","Priorize os 5 primeiros para correção.","Escreva um relatório executivo de 1 página."],r:"Rubrica: (1) achados organizados por severidade (crítica, alta, média, baixa) com base no CVSS; (2) priorização que considera severidade + exposição (serviço acessível pela internet) + criticidade do ativo; (3) relatório executivo em linguagem para gestores: resumo, riscos principais, recomendações e prazos. Importante: varreduras só em ambientes autorizados."}
]

MODS.push({
id:"m9", titulo:"Segurança Física, Políticas e Tecnologias de Defesa", curto:"Defesa",
fonte:"SEC2026 (102, 150–191, 193)",
objetivo:"Proteger a infraestrutura física, redigir políticas de segurança com objetivo, escopo, responsabilidades e conformidade, e compreender o papel do firewall, do proxy, do IDS e do SSL/TLS.",
resumo:[
["Segurança física","Ameaças: enchente, raios, incêndio, falhas de equipamento, acesso físico não autorizado, curto-circuito, vandalismo, furto e fatores humanos."],
["Soluções físicas","Plano de recuperação de desastres e de continuidade de negócios, crachás, circulação restrita, cofres e backup externo, proteção de cabos e energia."],
["Política de segurança","Conjunto de normas que guia as pessoas; primeiro passo para a conscientização. Componentes: objetivo, escopo, responsabilidades, direitos e deveres, conformidade."],
["Firewall","Barreira entre a rede e o computador que filtra o fluxo de dados, bloqueando conteúdo malicioso sem impedir o tráfego legítimo."],
["Proxy e IDS","Proxy: intermediário entre navegador e internet (cache, filtragem de conteúdo). IDS: detecta acessos não autorizados."],
["SSL/TLS","Canal criptografado entre servidor web e navegador (Netscape, 1994); cadeado e HTTPS. Hoje usa-se o TLS, sucessor do SSL."]
],
caderno:[
{q:"Cite 6 ameaças físicas a um datacenter e uma solução para cada.",r:"Enchente: instalar fora do térreo e usar piso elevado. Raio: para-raios e aterramento. Incêndio: detecção de fumaça e supressão por gás. Falha elétrica: nobreak e gerador. Acesso não autorizado: crachá, biometria e câmeras. Furto: rack trancado e inventário."},
{q:"Diferencie Plano de Continuidade de Negócios (PCN) e Plano de Recuperação de Desastres (PRD).",r:"PCN: como a organização continua operando os processos críticos durante e após um incidente (visão de negócio). PRD: como restaurar a infraestrutura de TI (servidores, dados, rede) após um desastre (visão técnica). O PRD é parte do PCN."},
{q:"Quais são os componentes de uma política de segurança da informação?",r:"Objetivo (por que existe), Escopo (a quem e ao que se aplica), Responsabilidades (quem faz o quê), Direitos e Deveres, e Conformidade (como fiscalizar e o que acontece com quem descumpre, intencionalmente ou não)."},
{q:"Com base no exemplo da aula, escreva 4 regras de uma política de autenticação para servidores.",r:"Senhas com no mínimo 8 caracteres (hoje recomenda-se 12 ou mais); combinando letras maiúsculas, minúsculas, números e símbolos; autenticação multifator para acesso remoto; acesso apenas por usuários do setor de TI a partir da rede de TI; servidores em rede isolada da rede de usuários."},
{q:"No exemplo da política para roteadores, cite 4 configurações que devem ser desabilitadas.",r:"Broadcast IP direcionado; recepção de pacotes com endereços inválidos (RFC 1918); serviços TCP/UDP “pequenos” (echo, chargen, daytime, discard); roteamento pela fonte (source routing); serviços web no roteador; comunidade SNMP public."},
{q:"Explique o que é um firewall e de onde vem o nome.",r:"É um software ou equipamento entre a rede e o computador (ou entre redes) que filtra o tráfego segundo regras, bloqueando o que é malicioso e deixando passar o legítimo. O nome vem das portas corta-fogo dos prédios, que impedem o fogo de passar para as escadas."},
{q:"Quais as duas funções principais de um servidor proxy?",r:"Desempenho: armazena em cache as páginas mais acessadas e as entrega mais rápido. Segurança: filtra conteúdo web e softwares mal-intencionados e pode registrar e controlar o acesso."},
{q:"O que o cadeado e o HTTPS no navegador indicam? Isso garante que o site é honesto?",r:"Que a comunicação entre o navegador e o servidor está criptografada (TLS) e que o certificado corresponde ao domínio. Não garante que o site é honesto: sites de phishing também usam HTTPS. É preciso conferir o endereço."},
{q:"Crie um checklist de 5 itens antes de usar Wi-Fi público (atividade da aula).",r:"1) Confirmar o nome da rede com o estabelecimento; 2) desativar compartilhamento de arquivos; 3) usar VPN; 4) evitar transações bancárias e compras; 5) acessar só sites com HTTPS e esquecer a rede após o uso."},
{q:"O que é uma política de uso aceitável?",r:"Documento que define o que usuários podem e não podem fazer com os recursos de TI da organização (e-mail, internet, equipamentos), por exemplo, proibir instalar software sem autorização ou usar a rede para fins ilícitos."},
{q:"O que é uma política de BYOD?",r:"Bring Your Own Device: regras para uso de dispositivos pessoais (celular, notebook) na rede e nos sistemas da organização, como senha de bloqueio, antivírus, rede separada e direito de apagar dados corporativos em caso de perda."},
{q:"Por que a política de segurança é considerada o primeiro passo para a conscientização?",r:"Porque formaliza o que se espera de cada pessoa, torna as regras conhecidas e dá base para treinamentos e para cobrar conformidade. Sem política, cada um age do seu jeito."}
],

const VIZ={};
const VZ=(function(){
const E=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const RM=()=>window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;
const KIND={ativo:["Ativo","k-ativo"],vuln:["Vulnerabilidade","k-vuln"],ameaca:["Ameaça","k-ameaca"],controle:["Controle","k-controle"],sinal:["Indício de golpe","k-ameaca"]};

/* ---------- SVG helpers ---------- */
function lines(txt,x,y,lh){const p=String(txt).split("\n");const y0=y-(p.length-1)*lh/2;return p.map((t,i)=>`<tspan x="${x}" y="${y0+i*lh}">${E(t)}</tspan>`).join("")}
function box(n,x,y,w,h,label,ico){const cx=x+w/2;
  return `<g data-n="${n}" class="vz-node"><rect x="${x}" y="${y}" width="${w}" height="${h}" rx="10"/>${ico?`<text class="vz-ico" x="${cx}" y="${y+h/2-4}" text-anchor="middle">${ico}</text>`:""}<text class="vz-lbl" text-anchor="middle">${lines(label,cx,ico?y+h-14:y+h/2+5,15)}</text></g>`}
function edge(n,x1,y1,x2,y2,dash){return `<line data-n="${n}" class="vz-edge${dash?" dash":""}" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" marker-end="url(#vzArrow)"/>`}
const DEFS=`<defs><marker id="vzArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="vz-arrow"/></marker></defs>`;

/* ---------- Sorter (classificar) ---------- */
function sorter(root,o){
  const order=shuffle(o.items.map((_,i)=>i));let place={},sel=null,checked=false;
  root.innerHTML=`<div class="vz-pool" data-pool aria-label="Cartões para classificar"></div>
  ${o.axes?`<div class="vz-axes"><span>${E(o.axes[0])}</span><span>${E(o.axes[1])}</span></div>`:""}
  <div class="vz-buckets${o.grid?" grid":""}" style="--cols:${o.cols||o.buckets.length}">${o.buckets.map(b=>`<div class="vz-bucket" data-b="${b.k}" style="${b.c?`--bc:${b.c}`:""}" tabindex="0" role="button" aria-label="Caixa ${E(b.label)}"><div class="vz-bh">${E(b.label)}</div>${b.desc?`<div class="vz-bd">${E(b.desc)}</div>`:""}<div class="vz-bin"></div></div>`).join("")}</div>
  <div class="ctrl"><button class="btn pri" type="button" data-check disabled>Conferir</button><button class="btn" type="button" data-reset>Recomeçar</button><span class="hint" data-msg>Toque em um cartão e depois na caixa certa (no computador, pode arrastar).</span></div><div class="vz-fb" data-fb></div>`;
  const pool=root.querySelector("[data-pool]"),bk=[...root.querySelectorAll(".vz-bucket")],bc=root.querySelector("[data-check]"),fb=root.querySelector("[data-fb]"),msg=root.querySelector("[data-msg]");
  const chip=i=>`<button type="button" class="vz-chip${sel===i?" sel":""}${checked?(place[i]===o.items[i].k?" ok":" bad"):""}" draggable="${!checked}" data-i="${i}">${E(o.items[i].t)}</button>`;
  function draw(){
    const left=order.filter(i=>place[i]==null);
    pool.innerHTML=left.length?left.map(chip).join(""):`<span class="hint">${checked?"":"Todos os cartões foram colocados. Clique em Conferir."}</span>`;
    bk.forEach(b=>{b.querySelector(".vz-bin").innerHTML=order.filter(i=>place[i]===b.dataset.b).map(chip).join("");b.classList.toggle("target",sel!=null)});
    bc.disabled=checked||left.length>0;
    root.querySelectorAll(".vz-chip").forEach(c=>{const i=+c.dataset.i;
      c.onclick=e=>{e.stopPropagation();if(checked)return;
        if(place[i]!=null&&sel!=null&&sel!==i){place[sel]=place[i];sel=null}
        else if(place[i]!=null){place[i]=null;sel=i}else sel=(sel===i?null:i);draw()};
      c.ondragstart=e=>{e.dataTransfer.setData("text/plain",i);sel=i}});
  }
  bk.forEach(b=>{const put=i=>{if(checked||i==null||isNaN(i))return;place[i]=b.dataset.b;sel=null;draw()};
    b.onclick=()=>put(sel);b.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();put(sel)}};
    b.ondragover=e=>{e.preventDefault();b.classList.add("over")};b.ondragleave=()=>b.classList.remove("over");
    b.ondrop=e=>{e.preventDefault();b.classList.remove("over");put(+e.dataTransfer.getData("text/plain"))}});
  pool.ondragover=e=>e.preventDefault();pool.ondrop=e=>{e.preventDefault();const i=+e.dataTransfer.getData("text/plain");if(!checked&&!isNaN(i)){place[i]=null;sel=null;draw()}};
  bc.onclick=()=>{checked=true;sel=null;draw();const n=o.items.length,ok=o.items.filter((it,i)=>place[i]===it.k).length;
    const lab=k=>(o.buckets.find(b=>b.k===k)||{}).label;
    msg.textContent="";fb.innerHTML=`<div class="ans ${ok===n?"ok":ok>=n*.6?"":"bad"}"><span class="lbl">${ok} de ${n} corretos</span>${order.map(i=>{const it=o.items[i],g=place[i]===it.k;return `<div class="vz-fbi ${g?"g":"b"}"><b>${g?"✓":"✗"} ${E(it.t)}</b> → ${E(lab(it.k))}${it.why?`. ${E(it.why)}`:""}</div>`}).join("")}</div>`};
  root.querySelector("[data-reset]").onclick=()=>{place={};sel=null;checked=false;fb.innerHTML="";msg.textContent="Toque em um cartão e depois na caixa certa (no computador, pode arrastar).";draw()};
  draw();
}

/* ---------- Hotspots (investigar a imagem) ---------- */
function hsPanel(n){return `<div class="vz-side"><div class="vz-count" data-cnt>0 de ${n} pontos investigados</div><div class="vz-info" data-info>Toque nos números da imagem para investigar cada ponto.</div><div class="vz-leg">${Object.keys(KIND).filter(k=>k!=="sinal").map(k=>`<span class="${KIND[k][1]}"><i></i>${KIND[k][0]}</span>`).join("")}</div></div>`}
function hsWire(root,items,found){
  const info=root.querySelector("[data-info]"),cnt=root.querySelector("[data-cnt]");found=found||new Set();
  const open=i=>{const it=items[i];found.add(i);
    root.querySelectorAll(`[data-hs="${i}"]`).forEach(el=>{el.classList.add("found",KIND[it.kind][1])});
    root.querySelectorAll("[data-hs]").forEach(el=>el.classList.toggle("cur",+el.dataset.hs===i));
    info.innerHTML=`<span class="vz-tag ${KIND[it.kind][1]}">${KIND[it.kind][0]}${it.sub?` · ${E(it.sub)}`:""}</span><h5>${E(it.label)}</h5><p>${E(it.info)}</p>`;
    cnt.textContent=found.size===items.length?`Você investigou os ${items.length} pontos.`:`${found.size} de ${items.length} pontos investigados`};
  root.querySelectorAll("[data-hs]").forEach(el=>{el.onclick=e=>{e.preventDefault();open(+el.dataset.hs)};el.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();open(+el.dataset.hs)}}});
}
function hotspots(root,o){
  root.innerHTML=`<div class="vz-hs"><div class="vz-scene"><svg viewBox="0 0 ${o.w} ${o.h}" class="vz-svg" role="img" aria-label="${E(o.alt||"Cena para investigar")}">${o.scene}${o.items.map((it,i)=>`<g class="vz-mk" data-hs="${i}" tabindex="0" role="button" aria-label="Ponto ${i+1}" transform="translate(${it.x} ${it.y})"><circle r="15" class="vz-mk-c"/><text class="vz-mk-t" text-anchor="middle" y="5">${i+1}</text></g>`).join("")}</svg></div>${hsPanel(o.items.length)}</div>`;
  hsWire(root,o.items);
}

/* ---------- Stepper (diagrama passo a passo) ---------- */
function stepper(root,o){
  root.innerHTML=`<div class="vz-scene"><svg viewBox="0 0 ${o.w} ${o.h}" class="vz-svg vz-step" role="img" aria-label="${E(o.alt||"Diagrama")}">${DEFS}${o.svg}</svg></div>
  <div class="vz-stepbox"><span class="vz-stepn" data-sn></span><h5 data-st></h5><p data-sd></p></div>
  <div class="ctrl"><button class="btn" type="button" data-prev>← Anterior</button><button class="btn pri" type="button" data-play>▶ Reproduzir</button><button class="btn" type="button" data-next>Próximo →</button></div>
  <div class="vz-dots" data-dots>${o.steps.map((s,i)=>`<button type="button" data-go="${i}" aria-label="Passo ${i+1}: ${E(s.t)}"></button>`).join("")}</div>`;
  const svg=root.querySelector("svg");let i=0,tm=null;const pb=root.querySelector("[data-play]");
  function go(k){i=(k+o.steps.length)%o.steps.length;const s=o.steps[i],on=new Set(s.on||[]);
    svg.querySelectorAll("[data-n]").forEach(el=>{const n=el.dataset.n;el.classList.toggle("on",on.has(n));el.classList.toggle("dim",on.size>0&&!on.has(n)&&!(s.keep||[]).includes(n))});
    root.querySelector("[data-sn]").textContent=`Passo ${i+1} de ${o.steps.length}`;root.querySelector("[data-st]").textContent=s.t;root.querySelector("[data-sd]").textContent=s.d;
    root.querySelectorAll("[data-go]").forEach((d,j)=>d.classList.toggle("cur",j===i));if(o.onStep)o.onStep(i,svg,s)}
  function stop(){clearInterval(tm);tm=null;pb.textContent="▶ Reproduzir"}
  root.querySelector("[data-prev]").onclick=()=>{stop();go(i-1)};root.querySelector("[data-next]").onclick=()=>{stop();go(i+1)};
  root.querySelectorAll("[data-go]").forEach(d=>d.onclick=()=>{stop();go(+d.dataset.go)});
  pb.onclick=()=>{if(tm)return stop();if(i===o.steps.length-1)go(0);pb.textContent="❚❚ Pausar";tm=setInterval(()=>{if(i>=o.steps.length-1||!root.isConnected)return stop();go(i+1)},o.ms||3200)};
  go(0);
}

/* ---------- Timeline ---------- */
function timeline(root,o){
  root.innerHTML=`<div class="vz-tl"><div class="vz-tl-track">${o.events.map((e,i)=>`<button type="button" class="vz-tl-ev" data-i="${i}"><span class="y">${E(e.y)}</span><span class="dot"></span><span class="t">${E(e.s)}</span></button>`).join("")}</div></div>
  <div class="vz-tl-card"><div class="vz-tl-ico" data-ico></div><div><span class="vz-tag" data-era></span><h5 data-t></h5><p data-d></p><p class="vz-lesson" data-l></p></div></div>
  <div class="ctrl"><button class="btn" type="button" data-prev>← Anterior</button><button class="btn pri" type="button" data-next>Próximo →</button><span class="hint" data-pos></span></div>`;
  let i=0;const evs=[...root.querySelectorAll(".vz-tl-ev")];
  function go(k){i=Math.max(0,Math.min(o.events.length-1,k));const e=o.events[i];
    evs.forEach((b,j)=>{b.classList.toggle("cur",j===i);b.classList.toggle("past",j<i)});
    root.querySelector("[data-ico]").textContent=e.ico;root.querySelector("[data-era]").textContent=`${e.y} · ${e.era}`;root.querySelector("[data-t]").textContent=e.t;root.querySelector("[data-d]").textContent=e.d;
    root.querySelector("[data-l]").innerHTML=`<b>Lição para hoje:</b> ${E(e.l)}`;root.querySelector("[data-pos]").textContent=`${i+1} de ${o.events.length}`;
    const tr=root.querySelector(".vz-tl");const b=evs[i];if(tr.scrollTo)tr.scrollTo({left:b.offsetLeft-tr.clientWidth/2+b.clientWidth/2,behavior:RM()?"auto":"smooth"})}

  root.querySelector("[data-prev]").onclick=()=>go(i-1);root.querySelector("[data-next]").onclick=()=>go(i+1);go(0);
}

/* ---------- Flip grid ---------- */
function flipgrid(root,o){
  root.innerHTML=`<div class="vz-flips">${o.cards.map((c,i)=>`<button type="button" class="vz-flip" data-i="${i}" aria-pressed="false"><span class="fr"><span class="vz-ico2">${c.ico||""}</span><b>${E(c.f)}</b><span class="hint">toque para ver</span></span><span class="bk"><b>${E(c.f)}</b><span>${E(c.b)}</span>${c.ex?`<em>Ex.: ${E(c.ex)}</em>`:""}</span></button>`).join("")}</div><p class="hint" data-c>0 de ${o.cards.length} cartões abertos</p>`;

}

/* ---------- animation ---------- */
function tween(ms,fn){return new Promise(res=>{if(RM()){fn(1);return res()}const t0=performance.now();(function f(t){const p=Math.min(1,(t-t0)/ms);fn(p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2);p<1?requestAnimationFrame(f):res()})(t0)})}

function st(mid){return S[mid]||(S[mid]={c:{},f:{},v:{},p:{},d:{}})}
let PROF=false;
const main=document.getElementById("main"),nav=document.getElementById("nav"),mob=document.getElementById("mobsel");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pad=n=>String(n).padStart(2,"0");
function done(mid){const s=st(mid);return Object.keys(s.c).length+Object.keys(s.f).length+Object.keys(s.v).length+Object.keys(s.p).length}
function total(m){return m.caderno.length+m.flash.length+m.vf.length+m.pbl.length}
let view={page:"home",mod:null,tab:"resumo"};
try{const v=JSON.parse(localStorage.getItem(KEY+"-view")||"null");if(v&&v.page)view=v}catch(e){}
function setView(v){view=Object.assign({},view,v);try{localStorage.setItem(KEY+"-view",JSON.stringify(view))}catch(e){}render();window.scrollTo({top:0})}

function renderNav(){
  let h='<div class="grp">Console</div>';
  h+=nb("home","⌂","Painel","");
  h+=nb("cola","≡","Cola geral","");
  h+=nb("simulado","✓","Simulado",S._sim?S._sim+"%":"");
  h+='<div class="grp">Módulos</div>';
  MODS.forEach((m,i)=>{const p=Math.round(done(m.id)/total(m)*100);
    h+=`<button type="button" data-go="mod" data-mod="${m.id}" aria-current="${view.page==="mod"&&view.mod===m.id}"><span class="num">${pad(i+1)}</span><span>${esc(m.curto)}</span><span class="pct">${p}%</span></button>`});
  nav.innerHTML=h;
  let o='<option value="home">Painel</option><option value="cola">Cola geral</option><option value="simulado">Simulado</option>';
  MODS.forEach((m,i)=>o+=`<option value="${m.id}">${pad(i+1)} · ${esc(m.titulo)}</option>`);
  mob.innerHTML=o;mob.value=view.page==="mod"?view.mod:view.page;
  function nb(pg,ico,label,extra){return `<button type="button" data-go="${pg}" aria-current="${view.page===pg}"><span class="ico">${ico}</span><span>${label}</span><span class="pct">${extra}</span></button>`}
}
nav.addEventListener("click",e=>{const b=e.target.closest("button[data-go]");if(!b)return;
  if(b.dataset.go==="mod")setView({page:"mod",mod:b.dataset.mod,tab:"resumo"});else setView({page:b.dataset.go})});
mob.addEventListener("change",()=>{const v=mob.value;if(["home","cola","simulado"].includes(v))setView({page:v});else setView({page:"mod",mod:v,tab:"resumo"})});

function render(){renderNav();
  if(view.page==="home")return renderHome();
  if(view.page==="cola")return renderCola();
  if(view.page==="simulado")return renderSim();
  const m=MODS.find(x=>x.id===view.mod)||MODS[0];renderMod(m);
}

function renderHome(){
  const T=MODS.reduce((a,m)=>a+total(m),0),D=MODS.reduce((a,m)=>a+done(m.id),0),pc=Math.round(D/T*100);
  let h=`<div class="mhead"><span class="eyebrow">Console de estudos · ${MODS.length} módulos · ${T} atividades</span><h2>Segurança da Informação</h2>
  <p>Unidade Curricular Segurança de Sistemas. Estude cada módulo pelo resumo, depois resolva as atividades. As respostas só aparecem depois que você tenta.</p></div>
  <div class="hero"><div class="panel"><h3>Como estudar em cada módulo</h3>
  <div class="legend"><div><b>12</b><span><strong>Caderno</strong>: responda à mão no caderno e confira.</span></div>
  <div><b>12</b><span><strong>Flashcards</strong>: pense na definição, vire a carta e avalie-se.</span></div>
  <div><b>12</b><span><strong>V ou F</strong>: marque e justifique antes de conferir.</span></div>
  <div><b>★</b><span><strong>Interativo</strong>: imagens, linhas do tempo, animações e simuladores.</span></div><div><b>4</b><span><strong>PBL</strong>: problemas reais para resolver em equipe.</span></div></div>
  <p class="ementa"><strong>Ementa:</strong> conceitos básicos de Segurança e Auditoria da TI; segurança lógica, física e ambiental; política de segurança; continuidade operacional e planos de contingência; acesso lógico e controle de acesso; pontos de controle e normas de gestão de segurança da informação.</p></div>
  <div class="panel"><h3>Seu progresso</h3><div class="big">${pc}%</div><div class="bar"><i style="width:${pc}%"></i></div>
  <p class="hint">${D} de ${T} atividades concluídas${S._sim?` · último simulado: ${S._sim}%`:""}. O progresso fica salvo só neste navegador.</p>
  <div class="ctrl"><button class="btn pri" type="button" data-next>${D?"Continuar":"Começar pelo Módulo 01"}</button><button class="btn" type="button" data-sim>Fazer simulado</button></div></div></div>
  <div class="sec-t">Módulos</div><div class="mgrid">`;
  MODS.forEach((m,i)=>{const d=done(m.id),t=total(m),p=Math.round(d/t*100);
    h+=`<button class="mcard" type="button" data-mod="${m.id}"><span class="n">Módulo ${pad(i+1)}</span><h4>${esc(m.titulo)}</h4><span class="src">${esc(m.fonte)}</span><div class="bar"><i style="width:${p}%"></i></div><div class="meta"><span>${d}/${t} feitas</span><span>${p}%</span></div></button>`});
  h+="</div>";main.innerHTML=h;
  main.querySelectorAll(".mcard").forEach(b=>b.onclick=()=>setView({page:"mod",mod:b.dataset.mod,tab:"resumo"}));
  main.querySelector("[data-sim]").onclick=()=>setView({page:"simulado"});
  main.querySelector("[data-next]").onclick=()=>{const m=MODS.find(x=>done(x.id)<total(x))||MODS[0];setView({page:"mod",mod:m.id,tab:done(m.id)?"caderno":"resumo"})};
}

function renderCola(){
  let h=`<div class="mhead"><span class="eyebrow">Revisão rápida</span><h2>Cola geral</h2><p>Os pontos principais de todos os módulos em uma página, para revisar antes da prova.</p></div><div class="cola">`;
  MODS.forEach((m,i)=>{h+=`<h3>${pad(i+1)} · ${esc(m.titulo)}</h3><dl>`;m.resumo.forEach(r=>h+=`<dt>${esc(r[0])}</dt><dd>${esc(r[1])}</dd>`);h+="</dl>"});
  main.innerHTML=h+"</div>";
}

const TABS=[["resumo","Resumo",m=>""],["viz","Interativo",m=>(VIZ[m.id]||[]).length+(m.lab?1:0)],["caderno","Caderno",m=>m.caderno.length],["flash","Flashcards",m=>m.flash.length],["vf","V ou F",m=>m.vf.length],["pbl","PBL",m=>m.pbl.length]];
function renderMod(m){
  const i=MODS.indexOf(m);
  let h=`<div class="mhead"><span class="eyebrow">Módulo ${pad(i+1)} · ${esc(m.fonte)}</span><h2>${esc(m.titulo)}</h2><p>${esc(m.objetivo)}</p></div>
  <div class="tabs" role="tablist">`;
  TABS.forEach(t=>{const c=t[2](m);h+=`<button role="tab" type="button" aria-selected="${view.tab===t[0]}" data-tab="${t[0]}">${t[1]}${c!==""?`<span class="ct">${c}</span>`:""}</button>`});
  h+=`</div><div id="pane"></div>`;main.innerHTML=h;
  main.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>setView({tab:b.dataset.tab}));
  const pane=document.getElementById("pane");
  ({resumo:paneResumo,viz:paneViz,caderno:paneCaderno,flash:paneFlash,vf:paneVF,pbl:panePBL})[view.tab](m,pane);
}

function paneResumo(m,pane){
  let h='<div class="rgrid">';m.resumo.forEach(r=>h+=`<div class="rcard"><h4>${esc(r[0])}</h4><p>${esc(r[1])}</p></div>`);h+="</div>";
  const i=MODS.indexOf(m);
  h+=`<div class="sec-t">Próximo passo</div><div class="ctrl"><button class="btn pri" type="button" id="goViz">Explorar o Interativo</button><button class="btn" type="button" id="goCad">Ir para o caderno</button>${i<MODS.length-1?`<button class="btn" type="button" id="goNext">Módulo ${pad(i+2)} →</button>`:""}</div>`;
  pane.innerHTML=h;
  pane.querySelector("#goCad").onclick=()=>setView({tab:"caderno"});
  const gn=pane.querySelector("#goNext");if(gn)gn.onclick=()=>setView({mod:MODS[i+1].id,tab:"resumo"});
  pane.querySelector("#goViz").onclick=()=>setView({tab:"viz"});
}
function paneViz(m,pane){
  const list=(VIZ[m.id]||[]).slice();
  if(m.lab==="cesar")list.push({tipo:"Laboratório",t:"Cifra de César: cifrar e quebrar",d:"Digite um texto, escolha o deslocamento e veja a força bruta testar todas as chaves.",build:r=>{r.innerHTML=labCesar();wireCesar(r)}});
  if(m.lab==="hash")list.unshift({tipo:"Laboratório",t:"Hash SHA-256 e efeito avalanche",d:"Mude uma letra no texto B e veja o hash inteiro mudar.",build:r=>{r.innerHTML=labHash();wireHash(r)}});
  pane.innerHTML=`<p class="intro"><b>Explore antes de responder:</b> toque nas imagens, rode as animações e faça os desafios. Depois siga para o caderno.</p><nav class="vz-toc" aria-label="Atividades interativas">${list.map((w,k)=>`<a href="#vz-${m.id}-${k}"><span>${pad(k+1)}</span>${esc(w.t)}</a>`).join("")}</nav><div class="list" data-vl></div>
  <div class="ctrl" style="margin-top:18px"><button class="btn pri" type="button" id="goCad2">Ir para as atividades do caderno →</button></div>`;
  const vl=pane.querySelector("[data-vl]");
  list.forEach((w,k)=>{const sec=document.createElement("section");sec.className="item vz-card";sec.id=`vz-${m.id}-${k}`;
    sec.innerHTML=`<span class="kicker">${esc(w.tipo)}</span><h4 class="vz-h">${esc(w.t)}</h4><p class="vz-d">${esc(w.d)}</p><div class="vz-body"></div>`;vl.appendChild(sec);
    try{w.build(sec.querySelector(".vz-body"))}catch(e){sec.querySelector(".vz-body").innerHTML='<p class="hint">Não foi possível carregar esta atividade neste navegador.</p>';console.error(e)}});
  pane.querySelectorAll(".vz-toc a").forEach(a=>a.onclick=e=>{e.preventDefault();const t=document.getElementById(a.getAttribute("href").slice(1));if(t)t.scrollIntoView({behavior:"smooth",block:"start"})});
  pane.querySelector("#goCad2").onclick=()=>setView({tab:"caderno"});
}

/* gating helper: returns true when attempt is valid */
function gate(ta,ck,min){return PROF||(ta&&ta.value.trim().length>=min)||(ck&&ck.checked)}

function paneCaderno(m,pane){
  const s=st(m.id);
  let h=`<p class="intro"><b>Como fazer:</b> copie a pergunta no caderno e responda à mão. Depois marque “Respondi no caderno” (ou digite um rascunho aqui) para liberar a resposta e compare com a sua.</p><div class="list">`;
  m.caderno.forEach((it,k)=>{const rev=PROF||s.c[k]!=null;
    h+=`<div class="item${s.c[k]!=null?" done":""}" data-k="${k}"><div class="qrow"><span class="qn">${pad(k+1)}</span><p class="q">${esc(it.q)}</p></div>
    <textarea id="c-${m.id}-${k}" placeholder="Rascunho opcional (mín. 15 caracteres)…">${esc((s.d["c"+k])||"")}</textarea>
    <div class="ctrl"><label class="chk"><input type="checkbox" id="ck-${m.id}-${k}"${s.c[k]!=null?" checked":""}> Respondi no caderno</label><button class="btn pri" type="button" data-rev disabled>Ver resposta</button></div>
    <div data-out ${rev?"":"hidden"}>${ansC(it,k,s)}</div></div>`});
  pane.innerHTML=h+"</div>";
  pane.querySelectorAll(".item").forEach(el=>{const k=+el.dataset.k,ta=el.querySelector("textarea"),ck=el.querySelector("input"),b=el.querySelector("[data-rev]"),out=el.querySelector("[data-out]");
    const upd=()=>{b.disabled=!gate(ta,ck,15)||!out.hidden};upd();
    ta.oninput=()=>{s.d["c"+k]=ta.value;save();upd()};ck.onchange=upd;
    b.onclick=()=>{out.hidden=false;if(s.c[k]==null){s.c[k]="?";save();el.classList.add("done");renderNav()}upd();wireRate(el,m,k)};
    if(!out.hidden)wireRate(el,m,k);
  });
}
function ansC(it,k,s){const v=s.c[k];return `<div class="ans"><span class="lbl">Resposta esperada</span><div>${esc(it.r)}</div></div>
  <div class="rate" style="margin-top:8px">Como foi? <button type="button" data-r="ok" aria-pressed="${v==="ok"}">Acertei</button><button type="button" data-r="parc" aria-pressed="${v==="parc"}">Acertei em parte</button><button type="button" data-r="err" aria-pressed="${v==="err"}">Errei</button></div>`}
function wireRate(el,m,k){const s=st(m.id);el.querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>{s.c[k]=b.dataset.r;save();el.querySelectorAll("[data-r]").forEach(x=>x.setAttribute("aria-pressed",x===b));if(!el.classList.contains("done")){el.classList.add("done");renderNav()}})}

function paneFlash(m,pane){
  const s=st(m.id);let idx=s.fi||0;if(idx>=m.flash.length)idx=0;let order=s.fo&&s.fo.length===m.flash.length?s.fo:m.flash.map((_,i)=>i);
  pane.innerHTML=`<p class="intro"><b>Como fazer:</b> leia o termo e diga (ou escreva) a definição antes de virar. Clique na carta para virar e marque se sabia. Os quadradinhos mostram seu desempenho: verde = sabia, âmbar = revisar.</p>
  <div class="deck"><button type="button" class="fc" id="fc" aria-label="Virar carta"><div class="in"><div class="face front"><span class="tag">Termo · clique para virar</span><span class="term" id="ft"></span></div><div class="face back"><span class="tag">Definição</span><span class="def" id="fb"></span></div></div></button>
  <div class="deckbar"><button class="btn" type="button" id="fp">← Anterior</button><span class="pos" id="fpos"></span><button class="btn" type="button" id="fn">Próxima →</button></div>
  <div class="deckbar" id="frate" hidden><span class="hint">Você sabia?</span><button class="btn" type="button" data-k="1">Sabia</button><button class="btn" type="button" data-k="0">Preciso revisar</button></div>
  <div class="dots" id="fdots"></div>
  <div class="deckbar"><button class="btn" type="button" id="fsh">Embaralhar</button><button class="btn" type="button" id="frev">Só as que preciso revisar</button></div></div>`;
  const fc=pane.querySelector("#fc"),fr=pane.querySelector("#frate");
  function show(){const c=m.flash[order[idx]];pane.querySelector("#ft").textContent=c.f;pane.querySelector("#fb").textContent=c.b;fc.classList.remove("flip");fr.hidden=true;
    pane.querySelector("#fpos").textContent=`${idx+1} / ${order.length}`;s.fi=idx;save();
    pane.querySelector("#fdots").innerHTML=order.map((o,j)=>`<span class="${s.f[o]===1?"k":s.f[o]===0?"n":""}${j===idx?" cur":""}" title="Carta ${j+1}"></span>`).join("")}
  fc.onclick=()=>{fc.classList.toggle("flip");fr.hidden=!fc.classList.contains("flip")};
  pane.querySelector("#fp").onclick=()=>{idx=(idx-1+order.length)%order.length;show()};
  pane.querySelector("#fn").onclick=()=>{idx=(idx+1)%order.length;show()};
  fr.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>{s.f[order[idx]]=+b.dataset.k;save();renderNav();idx=(idx+1)%order.length;show()});
  pane.querySelector("#fsh").onclick=()=>{order=m.flash.map((_,i)=>i).sort(()=>Math.random()-.5);s.fo=order;idx=0;show()};
  pane.querySelector("#frev").onclick=()=>{const r=m.flash.map((_,i)=>i).filter(i=>s.f[i]!==1);if(!r.length){pane.querySelector("#fpos").textContent="Nada a revisar";return}order=r;s.fo=null;idx=0;show()};
  show();
}

function paneVF(m,pane){
  const s=st(m.id);
  let h=`<p class="intro"><b>Como fazer:</b> marque V ou F e escreva a justificativa (no caderno ou aqui). Se for falsa, diga o que tornaria a frase verdadeira. Só então confira.</p><div class="list">`;
  m.vf.forEach((it,k)=>{const r=s.v[k];
    h+=`<div class="item${r?" done":""}" data-k="${k}"><div class="qrow"><span class="qn">${pad(k+1)}</span><p class="q">${esc(it.a)}</p></div>
    <div class="ctrl"><div class="vf"><button type="button" data-c="V" aria-pressed="${r&&r.c==="V"}"${r?" disabled":""}>V</button><button type="button" data-c="F" aria-pressed="${r&&r.c==="F"}"${r?" disabled":""}>F</button></div></div>
    <textarea id="v-${m.id}-${k}" placeholder="Justificativa (mín. 10 caracteres)…"${r?" readonly":""}>${esc(s.d["v"+k]||"")}</textarea>
    <div class="ctrl"><label class="chk"><input type="checkbox"${r?" checked disabled":""}> Justifiquei no caderno</label><button class="btn pri" type="button" data-rev disabled>Conferir</button><span class="hint" data-h></span></div>
    <div data-out>${r||PROF?ansV(it,r):""}</div></div>`});
  pane.innerHTML=h+"</div>";
  pane.querySelectorAll(".item").forEach(el=>{const k=+el.dataset.k,it=m.vf[k],ta=el.querySelector("textarea"),ck=el.querySelector("input"),b=el.querySelector("[data-rev]"),hint=el.querySelector("[data-h]"),out=el.querySelector("[data-out]");
    let choice=s.v[k]?s.v[k].c:null;
    const upd=()=>{if(s.v[k]){b.disabled=true;return}b.disabled=!(choice&&gate(ta,ck,10));hint.textContent=!choice?"Escolha V ou F.":(b.disabled?"Falta a justificativa.":"")};upd();
    el.querySelectorAll("[data-c]").forEach(x=>x.onclick=()=>{choice=x.dataset.c;el.querySelectorAll("[data-c]").forEach(y=>y.setAttribute("aria-pressed",y===x));upd()});
    ta.oninput=()=>{s.d["v"+k]=ta.value;save();upd()};ck.onchange=upd;
    b.onclick=()=>{const ok=(choice==="V")===it.v;s.v[k]={c:choice,ok};save();out.innerHTML=ansV(it,s.v[k]);el.classList.add("done");ta.readOnly=true;ck.disabled=true;el.querySelectorAll("[data-c]").forEach(y=>y.disabled=true);upd();hint.textContent="";renderNav()};
  });
}
function ansV(it,r){const cls=r?(r.ok?"ok":"bad"):"";const lbl=r?(r.ok?"Você acertou · gabarito: "+(it.v?"V":"F"):"Não foi dessa vez · gabarito: "+(it.v?"V":"F")):"Gabarito: "+(it.v?"V":"F");
  return `<div class="ans ${cls}"><span class="lbl">${lbl}</span><div>${esc(it.j)}</div></div>`}

function panePBL(m,pane){
  const s=st(m.id);
  let h=`<p class="intro"><b>Como fazer:</b> em equipe, leia o cenário, discuta as questões-guia e registre a solução no caderno. Libere a solução de referência só depois de terminar, e use-a como rubrica para avaliar o que fizeram.</p><div class="list">`;
  m.pbl.forEach((it,k)=>{const rev=PROF||s.p[k];
    h+=`<div class="item pbl${s.p[k]?" done":""}" data-k="${k}"><span class="kicker">Problema ${k+1} de ${m.pbl.length}</span><h4>${esc(it.t)}</h4><p class="cen">${esc(it.c)}</p>
    <ol>${it.p.map(x=>`<li>${esc(x)}</li>`).join("")}</ol>
    <textarea id="p-${m.id}-${k}" placeholder="Resumo da solução da equipe (mín. 40 caracteres)…" style="min-height:96px">${esc(s.d["p"+k]||"")}</textarea>
    <div class="ctrl"><label class="chk"><input type="checkbox"${s.p[k]?" checked":""}> A equipe registrou a solução no caderno</label><button class="btn pri" type="button" data-rev disabled>Ver solução de referência</button></div>
    <div data-out ${rev?"":"hidden"}><div class="ans"><span class="lbl">Solução de referência / rubrica</span><div>${esc(it.r)}</div></div></div></div>`});
  pane.innerHTML=h+"</div>";
  pane.querySelectorAll(".item").forEach(el=>{const k=+el.dataset.k,ta=el.querySelector("textarea"),ck=el.querySelector("input"),b=el.querySelector("[data-rev]"),out=el.querySelector("[data-out]");
    const upd=()=>{b.disabled=!out.hidden||!gate(ta,ck,40)};upd();
    ta.oninput=()=>{s.d["p"+k]=ta.value;save();upd()};ck.onchange=upd;
    b.onclick=()=>{out.hidden=false;s.p[k]=1;save();el.classList.add("done");upd();renderNav()};
  });
}

/* Simulado */
let SIM=null;
function renderSim(){
  if(!SIM){main.innerHTML=`<div class="mhead"><span class="eyebrow">Avaliação</span><h2>Simulado</h2><p>20 afirmações de Verdadeiro ou Falso sorteadas de todos os módulos. Responda todas; o gabarito com as justificativas aparece no final.</p></div>
    <div class="panel" style="max-width:560px"><h3>Pronto?</h3><p class="hint">${S._sim?`Seu último resultado: ${S._sim}%.`:"Você ainda não fez o simulado."} A cada tentativa as questões mudam.</p><div class="ctrl"><button class="btn pri" type="button" id="simgo">Iniciar simulado</button></div></div>`;
    main.querySelector("#simgo").onclick=()=>{const pool=[];MODS.forEach((m,i)=>m.vf.forEach(q=>pool.push(Object.assign({mi:i},q))));pool.sort(()=>Math.random()-.5);SIM={q:pool.slice(0,20),a:{},end:false};renderSim()};return}
  let h=`<div class="mhead"><span class="eyebrow">Simulado · 20 questões</span><h2>${SIM.end?"Resultado":"Verdadeiro ou Falso"}</h2></div>`;
  if(SIM.end){const ok=SIM.q.filter((q,k)=>(SIM.a[k]==="V")===q.v).length,pc=Math.round(ok/20*100);
    h+=`<div class="panel" style="margin-bottom:18px"><div class="score"><span class="big">${ok}/20</span><div style="flex:1;min-width:200px"><div class="bar"><i style="width:${pc}%"></i></div><p class="hint" style="margin-top:6px">${pc>=70?"Bom resultado. Revise as que errou abaixo.":"Revise os módulos indicados nas questões erradas e tente de novo."}</p></div><button class="btn pri" type="button" id="simnew">Novo simulado</button></div></div>`}
  h+='<div class="list">';
  SIM.q.forEach((q,k)=>{const a=SIM.a[k];
    h+=`<div class="item" data-k="${k}"><div class="qrow"><span class="qn">${pad(k+1)}</span><p class="q">${esc(q.a)} <span class="hint">· Módulo ${pad(q.mi+1)}</span></p></div>
    <div class="vf"><button type="button" data-c="V" aria-pressed="${a==="V"}"${SIM.end?" disabled":""}>V</button><button type="button" data-c="F" aria-pressed="${a==="F"}"${SIM.end?" disabled":""}>F</button></div>
    ${SIM.end?ansV(q,{c:a,ok:(a==="V")===q.v}):""}</div>`});
  h+="</div>";
  if(!SIM.end)h+=`<div class="ctrl" style="margin-top:16px"><button class="btn pri" type="button" id="simend" disabled>Finalizar e ver gabarito</button><span class="hint" id="simh">0 de 20 respondidas</span></div>`;
  main.innerHTML=h;
  if(SIM.end){main.querySelector("#simnew").onclick=()=>{SIM=null;renderSim()};return}
  const be=main.querySelector("#simend"),sh=main.querySelector("#simh");
  const cnt=()=>{const n=Object.keys(SIM.a).length;sh.textContent=`${n} de 20 respondidas`;be.disabled=n<20};cnt();
  main.querySelectorAll(".item").forEach(el=>{const k=+el.dataset.k;el.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>{SIM.a[k]=b.dataset.c;el.querySelectorAll("[data-c]").forEach(y=>y.setAttribute("aria-pressed",y===b));cnt()})});
  be.onclick=()=>{SIM.end=true;const ok=SIM.q.filter((q,k)=>(SIM.a[k]==="V")===q.v).length;S._sim=Math.round(ok/20*100);save();render();window.scrollTo({top:0})};
}

/* Labs */
function caesar(t,n){return t.toUpperCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[A-Z]/g,c=>String.fromCharCode((c.charCodeAt(0)-65+n+26)%26+65))}
function labCesar(){return `<div class="lab"><h4>Cifra de César</h4><p class="hint" style="margin:0">Digite um texto, escolha o deslocamento e veja o resultado. A tabela de força bruta mostra todas as 25 chaves possíveis: é por isso que a cifra é fraca.</p>
  <div class="two"><label>Texto<input type="text" id="cz-in" value="SEGURANCA DA INFORMACAO"></label><label>Deslocamento: <span id="cz-nv">3</span><input type="range" id="cz-n" min="1" max="25" value="3"></label></div>
  <div class="two"><div><div class="hint">Cifrar (+n)</div><div class="out" id="cz-enc"></div></div><div><div class="hint">Decifrar (−n)</div><div class="out" id="cz-dec"></div></div></div>
  <div class="hint">Força bruta sobre o texto digitado (decifrando com cada chave)</div><div class="bf"><table id="cz-bf"></table></div></div>`}
function wireCesar(p){const i=p.querySelector("#cz-in"),n=p.querySelector("#cz-n");const f=()=>{const k=+n.value;p.querySelector("#cz-nv").textContent=k;p.querySelector("#cz-enc").textContent=caesar(i.value,k);p.querySelector("#cz-dec").textContent=caesar(i.value,-k);
  let t="";for(let j=1;j<26;j++)t+=`<tr><td>${j}</td><td>${esc(caesar(i.value,-j))}</td></tr>`;p.querySelector("#cz-bf").innerHTML=t};i.oninput=f;n.oninput=f;f()}
function labHash(){return `<div class="lab"><h4>Laboratório de hash SHA-256</h4><p class="hint" style="margin:0">Mude uma única letra no texto B e veja o efeito avalanche: o hash inteiro muda. Os caracteres diferentes aparecem destacados.</p>
  <div class="two"><label>Texto A<input type="text" id="h-a" value="Nota final: 8,5"></label><label>Texto B<input type="text" id="h-b" value="Nota final: 5,5"></label></div>
  <div class="two"><div><div class="hint">SHA-256 de A</div><div class="out" id="h-oa"></div></div><div><div class="hint">SHA-256 de B</div><div class="out" id="h-ob"></div></div></div>
  <div class="hint" id="h-diff"></div></div>`}
async function sha(t){if(!(window.crypto&&crypto.subtle))return null;const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(t));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}
function wireHash(p){const a=p.querySelector("#h-a"),b=p.querySelector("#h-b");const f=async()=>{const ha=await sha(a.value),hb=await sha(b.value);
  if(!ha){p.querySelector("#h-diff").textContent="Este navegador não disponibilizou a função de hash. No Windows use: certutil -hashfile arquivo SHA256";return}
  let d=0,sb="";for(let i=0;i<64;i++){if(ha[i]!==hb[i]){d++;sb+=`<mark>${hb[i]}</mark>`}else sb+=hb[i]}
  p.querySelector("#h-oa").textContent=ha;p.querySelector("#h-ob").innerHTML=sb;p.querySelector("#h-diff").textContent=`${d} de 64 caracteres hexadecimais diferentes${a.value===b.value?" (textos iguais, hashes iguais)":""}.`};a.oninput=f;b.oninput=f;f()}

/* professor mode + reset */
const pf=document.getElementById("prof"),pm=document.getElementById("profmob");
[pf,pm].forEach(x=>x.onchange=()=>{PROF=x.checked;pf.checked=pm.checked=PROF;render()});
const rs=document.getElementById("reset"),rm=document.getElementById("resetmsg");let armed=false;
rs.onclick=()=>{if(!armed){armed=true;rs.textContent="Clique de novo para confirmar";setTimeout(()=>{armed=false;rs.textContent="Zerar meu progresso"},4000);return}
  S={};save();armed=false;rs.textContent="Zerar meu progresso";rm.hidden=false;rm.textContent="Progresso zerado.";setTimeout(()=>rm.hidden=true,2500);render()};
render();
})();
