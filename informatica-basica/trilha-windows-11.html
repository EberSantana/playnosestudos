["E-mail para a coordenação","Você precisa enviar o trabalho em grupo ao professor, mantendo a coordenação informada e o colega que faltou em cópia sem expor o e-mail dele a todos.",["Defina quem vai em Para, Cc e Cco.","Escreva um assunto claro.","Escreva o corpo do e-mail (5 a 7 linhas)."],"Rascunho completo do e-mail.","Para: professor. Cc: coordenação. Cco: colega. Assunto: ‘Trabalho em grupo – Turma X – Tema Y’. Corpo: saudação, o que está sendo enviado, integrantes, observação breve, agradecimento e assinatura com nome e turma."],
["Semana de provas no To Do","A semana de provas tem 5 avaliações, 2 trabalhos e o treino de futebol às terças e quintas.",["Crie as tarefas com datas e lembretes.","Divida um trabalho em etapas.","Diga quais vão para Importante e quais repetem."],"Lista de tarefas como ficaria no app.","Cada prova: tarefa com data de conclusão e Lembrar-me na véspera. Trabalho dividido em etapas (pesquisar, escrever, revisar, entregar). Importante: provas e entregas. Repetir: treino semanal às terças e quintas. Meu Dia: o que fazer hoje."],
["Conta segura","Você vai criar sua conta Outlook para usar o To Do. Um colega sugere usar a mesma senha do Instagram para não esquecer.",["Explique o risco de reutilizar senhas.","Crie uma regra para montar uma senha forte (sem revelar a sua).","Cite uma camada extra de proteção."],"Regras de senha + explicação.","Se um serviço vazar, todos com a mesma senha ficam expostos. Regra: frase longa com 12+ caracteres, misturando palavras, números e símbolos, única por serviço; gerenciador de senhas ajuda. Camada extra: verificação em duas etapas (app autenticador ou SMS)."]]},

{t:"Aplicativos Parte III · Paint 3D",
r:["O Paint 3D traz ferramentas 2D e 3D fáceis de usar, sem exigir conhecimento de design 3D.","Pincéis (10): marcador, caneta de caligrafia, pincel para óleo, aquarela, caneta de pixel, lápis, borracha, giz de cera, tubo de spray e preenchimento; todos com espessura e opacidade.","Materiais: fosco, brilho, metal opaco e metal polido.","Formas 2D: linha, curvas de 3, 4 e 5 pontos e formas prontas; Selo replica, Confirmar aplica, alças redimensionam, Girar e inverter.","Formas 3D: esboço 3D (borda suave/aguda), pincel tubular (forma de tubo, espessura, cônico), modelos 3D (homem, mulher, cão, gato, peixe).","Adesivos, Texto 2D/3D, Efeitos de iluminação, Tela (mostrar, transparente, redimensionar) e Biblioteca 3D.","Exibição 3D: com [[Alt]] e o botão do mouse pressionados, gira-se a cena e muda-se a perspectiva."],
k:[["[[Alt]] + arrastar","Gira a visão 3D da cena"],["[[Ctrl]] + [[Z]]","Desfazer"],["[[Ctrl]] + [[S]]","Salvar projeto"]],
n:"O Paint 3D foi descontinuado e retirado da Microsoft Store em novembro de 2024. Quem já o tem instalado pode continuar usando. Para praticar modelagem 3D hoje: Tinkercad (online, gratuito) ou Blender.",
c:[["Qual a principal vantagem do Paint 3D em relação ao Paint para quem não sabe desenhar?","Oferece ferramentas básicas e avançadas fáceis de usar, sem exigir saber desenhar ou ter conhecimento de design 3D."],
["Cite os 10 pincéis do Paint 3D.","Marcador, caneta de caligrafia, pincel para óleo, aquarela, caneta de pixel, lápis, borracha, giz de cera, tubo de spray e preenchimento."],
["Diferencie marcador e caneta de caligrafia.","O marcador tem traço uniforme e limpo. A caneta de caligrafia varia a espessura conforme a velocidade do movimento."],
["Para que servem a tolerância e a opacidade no preenchimento?","Tolerância define quanto da imagem será colorida; opacidade define a transparência do objeto."],
["O que fazem o Selo, o Confirmar e as alças de uma forma?","Selo replica a forma; Confirmar (o V) aplica as modificações; alças redimensionam."],
["Quais tipos de curva o Paint 3D oferece e para que servem os pontos?","Curvas de 3, 4 e 5 pontos; os pontos permitem arrastar e alterar o formato da curva."],
["Diferencie borda suave e borda aguda no esboço 3D.","Borda suave arredonda os cantos do desenho; borda aguda cria um desenho plano, sem suavizar cantos."],
["O que indica o timer laranja no pincel tubular?","Que o objeto está chegando ao limite de tamanho; todo laranja significa que não dá para continuar desenhando, só editar pelos pontos."],
["Descreva as quatro opções de Cônico.","Não cônico (mesma espessura); Grande para pequeno; Pequeno para grande; Pequeno-grande-pequeno; e Grande-pequeno-grande."],
["Para que serve a opção Tela transparente?","Para salvar o desenho sem o fundo branco padrão."]],
f:[["Paint 3D","Editor 2D/3D do Windows, descontinuado em 2024."],["Caneta de caligrafia","Espessura varia com a velocidade do traço."],["Caneta de pixel","Colore totalmente cada pixel por onde passa."],["Tubo de spray","Acumula cor quando mantido pressionado."],["Material metal polido","Visual metálico, como cobre."],["Selo","Replica a forma selecionada."],["Curva de 5 pontos","Curva com cinco pontos editáveis."],["Borda suave","Esboço 3D com cantos arredondados."],["Pincel tubular","Cria volumes 3D em forma de tubo."],["Cônico","Define como a espessura do tubo varia."],["Adesivos","Figuras ou texturas aplicadas sobre formas 3D."],["Biblioteca 3D","Galeria de objetos 3D por categoria (Animais, Espaço...)."]],
v:[["No Paint 3D não é preciso saber desenhar para criar objetos 3D.",1,"As ferramentas foram pensadas para facilitar esse trabalho."],
["O menu Pincéis possui 10 ferramentas.",1,"Do marcador ao preenchimento."],
["A caneta de caligrafia tem traço sempre da mesma espessura.",0,"A espessura depende da velocidade do movimento."],
["A aquarela escurece quando se passa várias vezes no mesmo local.",1,"O efeito vai de fraco a escuro com repetições."],
["A borracha do Paint 3D remove elementos 2D da área de desenho.",1,"É a função descrita na aula."],
["A opacidade define o quanto de transparência um objeto terá.",1,"Menor opacidade, mais transparente."],
["O Selo serve para apagar uma forma.",0,"O Selo replica a forma."],
["As curvas do Paint 3D podem ter 3, 4 ou 5 pontos.",1,"São os três tipos de curva."],
["A borda aguda suaviza os cantos do esboço 3D.",0,"Quem suaviza é a borda suave."],
["O pincel tubular oferece formas como cápsula, cilindro e estrela.",1,"São seis: cápsula, cilindro, triângulo, losango, hexágono e estrela."],
["O timer laranja indica que o tubo pode crescer sem limites.",0,"Indica que o objeto está chegando ao limite."],
["Os modelos 3D prontos incluem homem, mulher, cão, gato e peixe.",1,"São os cinco modelos citados."],
["Tela transparente salva o desenho sem o fundo branco.",1,"É a finalidade da opção."],
["O Paint 3D continua disponível para download na Microsoft Store.",0,"Foi retirado da loja em novembro de 2024."]],
p:[["Paisagem em camadas","A turma vai criar uma paisagem para o mural virtual da escola, com fundo, sol, nuvens e pássaros.",["Defina a ferramenta do Paint 3D para cada elemento.","Desenhe o esboço da composição no caderno.","Indique materiais e cores."],"Esboço + tabela Elemento | Ferramenta | Cor/Material.","Fundo: pincel Preenchimento. Sol: forma 2D círculo ou esfera 3D com material brilho. Nuvens: esboço 3D com borda suave em branco. Pássaros: curva de 5 pontos em preto, replicada com o Selo e redimensionada."],
["Emoji da turma","Cada aluno vai criar um emoji 3D que represente a turma para usar no grupo da sala.",["Escolha a forma 3D base.","Defina adesivos, cores e material.","Planeje uma vista de exibição 3D para o ‘print’ final."],"Esboço do emoji + ficha técnica.","Base: esfera 3D. Adesivos de olhos/boca da categoria Adesivos ou desenhados. Material fosco para cor uniforme. Usar Exibição 3D ([[Alt]] + arrastar) para escolher um ângulo levemente inclinado antes de salvar com Tela transparente."],
["Maquete do zoológico","A professora de Biologia quer uma cena com três animais da Biblioteca 3D e placas com nomes.",["Escolha três animais e explique a escolha.","Planeje a disposição na cena.","Defina como fazer as placas (Texto 2D ou 3D) e a iluminação."],"Planta baixa da cena + escolhas.","Ex.: lobo cinza, cavalo e jacaré da categoria Animais. Disposição em semicírculo para a visão 3D. Placas em Texto 3D sobre uma forma retangular. Efeito de iluminação claro e natural para não escurecer os modelos."],
["Paint 3D saiu da loja","O laboratório foi formatado e o Paint 3D não pode mais ser instalado. A professora quer manter a atividade de modelagem 3D.",["Pesquise duas alternativas gratuitas.","Compare facilidade, necessidade de internet e público.","Recomende uma para o 1º ano e justifique."],"Quadro comparativo + recomendação.","Tinkercad: online, no navegador, muito simples e voltado à educação (bom para 1º ano). Blender: instalado, profissional, curva de aprendizado alta. Recomendação: Tinkercad, por ser fácil, gratuito e permitir exportar para impressão 3D."]]},

{t:"Aplicativos Parte IV · Animação e Clipchamp",
r:["No Paint 3D: Expandir Menu > Salvar como > Vídeo. Inserir uma forma 3D melhora a animação.","Formatos: PNG, JPEG, BMP, GIF, TIFF (imagens), MP4 e GIF (vídeo). O melhor para vídeo é MP4.","Largura e altura em pixels ou porcentagem (padrão 1096 × 640).","Taxa de quadros: imagens por segundo (24 qps = 24 quadros por segundo). Qualidade recomendada: 80%.","Animação: seis tipos, multiplicador de velocidade de 0,25 a 4,00 e número de loops.","Clipchamp: editor de vídeo online da Microsoft com corte, texto, transições, efeitos, filtros e exportação.","Timeline com trilhas empilhadas e agulha (posição atual); recursos de áudio (volume, silenciar, deslocamento), fade in/out, filtros, efeitos e ajustes de cor (brilho, contraste, saturação, temperatura)."],
k:[["[[Espaço]]","Reproduzir/pausar no Clipchamp"],["[[S]]","Dividir clipe na agulha (Clipchamp)"],["[[Ctrl]] + [[Z]]","Desfazer"]],
n:"O Paint 3D foi descontinuado (ver Aula 9); a parte de animação vale para quem ainda o tem. O Clipchamp segue ativo e vem com o Windows 11.",
c:[["Como acessar a opção de salvar como vídeo no Paint 3D?","Botão Expandir Menu (superior esquerdo) > Salvar como > Vídeo."],
["Quais formatos de saída o Paint 3D oferece e qual é o melhor para vídeo?","PNG, JPEG, BMP, GIF, TIFF (imagem), MP4 e GIF (vídeo). O melhor para vídeo é o MP4."],
["O que é taxa de quadros? Dê um exemplo.","É o número de imagens exibidas por segundo. Com 24 quadros por segundo, 24 imagens formam 1 segundo de vídeo."],
["Qual a qualidade de vídeo recomendada e qual o efeito de aumentar ou reduzir?","80%. Menos qualidade deixa o arquivo leve e pior; mais qualidade melhora a imagem e deixa o arquivo pesado."],
["O que fazem o multiplicador de velocidade e o número de loops?","O multiplicador muda a velocidade (de 0,25 a 4,00); o número de loops define quantas vezes a animação se repete."],
["O que é o Clipchamp e quem o usa?","Editor de vídeo online da Microsoft, usado por iniciantes e profissionais para redes sociais, apresentações e marketing."],
["Descreva os passos para importar um vídeo no Clipchamp.","Entrar na conta, Create a new video, clicar em Importar mídia ou arrastar o arquivo, e depois arrastar o vídeo para a timeline."],
["Como funciona a timeline?","É dividida em trilhas horizontais empilhadas onde se arrastam clipes de vídeo, áudio, imagens e textos, permitindo sobrepor elementos."],
["Quais as funções da agulha na timeline?","Mostrar a posição atual, definir o ponto de cortes/divisões/efeitos e permitir visualizar um trecho exato."],
["Diferencie filtros e ajustes de cor no Clipchamp.","Filtros são estilos prontos (preto e branco, sépia, vintage) com intensidade. Ajustes de cor controlam brilho, contraste, saturação e temperatura individualmente."]],
f:[["Salvar como vídeo","Expandir Menu > Salvar como > Vídeo (Paint 3D)."],["MP4","Melhor formato de vídeo da lista."],["Taxa de quadros","Imagens exibidas por segundo."],["Qualidade 80%","Equilíbrio recomendado entre imagem e tamanho."],["Multiplicador de velocidade","De 0,25× a 4×."],["Loops","Quantas vezes a animação se repete."],["Clipchamp","Editor de vídeo online da Microsoft."],["Timeline","Trilhas onde os clipes são organizados."],["Agulha","Indicador da posição atual na timeline."],["Fade in / Fade out","Vídeo aparece ou desaparece gradualmente."],["Deslocamento de áudio","Sincroniza o som com a imagem."],["Temperatura de cor","Deixa o vídeo mais quente (amarelo) ou frio (azul)."]],
v:[["Inserir uma forma 3D ajuda a animação do Paint 3D a ter melhor visualização.",1,"É a recomendação da aula."],
["O GIF pode ser salvo como imagem ou como vídeo no Paint 3D.",1,"Aparece nas duas categorias."],
["O tamanho padrão do vídeo no Paint 3D é 1920 × 1080.",0,"O padrão mostrado é 1096 × 640 pixels."],
["Com 24 quadros por segundo, 24 imagens formam um segundo de vídeo.",1,"É a definição de taxa de quadros."],
["Quanto maior a qualidade de vídeo, menor fica o arquivo.",0,"Maior qualidade deixa o arquivo mais pesado."],
["O multiplicador de velocidade vai de 0,25 a 4,00.",1,"São os limites indicados."],
["O Clipchamp só serve para profissionais de vídeo.",0,"É usado por iniciantes e profissionais."],
["No Clipchamp, as trilhas da timeline são empilhadas verticalmente.",1,"Isso permite sobrepor vídeo, áudio e texto."],
["A agulha se move da direita para a esquerda durante a reprodução.",0,"Ela se move da esquerda para a direita."],
["Para dividir um clipe, posiciona-se a agulha no ponto desejado.",1,"Depois usa-se a ferramenta de corte ou divisão."],
["Silenciar remove completamente o áudio do clipe.",1,"É a opção para silenciar o clipe."],
["Fade in faz o vídeo desaparecer gradualmente.",0,"Fade in faz aparecer; fade out faz desaparecer."],
["A saturação ajusta a intensidade das cores.",1,"Aumenta ou diminui a vivacidade."],
["No exercício da aula, o vídeo é exportado em 720p.",1,"É a qualidade pedida no passo a passo."]],
p:[["Vinheta do canal da turma","A turma vai abrir seus vídeos no canal da escola com uma vinheta de 5 segundos feita no Paint 3D.",["Defina formato, tamanho e taxa de quadros.","Escolha a animação, velocidade e loops.","Estime quantos quadros terá a vinheta."],"Ficha técnica da vinheta.","MP4, 1096 × 640 (ou proporção 16:9), 24 qps, qualidade 80%. Animação de giro, multiplicador 1,0, loops ajustados até ~5 s. Quadros: 5 s × 24 = 120 quadros."],
["Reels da feira de ciências","Você gravou 6 trechos da feira de ciências e precisa montar um vídeo de 60 segundos com títulos.",["Planeje o roteiro com tempo de cada trecho.","Defina onde entram textos, transições e música.","Escolha a resolução de exportação e justifique."],"Roteiro em tabela: Tempo | Clipe | Texto | Efeito.","Abertura com título (0–5 s), 6 trechos de ~8 s com transição suave, créditos (55–60 s). Música em trilha separada com volume baixo, fade in no início e fade out no fim. Exportar em 1080p (ou 720p se a internet for lenta)."],
["Vídeo escuro e sem som sincronizado","Um colega gravou uma entrevista em local escuro e a voz está atrasada em relação à boca.",["Indique os ajustes de cor a usar.","Explique como corrigir o atraso do áudio.","Diga o que evitar para não piorar a imagem."],"Lista de correções com valores aproximados.","Aumentar brilho, ajustar contraste levemente, temperatura um pouco mais quente. Usar Deslocamento de áudio para adiantar o som até sincronizar. Evitar brilho exagerado (granulação) e saturação alta (pele artificial)."],
["Tutorial de 1 minuto","Crie um tutorial curto ensinando um recurso do Windows 11 aprendido nesta trilha, usando Clipchamp.",["Escolha o recurso e escreva o roteiro.","Planeje legendas e destaques visuais.","Defina a plataforma de destino e o formato de exportação."],"Roteiro + plano de edição.","Ex.: ‘Como usar o Snap Layout’. Roteiro: problema (janelas bagunçadas), atalho [[Win]] + [[Z]], demonstração, resultado. Legendas em texto na timeline, zoom ou seta em cada passo. Destino: canal da escola, MP4 em 1080p."]]},

{t:"Barra de Tarefas",
r:["A barra de tarefas mostra os programas em execução e contém o menu Iniciar.","Data e hora ficam na barra; clicar exibe o calendário. Ajuste pelo botão direito > Ajustar data e hora.","Definir horário automaticamente sincroniza pela internet; desativando, é possível definir manualmente.","Widgets: clima, notícias, esportes; tamanhos pequeno, médio e grande; personalizar e desafixar em Mais opções.","Reprodutor multimídia: bibliotecas de músicas (Músicas, Álbuns, Artistas) e vídeos, ordem aleatória, ordenar e adicionar pasta.","Microsoft Notícias: categorias Hoje, Interesses e Notícias locais.","Relógio: Sessões de foco, Temporizador, Alarme, Cronômetro e Relógio mundial."],
k:[["[[Win]] + [[W]]","Abre os Widgets"],["[[Win]] + [[Alt]] + [[D]]","Abre data, hora e calendário"],["[[Win]] + [[1]]…[[9]]","Abre o app fixado naquela posição da barra"]],
n:"",
c:[["Por que manter data e hora corretas é importante?","Para o bom funcionamento do sistema (atualizações, certificados de sites, agendamentos e registros de arquivos)."],
["Como alterar data e hora manualmente?","Botão direito sobre data e hora > Ajustar data e hora > desativar Definir horário automaticamente > Definir a data e a hora manualmente > Alterar."],
["O que faz a opção Definir horário automaticamente?","Mantém o relógio certo buscando a hora na internet, conforme o fuso horário."],
["O que são widgets e onde fica seu ícone?","Ferramentas de acesso rápido a clima, notícias, esportes e mais; o ícone fica fixo na barra de tarefas mostrando o clima."],
["Quais opções existem em Mais opções de um widget?","Tamanho pequeno, médio ou grande, personalizar widget e desafixar widget."],
["Como o Reprodutor multimídia monta a biblioteca?","Lista automaticamente os arquivos das pastas Músicas e Vídeos do PC; outras pastas podem ser adicionadas."],
["Por quais critérios é possível ordenar as músicas?","De A a Z, por Artista, por Álbum ou por Ano de lançamento."],
["Diferencie as categorias Hoje, Interesses e Notícias locais.","Hoje: destaques de todas as categorias. Interesses: assuntos marcados como favoritos. Notícias locais: notícias da região escolhida."],
["Como funciona a Sessão de foco?","Reduz distrações por um período; a partir de 45 minutos já inclui um intervalo de 5 minutos para descanso."],
["Diferencie temporizador e cronômetro.","Temporizador faz contagem regressiva de um tempo definido. Cronômetro mede quanto tempo uma atividade está levando."]],
f:[["Barra de tarefas","Mostra programas abertos e contém o Iniciar."],["Ajustar data e hora","Botão direito no relógio da barra."],["Horário automático","Sincroniza o relógio pela internet."],["Widgets","Painel com clima, notícias, esportes ([[Win]] + [[W]])."],["Desafixar widget","Remove o widget do painel."],["Reprodutor multimídia","App para áudio e vídeo das pastas do PC."],["Ordem aleatória","Toca a lista fora de ordem."],["Microsoft Notícias","App de notícias por seções e interesses."],["Sessões de foco","Períodos de concentração com pausas."],["Temporizador","Contagem regressiva."],["Cronômetro","Mede o tempo decorrido."],["Relógio mundial","Horários de outros fusos."]],
v:[["Clicar na data e hora da barra de tarefas exibe o calendário.",1,"É a forma de abrir o calendário."],
["Com Definir horário automaticamente ativado, o sistema busca a hora na internet.",1,"Sincroniza pela internet conforme o fuso."],
["É possível mudar a hora manualmente com o horário automático ligado.",0,"É preciso desativar o horário automático antes."],
["O ícone dos widgets na barra de tarefas mostra o clima.",1,"Ele aparece fixo com a temperatura."],
["Os widgets têm apenas um tamanho fixo.",0,"Podem ser pequenos, médios ou grandes."],
["Para adicionar um widget clica-se no sinal de adição.",1,"O botão + adiciona widgets ao painel."],
["O Reprodutor multimídia lista automaticamente as pastas Músicas e Vídeos.",1,"Os arquivos dessas pastas aparecem na biblioteca."],
["A biblioteca de músicas tem as abas Músicas, Álbuns e Artistas.",1,"São as três abas citadas."],
["Ordem aleatória toca as músicas sempre na mesma sequência.",0,"Ela reproduz fora de ordem."],
["Em Notícias locais é possível escolher a sua região.",1,"Para acompanhar notícias locais."],
["A Sessão de foco serve para aumentar as notificações do dia.",0,"Ela reduz distrações e foca no que importa."],
["Uma sessão de foco de 45 minutos já inclui 5 minutos de pausa.",1,"É o padrão descrito na aula."],
["O cronômetro faz contagem regressiva.",0,"Isso é o temporizador; o cronômetro mede o tempo decorrido."],
["O Relógio mundial é útil para quem viaja entre fusos horários.",1,"Mostra horários de outros locais."]],
p:[["Certificado inválido","Ao abrir o site do banco, aparece ‘sua conexão não é particular’. A data do computador está em 2019.",["Relacione o erro à data errada.","Corrija a data passo a passo.","Proponha como evitar o problema."],"Diagnóstico + passos + prevenção.","Certificados de segurança têm validade; com data errada, o navegador acha que estão inválidos. Corrigir: botão direito no relógio > Ajustar data e hora > ativar Definir horário automaticamente (ou ajustar manual). Prevenção: manter automático ligado; se a data sempre volta ao ligar, a bateria da placa-mãe pode estar fraca — chamar o técnico."],
["Rotina de estudos","Você tem 3 horas à tarde para estudar e se distrai com o celular a cada 10 minutos.",["Planeje sessões de foco com pausas.","Use temporizador ou alarme para outra tarefa do dia.","Registre como vai medir se funcionou."],"Plano de estudo com horários.","Ex.: 3 sessões de 50 min com pausas de 5–10 min. Alarme para o horário do treino ou do ônibus. Medir com a meta diária do Relógio e anotar no caderno quantas sessões foram completadas sem interrupção."],
["Playlist do intervalo","O grêmio vai tocar músicas no intervalo pelo computador da sala, mas os arquivos estão em um pen-drive.",["Explique como adicionar a pasta à biblioteca.","Defina ordenação e uso de ordem aleatória.","Diga como ajustar o volume do app sem mexer no sistema todo."],"Passo a passo + critérios.","Reprodutor multimídia > Biblioteca de músicas > Adicionar uma pasta (pasta do pen-drive ou copiar para Músicas). Ordenar por Artista para conferir, depois Ordem aleatória e reproduzir. Volume do app pelo Mixer de volume (ver Aula 12)."],
["Painel de informações da recepção","A recepção da escola quer um computador que mostre clima, notícias da região e o horário de Brasília e de Lisboa (parceria de intercâmbio).",["Escolha os widgets e tamanhos.","Configure o Microsoft Notícias.","Configure o Relógio mundial."],"Configuração proposta.","Widgets: Clima (grande) e Notícias (médio); desafixar os outros. Notícias: Notícias locais com a cidade da escola e Interesses em educação. Relógio mundial: adicionar Brasília e Lisboa."]]},

{t:"Acessibilidade Parte II",
r:["Temas de contraste tornam interface, textos e imagens mais legíveis: Aquático, Deserto, Entardecer e Céu noturno.","O Narrador lê a tela em voz alta, já vem no sistema e liga/desliga com [[Ctrl]] + [[Win]] + [[Enter]].","A Página Inicial do Narrador oferece ajuda sobre os recursos.","Vozes em português: Microsoft Maria e Microsoft Daniel; ajuste de velocidade, tonalidade e volume.","Áudio mono envia o mesmo som aos dois lados do fone; estéreo mantém canais diferentes.","Mixer de volume ajusta o volume geral e o de cada aplicativo.","Calendário registra compromissos e envia notificações."],
k:[["[[Ctrl]] + [[Win]] + [[Enter]]","Liga/desliga o Narrador"],["[[Alt]] esq. + [[Shift]] esq. + [[PrtScn]]","Liga/desliga o tema de contraste"],["[[Win]] + [[Ctrl]] + [[V]]","Abre o controle rápido de áudio"]],
n:"O app Calendário (Email e Calendário) está sendo substituído pelo novo Outlook no Windows 11; o recurso de agendar e receber lembretes continua no Outlook.",
c:[["Para que servem os temas de contraste?","Tornam elementos da interface mais fáceis de ver, deixando textos e imagens mais legíveis."],
["Quais são os quatro temas de contraste do Windows 11?","Aquático, Deserto, Entardecer e Céu noturno."],
["O que faz o Narrador e é preciso instalá-lo?","Lê a tela em voz alta; não precisa baixar nada, faz parte do sistema."],
["Qual o atalho do Narrador?","[[Ctrl]] + [[Win]] + [[Enter]]."],
["Quais vozes em português estão disponíveis e o que pode ser ajustado?","Microsoft Maria e Microsoft Daniel; ajusta-se velocidade, tonalidade (densidade) e volume."],
["Para que serve a Página Inicial do Narrador?","Oferece ajuda sobre os recursos disponíveis; pode abrir sempre que o Narrador iniciar."],
["Diferencie áudio mono e estéreo.","Mono: o mesmo som nos dois lados. Estéreo: canais diferentes (ex.: guitarra à esquerda e violão à direita)."],
["Para quem o áudio mono é útil?","Para quem ouve só de um lado ou usa apenas um fone, para não perder parte do som."],
["O que o Mixer de volume permite?","Controlar o volume geral do sistema e ajustar o volume de cada aplicativo separadamente."],
["Como o Calendário ajuda na rotina?","Registra compromissos e envia notificações automáticas na área de trabalho."]],
f:[["Tema de contraste","Esquema de cores de alta legibilidade."],["Aquático · Deserto · Entardecer · Céu noturno","Os quatro temas de contraste."],["Narrador","Leitor de tela nativo do Windows."],["[[Ctrl]] + [[Win]] + [[Enter]]","Liga/desliga o Narrador."],["Microsoft Maria","Voz feminina em português do Narrador."],["Microsoft Daniel","Voz masculina em português do Narrador."],["Velocidade da voz","Quão rápido o Narrador fala."],["Áudio mono","Mesmo som nos dois lados do fone."],["Estéreo","Sons diferentes em cada canal."],["Balanço L/R","Volume separado de cada lado (Som > Alto-falantes)."],["Mixer de volume","Volume por aplicativo."],["Calendário","Agenda com lembretes e notificações."]],
v:[["Os temas de contraste deixam textos e imagens mais legíveis.",1,"É a finalidade desse recurso."],
["O Windows 11 oferece quatro temas de contraste.",1,"Aquático, Deserto, Entardecer e Céu noturno."],
["Para usar o Narrador é preciso baixar um programa extra.",0,"Ele faz parte do sistema operacional."],
["[[Ctrl]] + [[Win]] + [[Enter]] liga e desliga o Narrador.",1,"É o atalho padrão."],
["O Narrador só tem vozes em inglês.",0,"Há Maria e Daniel em português do Brasil."],
["É possível ajustar velocidade e volume da voz do Narrador.",1,"Também a tonalidade."],
["Com áudio mono, cada lado do fone toca um instrumento diferente.",0,"No mono, o mesmo som vai para os dois lados."],
["No estéreo, pode haver um solo de guitarra à esquerda e violão à direita.",1,"É o exemplo da aula."],
["O Mixer de volume permite volumes diferentes por aplicativo.",1,"Ex.: Chrome em 70 e reprodutor em 100."],
["O Mixer de volume controla apenas o volume geral.",0,"Controla o geral e o de cada app."],
["O Calendário pode enviar notificações dos compromissos.",1,"Notificações aparecem na área de trabalho."],
["A tecla com o logotipo do Windows faz parte do atalho do Narrador.",1,"[[Ctrl]] + [[Win]] + [[Enter]]."],
["Áudio mono é útil para quem escuta apenas de um ouvido.",1,"Assim nenhum som se perde."],
["A Página Inicial do Narrador desativa o leitor de tela.",0,"Ela oferece ajuda sobre os recursos."]],
p:[["Aluno cego na turma","Um aluno cego vai usar o computador da sala nas aulas práticas.",["Configure o Narrador (voz, velocidade, atalho).","Liste 3 cuidados que a turma e o professor devem ter.","Explique por que testar o Narrador você mesmo ajuda."],"Configuração + cuidados.","Narrador com atalho ativado, voz Maria ou Daniel conforme preferência do aluno, velocidade ajustada por ele. Cuidados: descrever imagens projetadas, nomear arquivos com clareza, não mover itens da Área de Trabalho sem avisar. Testar ajuda a entender como a interface ‘soa’ e a escrever materiais mais acessíveis."],
["Fone com um lado quebrado","Um colega só tem um fone funcionando e perde partes da música e das videoaulas.",["Explique por que ele perde partes do som.","Configure o áudio mono passo a passo.","Diga outra situação em que o mono ajuda."],"Explicação + passos.","No estéreo, alguns sons saem só em um canal. Configurações > Acessibilidade > Áudio > ativar Áudio mono. Também ajuda pessoas com perda auditiva em um ouvido."],
["Videoaula com música alta","Durante a videoaula no navegador, a música do reprodutor está mais alta que a voz do professor, e baixar o volume geral abaixa tudo.",["Explique o que é o Mixer de volume.","Defina volumes para cada app.","Mostre o caminho até o mixer."],"Configuração proposta.","Mixer de volume ajusta cada app separado. Ex.: navegador 100, Reprodutor multimídia 25, Sons do sistema 40. Caminho: Configurações > Sistema > Som > Mixer de volume (ou botão direito no ícone de som)."],
["Agenda acessível da semana","Você precisa registrar: palestra de vendas na sexta às 15h e estreia de filme no sábado às 20h, recebendo lembretes. Sua avó, que tem baixa visão, vai usar o mesmo computador.",["Crie os dois eventos com lembretes.","Escolha um tema de contraste para a avó.","Explique como alternar o contraste rapidamente."],"Eventos + configuração de contraste.","Eventos no Calendário/Outlook com lembrete 1 h antes (ou 1 dia antes para a estreia). Tema de contraste Céu noturno ou Deserto, conforme o conforto dela. Alternar com [[Alt]] esq. + [[Shift]] esq. + [[PrtScn]] ou em Acessibilidade > Temas de contraste."]]}

 const st=r.querySelector(".stage3"),cube=r.querySelector(".cube"),faces=[...cube.querySelectorAll(".f3")],ctl=r.querySelector(".c3");
 let rx=-22,ry=32,tot=0,mat="fosco",base="#3b82f6",stk=false,light="std";const mt=new Set(["fosco"]);
 const SH={fr:0,bk:.25,rt:.18,lt:.1,tp:-.12,bt:.35};

 const SMILE=`<svg viewBox="0 0 100 100" width="70%" height="70%"><circle cx="50" cy="50" r="44" fill="#fde047" stroke="#a16207" stroke-width="3"/><circle cx="35" cy="40" r="6" fill="#1f2937"/><circle cx="65" cy="40" r="6" fill="#1f2937"/><path d="M28 60q22 22 44 0" fill="none" stroke="#1f2937" stroke-width="5" stroke-linecap="round"/></svg>`;
 function paint(){faces.forEach(f=>{const k=f.classList[1],s=SH[k];const shade=s>=0?`rgba(0,0,0,${s})`:`rgba(255,255,255,${-s})`;let bg;

 function rad(t){const R=24,s=Math.sin(Math.PI*t);return cm==="gp"?R*(1-.82*t):cm==="pg"?R*(.18+.82*t):cm==="pgp"?R*(.18+.82*s):cm==="gpg"?R*(1-.82*s):R;}
 function bez(t){const P=[[40,150],[160,10],[320,220],[460,60]],u=1-t;const x=u*u*u*P[0][0]+3*u*u*t*P[1][0]+3*u*t*t*P[2][0]+t*t*t*P[3][0];const y=u*u*u*P[0][1]+3*u*u*t*P[1][1]+3*u*t*t*P[2][1]+t*t*t*P[3][1];return [x,y];}
 function poly(cx,cy,R,k){if(k==="circ"||k==="cyl")return null;const n={tri:3,dia:4,hex:6,star:10}[k];let p=[];for(let i=0;i<n;i++){const a=-Math.PI/2+i*2*Math.PI/n;const rr=k==="star"&&i%2?R*.45:R;p.push((cx+rr*Math.cos(a)).toFixed(1)+","+(cy+rr*Math.sin(a)).toFixed(1));}return p.join(" ");}
 function dT(){const L=[],Rr=[];const N=60;for(let i=0;i<=N;i++){const t=i/N,[x,y]=bez(t),[x2,y2]=bez(Math.min(1,t+.01)),[x0,y0]=bez(Math.max(0,t-.01));let dx=x2-x0,dy=y2-y0;const l=Math.hypot(dx,dy)||1;const nx=-dy/l,ny=dx/l,w=rad(t);L.push([x+nx*w,y+ny*w]);Rr.push([x-nx*w,y-ny*w]);}
  const d="M"+L.map(p=>p.map(v=>v.toFixed(1)).join(" ")).join("L")+"L"+Rr.reverse().map(p=>p.map(v=>v.toFixed(1)).join(" ")).join("L")+"Z";
  const [ex,ey]=bez(1),er=rad(1),pg=poly(ex,ey,Math.max(er,6),sec);

  <circle cx="40" cy="150" r="9" fill="#ea580c"/><text x="56" y="178" font-size="12" fill="currentColor">início (timer do pincel)</text></svg>
  <p class="hint">${CM.find(c=>c[0]===cm)[2]} A ponta mostra a forma de tubo escolhida.</p>`;}

  if(tab==="crono"){rb.innerHTML=`<div class="crono"><b class="cdig">${fmtS(sw)}</b><div class="opts"><button class="mini pri" data-sw>${swOn?"Pausar":"Iniciar"}</button><button class="mini" data-lap ${swOn?"":"disabled"}>Volta</button><button class="mini" data-swr>Zerar</button></div><ol>${swL.map(x=>`<li>${fmtS(x)}</li>`).join("")}</ol></div>`;}}
 const fmtS=ms=>{const s=ms/1000;return `${String(Math.floor(s/60)).padStart(2,"0")}:${String(Math.floor(s%60)).padStart(2,"0")},${String(Math.floor(ms%1000/10)).padStart(2,"0")}`;};
 rt.addEventListener("click",e=>{const b=e.target.closest("[data-rt]");if(b){tab=b.dataset.rt;dR();}});

  if(D.lap!==undefined)swL.unshift(sw);if(D.swr!==undefined){swOn=false;clearInterval(swi);sw=0;swL=[];}

 /* narrador */
 const nr=r.querySelector(".narr"),SS=window.speechSynthesis;let on=false,rate=1,pitch=1,vol=1,voice="";
 const voices=()=>{try{return SS?SS.getVoices().filter(v=>/^pt/i.test(v.lang)):[]}catch(e){return []}};

  <div class="nset"><label class="rng sm">Velocidade <b>${nf(rate,1)}</b><input type="range" min="0.5" max="2" step="0.1" value="${rate}" data-nr="rate"></label><label class="rng sm">Tonalidade <b>${nf(pitch,1)}</b><input type="range" min="0.5" max="2" step="0.1" value="${pitch}" data-nr="pitch"></label><label class="rng sm">Volume <b>${Math.round(vol*100)}</b><input type="range" min="0" max="1" step="0.05" value="${vol}" data-nr="vol"></label>

 const au=r.querySelector(".aud2");let AC=null,play=false,mono=false,L=100,R=100,iv=null,step=0,pans=[],gL,gR,lit=[0,0];
 function build(){AC=new (window.AudioContext||window.webkitAudioContext)();const sp=AC.createChannelSplitter(2),mg=AC.createChannelMerger(2);gL=AC.createGain();gR=AC.createGain();
  const bus=AC.createGain();bus.channelCount=2;bus.channelCountMode="explicit";bus.connect(sp);sp.connect(gL,0);sp.connect(gR,1);gL.connect(mg,0,0);gR.connect(mg,0,1);mg.connect(AC.destination);
  pans=[AC.createStereoPanner(),AC.createStereoPanner()];pans.forEach(p=>p.connect(bus));setPan();setGain();}
 function setPan(){if(!pans.length)return;pans[0].pan.value=mono?0:-1;pans[1].pan.value=mono?0:1;}

 function note(f,type,dur,pi,v){const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;const t=AC.currentTime;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.01);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(g);g.connect(pans[pi]);o.start(t);o.stop(t+dur+.05);}
 const GT=[329.6,392,440,493.9,440,392,329.6,293.7],VI=[[130.8,164.8,196],[110,130.8,164.8],[146.8,174.6,220],[98,123.5,146.8]];
 function beat(){if(step%1===0)note(GT[step%8],"sawtooth",.28,0,.09);if(step%2===0){VI[(step/2|0)%4].forEach((f,k)=>setTimeout(()=>{if(play)note(f,"triangle",.9,1,.16)},k*60));}lit=[1,step%2===0?1:lit[1]];dA(true);step++;setTimeout(()=>{lit=[0,0];dA(true);},140);}

 au.addEventListener("click",e=>{const b=e.target.closest("[data-ap]");if(!b)return;play=!play;if(play){try{if(!AC)build();AC.resume();}catch(err){play=false;scrMsg(au,"Este navegador bloqueou o áudio.");return;}step=0;beat();iv=setInterval(beat,300);}else clearInterval(iv);dA();});

 au.addEventListener("input",e=>{const k=e.target.dataset.ch;if(!k)return;if(k==="L")L=+e.target.value;else R=+e.target.value;setGain();e.target.parentElement.querySelector("b").textContent=e.target.value;if(L===10&&R===20)labDone("bal");dA(true);});

 /* mixer */
 const mx=r.querySelector(".mix");const M2=[["sys","Sons do sistema",60],["nav","Navegador · videoaula",50],["rep","Reprodutor multimídia · música",90]];let mv={mst:80,sys:60,nav:50,rep:90},miv=null;

 miv=setInterval(()=>{mx.querySelectorAll("[data-lv]").forEach(i=>{const k=i.dataset.lv;i.style.width=(mv[k]*mv.mst/100*(.55+Math.random()*.45))+"%";});},180);onClean(()=>clearInterval(miv));dM();
}};

/* ========= ESTADO ========= */
const KEY="trilha-win11-v1";
let S={mod:-1,tab:"resumo",c:{},f:{},v:{},p:{},d:{},fi:{},ff:{},l:{}};
try{const x=JSON.parse(localStorage.getItem(KEY));if(x)S=Object.assign(S,x);}catch(e){}
if(!S.l)S.l={};
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){} if(window.progressoMudou) progressoMudou();}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=s=>esc(s).replace(/\[\[(.+?)\]\]/g,"<kbd>$1</kbd>");
const pad=n=>String(n).padStart(2,"0");
const TOT=m=>m.c.length+m.f.length+m.v.length+m.p.length+LABS[M.indexOf(m)].m.length;

function prog(i){const m=M[i];let n=0;
  m.c.forEach((_,j)=>{const x=S.c[i+":"+j];if(x==="ok"||x==="rev")n++;});
  m.f.forEach((_,j)=>{if(S.f[i+":"+j])n++;});
  m.v.forEach((_,j)=>{const x=S.v[i+":"+j];if(x&&x.done)n++;});
  m.p.forEach((_,j)=>{if(S.p[i+":"+j])n++;});
  LABS[i].m.forEach(([id])=>{if(S.l[i+":"+id])n++;});
  return {n,t:TOT(m),pct:Math.round(n/TOT(m)*100)};}
function counts(i){const m=M[i];const c=k=>Object.keys(k).filter(x=>x.startsWith(i+":"));
  return {c:m.c.filter((_,j)=>["ok","rev"].includes(S.c[i+":"+j])).length,f:m.f.filter((_,j)=>S.f[i+":"+j]).length,v:m.v.filter((_,j)=>S.v[i+":"+j]&&S.v[i+":"+j].done).length,p:m.p.filter((_,j)=>S.p[i+":"+j]).length,lab:LABS[i].m.filter(([id])=>S.l[i+":"+id]).length};}

/* ========= RENDER ========= */
const $=s=>document.querySelector(s);
function renderTop(){let a=0,t=0;M.forEach((_,i)=>{const p=prog(i);a+=p.n;t+=p.t;});
  const pc=Math.round(a/t*100);$("#gtxt").textContent=pc+"% · "+a+"/"+t;$("#gbar").style.width=pc+"%";}
function renderSide(){$("#side").innerHTML='<div class="lbl">Aulas</div>'+M.map((m,i)=>{const p=prog(i);
  return `<button class="mi ${p.pct===100?"done":""}" data-mod="${i}" aria-current="${S.mod===i}"><span class="num">${p.pct===100?"✓":pad(i+1)}</span><span><span class="tt">${esc(m.t)}</span><div class="mbar"><span style="width:${p.pct}%"></span></div></span></button>`}).join("");}

function renderHome(){
  $("#main").innerHTML=`<section class="hero">
    <div class="eyebrow">Curso de Informática · Windows 11</div>
    <h1>Do primeiro clique ao uso profissional do Windows 11</h1>
    <p>12 aulas da apostila transformadas em prática ativa. Em cada aula você estuda o resumo, experimenta no laboratório visual, responde no caderno, revisa com flashcards, decide Verdadeiro ou Falso justificando e resolve problemas reais (PBL). As respostas só aparecem depois que você tenta.</p>
    <div class="steps">
      <div class="step"><span class="sn">1 · Resumo</span><b>Leia os pontos-chave</b><span>Conceitos, atalhos e notas de atualização.</span></div>
      <div class="step"><span class="sn">2 · Lab visual</span><b>Simulação interativa</b><span>Mexa na tela simulada e cumpra as missões.</span></div>
      <div class="step"><span class="sn">3 · Caderno</span><b>10 perguntas abertas</b><span>Responda à mão; depois confira e autoavalie.</span></div>
      <div class="step"><span class="sn">4 · Flashcards</span><b>12 cartões</b><span>Vire, lembre e marque o que já sabe.</span></div>
      <div class="step"><span class="sn">5 · V ou F</span><b>14 afirmações</b><span>Escolha, justifique e veja a correção.</span></div>
      <div class="step"><span class="sn">6 · PBL</span><b>4 problemas reais</b><span>Resolva no caderno e compare com a referência.</span></div>
    </div>
    <div class="cta"><button class="btn" data-mod="${firstOpen()}">${firstOpen()>0?"Continuar de onde parei":"Começar pela Aula 01"}</button></div>
  </section>
  <div class="grid">${M.map((m,i)=>{const p=prog(i);return `<button class="mcard" data-mod="${i}"><span class="k">AULA ${pad(i+1)} · 1h30</span><h3>${esc(m.t)}</h3><div class="bar"><span style="width:${p.pct}%"></span></div><div class="row"><span>${p.n}/${p.t} atividades</span><span>${p.pct}%</span></div></button>`}).join("")}</div>`;}
function firstOpen(){for(let i=0;i<M.length;i++)if(prog(i).pct<100)return i;return 0;}

const TABS=[["resumo","Resumo"],["lab","Lab visual"],["caderno","Caderno"],["flash","Flashcards"],["vf","V ou F"],["pbl","PBL"]];
function renderModule(){runClean();const i=S.mod,m=M[i],p=prog(i),ct=counts(i);
  const tot={lab:LABS[i].m.length,caderno:m.c.length,flash:m.f.length,vf:m.v.length,pbl:m.p.length};const done={lab:ct.lab,caderno:ct.c,flash:ct.f,vf:ct.v,pbl:ct.p};
  let h=`<div class="mhead"><div><div class="eyebrow">Aula ${pad(i+1)} de ${M.length}</div><h1>${esc(m.t)}</h1></div>
  <div class="chips"><span class="chip">1h30</span><span class="chip">${p.t} atividades</span><span class="chip on">${p.pct}% concluído</span></div></div>
  <div class="tabs" role="tablist">${TABS.map(([k,l])=>`<button class="tab ${tot[k]&&done[k]===tot[k]?"full":""}" role="tab" data-tab="${k}" aria-selected="${S.tab===k}">${l}${tot[k]?`<span class="ct" id="ct-${k}">${done[k]}/${tot[k]}</span>`:""}</button>`).join("")}</div>
  <div class="panel" id="panel">`;
  h+=({resumo:pResumo,lab:pLab,caderno:pCaderno,flash:pFlash,vf:pVF,pbl:pPBL})[S.tab](i,m);
  h+=`</div>`;$("#main").innerHTML=h;
  if(S.tab==="lab"){try{LABS[i].init(document.getElementById("stage"));}catch(err){console.error(err);}}}

function pResumo(i,m){return `<section class="card sum"><h2>Pontos-chave da aula</h2><ul>${m.r.map(x=>`<li>${fmt(x)}</li>`).join("")}</ul></section>
  ${m.k&&m.k.length?`<section class="card"><h2>Atalhos para anotar</h2><div class="keys">${m.k.map(([a,b])=>`<div>${fmt(a)} <span class="hint">· ${esc(b)}</span></div>`).join("")}</div></section>`:""}
  ${m.n?`<div class="note"><b>Nota de atualização.</b> ${fmt(m.n)}</div>`:""}
  <div class="cta"><button class="btn" data-tab="lab">Abrir o Lab visual</button><button class="btn sec" data-tab="caderno">Ir para o Caderno</button><button class="btn sec" data-tab="flash">Revisar com flashcards</button></div>`;}

function pCaderno(i,m){const ok=m.c.filter((_,j)=>S.c[i+":"+j]==="ok").length;
  return `<div class="toolbar"><span>Responda cada pergunta no caderno. A resposta é liberada quando você marca que respondeu ou escreve um rascunho.</span><span class="score"><strong>${ok}</strong>acertos de ${m.c.length}</span></div>`+
  m.c.map(([q,a],j)=>{const k=i+":"+j,st=S.c[k],d=S.d["c"+k]||"";const shown=!!st;
  return `<article class="card q"><div class="qn">Questão ${pad(j+1)}</div><p class="qt">${fmt(q)}</p>
  <label class="hint" for="d-c-${i}-${j}">Rascunho (opcional)</label><textarea id="d-c-${i}-${j}" data-draft="c${k}" placeholder="Escreva aqui um resumo do que você respondeu no caderno…">${esc(d)}</textarea>
  ${shown?"":`<div class="acts"><label class="chk"><input type="checkbox" id="ck-c-${i}-${j}" data-ck="${k}"> Já respondi no caderno</label><button class="btn" data-show="${k}" ${d.trim().length>=3?"":"disabled"}>Ver resposta</button></div>`}
  ${shown?`<div class="paper"><div class="lab">Resposta de referência</div>${fmt(a)}</div>
  <div class="self">Compare com a sua: <button class="pill okk" data-self="${k}" data-val="ok" aria-pressed="${st==="ok"}">Acertei</button><button class="pill rev" data-self="${k}" data-val="rev" aria-pressed="${st==="rev"}">Preciso revisar</button></div>`:""}
  </article>`}).join("");}

function pFlash(i,m){const only=!!S.ff[i];let list=m.f.map((_,j)=>j);if(only)list=list.filter(j=>S.f[i+":"+j]!=="sei");
  if(!list.length)return `<section class="card"><h2>Tudo dominado</h2><p>Você marcou todos os cartões como “Já sei”. Desative o filtro para revisar de novo.</p><div class="cta"><button class="btn" data-fonly="0">Mostrar todos os cartões</button></div></section>`;
  let pos=S.fi[i]||0;if(pos>=list.length)pos=0;S.fi[i]=pos;const j=list[pos],[fr,bk]=m.f[j],st=S.f[i+":"+j];
  return `<div class="toolbar"><span>Tente lembrar a resposta antes de virar. Atalhos: <kbd>Espaço</kbd> vira, <kbd>←</kbd> <kbd>→</kbd> navegam.</span>
  <label class="chk"><input type="checkbox" id="fonly-${i}" data-fonly="${only?0:1}" ${only?"checked":""}> Só os que não sei</label></div>
  <div class="deck"><button class="fc" id="fc" aria-label="Virar cartão"><div class="in">
   <div class="face front"><span class="tag">Cartão ${pos+1}/${list.length}</span>${st?`<span class="st" style="color:var(--${st==="sei"?"ok":"warn"})">${st==="sei"?"Já sei":"Revisar"}</span>`:""}<div class="big">${fmt(fr)}</div><span class="hint" style="margin-top:14px">Clique para virar</span></div>
   <div class="face back"><span class="tag">Resposta</span><div class="txt">${fmt(bk)}</div></div></div></button>
  <div class="nav"><button class="btn sec" data-fnav="-1">← Anterior</button><button class="pill rev" data-fmark="rev" aria-pressed="${st==="rev"}">Revisar</button><button class="pill okk" data-fmark="sei" aria-pressed="${st==="sei"}">Já sei</button><button class="btn sec" data-fnav="1">Próximo →</button></div>
  <div class="dots">${list.map((jj,p)=>`<button class="dot ${S.f[i+":"+jj]||""} ${p===pos?"cur":""}" data-fgo="${p}" aria-label="Cartão ${p+1}"></button>`).join("")}</div></div>`;}

function pVF(i,m){const done=m.v.filter((_,j)=>S.v[i+":"+j]&&S.v[i+":"+j].done);const hit=m.v.filter((_,j)=>S.v[i+":"+j]&&S.v[i+":"+j].ok).length;
  return `<div class="toolbar"><span>Decida se é Verdadeiro ou Falso e justifique (no caderno ou aqui). Se for falso, explique como ficaria correto.</span><span class="score"><strong>${hit}/${done.length}</strong>acertos · ${m.v.length-done.length} pendentes</span></div>`+
  m.v.map(([af,val,ju],j)=>{const k=i+":"+j,st=S.v[k]||{},d=S.d["v"+k]||"";const can=st.a!==undefined&&(d.trim().length>=10||st.ck);
  return `<article class="card q"><div class="qn">Afirmação ${pad(j+1)}</div><p class="qt">${fmt(af)}</p>
  <div class="seg" role="group" aria-label="Sua resposta"><button data-vf="${k}" data-val="1" aria-pressed="${st.a===1}" ${st.done?"disabled":""}>Verdadeiro</button><button data-vf="${k}" data-val="0" aria-pressed="${st.a===0}" ${st.done?"disabled":""}>Falso</button></div>
  <div style="margin-top:10px"><label class="hint" for="d-v-${i}-${j}">Justificativa</label><textarea id="d-v-${i}-${j}" data-draft="v${k}" placeholder="Por que é verdadeiro ou falso?" ${st.done?"readonly":""}>${esc(d)}</textarea></div>
  ${st.done?`<div class="res ${st.ok?"good":"bad"}"><b>${st.ok?"Correto.":"Não foi dessa vez."}</b> A afirmação é <b>${val?"Verdadeira":"Falsa"}</b>. ${fmt(ju)}</div><div class="acts"><button class="ghost" data-vredo="${k}">Tentar de novo</button></div>`
  :`<div class="acts"><label class="chk"><input type="checkbox" id="ckv-${i}-${j}" data-vck="${k}" ${st.ck?"checked":""}> Justifiquei no caderno</label><button class="btn" data-vcheck="${k}" ${can?"":"disabled"}>Conferir</button><span class="hint">Escolha V ou F e justifique para liberar.</span></div>`}
  </article>`}).join("");}

function pPBL(i,m){return `<div class="toolbar"><span>Aprendizagem Baseada em Problemas: leia o cenário, resolva no caderno (sozinho ou em grupo) e só então compare com a referência.</span></div>`+
  m.p.map(([t,cen,tar,ent,ref],j)=>{const k=i+":"+j,st=S.p[k];
  return `<article class="card pbl"><div class="qn" style="font-family:var(--f-mono);font-size:.74rem;color:var(--muted)">PROBLEMA ${pad(j+1)}</div><h2>${esc(t)}</h2>
  <div class="meta"><div><h3>Cenário</h3><p>${fmt(cen)}</p></div><div><h3>Seu desafio</h3><ol>${tar.map(x=>`<li>${fmt(x)}</li>`).join("")}</ol></div><div><h3>Entregável no caderno</h3><p>${fmt(ent)}</p></div></div>
  ${st?`<div class="paper"><div class="lab">Referência de solução · compare e complete a sua</div>${fmt(ref)}</div>`:`<div class="acts"><label class="chk"><input type="checkbox" id="pk-${i}-${j}" data-pk="${k}"> Registrei minha solução no caderno</label><button class="btn" data-pshow="${k}" disabled>Ver referência</button></div>`}
  </article>`}).join("");}

function pLab(i){const L=LABS[i],d=L.m.filter(([id])=>S.l[i+":"+id]).length;return `<section class="labwrap"><div class="labgrid"><div class="labmain"><div><div class="eyebrow">Laboratório visual</div><h2 style="font-size:1.25rem;margin-top:4px">${L.t}</h2><p class="hint" style="margin:6px 0 0;max-width:75ch">${esc(L.d)}</p></div><div class="labmain" id="stage">${L.html()}</div></div>
  <section class="mis" aria-label="Missões"><h3>Missões</h3><div class="misbar"><span id="misbar" style="width:${d/L.m.length*100}%"></span></div><ul>${L.m.map(([id,l])=>`<li data-mis="${id}" class="${S.l[i+":"+id]?"ok":""}"><span class="ck"></span><span>${fmt(l)}</span></li>`).join("")}</ul><p class="hint">As missões são marcadas sozinhas quando você realiza a ação na simulação.</p></section></div></section>`;}
function labDone(id){const i=S.mod;if(i<0)return;const k=i+":"+id;if(S.l[k])return;const L=LABS[i];const item=L.m.find(x=>x[0]===id);if(!item)return;S.l[k]=1;save();
  const li=document.querySelector(`[data-mis="${id}"]`);if(li)li.classList.add("ok");const d=L.m.filter(([x])=>S.l[i+":"+x]).length;const mb=$("#misbar");if(mb)mb.style.width=(d/L.m.length*100)+"%";
  const ct=$("#ct-lab");if(ct)ct.textContent=d+"/"+L.m.length;toast("Missão concluída · "+item[1]);renderTop();renderSide();}
let toastT;function toast(t){let el=$("#toast");if(!el){el=document.createElement("div");el.id="toast";el.className="toast";el.setAttribute("role","status");document.body.appendChild(el);}el.textContent=t;el.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>el.hidden=true,2600);}
function render(){renderTop();renderSide();if(S.mod<0){runClean();renderHome();}else renderModule();const tm=LABS.reduce((a,l)=>a+l.m.length,0);const bs=$("#bsub");if(bs)bs.textContent=`12 aulas · 18 h · 480 atividades + ${tm} missões`;}


/* ========= EVENTOS ========= */
document.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;const D=b.dataset;
  if(b.id==="home"){S.mod=-1;save();render();scrollTo(0,0);return;}
  if(b.id==="reset"){$("#confirm").hidden=false;return;}
  if(b.id==="noReset"){$("#confirm").hidden=true;return;}
  if(b.id==="yesReset"){S={mod:-1,tab:"resumo",c:{},f:{},v:{},p:{},d:{},fi:{},ff:{},l:{}};save();$("#confirm").hidden=true;render();return;}
  if(D.mod!==undefined){S.mod=+D.mod;S.tab="resumo";save();render();scrollTo(0,0);return;}
  if(D.tab){S.tab=D.tab;save();render();return;}
  if(D.show){S.c[D.show]="shown";save();render();return;}
  if(D.self){S.c[D.self]=D.val;save();render();return;}
  if(b.id==="fc"){b.classList.toggle("flip");return;}
  if(D.fnav){const i=S.mod;const L=flashList(i);S.fi[i]=((S.fi[i]||0)+ +D.fnav+L.length)%L.length;save();render();return;}
  if(D.fgo!==undefined){S.fi[S.mod]=+D.fgo;save();render();return;}
  if(D.fmark){const i=S.mod,L=flashList(i),j=L[S.fi[i]||0];S.f[i+":"+j]=D.fmark;
    if(!S.ff[i])S.fi[i]=((S.fi[i]||0)+1)%L.length;save();render();return;}
  if(D.fonly!==undefined&&b.tagName==="BUTTON"){S.ff[S.mod]=+D.fonly===1;S.fi[S.mod]=0;save();render();return;}
  if(D.vf){const st=S.v[D.vf]||{};st.a=+D.val;S.v[D.vf]=st;save();render();return;}
  if(D.vcheck){const [i,j]=D.vcheck.split(":").map(Number);const st=S.v[D.vcheck];st.done=1;st.ok=st.a===M[i].v[j][1];save();render();return;}
  if(D.vredo){const st=S.v[D.vredo];delete st.done;delete st.ok;delete st.a;save();render();return;}
  if(D.pshow){S.p[D.pshow]=1;save();render();return;}
});
function flashList(i){let L=M[i].f.map((_,j)=>j);if(S.ff[i])L=L.filter(j=>S.f[i+":"+j]!=="sei");return L.length?L:[0];}
document.addEventListener("change",e=>{const t=e.target,D=t.dataset;
  if(D.ck){const b=document.querySelector(`[data-show="${D.ck}"]`);const ta=t.closest(".q").querySelector("textarea");if(b)b.disabled=!(t.checked||ta.value.trim().length>=3);}
  if(D.vck){const st=S.v[D.vck]||{};st.ck=t.checked;S.v[D.vck]=st;save();refreshV(D.vck,t);}
  if(D.pk){const b=document.querySelector(`[data-pshow="${D.pk}"]`);if(b)b.disabled=!t.checked;}
  if(t.id&&t.id.startsWith("fonly-")){S.ff[S.mod]=t.checked;S.fi[S.mod]=0;save();render();}
});
function refreshV(k,el){const st=S.v[k]||{};const d=S.d["v"+k]||"";const b=document.querySelector(`[data-vcheck="${k}"]`);if(b)b.disabled=!(st.a!==undefined&&(d.trim().length>=10||st.ck));}
document.addEventListener("input",e=>{const t=e.target;if(!t.dataset.draft)return;S.d[t.dataset.draft]=t.value;save();
  const key=t.dataset.draft.slice(1);
  if(t.dataset.draft[0]==="c"){const b=document.querySelector(`[data-show="${key}"]`);const ck=t.closest(".q").querySelector("[data-ck]");if(b)b.disabled=!(t.value.trim().length>=3||(ck&&ck.checked));}
  else refreshV(key,t);
});
document.addEventListener("keydown",e=>{if(S.mod<0||S.tab!=="flash")return;if(/TEXTAREA|INPUT/.test(e.target.tagName))return;
  if(e.code==="Space"){e.preventDefault();const f=$("#fc");if(f)f.classList.toggle("flip");}
  if(e.key==="ArrowRight"){const b=document.querySelector('[data-fnav="1"]');if(b)b.click();}
  if(e.key==="ArrowLeft"){const b=document.querySelector('[data-fnav="-1"]');if(b)b.click();}
});
render();
</script>
