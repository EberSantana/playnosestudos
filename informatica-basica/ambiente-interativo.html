/* ===================== JOGO: DETETIVE DO CÓDIGO ===================== */
function initGame(m){
  const state = { round:0, score:0, answered:false };
  renderGameRound(m, state);
}

function renderGameRound(m, state){
  const box = document.getElementById('game-'+m.id);
  const rounds = m.game;
  if(state.round >= rounds.length){
    box.innerHTML = `
      <div class="game-result">
        <div class="game-result-score">🏆 ${state.score} / ${rounds.length}</div>
        <p class="content-text">${state.score===rounds.length ? 'Perfeito! Você entendeu muito bem a lógica dos códigos! 🎉' : state.score>=rounds.length/2 ? 'Muito bom! Releia as explicações das que errou e tente de novo.' : 'Continue praticando! Releia os exemplos do guia acima e tente novamente.'}</p>
        <button class="game-btn" onclick="(function(){ const st={round:0,score:0,answered:false}; renderGameRound(modules.find(x=>x.id==='${m.id}'), st); })()">🔄 Jogar Novamente</button>
      </div>`;
    return;
  }
  const r = rounds[state.round];
  box.innerHTML = `
    <div class="game-card">
      <div class="game-progress">Rodada ${state.round+1} de ${rounds.length} &nbsp;·&nbsp; Pontuação: ${state.score}</div>
      <p class="content-text"><b>O que este código imprime?</b></p>
      <pre class="game-code">${r.code.replace(/</g,'&lt;')}</pre>
      <div class="game-options">
        ${r.options.map((op,i)=>`<button class="game-opt-btn" data-i="${i}">${op}</button>`).join('')}
      </div>
      <div class="game-feedback"></div>
    </div>`;

  box.querySelectorAll('.game-opt-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      if(state.answered) return;
      state.answered = true;
      const chosen = parseInt(btn.dataset.i);
      const correct = (chosen === r.correct);
      if(correct) state.score++;
      box.querySelectorAll('.game-opt-btn').forEach(b=>{
        b.disabled = true;
        if(parseInt(b.dataset.i) === r.correct) b.classList.add('opt-correct');
        else if(b === btn) b.classList.add('opt-wrong');
      });
      const fb = box.querySelector('.game-feedback');
      fb.innerHTML = `<div class="game-explain ${correct?'ok':'no'}">${correct?'✅ Certo!':'❌ Quase lá.'} ${r.exp}</div>
                      <button class="game-btn" id="nextRoundBtn">Próxima rodada ➡️</button>`;
      document.getElementById('nextRoundBtn').onclick = ()=>{
        state.round++; state.answered=false;
        renderGameRound(m, state);
      };
    });
  });
}

/* ===================== TERMINAL DE PRÁTICA (PYTHON x PORTUGOL) ===================== */
const termLang = {};
const TERMINAL_TEMPLATES = {
  python:  'print("Olá, mundo!")',
  portugol:'escreva("Olá, mundo!")'
};

function terminalSetMode(mid, lang){
  termLang[mid] = lang;
  document.getElementById('term-tab-python-'+mid).classList.toggle('active', lang==='python');
  document.getElementById('term-tab-portugol-'+mid).classList.toggle('active', lang==='portugol');
  document.getElementById('term-code-python-'+mid).style.display = (lang==='python') ? 'block' : 'none';
  document.getElementById('term-code-portugol-'+mid).style.display = (lang==='portugol') ? 'block' : 'none';
}

function terminalClear(mid){
  const lang = termLang[mid] || 'python';
  document.getElementById('term-code-'+lang+'-'+mid).value = TERMINAL_TEMPLATES[lang];
  document.getElementById('term-output-'+mid).innerHTML = '<span class="term-placeholder">A saída do seu programa vai aparecer aqui...</span>';
}

function termSplitTopLevel(str, sep){
  const args = [];
  let cur = '', inS=false, inD=false;
  for(let i=0;i<str.length;i++){
    const c = str[i];
    if(c === "'" && !inD) inS = !inS;
    else if(c === '"' && !inS) inD = !inD;
    if(c === sep && !inS && !inD){ args.push(cur); cur=''; }
    else cur += c;
  }
  args.push(cur);
  return args;
}

function termSplitArgs(str){
  if(str.trim()==='') return [];
  return termSplitTopLevel(str, ',').filter(a=>a.trim()!=='');
}

function termAvaliarExpressao(str, vars, lang){
  str = str.trim();
  if(str === '') throw new Error('Encontrei um valor vazio onde era esperado um texto, número ou variável.');
  const partes = termSplitTopLevel(str, '+');
  if(partes.length > 1 && partes.every(p=>p.trim()!=='')){
    const valores = partes.map(p=>termAvaliarExpressao(p.trim(), vars, lang));
    const algumaString = valores.some(v=>v.type==='string');
    if(algumaString) return {type:'string', value: valores.map(v=>String(v.value)).join('')};
    return {type:'number', value: valores.reduce((a,v)=>a+Number(v.value),0)};
  }
  if((str.startsWith('"') && str.endsWith('"') && str.length>=2) || (str.startsWith("'") && str.endsWith("'") && str.length>=2)){
    return {type:'string', value: str.slice(1,-1)};
  }
  if(/^-?\d+(\.\d+)?$/.test(str)) return {type:'number', value: parseFloat(str)};
  if(lang==='python'){
    if(str==='True') return {type:'boolean', value:true};
    if(str==='False') return {type:'boolean', value:false};
  } else {
    if(str==='verdadeiro') return {type:'boolean', value:true};
    if(str==='falso') return {type:'boolean', value:false};
  }
  if(/^[a-zA-Z_]\w*$/.test(str)){
    if(str in vars) return vars[str];
    throw new Error('A variável "'+str+'" foi usada mas ainda não foi criada.');
  }
  throw new Error('Não entendi o valor "'+str+'". Use um texto entre aspas, um número, ou o nome de uma variável já criada.');
}

function termProcessarPython(line, vars, outputs){
  let m = line.match(/^print\s*\((.*)\)$/);
  if(m){
    const vals = termSplitArgs(m[1]).map(a=>termAvaliarExpressao(a.trim(), vars, 'python'));
    outputs.push(vals.map(v=>String(v.value)).join(' '));
    return;
  }
  m = line.match(/^([a-zA-Z_]\w*)\s*=\s*(.+)$/);
  if(m){
    vars[m[1]] = termAvaliarExpressao(m[2].trim(), vars, 'python');
    return;
  }
  throw new Error('Comando não reconhecido: "'+line+'". Em Python, use print(...) para exibir algo na tela ou nome = valor para criar uma variável.');
}

function termProcessarPortugol(line, vars, outputs){
  let m = line.match(/^escreva\s*\((.*)\)$/);
  if(m){
    const vals = termSplitArgs(m[1]).map(a=>termAvaliarExpressao(a.trim(), vars, 'portugol'));
    outputs.push(vals.map(v=>String(v.value)).join(''));
    return;
  }
  m = line.match(/^(inteiro|real|cadeia|logico)\s+([a-zA-Z_]\w*)\s*=\s*(.+)$/);
  if(m){
    vars[m[2]] = termAvaliarExpressao(m[3].trim(), vars, 'portugol');
    return;
  }
  m = line.match(/^([a-zA-Z_]\w*)\s*=\s*(.+)$/);
  if(m){
    if(!(m[1] in vars)) throw new Error('A variável "'+m[1]+'" foi usada sem ser declarada antes. Em Portugol, declare o tipo primeiro, por exemplo: inteiro '+m[1]+' = valor');
    vars[m[1]] = termAvaliarExpressao(m[2].trim(), vars, 'portugol');
    return;
  }
  throw new Error('Comando não reconhecido: "'+line+'". Em Portugol, use escreva(...) para exibir algo na tela ou tipo nome = valor (ex: inteiro idade = 10) para criar uma variável.');
}

function terminalRun(mid){
  const lang = termLang[mid] || 'python';
  const code = document.getElementById('term-code-'+lang+'-'+mid).value;
  const outEl = document.getElementById('term-output-'+mid);
  const lines = code.split('\n');
  const vars = {};
  const outputs = [];
  let erro = null;

  for(let i=0;i<lines.length;i++){
    const lineNum = i+1;
    const line = lines[i].trim();
    if(line === '') continue;
    if(lang==='python' && line.startsWith('#')) continue;
    if(lang==='portugol' && line.startsWith('//')) continue;

    const abre = (line.match(/\(/g)||[]).length;
    const fecha = (line.match(/\)/g)||[]).length;
    if(abre !== fecha){ erro = {linha:lineNum, msg:'Parênteses não fechados corretamente. Verifique se cada "(" tem um ")" correspondente.'}; break; }
    const aspasD = (line.match(/"/g)||[]).length;
    const aspasS = (line.match(/'/g)||[]).length;
    if(aspasD % 2 !== 0 || aspasS % 2 !== 0){ erro = {linha:lineNum, msg:'Aspas não fechadas corretamente. Todo texto entre aspas precisa começar e terminar com o mesmo tipo de aspas.'}; break; }

    try{
      if(lang==='python') termProcessarPython(line, vars, outputs);
      else termProcessarPortugol(line, vars, outputs);
    }catch(e){
      erro = {linha:lineNum, msg:e.message};
      break;
    }
  }

  let html = '';
  outputs.forEach(o=>{ html += '<span class="term-line-ok">'+o.replace(/</g,'&lt;')+'</span>'; });
  if(erro){
    html += '<span class="term-line-error">❌ Erro na linha '+erro.linha+': '+erro.msg+'</span>';
  } else if(outputs.length === 0){
    html += '<span class="term-placeholder">⚠️ O programa rodou mas não gerou nenhuma saída (nenhum print/escreva encontrado).</span>';
  } else {
    html += '<span class="term-summary-ok">✅ Programa executado com sucesso!</span>';
  }
  outEl.innerHTML = html;
}

function showModule(id){
  document.querySelectorAll('.module').forEach(m=>m.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  const idx = modules.findIndex(m=>m.id===id);
  const btns = document.querySelectorAll('.nav-btn');
  if(btns[idx]) btns[idx].classList.add('active');
  document.getElementById('moduleCounter').textContent = (idx+1)+'/'+modules.length;
  window.scrollTo({top:0, behavior:'smooth'});
}

function switchActivity(btn,type){
  const section = btn.closest('.content-section');
  section.querySelectorAll('.activity-tab').forEach(b=>b.classList.remove('active'));
  section.querySelectorAll('.activity-content').forEach(c=>c.classList.remove('active'));
  btn.classList.add('active');
  section.querySelector(`.activity-content[data-type="${type}"]`).classList.add('active');
}

function responderVF(btn, resposta, correta){
  const q = btn.closest('.vf-question');
  const isCorrect = (resposta === correta);
  const answer = q.querySelector('.vf-answer');
  const label = q.querySelector('.vf-answer-label');
  answer.classList.add('show');
  if(isCorrect){
    answer.classList.add('correct'); answer.classList.remove('incorrect');
    label.textContent = '✅ Você acertou! A afirmação é ' + (correta ? 'VERDADEIRA' : 'FALSA') + '.';
  } else {
    answer.classList.add('incorrect'); answer.classList.remove('correct');
    label.textContent = '❌ Resposta incorreta. A afirmação é, na verdade, ' + (correta ? 'VERDADEIRA' : 'FALSA') + '.';
  }
  q.querySelectorAll('.vf-btn').forEach(b=>b.disabled=true);
}
