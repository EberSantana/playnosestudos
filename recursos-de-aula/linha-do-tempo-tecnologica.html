<!doctype html><html lang="pt-BR"><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1"><style>:root{color-scheme:light}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}</style><script src="../aparencia.js"></script>
</head><body>
<title>Linha do Tempo Tecnológica</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,300..900;1,300..900&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
/* ============================================================
   APOSTILA INTERATIVA — LINHA DO TEMPO TECNOLÓGICA
   Sistema visual derivado de Google Antigravity (design-system.html)
   ============================================================ */

/* ---------- TOKENS: tema claro (estado base, sem stamp) ---------- */
:root{
  /* paleta bruta */
  --grey-0:#FFFFFF;   --grey-10:#F8F9FC;  --grey-15:#F0F1F5;  --grey-20:#EFF2F7;
  --grey-50:#E6EAF0;  --grey-100:#E1E6EC; --grey-200:#CDD4DC; --grey-300:#B2BBC5;
  --grey-400:#B7BFD9; --grey-800:#45474D; --grey-900:#2F3034; --grey-1000:#212226;
  --grey-1100:#18191D; --grey-1200:#121317;
  --blue:#1F5135;     --blue-600:#163D28; --red:#FF4641;      --steel:#676A72;

  /* superfícies */
  --surface:var(--grey-0);
  --surface-1:var(--grey-10);
  --surface-2:var(--grey-20);
  --surface-3:var(--grey-100);
  --ink:var(--grey-1200);
  --ink-muted:var(--grey-800);
  --ink-faint:#6A6A71;
  --outline:rgba(33,34,38,.12);
  --outline-faint:rgba(33,34,38,.06);
  --inverse-surface:var(--grey-1200);
  --inverse-ink:var(--grey-10);
  --accent:var(--blue);
  --accent-soft:rgba(31,81,53,.10);
  --accent-line:rgba(31,81,53,.28);
  --signal:var(--red);
  --signal-soft:rgba(255,70,65,.10);
  --ok:#1E8E5A;
  --ok-soft:rgba(30,142,90,.12);
  --warn:#B26A00;
  --warn-soft:rgba(178,106,0,.12);
  --shadow-sm:0 1px 2px rgba(18,19,23,.06), 0 4px 14px rgba(18,19,23,.05);
  --shadow-md:0 2px 6px rgba(18,19,23,.07), 0 18px 44px rgba(18,19,23,.09);

  /* forma */
  --r-xs:4px; --r-sm:8px; --r-md:16px; --r-lg:24px; --r-pill:9999px;
  /* espaço */
  --s-xs:4px; --s-sm:8px; --s-md:16px; --s-lg:24px; --s-xl:36px; --s-2xl:48px; --s-3xl:60px; --s-4xl:80px;
  /* tipo */
  --font:"Google Sans Flex","Google Sans","Product Sans",Figtree,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --mono:"Google Sans Code","JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}

/* ---------- TOKENS: tema escuro ---------- */
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --surface:var(--grey-1200);
    --surface-1:var(--grey-1100);
    --surface-2:#1E1F24;
    --surface-3:#26272C;
    --ink:var(--grey-50);
    --ink-muted:var(--grey-300);
    --ink-faint:#8A8F99;
    --outline:rgba(230,234,240,.14);
    --outline-faint:rgba(230,234,240,.07);
    --inverse-surface:var(--grey-50);
    --inverse-ink:var(--grey-1200);
    --accent:#6E9BFF;
    --accent-soft:rgba(110,155,255,.14);
    --accent-line:rgba(110,155,255,.34);
    --signal:#FF6B66;
    --signal-soft:rgba(255,107,102,.14);
    --ok:#4CC38A;
    --ok-soft:rgba(76,195,138,.16);
    --warn:#E0A33E;
    --warn-soft:rgba(224,163,62,.16);
    --shadow-sm:0 1px 2px rgba(0,0,0,.4), 0 4px 14px rgba(0,0,0,.3);
    --shadow-md:0 2px 6px rgba(0,0,0,.45), 0 18px 44px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  --surface:var(--grey-1200);
  --surface-1:var(--grey-1100);
  --surface-2:#1E1F24;
  --surface-3:#26272C;
  --ink:var(--grey-50);
  --ink-muted:var(--grey-300);
  --ink-faint:#8A8F99;
  --outline:rgba(230,234,240,.14);
  --outline-faint:rgba(230,234,240,.07);
  --inverse-surface:var(--grey-50);
  --inverse-ink:var(--grey-1200);
  --accent:#6E9BFF;
  --accent-soft:rgba(110,155,255,.14);
  --accent-line:rgba(110,155,255,.34);
  --signal:#FF6B66;
  --signal-soft:rgba(255,107,102,.14);
  --ok:#4CC38A;
  --ok-soft:rgba(76,195,138,.16);
  --warn:#E0A33E;
  --warn-soft:rgba(224,163,62,.16);
  --shadow-sm:0 1px 2px rgba(0,0,0,.4), 0 4px 14px rgba(0,0,0,.3);
  --shadow-md:0 2px 6px rgba(0,0,0,.45), 0 18px 44px rgba(0,0,0,.4);
}

/* ---------- RESET ---------- */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--surface); color:var(--ink);
  font-family:var(--font); font-size:16px; line-height:1.55;
  -webkit-font-smoothing:antialiased; font-variation-settings:"wdth" 100;
}
h1,h2,h3,h4,h5,p,figure,ul,ol{margin:0;padding:0}
ul,ol{list-style:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:var(--r-xs)}
svg{display:block}
img{max-width:100%;display:block}

/* ---------- TIPOGRAFIA ---------- */
.h-xl{font-size:clamp(30px,4.2vw,46px);line-height:1.08;letter-spacing:-.022em;font-weight:500;text-wrap:balance}
.h-lg{font-size:clamp(22px,2.6vw,30px);line-height:1.16;letter-spacing:-.016em;font-weight:500;text-wrap:balance}
.h-md{font-size:19px;line-height:1.3;letter-spacing:-.01em;font-weight:500}
.h-sm{font-size:16px;line-height:1.35;letter-spacing:-.005em;font-weight:600}
.body{font-size:16.5px;line-height:1.62;color:var(--ink-muted)}
.body strong{color:var(--ink);font-weight:600}
.cap{font-size:13.5px;line-height:1.5;color:var(--ink-faint)}
.eyebrow{
  font-size:11.5px;font-weight:600;letter-spacing:.13em;text-transform:uppercase;
  color:var(--ink-faint);
}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}

/* ---------- LAYOUT GERAL ---------- */
.app{display:grid;grid-template-columns:288px minmax(0,1fr);min-height:100vh}

/* ---------- SIDEBAR ---------- */
.sidebar{
  position:sticky;top:0;height:100vh;display:flex;flex-direction:column;
  background:var(--surface-1);border-right:1px solid var(--outline-faint);
}
.sb-head{padding:22px 20px 14px;border-bottom:1px solid var(--outline-faint)}
.sb-brand{display:flex;align-items:center;gap:10px}
.sb-mark{
  width:30px;height:30px;border-radius:var(--r-sm);flex:none;
  background:var(--inverse-surface);color:var(--inverse-ink);
  display:grid;place-items:center;font-weight:700;font-size:13px;letter-spacing:-.03em;
}
.sb-title{font-size:14.5px;font-weight:600;line-height:1.2;letter-spacing:-.01em}
.sb-sub{font-size:11.5px;color:var(--ink-faint);line-height:1.3;margin-top:2px}
.sb-author{
  margin-top:13px;padding-top:11px;border-top:1px solid var(--outline-faint);
  display:flex;flex-direction:column;gap:1px;
}
.sb-author-k{font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-faint)}
.sb-author-v{font-size:12.5px;font-weight:600;color:var(--ink)}
/* crédito visível também na impressão e na projeção */
.credit-line{
  display:none;font-size:12px;color:var(--ink-faint);
  padding-bottom:10px;margin-bottom:16px;border-bottom:1px solid var(--outline-faint);
}
.credit-line b{color:var(--ink-muted);font-weight:600}
body[data-proj="1"] .credit-line{display:block;font-size:15px}
@media print{.credit-line{display:block !important}}

.sb-progress{padding:12px 20px 14px;border-bottom:1px solid var(--outline-faint)}
.sb-progress-row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:7px}
.sb-progress-label{font-size:11.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint)}
.sb-progress-val{font-size:12px;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
.bar{height:4px;border-radius:var(--r-pill);background:var(--surface-3);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:var(--r-pill);background:var(--accent);transition:width .45s cubic-bezier(.16,1,.3,1)}

/* ---------- BUSCA ---------- */
.sb-search{padding:12px 16px;border-bottom:1px solid var(--outline-faint);position:relative}
/* especificidade elevada de propósito: a regra genérica de input,
   definida mais abaixo, sobrescreveria o padding e o ícone da lupa
   cairia por cima do texto digitado. */
.sidebar .sb-search input[type="search"]{
  width:100%;font-size:13px;padding:8px 34px 8px 34px;border-radius:var(--r-pill);
  border:1px solid var(--outline);background:var(--surface);color:var(--ink);
}
.sb-search .si{
  position:absolute;left:26px;top:50%;transform:translateY(-50%);
  width:14px;height:14px;color:var(--ink-faint);pointer-events:none;
}
.sb-search kbd{
  position:absolute;right:26px;top:50%;transform:translateY(-50%);
  font-family:var(--font);font-size:10px;font-weight:600;color:var(--ink-faint);
  border:1px solid var(--outline);border-radius:var(--r-xs);padding:1px 5px;pointer-events:none;
}
.sb-search input:focus + .si + kbd{display:none}
.results{padding:6px 12px 24px}
.res-empty{padding:16px 10px;font-size:13px;color:var(--ink-faint);line-height:1.5}
.res-item{
  width:100%;text-align:left;padding:9px 11px;border-radius:var(--r-sm);
  display:flex;flex-direction:column;gap:2px;transition:background .15s;
}
.res-item:hover,.res-item.sel{background:var(--surface-2)}
.res-t{font-size:13px;font-weight:600;color:var(--ink);line-height:1.3}
.res-m{font-size:11px;color:var(--ink-faint)}
.res-s{font-size:11.5px;color:var(--ink-muted);line-height:1.45;margin-top:2px}
.res-item mark{background:var(--accent-soft);color:var(--accent);border-radius:2px;padding:0 1px}
.res-count{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint);padding:8px 11px 4px}

.sb-scroll{flex:1;overflow-y:auto;padding:10px 12px 28px;scrollbar-width:thin}
.mod{margin-bottom:2px}
.mod-btn{
  width:100%;display:flex;align-items:center;gap:9px;padding:9px 10px;
  border-radius:var(--r-sm);text-align:left;color:var(--ink);
  font-size:13px;font-weight:600;letter-spacing:-.005em;
}
.mod-btn:hover{background:var(--surface-2)}
.mod-idx{
  flex:none;width:20px;height:20px;border-radius:5px;display:grid;place-items:center;
  font-size:10.5px;font-weight:700;background:var(--surface-3);color:var(--ink-muted);
  font-variant-numeric:tabular-nums;
}
.mod-name{flex:1;min-width:0}
.mod-chev{flex:none;width:14px;height:14px;color:var(--ink-faint);transition:transform .22s ease}
.mod[data-open="1"] .mod-chev{transform:rotate(90deg)}
.mod-list{display:none;padding:2px 0 6px 12px;margin-left:19px;border-left:1px solid var(--outline-faint)}
.mod[data-open="1"] .mod-list{display:block}
.tp-btn{
  width:100%;text-align:left;padding:6px 10px;border-radius:var(--r-sm);
  font-size:12.8px;line-height:1.35;color:var(--ink-muted);
  display:flex;align-items:center;gap:7px;
}
.tp-btn:hover{background:var(--surface-2);color:var(--ink)}
.tp-btn[aria-current="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.tp-dot{flex:none;width:5px;height:5px;border-radius:50%;background:var(--outline);transition:background .2s}
.tp-btn[data-done="1"] .tp-dot{background:var(--ok)}
.tp-btn[aria-current="true"] .tp-dot{background:var(--accent)}
.tp-label{flex:1;min-width:0}
.tp-btn.is-act{margin-top:5px;font-weight:600;color:var(--ink)}
.tp-btn.is-act .tp-dot{
  width:0;height:0;border-radius:0;background:transparent;
  border-left:6px solid var(--accent);border-top:4px solid transparent;border-bottom:4px solid transparent;
}
.tp-btn.is-act[data-done="1"] .tp-dot{border-left-color:var(--ok)}

/* ---------- MAIN ---------- */
.main{min-width:0;display:flex;flex-direction:column}
.topbar{
  position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;
  padding:12px 28px;background:color-mix(in srgb,var(--surface) 88%,transparent);
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--outline-faint);
}
.crumb{flex:1;min-width:0;font-size:12.5px;color:var(--ink-faint);display:flex;align-items:center;gap:7px;overflow:hidden}
.crumb b{color:var(--ink-muted);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumb-sep{opacity:.5}
.icon-btn{
  width:34px;height:34px;border-radius:var(--r-pill);display:grid;place-items:center;
  color:var(--ink-muted);border:1px solid var(--outline);background:var(--surface);
  transition:background .18s,color .18s;
}
.icon-btn:hover{background:var(--surface-2);color:var(--ink)}
.icon-btn svg{width:17px;height:17px}
.menu-btn{display:none}

.canvas{flex:1;padding:34px 28px 80px}
.wrap{max-width:900px;margin:0 auto}

/* ---------- CABEÇALHO DE TÓPICO ---------- */
.topic-head{margin-bottom:26px}
.topic-kicker{display:flex;align-items:center;gap:9px;margin-bottom:12px;flex-wrap:wrap}
.chip{
  display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:var(--r-pill);
  font-size:11.5px;font-weight:600;letter-spacing:.03em;
  background:var(--surface-2);color:var(--ink-muted);border:1px solid var(--outline-faint);
}
.chip-accent{background:var(--accent-soft);color:var(--accent);border-color:var(--accent-line)}
.topic-lead{margin-top:14px;font-size:17.5px;line-height:1.6;color:var(--ink-muted);max-width:66ch}
.topic-lead strong{color:var(--ink);font-weight:600}

/* ---------- CARDS / SECÇÕES ---------- */
.card{
  background:var(--surface-1);border:1px solid var(--outline-faint);
  border-radius:var(--r-lg);padding:22px;
}
.card + .card{margin-top:16px}
.card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;margin-bottom:16px;flex-wrap:wrap}
.card-title{display:flex;align-items:center;gap:9px}
.card-title .h-md{letter-spacing:-.012em}
.lab{
  font-size:10.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;
  color:var(--accent);
}
.stage{
  background:var(--surface);border:1px solid var(--outline-faint);border-radius:var(--r-md);
  padding:20px;position:relative;overflow:hidden;
}
.hint{
  margin-top:14px;font-size:12.5px;color:var(--ink-faint);display:flex;align-items:center;gap:7px;
}
.hint svg{width:14px;height:14px;flex:none;color:var(--accent)}

/* ---------- CONTROLES ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  padding:8px 17px;border-radius:var(--r-pill);font-size:14px;font-weight:500;
  border:1px solid transparent;transition:background .18s,color .18s,border-color .18s,transform .1s;
  white-space:nowrap;
}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--inverse-surface);color:var(--inverse-ink)}
.btn-primary:hover{background:var(--grey-900)}
:root[data-theme="dark"] .btn-primary:hover{background:var(--grey-100)}
.btn-sec{background:rgba(183,191,217,.14);color:var(--ink);border-color:var(--outline-faint)}
.btn-sec:hover{background:rgba(183,191,217,.26)}
.btn-ghost{color:var(--ink-muted);border-color:var(--outline)}
.btn-ghost:hover{background:var(--surface-2);color:var(--ink)}
.btn-sm{padding:6px 13px;font-size:13px}
.btn[aria-pressed="true"]{background:var(--inverse-surface);color:var(--inverse-ink);border-color:transparent}
.btn:disabled{opacity:.4;cursor:not-allowed}

.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--outline-faint);border-radius:var(--r-pill);padding:3px;gap:2px;flex-wrap:wrap}
.seg button{padding:6px 14px;border-radius:var(--r-pill);font-size:13px;font-weight:500;color:var(--ink-muted);transition:background .18s,color .18s}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-sm)}

.ctl-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
input[type=range]{
  -webkit-appearance:none;appearance:none;width:100%;height:26px;background:transparent;cursor:pointer;
}
input[type=range]::-webkit-slider-runnable-track{height:5px;border-radius:var(--r-pill);background:var(--surface-3)}
input[type=range]::-moz-range-track{height:5px;border-radius:var(--r-pill);background:var(--surface-3)}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;width:19px;height:19px;border-radius:50%;background:var(--accent);
  border:3px solid var(--surface);box-shadow:var(--shadow-sm);margin-top:-7px;
}
input[type=range]::-moz-range-thumb{
  width:13px;height:13px;border-radius:50%;background:var(--accent);
  border:3px solid var(--surface);box-shadow:var(--shadow-sm);
}
input[type=text],input[type=search],select{
  font:inherit;font-size:14px;padding:8px 13px;border-radius:var(--r-pill);
  border:1px solid var(--outline);background:var(--surface);color:var(--ink);
}
input::placeholder{color:var(--ink-faint)}

/* ---------- GRIDS UTILITÁRIOS ---------- */
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:12px}
.grid4{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:10px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}

/* ---------- TABELAS ---------- */
.tbl-wrap{overflow-x:auto;border:1px solid var(--outline-faint);border-radius:var(--r-md);background:var(--surface)}
table.t{width:100%;border-collapse:collapse;font-size:14px;min-width:520px}
table.t th{
  text-align:left;padding:10px 14px;font-size:11px;font-weight:700;letter-spacing:.1em;
  text-transform:uppercase;color:var(--ink-faint);border-bottom:1px solid var(--outline-faint);
  background:var(--surface-1);white-space:nowrap;
}
table.t td{padding:10px 14px;border-bottom:1px solid var(--outline-faint);color:var(--ink-muted);vertical-align:top}
table.t tr:last-child td{border-bottom:0}
table.t td:first-child{color:var(--ink);font-weight:500}
table.t code{font-family:var(--mono);font-size:12.5px;background:var(--surface-2);padding:1px 6px;border-radius:var(--r-xs)}

/* ---------- NAVEGAÇÃO INFERIOR ---------- */
.pager{display:flex;gap:12px;margin-top:34px;padding-top:22px;border-top:1px solid var(--outline-faint)}
.pager a{
  flex:1;min-width:0;display:flex;flex-direction:column;gap:3px;padding:14px 18px;
  border:1px solid var(--outline-faint);border-radius:var(--r-md);background:var(--surface-1);
  text-decoration:none;transition:border-color .18s,background .18s;
}
.pager a:hover{border-color:var(--accent-line);background:var(--surface-2);text-decoration:none}
.pager .pg-lab{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-faint)}
.pager .pg-name{font-size:14.5px;font-weight:500;color:var(--ink);line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pager a.nx{text-align:right;align-items:flex-end}

/* ---------- QUIZ ---------- */
.quiz{margin-top:16px;background:var(--surface-1);border:1px solid var(--outline-faint);border-radius:var(--r-lg);padding:20px}
.quiz-q{font-size:15.5px;font-weight:500;color:var(--ink);margin-bottom:13px;line-height:1.45}
.quiz-opts{display:flex;flex-direction:column;gap:8px}
.quiz-opt{
  text-align:left;padding:11px 15px;border-radius:var(--r-md);border:1px solid var(--outline);
  background:var(--surface);font-size:14.5px;color:var(--ink-muted);
  display:flex;align-items:center;gap:11px;transition:border-color .18s,background .18s,color .18s;
}
.quiz-opt:hover:not([disabled]){border-color:var(--accent-line);color:var(--ink)}
.quiz-opt .k{
  flex:none;width:22px;height:22px;border-radius:6px;display:grid;place-items:center;
  font-size:11.5px;font-weight:700;background:var(--surface-2);color:var(--ink-faint);
}
.quiz-opt[data-state="ok"]{border-color:var(--ok);background:var(--ok-soft);color:var(--ink)}
.quiz-opt[data-state="ok"] .k{background:var(--ok);color:#fff}
.quiz-opt[data-state="no"]{border-color:var(--signal);background:var(--signal-soft);color:var(--ink)}
.quiz-opt[data-state="no"] .k{background:var(--signal);color:#fff}
.quiz-fb{margin-top:12px;font-size:14px;line-height:1.55;color:var(--ink-muted);display:none}
.quiz-fb.on{display:block}

/* ---------- ANIMAÇÕES BASE ---------- */
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.anim{animation:fadeUp .34s cubic-bezier(.16,1,.3,1) both}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001ms !important;transition-duration:.001ms !important}
}

/* ---------- MODO PROJEÇÃO ---------- */
body[data-proj="1"] .app{grid-template-columns:1fr}
body[data-proj="1"] .sidebar{display:none}
body[data-proj="1"] .canvas{padding:40px 44px 90px}
body[data-proj="1"] .wrap{max-width:1180px}
body[data-proj="1"]{font-size:19px}
body[data-proj="1"] .h-xl{font-size:clamp(38px,5vw,60px)}
body[data-proj="1"] .topic-lead{font-size:23px;line-height:1.55;max-width:none}
body[data-proj="1"] .body{font-size:20px;line-height:1.6}
body[data-proj="1"] .h-md{font-size:24px}
body[data-proj="1"] .card{padding:30px}
body[data-proj="1"] .stage{padding:28px}
body[data-proj="1"] .tl-body h4{font-size:24px}
body[data-proj="1"] .tl-body p{font-size:19px}
body[data-proj="1"] .tl-year{font-size:34px}
body[data-proj="1"] .quiz-q{font-size:21px}
body[data-proj="1"] .quiz-opt{font-size:18.5px;padding:14px 18px}
body[data-proj="1"] .hs-info h4,body[data-proj="1"] .stk-detail h4{font-size:22px}
body[data-proj="1"] .hs-info p,body[data-proj="1"] .stk-detail p{font-size:19px}
body[data-proj="1"] .flow-note,body[data-proj="1"] .wall-msg,body[data-proj="1"] .dt-note{font-size:18px}
body[data-proj="1"] .btn{font-size:17px;padding:11px 22px}
body[data-proj="1"] .hs-svg{max-width:660px}
body[data-proj="1"] .menu-btn{display:none}
#projBtn[aria-pressed="true"]{background:var(--inverse-surface);color:var(--inverse-ion);border-color:transparent}
#projBtn[aria-pressed="true"]{background:var(--inverse-surface);color:var(--inverse-ink)}

/* ---------- IMPRESSÃO ---------- */
@media print{
  :root{--surface:#fff;--surface-1:#fff;--surface-2:#f4f4f6;--surface-3:#e8e8ec;
        --ink:#111;--ink-muted:#333;--ink-faint:#666;--outline:#ccc;--outline-faint:#e2e2e6;
        --accent:#1f4fb8;--accent-soft:#eaf0fe;--accent-line:#9db6ee}
  .sidebar,.topbar,.pager,.scrim,.hint,.tl-controls,.ctl-row,.seg,.ports-bar,.sb-search{display:none !important}
  .app{display:block}
  .canvas{padding:0}
  .wrap{max-width:none}
  body{font-size:11pt}
  .card,.quiz,.stage,.tl-card{break-inside:avoid;box-shadow:none}
  .topic-head{break-after:avoid}
  .h-xl{font-size:22pt}
  .quiz-fb{display:block !important}
  a[href^="#"]::after{content:""}
  .print-only{display:block !important}
}
.print-only{display:none}

/* ---------- RESPONSIVO ---------- */
.scrim{display:none}
@media (max-width: 940px){
  .app{grid-template-columns:1fr}
  .sidebar{
    position:fixed;inset:0 auto 0 0;width:290px;z-index:60;
    transform:translateX(-100%);transition:transform .28s cubic-bezier(.16,1,.3,1);
    box-shadow:var(--shadow-md);
  }
  body[data-nav="open"] .sidebar{transform:none}
  body[data-nav="open"] .scrim{display:block;position:fixed;inset:0;z-index:50;background:rgba(18,19,23,.42)}
  .menu-btn{display:grid}
  .canvas{padding:26px 18px 70px}
  .topbar{padding:11px 18px}
  .crumb>span:first-child,.crumb-sep{display:none}
  .crumb{white-space:nowrap}
}
@media (max-width: 560px){
  .canvas{padding:22px 14px 60px}
  .card{padding:17px;border-radius:var(--r-md)}
  .stage{padding:15px}
  .pager{flex-direction:column}
}

/* ============================================================
   COMPONENTES INTERATIVOS
   ============================================================ */

/* ---------- ILUSTRAÇÕES ---------- */
.art-svg{width:100%;height:auto;display:block}
.art-pane{
  background:var(--surface-1);border:1px solid var(--outline-faint);border-radius:var(--r-md);
  padding:12px;display:grid;place-items:center;min-height:182px;position:relative;
}
.art-pane .art-svg{max-width:262px;animation:artIn .38s cubic-bezier(.16,1,.3,1) both}
@keyframes artIn{from{opacity:0;transform:scale(.965)}to{opacity:1;transform:none}}
.art-cap{
  position:absolute;top:9px;left:11px;font-size:9.5px;font-weight:700;letter-spacing:.1em;
  text-transform:uppercase;color:var(--ink-faint);
}
.tl-card.has-art{grid-template-columns:238px 1fr;gap:18px;align-items:start}
.tl-card.has-art .tl-left{display:flex;flex-direction:column;gap:10px}
.tl-card.has-art .tl-year{font-size:23px}
@media (max-width:760px){
  .tl-card.has-art{grid-template-columns:1fr}
  .art-pane{min-height:0}
  .art-pane .art-svg{max-width:230px}
}
.scale-art{width:100%;max-width:248px;margin:0 auto 4px}
body[data-proj="1"] .art-pane .art-svg{max-width:330px}
body[data-proj="1"] .tl-card.has-art{grid-template-columns:300px 1fr}

/* ---------- TIMELINE (reutilizado em 15 tópicos) ---------- */
.tl{--tl-h:118px}
.tl-track-wrap{position:relative;padding:8px 0 2px}
.tl-rail{
  position:relative;height:var(--tl-h);
  border-radius:var(--r-md);background:var(--surface-1);
  border:1px solid var(--outline-faint);overflow:hidden;
}
.tl-line{position:absolute;left:0;right:0;top:50%;height:2px;background:var(--outline);transform:translateY(-50%)}
.tl-fill{position:absolute;left:0;top:50%;height:2px;background:var(--accent);transform:translateY(-50%);transition:width .3s cubic-bezier(.16,1,.3,1)}
.tl-node{
  position:absolute;top:50%;transform:translate(-50%,-50%);
  width:13px;height:13px;border-radius:50%;background:var(--surface);
  border:2px solid var(--outline);cursor:pointer;padding:0;
  transition:transform .2s,border-color .2s,background .2s;z-index:2;
}
.tl-node:hover{transform:translate(-50%,-50%) scale(1.35);border-color:var(--accent)}
.tl-node::before{content:"";position:absolute;inset:-9px;border-radius:50%}
@media (pointer:coarse){.tp-btn{min-height:40px}.tl-slider{min-height:36px}}
.tl-node[data-past="1"]{border-color:var(--accent);background:var(--accent)}
.tl-node[data-active="1"]{
  transform:translate(-50%,-50%) scale(1.55);border-color:var(--accent);background:var(--accent);
  box-shadow:0 0 0 5px var(--accent-soft);
}
.tl-tick{
  position:absolute;top:50%;margin-top:16px;transform:translateX(-50%);
  font-size:11.5px;font-weight:700;color:var(--accent);white-space:nowrap;
  font-variant-numeric:tabular-nums;pointer-events:none;
  transition:left .3s cubic-bezier(.16,1,.3,1);
  background:var(--surface-1);padding:1px 6px;border-radius:var(--r-xs);
}
.tl-edge{
  position:absolute;top:50%;margin-top:-30px;font-size:10.5px;font-weight:600;
  color:var(--ink-faint);font-variant-numeric:tabular-nums;pointer-events:none;
}
.tl-edge.a{left:8px}.tl-edge.b{right:8px}
.tl-era{
  position:absolute;top:8px;height:20px;border-radius:var(--r-pill);
  display:flex;align-items:center;padding:0 9px;font-size:10px;font-weight:700;
  letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;overflow:hidden;
  opacity:.92;
}
.tl-controls{display:flex;align-items:center;gap:12px;margin-top:16px;flex-wrap:wrap}
.tl-slider{flex:1;min-width:180px}
.tl-detail{margin-top:16px}
.tl-card{
  border:1px solid var(--outline-faint);border-radius:var(--r-md);background:var(--surface-1);
  padding:18px;display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:start;
}
.tl-year{
  font-family:var(--mono);font-size:26px;font-weight:700;line-height:1;color:var(--accent);
  font-variant-numeric:tabular-nums;letter-spacing:-.03em;
}
.tl-year small{display:block;font-family:var(--font);font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint);margin-top:6px}
.tl-body h4{font-size:18px;font-weight:600;letter-spacing:-.012em;line-height:1.25;color:var(--ink);margin-bottom:6px}
.tl-body p{font-size:15px;line-height:1.58;color:var(--ink-muted)}
.tl-tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:11px}
.tl-tag{font-size:11px;font-weight:600;padding:3px 9px;border-radius:var(--r-pill);background:var(--surface-2);color:var(--ink-muted);border:1px solid var(--outline-faint)}
.tl-stat{
  margin-top:12px;display:inline-flex;align-items:center;gap:8px;padding:6px 12px;
  border-radius:var(--r-pill);background:var(--accent-soft);color:var(--accent);
  font-size:12.5px;font-weight:600;font-variant-numeric:tabular-nums;
}
@media (max-width:560px){.tl-card{grid-template-columns:1fr;gap:10px}.tl-year{font-size:22px}}

/* ---------- BINÁRIO ---------- */
.bin-bits{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.bin-bit{display:flex;flex-direction:column;align-items:center;gap:6px}
.bin-toggle{
  width:52px;height:60px;border-radius:var(--r-md);border:1px solid var(--outline);
  background:var(--surface-1);font-family:var(--mono);font-size:24px;font-weight:700;
  color:var(--ink-faint);transition:all .2s cubic-bezier(.16,1,.3,1);
}
.bin-toggle[aria-pressed="true"]{
  background:var(--accent);color:#fff;border-color:var(--accent);
  box-shadow:0 0 0 4px var(--accent-soft);
}
.bin-w{font-family:var(--mono);font-size:11.5px;font-weight:600;color:var(--ink-faint);font-variant-numeric:tabular-nums}
.bin-bit[data-on="1"] .bin-w{color:var(--accent)}
.bin-out{
  margin-top:20px;display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap;
  padding:16px;border-radius:var(--r-md);background:var(--surface-1);border:1px solid var(--outline-faint);
}
.bin-eq{font-family:var(--mono);font-size:14.5px;color:var(--ink-muted);text-align:center;font-variant-numeric:tabular-nums}
.bin-res{font-family:var(--mono);font-size:34px;font-weight:700;color:var(--ink);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.bin-div{margin-top:6px;font-family:var(--mono);font-size:13.5px;line-height:1.9;color:var(--ink-muted)}
.bin-div b{color:var(--signal);font-weight:700}
.bin-div .q{color:var(--ink)}

/* ---------- ESCALA DE ARMAZENAMENTO ---------- */
.scale-view{display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center;min-height:200px;justify-content:center}
.scale-unit{font-family:var(--mono);font-size:clamp(38px,7vw,64px);font-weight:700;line-height:1;letter-spacing:-.04em;color:var(--ink)}
.scale-name{font-size:15px;font-weight:600;color:var(--accent);letter-spacing:.02em}
.scale-bytes{font-family:var(--mono);font-size:13px;color:var(--ink-faint);font-variant-numeric:tabular-nums;word-break:break-all;max-width:100%}
.scale-ex{
  font-size:15.5px;line-height:1.55;color:var(--ink-muted);max-width:44ch;
  padding:14px 18px;border-radius:var(--r-md);background:var(--surface-1);border:1px solid var(--outline-faint);
}
.scale-ex b{color:var(--ink);font-weight:600}
.scale-blocks{display:flex;gap:3px;justify-content:center;flex-wrap:wrap;max-width:340px}
.scale-blocks i{width:9px;height:9px;border-radius:2px;background:var(--accent);opacity:.75}

/* ---------- HOTSPOTS (PC por dentro) ---------- */
.hs{position:relative}
.hs-svg{
  width:100%;max-width:520px;margin:0 auto;height:auto;
  border-radius:var(--r-md);background:var(--surface-1);border:1px solid var(--outline-faint);
}
.hs-pt{cursor:pointer;transition:opacity .2s}
.hs-pt circle.ring{fill:var(--accent);opacity:.16}
.hs-pt circle.dot{fill:var(--accent)}
.hs-pt[data-active="1"] circle.ring{opacity:.34}
.hs-pt:hover circle.ring{opacity:.34}
.hs-info{
  margin-top:16px;padding:16px 18px;border-radius:var(--r-md);
  background:var(--surface-1);border:1px solid var(--outline-faint);min-height:96px;
}
.hs-info h4{font-size:17px;font-weight:600;color:var(--ink);margin-bottom:6px;letter-spacing:-.01em}
.hs-info p{font-size:14.5px;line-height:1.58;color:var(--ink-muted)}
.hs-info .role{
  display:inline-block;margin-bottom:9px;font-size:11px;font-weight:700;letter-spacing:.1em;
  text-transform:uppercase;color:var(--accent);
}
.hs-list{display:flex;gap:7px;flex-wrap:wrap;margin-top:14px}
.hs-chip{
  padding:6px 13px;border-radius:var(--r-pill);font-size:13px;font-weight:500;
  border:1px solid var(--outline);background:var(--surface);color:var(--ink-muted);transition:all .18s;
}
.hs-chip:hover{border-color:var(--accent-line);color:var(--ink)}
.hs-chip[aria-pressed="true"]{background:var(--accent);color:#fff;border-color:var(--accent)}

/* ---------- SORTER (arraste periféricos) ---------- */
.sorter{display:grid;gap:16px}
.sort-pool{
  display:flex;gap:8px;flex-wrap:wrap;min-height:56px;padding:12px;
  border-radius:var(--r-md);background:var(--surface-1);border:1px dashed var(--outline);
}
.sort-bins{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.sort-bin{
  border-radius:var(--r-md);padding:12px;min-height:130px;
  border:1.5px dashed var(--outline);background:var(--surface-1);transition:all .2s;
}
.sort-bin.over{border-color:var(--accent);background:var(--accent-soft)}
.sort-bin h5{font-size:12.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;margin-bottom:4px}
.sort-bin .sb-desc{font-size:11.5px;color:var(--ink-faint);margin-bottom:10px;line-height:1.4}
.sort-items{display:flex;gap:7px;flex-wrap:wrap}
.pill-item{
  display:inline-flex;align-items:center;gap:6px;padding:7px 13px;border-radius:var(--r-pill);
  font-size:13px;font-weight:500;background:var(--surface);border:1px solid var(--outline);
  color:var(--ink);cursor:grab;user-select:none;transition:all .18s;
}
.pill-item:hover{border-color:var(--accent-line);box-shadow:var(--shadow-sm)}
.pill-item:active{cursor:grabbing}
.pill-item.dragging{opacity:.4}
.pill-item[data-ok="1"]{border-color:var(--ok);background:var(--ok-soft)}
.pill-item[data-ok="0"]{border-color:var(--signal);background:var(--signal-soft)}
.sort-score{font-size:14px;font-weight:600;color:var(--ink)}

/* ---------- FLUXO CPU / RAM / KERNEL ---------- */
.flowbox{display:grid;gap:12px}
.flow-lane{
  display:grid;grid-template-columns:150px 1fr;gap:14px;align-items:center;
  padding:14px;border-radius:var(--r-md);background:var(--surface-1);
  border:1px solid var(--outline-faint);transition:border-color .25s,background .25s;
}
.flow-lane[data-hot="1"]{border-color:var(--accent-line);background:var(--accent-soft)}
.flow-tag{display:flex;flex-direction:column;gap:3px}
.flow-tag b{font-size:14.5px;font-weight:600;color:var(--ink)}
.flow-tag span{font-size:11.5px;color:var(--ink-faint)}
.flow-track{position:relative;height:38px;border-radius:var(--r-sm);background:var(--surface-2);overflow:hidden}
.flow-pkt{
  position:absolute;top:50%;transform:translateY(-50%);height:22px;padding:0 10px;
  border-radius:var(--r-pill);background:var(--accent);color:#fff;
  font-size:11px;font-weight:600;display:flex;align-items:center;white-space:nowrap;
  transition:left .7s cubic-bezier(.4,0,.2,1),opacity .3s;
}
.flow-note{font-size:13.5px;color:var(--ink-muted);line-height:1.55;min-height:42px}

/* ---------- CONECTORES ---------- */
.conn-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(122px,1fr));gap:10px}
.conn-card{
  padding:13px 11px;border-radius:var(--r-md);border:1px solid var(--outline);
  background:var(--surface);text-align:center;transition:all .18s;display:flex;
  flex-direction:column;align-items:center;gap:8px;
}
.conn-card:hover{border-color:var(--accent-line);transform:translateY(-2px);box-shadow:var(--shadow-sm)}
.conn-card[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.conn-shape{height:34px;display:grid;place-items:center;color:var(--ink-muted)}
.conn-card[aria-pressed="true"] .conn-shape{color:var(--accent)}
.conn-name{font-size:12.5px;font-weight:600;color:var(--ink);line-height:1.25}
.conn-era{font-size:10.5px;color:var(--ink-faint);font-variant-numeric:tabular-nums}
.conn-card[data-status="dead"] .conn-name{color:var(--ink-faint)}

/* ---------- MURO DE MEMÓRIA x86/x64 ---------- */
.wall{position:relative;height:70px;border-radius:var(--r-md);background:var(--surface-2);overflow:hidden;border:1px solid var(--outline-faint)}
.wall-fill{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,var(--accent),color-mix(in srgb,var(--accent) 55%,var(--surface)));transition:width .3s cubic-bezier(.16,1,.3,1)}
.wall-limit{position:absolute;top:0;bottom:0;width:3px;background:var(--signal);z-index:3}
.wall-limit::after{
  content:attr(data-lab);position:absolute;top:-1px;left:7px;font-size:10.5px;font-weight:700;
  color:var(--signal);white-space:nowrap;background:var(--surface);padding:2px 6px;border-radius:var(--r-xs);
}
.wall-txt{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--mono);font-size:19px;font-weight:700;color:var(--ink);z-index:2;text-shadow:0 1px 3px var(--surface);font-variant-numeric:tabular-nums}
.wall-msg{margin-top:12px;padding:12px 15px;border-radius:var(--r-md);font-size:14px;line-height:1.5;border:1px solid var(--outline-faint);background:var(--surface-1);color:var(--ink-muted)}
.wall-msg[data-tone="bad"]{border-color:var(--signal);background:var(--signal-soft);color:var(--ink)}
.wall-msg[data-tone="good"]{border-color:var(--ok);background:var(--ok-soft);color:var(--ink)}

/* ---------- CISC / RISC ---------- */
.isa-cols{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:620px){.isa-cols{grid-template-columns:1fr}}
.isa-col{border:1px solid var(--outline-faint);border-radius:var(--r-md);padding:15px;background:var(--surface-1)}
.isa-col h5{font-size:14px;font-weight:700;margin-bottom:3px;color:var(--ink)}
.isa-col .sub{font-size:11.5px;color:var(--ink-faint);margin-bottom:12px}
.isa-steps{display:flex;flex-direction:column;gap:6px;min-height:150px}
.isa-step{
  font-family:var(--mono);font-size:12.5px;padding:9px 12px;border-radius:var(--r-sm);
  background:var(--surface);border:1px solid var(--outline-faint);color:var(--ink-muted);
  opacity:.35;transition:all .3s;
}
.isa-step[data-on="1"]{opacity:1;border-color:var(--accent);background:var(--accent-soft);color:var(--ink)}
.isa-step[data-done="1"]{opacity:.8;border-color:var(--ok);background:var(--ok-soft);color:var(--ink)}
.isa-meter{margin-top:12px;display:flex;justify-content:space-between;align-items:baseline;font-size:12.5px;color:var(--ink-faint)}
.isa-meter b{font-family:var(--mono);font-size:19px;color:var(--ink);font-variant-numeric:tabular-nums}

/* ---------- ARQUITETURAS (barramentos) ---------- */
.arch-svg{width:100%;height:auto;border-radius:var(--r-md);background:var(--surface-1);border:1px solid var(--outline-faint)}
.arch-box{fill:var(--surface);stroke:var(--outline);stroke-width:1.5}
.arch-lab{fill:var(--ink);font-size:11px;font-weight:600;font-family:var(--font)}
.arch-sub{fill:var(--ink-faint);font-size:9px;font-family:var(--font)}
.arch-bus{stroke:var(--outline);stroke-width:2.5;fill:none}
.arch-dot{fill:var(--accent)}
.arch-dot.d2{fill:var(--signal)}

/* ---------- RAM vs ROM (energia) ---------- */
.pwr{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:620px){.pwr{grid-template-columns:1fr}}
.pwr-unit{border:1px solid var(--outline-faint);border-radius:var(--r-md);padding:15px;background:var(--surface-1)}
.pwr-unit h5{font-size:14px;font-weight:700;color:var(--ink);display:flex;align-items:center;gap:8px;margin-bottom:3px}
.pwr-unit .sub{font-size:11.5px;color:var(--ink-faint);margin-bottom:12px}
.pwr-cells{display:flex;flex-direction:column;gap:6px;min-height:158px}
.pwr-cell{
  font-size:12.5px;padding:9px 12px;border-radius:var(--r-sm);background:var(--surface);
  border:1px solid var(--outline-faint);color:var(--ink-muted);
  transition:opacity .5s,transform .5s,filter .5s;
}
.pwr-cell.gone{opacity:0;transform:translateX(22px);filter:blur(3px)}
.pwr-cell.kept{border-color:var(--ok);background:var(--ok-soft);color:var(--ink)}
.pwr-switch{display:flex;align-items:center;gap:14px;justify-content:center;margin-bottom:16px;flex-wrap:wrap}
.pwr-led{width:11px;height:11px;border-radius:50%;background:var(--ok);box-shadow:0 0 9px var(--ok);transition:all .3s}
.pwr-led.off{background:var(--outline);box-shadow:none}

/* ---------- ÁRVORE DE MEMÓRIA ---------- */
.mtree{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:620px){.mtree{grid-template-columns:1fr}}
.mbranch{border:1px solid var(--outline-faint);border-radius:var(--r-md);padding:14px;background:var(--surface-1)}
.mbranch>h5{font-size:12.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;margin-bottom:11px}
.mnode{
  padding:10px 13px;border-radius:var(--r-sm);border:1px solid var(--outline-faint);
  background:var(--surface);margin-bottom:7px;cursor:pointer;transition:all .18s;
}
.mnode:hover{border-color:var(--accent-line)}
.mnode[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.mnode b{font-size:13.5px;font-weight:600;color:var(--ink);display:block}
.mnode span{font-size:11.5px;color:var(--ink-faint)}

/* ---------- PIRÂMIDE DE MEMÓRIA ---------- */
.pyr{display:flex;flex-direction:column;align-items:center;gap:5px}
.pyr-lvl{
  border-radius:var(--r-sm);padding:11px 14px;text-align:center;cursor:pointer;
  border:1px solid var(--outline-faint);transition:all .2s;
  display:flex;align-items:center;justify-content:center;gap:10px;
}
.pyr-lvl:hover{border-color:var(--accent-line)}
.pyr-lvl[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.pyr-lvl b{font-size:13px;font-weight:600;color:var(--ink)}
.pyr-lvl span{font-size:11px;color:var(--ink-faint);font-variant-numeric:tabular-nums}
.pyr-axes{display:flex;justify-content:space-between;width:100%;max-width:520px;margin-top:6px;font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-faint)}
.pyr-detail{margin-top:16px;display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.pyr-stat{padding:12px;border-radius:var(--r-md);background:var(--surface-1);border:1px solid var(--outline-faint)}
.pyr-stat .k{font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint);margin-bottom:4px}
.pyr-stat .v{font-size:15px;font-weight:600;color:var(--ink)}

/* ---------- CÓPIA DE ARQUIVO (filesystems) ---------- */
.fs-sim{display:grid;gap:14px}
.fs-io{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center}
@media (max-width:620px){.fs-io{grid-template-columns:1fr}}
.fs-panel{border:1px solid var(--outline-faint);border-radius:var(--r-md);padding:14px;background:var(--surface-1)}
.fs-panel .k{font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint);margin-bottom:9px}
.fs-arrow{display:grid;place-items:center;color:var(--ink-faint)}
.fs-verdict{padding:14px 16px;border-radius:var(--r-md);border:1px solid var(--outline-faint);background:var(--surface-1);font-size:14.5px;line-height:1.55;color:var(--ink-muted)}
.fs-verdict[data-tone="ok"]{border-color:var(--ok);background:var(--ok-soft);color:var(--ink)}
.fs-verdict[data-tone="no"]{border-color:var(--signal);background:var(--signal-soft);color:var(--ink)}
.fs-verdict b{color:var(--ink)}

/* ---------- PILHA DE CAMADAS (SO / OSI / hypervisor) ---------- */
.stack{display:flex;flex-direction:column-reverse;gap:5px}
.stk-lvl{
  border-radius:var(--r-sm);padding:12px 15px;cursor:pointer;text-align:left;width:100%;
  border:1px solid var(--outline-faint);background:var(--surface-1);transition:all .2s;
  display:flex;align-items:center;gap:12px;
}
.stk-lvl:hover{border-color:var(--accent-line);transform:translateX(3px)}
.stk-lvl[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.stk-n{
  flex:none;width:26px;height:26px;border-radius:7px;display:grid;place-items:center;
  font-size:12px;font-weight:700;background:var(--surface-2);color:var(--ink-muted);
  font-variant-numeric:tabular-nums;
}
.stk-lvl[aria-pressed="true"] .stk-n{background:var(--accent);color:#fff}
.stk-txt{flex:1;min-width:0}
.stk-txt b{display:block;font-size:14px;font-weight:600;color:var(--ink);line-height:1.25}
.stk-txt span{font-size:11.5px;color:var(--ink-faint)}
.stk-pdu{
  flex:none;font-family:var(--mono);font-size:10.5px;font-weight:600;padding:3px 8px;
  border-radius:var(--r-pill);background:var(--surface-2);color:var(--ink-faint);
}
.stk-detail{margin-top:16px;padding:16px 18px;border-radius:var(--r-md);background:var(--surface-1);border:1px solid var(--outline-faint);min-height:104px}
.stk-detail h4{font-size:16.5px;font-weight:600;color:var(--ink);margin-bottom:6px}
.stk-detail p{font-size:14.5px;line-height:1.58;color:var(--ink-muted)}
.stk-protos{display:flex;gap:6px;flex-wrap:wrap;margin-top:11px}
.stk-proto{font-family:var(--mono);font-size:11.5px;padding:3px 9px;border-radius:var(--r-xs);background:var(--surface-2);color:var(--ink-muted);border:1px solid var(--outline-faint)}
.stk-attack{margin-top:11px;padding:10px 13px;border-radius:var(--r-sm);background:var(--signal-soft);border:1px solid rgba(255,70,65,.3);font-size:13px;color:var(--ink);line-height:1.5}
.stk-attack b{color:var(--signal);font-weight:700}

/* ---------- ENCAPSULAMENTO (PDU) ---------- */
.enc-view{display:flex;flex-direction:column;gap:9px;align-items:center;min-height:230px;justify-content:center;padding:10px 0}
.enc-layer{
  width:100%;max-width:520px;border-radius:var(--r-sm);padding:9px;
  display:flex;align-items:center;gap:7px;transition:all .4s cubic-bezier(.16,1,.3,1);
  border:1.5px solid;
}
.enc-hdr,.enc-ftr{
  font-family:var(--mono);font-size:10px;font-weight:700;padding:6px 8px;border-radius:var(--r-xs);
  color:#fff;white-space:nowrap;flex:none;
}
.enc-payload{
  flex:1;min-width:0;text-align:center;font-family:var(--mono);font-size:11px;font-weight:600;
  padding:6px;border-radius:var(--r-xs);background:var(--surface-2);color:var(--ink-muted);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.enc-name{
  width:100%;max-width:520px;display:flex;justify-content:space-between;align-items:baseline;
  font-size:11.5px;color:var(--ink-faint);
}
.enc-name b{font-size:13px;font-weight:700;color:var(--ink)}
.enc-bits{font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--accent);word-break:break-all;text-align:center;max-width:520px;line-height:1.7}

/* ---------- PORTAS ---------- */
.ports-bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.ports-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:9px;max-height:400px;overflow-y:auto;padding-right:4px}
.port-card{
  padding:11px 13px;border-radius:var(--r-md);border:1px solid var(--outline-faint);
  background:var(--surface);display:flex;gap:11px;align-items:flex-start;
}
.port-num{
  flex:none;font-family:var(--mono);font-size:13px;font-weight:700;color:var(--accent);
  min-width:44px;font-variant-numeric:tabular-nums;
}
.port-info b{display:block;font-size:13.5px;font-weight:600;color:var(--ink);line-height:1.25}
.port-info span{font-size:12px;color:var(--ink-faint);line-height:1.4;display:block;margin-top:2px}
.port-card[data-risk="1"]{border-color:rgba(255,70,65,.35);background:var(--signal-soft)}
.port-card[data-risk="1"] .port-num{color:var(--signal)}
.port-tag{display:inline-block;margin-top:5px;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:var(--r-xs)}
.port-tag.safe{background:var(--ok-soft);color:var(--ok)}
.port-tag.risk{background:var(--signal-soft);color:var(--signal)}

/* ---------- CONSTRUTOR DE REDE ---------- */
.netmap{display:grid;gap:14px}
.net-svg{width:100%;height:auto;border-radius:var(--r-md);background:var(--surface-1);border:1px solid var(--outline-faint)}
.net-node{cursor:pointer}
.net-node rect{fill:var(--surface);stroke:var(--outline);stroke-width:1.5;transition:all .2s}
.net-node:hover rect{stroke:var(--accent)}
.net-node[data-active="1"] rect{stroke:var(--accent);stroke-width:2.5;fill:var(--accent-soft)}
.net-node text{font-family:var(--font);font-size:9.5px;font-weight:600;fill:var(--ink)}
.net-node text.ip{font-family:var(--mono);font-size:8.5px;fill:var(--ink-faint);font-weight:400}
.net-link{stroke:var(--outline);stroke-width:1.8;fill:none}
.net-link.hot{stroke:var(--accent);stroke-width:2.6}
.ip-form{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.ip-field label{display:block;font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-faint);margin-bottom:5px}
.ip-field input{width:100%;font-family:var(--mono)}
.ip-field input[data-ok="1"]{border-color:var(--ok);background:var(--ok-soft)}
.ip-field input[data-ok="0"]{border-color:var(--signal);background:var(--signal-soft)}

/* ---------- VIRTUALIZAÇÃO ---------- */
.vm-host{border:1px solid var(--outline-faint);border-radius:var(--r-md);padding:15px;background:var(--surface-1)}
.vm-res{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:14px}
.vm-gauge .g-lab{display:flex;justify-content:space-between;font-size:11.5px;margin-bottom:5px}
.vm-gauge .g-lab b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.vm-gauge .g-lab span{color:var(--ink-faint)}
.vm-gauge .bar>i{background:var(--accent)}
.vm-gauge[data-over="1"] .bar>i{background:var(--signal)}
.vm-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.vm-card{padding:12px;border-radius:var(--r-md);border:1px solid var(--outline-faint);background:var(--surface)}
.vm-card h6{font-size:13px;font-weight:600;color:var(--ink);margin-bottom:8px;display:flex;align-items:center;gap:7px}
.vm-card .vm-os{width:8px;height:8px;border-radius:2px;flex:none}
.vm-ctl{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--ink-faint);margin-top:6px}
.vm-ctl input{flex:1}
.vs-cols{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:620px){.vs-cols{grid-template-columns:1fr}}
.vs-stack{display:flex;flex-direction:column-reverse;gap:4px}
.vs-block{padding:9px 12px;border-radius:var(--r-sm);font-size:12.5px;font-weight:500;text-align:center;border:1px solid var(--outline-faint)}

/* ---------- E-MAIL ---------- */
.mail-stage{position:relative;min-height:190px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;align-items:center}
.mail-node{
  border:1px solid var(--outline-faint);border-radius:var(--r-md);padding:14px 12px;
  background:var(--surface-1);text-align:center;transition:all .3s;
}
.mail-node[data-hot="1"]{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 0 0 3px var(--accent-soft)}
.mail-node .mi{color:var(--ink-muted);display:grid;place-items:center;margin-bottom:8px}
.mail-node[data-hot="1"] .mi{color:var(--accent)}
.mail-node b{display:block;font-size:13px;font-weight:600;color:var(--ink)}
.mail-node span{font-size:11px;color:var(--ink-faint);line-height:1.4;display:block;margin-top:3px}
.mail-env{
  position:absolute;top:38px;width:30px;height:22px;border-radius:3px;background:var(--accent);
  transition:left .9s cubic-bezier(.4,0,.2,1),opacity .3s;z-index:3;display:grid;place-items:center;color:#fff;
}
.mail-addr{
  display:flex;align-items:center;justify-content:center;gap:2px;flex-wrap:wrap;
  font-family:var(--mono);font-size:clamp(15px,3.2vw,24px);font-weight:700;margin:6px 0 12px;
}
.mail-part{padding:3px 6px;border-radius:var(--r-xs);cursor:pointer;transition:all .18s;border-bottom:2px solid transparent}
.mail-part:hover{background:var(--surface-2)}
.mail-part[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);border-bottom-color:var(--accent)}

/* ---------- ERAS DA WEB (browser mock) ---------- */
.wb{border:1px solid var(--outline);border-radius:var(--r-md);overflow:hidden;background:var(--surface)}
.wb-bar{display:flex;align-items:center;gap:8px;padding:9px 12px;background:var(--surface-2);border-bottom:1px solid var(--outline-faint)}
.wb-dots{display:flex;gap:5px}
.wb-dots i{width:9px;height:9px;border-radius:50%;background:var(--outline)}
.wb-url{flex:1;font-family:var(--mono);font-size:11.5px;color:var(--ink-faint);background:var(--surface);padding:4px 10px;border-radius:var(--r-pill);border:1px solid var(--outline-faint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wb-page{padding:20px;min-height:210px}
.wb-title{font-size:20px;font-weight:700;margin-bottom:8px;color:var(--ink)}
.wb-lines{display:flex;flex-direction:column;gap:7px;margin-bottom:14px}
.wb-lines i{height:8px;border-radius:var(--r-pill);background:var(--surface-3)}
.wb-feat{display:flex;gap:7px;flex-wrap:wrap}
.wb-feat span{font-size:11.5px;font-weight:600;padding:4px 10px;border-radius:var(--r-pill);background:var(--accent-soft);color:var(--accent)}
.wb-role{margin-top:14px;font-size:13px;color:var(--ink-muted);line-height:1.55;padding-top:12px;border-top:1px solid var(--outline-faint)}
.wb-role b{color:var(--ink)}

/* ---------- CARDS DE PESSOAS ---------- */
.ppl-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:12px}
.ppl{
  perspective:1000px;height:212px;cursor:pointer;background:none;border:0;padding:0;
}
.ppl-in{display:block;position:relative;width:100%;height:100%;transition:transform .55s cubic-bezier(.16,1,.3,1);transform-style:preserve-3d}
.ppl[aria-pressed="true"] .ppl-in{transform:rotateY(180deg)}
.ppl-face{
  position:absolute;inset:0;-webkit-backface-visibility:hidden;backface-visibility:hidden;
  border:1px solid var(--outline-faint);border-radius:var(--r-md);padding:14px;
  display:flex;flex-direction:column;background:var(--surface-1);text-align:left;
}
.ppl-back{transform:rotateY(180deg);background:var(--inverse-surface);color:var(--inverse-ink);border-color:transparent;justify-content:center}
.ppl-mono{
  width:38px;height:38px;border-radius:var(--r-sm);display:grid;place-items:center;
  font-size:14px;font-weight:700;background:var(--accent-soft);color:var(--accent);margin-bottom:10px;flex:none;
}
.ppl-name{font-size:14px;font-weight:600;color:var(--ink);line-height:1.22;margin-bottom:4px}
.ppl-role{font-size:11.5px;color:var(--ink-faint);line-height:1.4;flex:1}
.ppl-yr{font-family:var(--mono);font-size:11px;font-weight:600;color:var(--accent);font-variant-numeric:tabular-nums}
.ppl-back p{font-size:12px;line-height:1.5;opacity:.94;overflow-y:auto;max-height:100%;scrollbar-width:thin}
.ppl-back .ppl-flip{font-size:10px;letter-spacing:.1em;text-transform:uppercase;opacity:.55;margin-top:9px;font-weight:700}

/* ---------- BIG TECH ---------- */
.bt-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:11px}
.bt-card{
  padding:14px;border-radius:var(--r-md);border:1px solid var(--outline-faint);
  background:var(--surface-1);text-align:left;transition:all .2s;
}
.bt-card:hover{border-color:var(--accent-line);transform:translateY(-2px)}
.bt-card[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.bt-card .bt-nm{font-size:14.5px;font-weight:700;color:var(--ink);letter-spacing:-.01em}
.bt-card .bt-ceo{font-size:11.5px;color:var(--ink-faint);margin-top:2px}
.bt-card .bt-dom{font-size:11.5px;color:var(--accent);font-weight:600;margin-top:8px}
.bt-detail{margin-top:14px;padding:16px;border-radius:var(--r-md);background:var(--surface-1);border:1px solid var(--outline-faint);min-height:96px}
.bt-prods{display:flex;gap:7px;flex-wrap:wrap;margin-top:11px}
.bt-prod{font-size:12px;padding:5px 11px;border-radius:var(--r-pill);background:var(--surface-2);color:var(--ink-muted);border:1px solid var(--outline-faint)}

/* ---------- MAPA DE HABILIDADES (jogos) ---------- */
.gm-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.gm-card{
  padding:15px;border-radius:var(--r-md);border:1px solid var(--outline-faint);
  background:var(--surface-1);text-align:left;transition:all .2s;display:flex;flex-direction:column;gap:9px;
}
.gm-card:hover{border-color:var(--accent-line)}
.gm-card[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.gm-nm{font-size:14.5px;font-weight:600;color:var(--ink);line-height:1.25}
.gm-cat{font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--accent)}
.gm-skills{display:flex;gap:5px;flex-wrap:wrap}
.gm-skill{font-size:11px;padding:3px 9px;border-radius:var(--r-pill);background:var(--surface-2);color:var(--ink-muted);border:1px solid var(--outline-faint)}

/* ---------- COMPARADOR ---------- */
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:620px){.cmp{grid-template-columns:1fr}}
.cmp-col{border:1px solid var(--outline-faint);border-radius:var(--r-md);padding:16px;background:var(--surface-1);transition:all .25s}
.cmp-col[data-pick="1"]{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.cmp-col h5{font-size:15px;font-weight:700;color:var(--ink);margin-bottom:3px}
.cmp-col .sub{font-size:11.5px;color:var(--ink-faint);margin-bottom:13px}
.cmp-rows{display:flex;flex-direction:column;gap:9px}
.cmp-row{display:flex;flex-direction:column;gap:2px;padding-bottom:9px;border-bottom:1px solid var(--outline-faint)}
.cmp-row:last-child{border-bottom:0;padding-bottom:0}
.cmp-k{font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-faint)}
.cmp-v{font-size:14px;color:var(--ink);line-height:1.45}

/* ---------- GALERIA NOSTALGIA ---------- */
.nos-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:13px}
.nos-card{
  border:1px solid var(--outline-faint);border-radius:var(--r-md);overflow:hidden;
  background:var(--surface-1);text-align:left;transition:all .2s;display:flex;flex-direction:column;
}
.nos-card:hover{border-color:var(--accent-line);transform:translateY(-3px);box-shadow:var(--shadow-sm)}
.nos-art{height:112px;position:relative;overflow:hidden;display:grid;place-items:center}
.nos-body{padding:13px 15px 15px}
.nos-yr{font-family:var(--mono);font-size:11px;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums}
.nos-t{font-size:14.5px;font-weight:600;color:var(--ink);margin:3px 0 5px;line-height:1.25}
.nos-d{font-size:12.5px;color:var(--ink-muted);line-height:1.5}

/* ---------- SERVIÇOS WINDOWS/LINUX ---------- */
.svc-toggle{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.svc-rows{display:flex;flex-direction:column;gap:8px}
.svc-row{
  display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;align-items:center;
  padding:11px 13px;border-radius:var(--r-md);border:1px solid var(--outline-faint);background:var(--surface);
}
@media (max-width:620px){.svc-row{grid-template-columns:1fr}}
.svc-k{font-size:13.5px;font-weight:600;color:var(--ink)}
.svc-v{font-family:var(--mono);font-size:12.5px;color:var(--ink-muted);padding:5px 10px;border-radius:var(--r-sm);background:var(--surface-1);border:1px solid var(--outline-faint)}
.svc-v.win{border-color:rgba(52,107,241,.3)}
.svc-v.lin{border-color:rgba(30,142,90,.3)}

/* ---------- ÁRVORE DE DIRETÓRIOS ---------- */
.dt-cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:12px}
.dt-col{border:1px solid var(--outline-faint);border-radius:var(--r-md);padding:14px;background:var(--surface-1)}
.dt-col>h5{font-size:13px;font-weight:700;color:var(--ink);margin-bottom:2px}
.dt-col>.sub{font-family:var(--mono);font-size:11px;color:var(--ink-faint);margin-bottom:11px}
.dt-tree{font-family:var(--mono);font-size:12.5px;line-height:1.9}
.dt-item{display:block;width:100%;text-align:left;padding:2px 7px;border-radius:var(--r-xs);color:var(--ink-muted);transition:all .15s}
.dt-item:hover{background:var(--surface-2);color:var(--ink)}
.dt-item[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.dt-note{margin-top:14px;padding:13px 15px;border-radius:var(--r-md);background:var(--surface-1);border:1px solid var(--outline-faint);font-size:14px;line-height:1.55;color:var(--ink-muted);min-height:64px}
.dt-note b{color:var(--ink)}

/* ---------- MATRIZ DE COMPATIBILIDADE ---------- */
.cx-pick{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.cx-matrix{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (max-width:520px){.cx-matrix{grid-template-columns:1fr}}
.cx-os{padding:15px;border-radius:var(--r-md);border:1.5px solid var(--outline-faint);background:var(--surface-1);text-align:center;transition:all .3s}
.cx-os h6{font-size:13.5px;font-weight:700;color:var(--ink);margin-bottom:9px}
.cx-verdict{font-size:12.5px;line-height:1.5;color:var(--ink-muted)}
.cx-os[data-r="native"]{border-color:var(--ok);background:var(--ok-soft)}
.cx-os[data-r="app"]{border-color:var(--warn);background:var(--warn-soft)}
.cx-os[data-r="no"]{border-color:var(--signal);background:var(--signal-soft)}
.cx-badge{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:3px 9px;border-radius:var(--r-pill);margin-bottom:8px}
.cx-os[data-r="native"] .cx-badge{background:var(--ok);color:#fff}
.cx-os[data-r="app"] .cx-badge{background:var(--warn);color:#fff}
.cx-os[data-r="no"] .cx-badge{background:var(--signal);color:#fff}

/* ---------- ATIVIDADE DO MÓDULO (10 questões) ---------- */
.ex-top{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:16px}
.ex-count{font-size:13px;font-weight:600;color:var(--ink)}
.ex-count span{color:var(--ink-faint);font-weight:400}
.ex-dots{display:flex;gap:5px;flex-wrap:wrap}
.ex-dots i{
  width:20px;height:5px;border-radius:var(--r-pill);background:var(--surface-3);
  transition:background .25s;
}
.ex-dots i[data-s="ok"]{background:var(--ok)}
.ex-dots i[data-s="no"]{background:var(--signal)}
.ex-dots i[data-s="now"]{background:var(--accent)}

.ex-q{
  font-size:17.5px;font-weight:500;line-height:1.45;color:var(--ink);
  margin-bottom:16px;text-wrap:balance;
}
.ex-opts{display:flex;flex-direction:column;gap:9px}
.ex-opt{
  text-align:left;padding:13px 16px;border-radius:var(--r-md);border:1px solid var(--outline);
  background:var(--surface);font-size:15px;color:var(--ink-muted);line-height:1.45;
  display:flex;align-items:flex-start;gap:12px;transition:border-color .18s,background .18s,color .18s;
}
.ex-opt:hover:not([disabled]){border-color:var(--accent-line);color:var(--ink)}
.ex-opt .k{
  flex:none;width:24px;height:24px;border-radius:7px;display:grid;place-items:center;
  font-size:12px;font-weight:700;background:var(--surface-2);color:var(--ink-faint);margin-top:-1px;
}
.ex-opt[data-state="ok"]{border-color:var(--ok);background:var(--ok-soft);color:var(--ink)}
.ex-opt[data-state="ok"] .k{background:var(--ok);color:#fff}
.ex-opt[data-state="no"]{border-color:var(--signal);background:var(--signal-soft);color:var(--ink)}
.ex-opt[data-state="no"] .k{background:var(--signal);color:#fff}
.ex-opt[disabled]{cursor:default}

.ex-why{margin-top:16px;display:none;flex-direction:column;gap:11px}
.ex-why.on{display:flex}
.ex-box{padding:14px 16px;border-radius:var(--r-md);border:1px solid var(--outline-faint);background:var(--surface-1)}
.ex-box .lab{
  display:block;font-size:10.5px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;
  margin-bottom:6px;
}
.ex-box p{font-size:15px;line-height:1.6;color:var(--ink-muted)}
.ex-box p b,.ex-box p strong{color:var(--ink);font-weight:600}
.ex-box.right{border-color:var(--ok);background:var(--ok-soft)}
.ex-box.right .lab{color:var(--ok)}
.ex-box.wrong{border-color:var(--signal);background:var(--signal-soft)}
.ex-box.wrong .lab{color:var(--signal)}
.ex-nav{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:16px}

/* resultado final */
.ex-score{text-align:center;padding:10px 0 4px}
.ex-ring{
  width:132px;height:132px;margin:0 auto 16px;border-radius:50%;display:grid;place-items:center;
  position:relative;
}
.ex-ring .n{font-family:var(--mono);font-size:36px;font-weight:700;color:var(--ink);line-height:1;font-variant-numeric:tabular-nums}
.ex-ring .d{font-size:11px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-faint);margin-top:5px}
.ex-verdict{font-size:17px;font-weight:500;color:var(--ink);margin-bottom:6px}
.ex-advice{font-size:15px;line-height:1.6;color:var(--ink-muted);max-width:56ch;margin:0 auto}
.ex-review{margin-top:22px;display:flex;flex-direction:column;gap:11px;text-align:left}
.ex-rev{
  padding:14px 16px;border-radius:var(--r-md);border:1px solid var(--outline-faint);background:var(--surface-1);
  border-left-width:3px;
}
.ex-rev[data-ok="1"]{border-left-color:var(--ok)}
.ex-rev[data-ok="0"]{border-left-color:var(--signal)}
.ex-rev .qn{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint)}
.ex-rev .qt{font-size:14.5px;font-weight:500;color:var(--ink);margin:4px 0 7px;line-height:1.4}
.ex-rev .qa{font-size:13.5px;line-height:1.55;color:var(--ink-muted)}
.ex-rev .qa em{color:var(--ink);font-style:normal;font-weight:600}

/* impressão da atividade: tudo aberto */
@media print{
  .ex-nav,.ex-dots{display:none !important}
  .ex-why{display:flex !important}
  .ex-rev{break-inside:avoid}
}

/* ---------- MERCADO DE NAVEGADORES ---------- */
.share-wrap{margin-top:14px}
.share-row{display:grid;grid-template-columns:88px 1fr 46px;gap:10px;align-items:center;margin-bottom:7px}
.share-nm{font-size:12.5px;font-weight:600;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.share-bar{height:16px;border-radius:var(--r-pill);background:var(--surface-2);overflow:hidden}
.share-bar>i{display:block;height:100%;border-radius:var(--r-pill);transition:width .5s cubic-bezier(.16,1,.3,1)}
.share-pct{font-family:var(--mono);font-size:12px;font-weight:600;color:var(--ink-muted);text-align:right;font-variant-numeric:tabular-nums}

<script>
"use strict";
/* ============================================================
   DADOS — Módulos 1 a 4
   ============================================================ */

const ERAS = {
  ancient:{c:'#8B7355', n:'Antecedentes'},
  valve:{c:'#C4562F', n:'Válvulas'},
  trans:{c:'#B58A1E', n:'Transístores'},
  ic:{c:'#2E8B62', n:'Circuitos Integrados'},
  micro:{c:'#346BF1', n:'Microprocessadores'},
  ai:{c:'#7B4FD8', n:'IA e Conectividade'}
};

const MODULES = [];

/* ══════════════════ MÓDULO 1 · FUNDAMENTOS ══════════════════ */
MODULES.push({
id:'fund', name:'Fundamentos', topics:[

{
id:'linha-geral', t:'A Linha do Tempo da Tecnologia', tag:'Panorama',
lead:'Da roda ao ChatGPT: <strong>5.500 anos</strong> de invenções que reorganizaram a forma como a humanidade guarda, transporta e processa informação. Arraste o controle para percorrer a linha — repare como o intervalo entre saltos tecnológicos vai encolhendo.',
w:{k:'timeline', unit:'', items:[
 {y:'3500 a.C.', v:-3500, t:'A Roda', d:'Na Mesopotâmia, o disco giratório resolve o problema do atrito. É o primeiro caso de uma peça mecânica que multiplica a força humana — o avô distante de qualquer engrenagem.', tags:['Mecânica','Mesopotâmia'], era:'ancient'},
 {y:'3300 a.C.', v:-3300, t:'A Escrita Cuneiforme', d:'Os sumérios pressionam um estilete em tabuletas de argila. Pela primeira vez a informação sobrevive à memória de quem a criou: nasce o armazenamento de dados.', tags:['Armazenamento','Suméria'], stat:'Primeiro "disco rígido" da história: argila', era:'ancient'},
 {y:'2400 a.C.', v:-2400, t:'O Ábaco', d:'Contas deslizando em hastes transformam cálculo em manipulação física. É a primeira calculadora — e o conceito de representar números por posição sobrevive até o sistema binário.', tags:['Cálculo','Posicional'], era:'ancient'},
 {y:'1450', v:1450, t:'A Imprensa de Gutenberg', d:'Tipos móveis metálicos derrubam o custo de copiar um livro em mais de 90%. A informação deixa de ser privilégio de mosteiros — é a primeira grande democratização de dados.', tags:['Distribuição','Escala'], stat:'De ~1 livro/ano por escriba → 3.600 páginas/dia', era:'ancient'},
 {y:'1837', v:1837, t:'A Máquina Analítica e o Telégrafo', d:'Charles Babbage projeta um computador mecânico programável por cartões perfurados. No mesmo ano, o telégrafo de Morse separa a mensagem do mensageiro: informação passa a viajar mais rápido que qualquer pessoa.', tags:['Programável','Ada Lovelace'], era:'ancient'},
 {y:'1876', v:1876, t:'O Telefone', d:'Alexander Graham Bell converte som em sinal elétrico. A rede telefônica que nasce daí será, cem anos depois, a infraestrutura física por onde a internet discada entra na sua casa.', tags:['Analógico','Rede'], era:'ancient'},
 {y:'1946', v:1946, t:'ENIAC', d:'Trinta toneladas, 17.468 válvulas e uma sala inteira para fazer 5.000 somas por segundo. O primeiro computador eletrônico de propósito geral era programado fisicamente, trocando cabos de lugar.', tags:['Válvulas','Von Neumann'], stat:'17.468 válvulas · 150 kW · 30 toneladas', era:'valve'},
 {y:'1947', v:1947, t:'O Transístor', d:'No Bell Labs, Bardeen, Brattain e Shockley criam um interruptor sem partes móveis, minúsculo e frio. É o componente que torna possível absolutamente tudo o que veio depois.', tags:['Bell Labs','Semicondutor'], stat:'Prêmio Nobel de Física, 1956', era:'trans'},
 {y:'1969', v:1969, t:'ARPANET', d:'Quatro universidades americanas conectam seus computadores por comutação de pacotes. A primeira mensagem enviada foi "LO" — o sistema caiu antes de completar a palavra "LOGIN".', tags:['Pacotes','TCP/IP'], stat:'4 nós em 1969 → +5,5 bilhões de usuários hoje', era:'ic'},
 {y:'1971', v:1971, t:'O Microprocessador', d:'O Intel 4004 coloca uma CPU inteira em um único chip de 4 bits com 2.300 transístores. O computador deixa de ser um móvel e começa a virar um objeto.', tags:['Intel 4004','4 bits'], stat:'2.300 transístores · 740 kHz', era:'micro'},
 {y:'1989', v:1989, t:'World Wide Web', d:'Tim Berners-Lee, no CERN, junta três ideias — HTML, HTTP e URL — e transforma a internet (que já existia) em algo navegável por qualquer pessoa.', tags:['HTML','HTTP','URL'], era:'micro'},
 {y:'1991', v:1991, t:'Linux', d:'Um estudante finlandês de 21 anos publica um kernel "só por hobby, nada grande e profissional como o GNU". Hoje ele roda em 100% dos 500 maiores supercomputadores do mundo.', tags:['Código Aberto','Torvalds'], stat:'~92% dos sites rodam em servidores tipo Unix', era:'micro'},
 {y:'2007', v:2007, t:'iPhone', d:'Tela capacitiva multi-touch, sem teclado físico e com uma loja de aplicativos. O computador pessoal se dissolve no bolso e a internet passa a ser algo que você carrega.', tags:['Touch','App Store'], era:'micro'},
 {y:'2008', v:2008, t:'Bitcoin e Blockchain', d:'Um documento assinado por "Satoshi Nakamoto" descreve um livro-caixa distribuído que não precisa de banco central. A ideia de confiança sem intermediário sai do papel.', tags:['Descentralização','Criptografia'], era:'micro'},
 {y:'2010s', v:2014, t:'Nuvem, 4G e 5G', d:'Processamento e armazenamento migram para data centers gigantescos. Seu celular vira um terminal: os dados e a força bruta estão em outro continente.', tags:['AWS','Azure','5G'], era:'micro'},
 {y:'2022+', v:2023, t:'IA Generativa', d:'Modelos de linguagem em larga escala passam a escrever, programar e desenhar. Pela primeira vez a máquina não só executa instruções — ela as propõe.', tags:['LLM','Multimodal','Agentes'], stat:'ChatGPT: ~100 milhões de usuários em 2 meses (estimativa)', era:'ai'}
]},
notes:[{h:'O padrão que se repete', p:'Olhe os intervalos: 2.000 anos entre a escrita e o ábaco, 400 anos entre a imprensa e o telégrafo, 30 anos entre o microprocessador e a web, 15 anos entre o iPhone e o ChatGPT. Tecnologia se acumula — cada camada nova é construída em cima da anterior, e por isso o ritmo acelera.'}],
quiz:{q:'Qual invenção resolveu, pela primeira vez, o problema de guardar informação fora da cabeça humana?', o:['A roda','A escrita cuneiforme','O ábaco','A imprensa'], a:1, fb:'A escrita cuneiforme (c. 3300 a.C.) é o primeiro sistema de armazenamento persistente de dados. A imprensa resolveu a <em>cópia</em> em escala, e o ábaco resolveu o <em>processamento</em> — problemas diferentes.'}
},

{
id:'geracoes', t:'As Cinco Gerações dos Computadores', tag:'Classificação',
lead:'Historiadores da computação dividem a evolução em gerações, e o critério não é a data — é <strong>a tecnologia que faz o chaveamento</strong>. Cada troca de componente básico reduziu tamanho, custo e consumo em ordens de grandeza.',
w:{k:'timeline', items:[
 {y:'até 1930', v:1930, t:'Antecedentes — Mecânica pura', d:'Ábaco, régua de cálculo, a Máquina Analítica de Babbage e os cartões perfurados de Hollerith usados no censo americano de 1890. Nenhuma eletrônica: tudo é engrenagem, alavanca e furo em papelão.', tags:['Ábaco','Cartão perfurado','Babbage'], era:'ancient'},
 {y:'1940–1956', v:1946, t:'1ª Geração — Válvulas', d:'A válvula termiônica é um interruptor eletrônico do tamanho de uma lâmpada, que esquenta muito e queima com frequência. Colossus (1943, quebra de códigos nazistas) e ENIAC (1946) são os expoentes. Programação: recabeamento manual.', tags:['Colossus','ENIAC','UNIVAC'], stat:'Consumo: ~150.000 W · Falha a cada ~2 dias', era:'valve'},
 {y:'1956–1963', v:1959, t:'2ª Geração — Transístores', d:'O transístor substitui a válvula: 1/100 do tamanho, quase nenhum calor e vida útil de anos. Surgem as primeiras linguagens de alto nível — FORTRAN (1957) e COBOL (1959) — e o PDP-1 inaugura a computação interativa.', tags:['FORTRAN','COBOL','PDP-1'], stat:'Redução de ~100× em tamanho e consumo', era:'trans'},
 {y:'1964–1971', v:1967, t:'3ª Geração — Circuitos Integrados', d:'Jack Kilby e Robert Noyce colocam vários transístores numa única pastilha de silício. O IBM System/360 cria a ideia de família de computadores compatíveis entre si, e nasce a ARPANET.', tags:['System/360','ARPANET','Silício'], era:'ic'},
 {y:'1971–hoje', v:1985, t:'4ª Geração — Microprocessadores', d:'A CPU inteira num só chip barateia o computador a ponto de ele caber numa casa. Altair 8800, Apple II, IBM PC, Macintosh, Windows, a Web, o smartphone: tudo é 4ª geração.', tags:['Intel 4004','IBM PC','Macintosh'], stat:'De 2.300 (1971) a +100 bilhões de transístores', era:'micro'},
 {y:'hoje →', v:2024, t:'5ª Geração — IA e Conectividade', d:'O critério muda de componente para capacidade: paralelismo massivo em GPUs, redes neurais, computação em nuvem e as primeiras máquinas quânticas. O computador deixa de apenas calcular e passa a inferir.', tags:['GPU','Redes neurais','Quântica'], era:'ai'}
]},
notes:[{h:'Por que o critério é o componente?', p:'Porque cada troca de componente básico muda tudo o que está acima dela. Passar da válvula para o transístor não deixou o computador só menor — permitiu que ele fosse confiável o suficiente para rodar dias seguidos, o que por sua vez viabilizou sistemas operacionais e linguagens de alto nível.'}],
quiz:{q:'O que define a passagem da 1ª para a 2ª geração de computadores?', o:['A invenção do teclado','A substituição da válvula pelo transístor','A criação da internet','O aparecimento do mouse'], a:1, fb:'O critério das gerações é sempre o componente eletrônico de chaveamento. Válvula → transístor → circuito integrado → microprocessador.'}
},

{
id:'binario', t:'Cálculo Binário sem Decorar Nada', tag:'Prática',
lead:'O computador só entende dois estados: <strong>tem corrente (1)</strong> ou <strong>não tem (0)</strong>. Todo o resto — texto, foto, vídeo, este parágrafo — é apenas um jeito combinado de agrupar zeros e uns. Ligue e desligue os interruptores abaixo e veja o número decimal se formar.',
w:{k:'binary'},
notes:[
 {h:'A lógica das "casinhas"', p:'Da direita para a esquerda, cada posição vale o dobro da anterior: 1, 2, 4, 8, 16, 32, 64, 128. Basta somar o valor das casas que estão ligadas. Não existe fórmula para decorar — existe uma sequência que dobra.'},
 {h:'Dica de ouro', p:'Se o último bit (o da direita, valor 1) estiver ligado, o número é <strong>ímpar</strong>. Se estiver desligado, é <strong>par</strong>. Sempre. Isso vale para qualquer quantidade de bits.'}
],
quiz:{q:'Quanto vale o binário 1 0 1 0 0 0 0 0 em decimal?', o:['80','160','168','200'], a:1, fb:'As casas ligadas são a de 128 e a de 32. 128 + 32 = <strong>160</strong>. Repare que o bit da direita está desligado — então o número é par, como esperado.'}
},

{
id:'unidades', t:'Do Bit ao Yottabyte', tag:'Escala',
lead:'Um bit é a menor unidade possível: um único 0 ou 1. Daí para cima tudo cresce de <strong>1.024 em 1.024</strong>, porque o computador conta em potências de 2 e 2¹⁰ = 1.024 é o valor mais próximo de mil. Arraste para subir a escala e compare com objetos reais.',
w:{k:'scale', items:[
 {u:'1 bit', n:'BIT', b:'0 ou 1', ex:'Um único interruptor. <b>8 bits</b> formam 1 byte — e é isso que permite representar uma letra.', blocks:1},
 {u:'1 B', n:'BYTE', b:'8 bits', ex:'Exatamente <b>uma letra</b>. A palavra "informática" ocupa 11 bytes.', blocks:2},
 {u:'1 KB', n:'KILOBYTE', b:'1.024 bytes = 2¹⁰', ex:'Uma <b>página de texto puro</b>. O computador de bordo da Apollo 11 tinha cerca de 72 KB de memória total — e levou o homem à Lua.', blocks:4},
 {u:'1 MB', n:'MEGABYTE', b:'1.048.576 bytes = 2²⁰', ex:'Uma <b>foto de celular</b> em qualidade média. Um MP3 de 1 minuto. Disquetes de 3,5" guardavam 1,44 MB.', blocks:8},
 {u:'1 GB', n:'GIGABYTE', b:'1.073.741.824 bytes = 2³⁰', ex:'Um <b>filme comprimido</b> em qualidade razoável, ou cerca de 250 músicas. Pendrives comuns têm de 16 a 128 GB.', blocks:16},
 {u:'1 TB', n:'TERABYTE', b:'2⁴⁰ bytes', ex:'Um <b>HD ou SSD moderno</b>. Cabem aí umas 250 mil fotos ou 500 horas de vídeo em HD.', blocks:26},
 {u:'1 PB', n:'PETABYTE', b:'2⁵⁰ bytes', ex:'A escala dos <b>data centers</b>. O acervo completo do YouTube cresce vários petabytes por dia.', blocks:40},
 {u:'1 EB', n:'EXABYTE', b:'2⁶⁰ bytes', ex:'Todo o <b>tráfego mundial da internet</b> em poucas horas. Nenhum dispositivo pessoal chega perto.', blocks:56},
 {u:'1 ZB', n:'ZETTABYTE', b:'2⁷⁰ bytes', ex:'O <b>volume de dados criados no mundo inteiro</b> por ano — estimado em mais de 175 ZB atualmente.', blocks:76},
 {u:'1 YB', n:'YOTTABYTE', b:'2⁸⁰ bytes', ex:'<b>Teórico.</b> Nenhum sistema existente armazena um yottabyte. É a unidade que guardamos para o futuro.', blocks:100}
]},
notes:[{h:'Por que o Windows mostra "931 GB" num HD de 1 TB?', p:'Porque fabricante e sistema operacional usam bases diferentes. O fabricante vende 1 TB = 1.000.000.000.000 bytes (base 10, mais bonito na embalagem). O Windows divide por 1.024 três vezes e mostra 931 GiB. O disco não perdeu nada — só está sendo medido com outra régua.'}],
quiz:{q:'Por que a escala de armazenamento cresce de 1.024 em 1.024, e não de 1.000 em 1.000?', o:['Para o fabricante vender mais','Porque 2¹⁰ = 1.024 e o computador conta em potências de 2','Por causa dos 8 bits do byte','É uma convenção sem motivo técnico'], a:1, fb:'O sistema binário só trabalha com potências de 2. A potência mais próxima de mil é 2¹⁰ = 1.024, e ela virou o degrau padrão da escala.'}
}
]});
