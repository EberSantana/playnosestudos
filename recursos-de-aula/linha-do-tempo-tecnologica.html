lead:'Programar já foi considerado trabalho feminino — a parte "menor" do projeto, enquanto os homens montavam o hardware. Essa avaliação estava errada de todas as formas possíveis. Clique nos cartões para virá-los.',
w:{k:'people', cards:[
 {n:'Ada Lovelace', y:'1815–1852', r:'Primeira programadora da história', b:'Ao traduzir um artigo sobre a Máquina Analítica de Babbage, escreveu notas três vezes maiores que o texto original. Nelas está o primeiro algoritmo feito para ser executado por uma máquina — e a percepção, um século adiantada, de que aquilo poderia manipular símbolos, não apenas números.'},
 {n:'Grace Hopper', y:'1906–1992', r:'Inventora do compilador e do COBOL', b:'Contra-almirante da Marinha americana. Criou o primeiro compilador ao insistir que era possível programar em palavras em inglês, e não em números. Popularizou o termo "bug" ao registrar no diário uma mariposa presa num relé do Harvard Mark II.'},
 {n:'Hedy Lamarr', y:'1914–2000', r:'Co-inventora do salto de frequência', b:'Atriz de Hollywood e inventora. Patenteou em 1942 um sistema de comunicação por salto de frequência para torpedos, resistente a interferência. A técnica é a base do Wi-Fi, do Bluetooth e do GPS — e ela nunca recebeu um centavo por isso.'},
 {n:'Margaret Hamilton', y:'1936–', r:'Engenheira-chefe do software da Apollo', b:'Liderou o software de bordo da Apollo. Cunhou a expressão "engenharia de software" numa época em que a área nem era levada a sério. Seu código de priorização de tarefas salvou o pouso da Apollo 11 quando o computador sobrecarregou a três minutos da superfície lunar.'},
 {n:'Katherine Johnson', y:'1918–2020', r:'Matemática das trajetórias orbitais', b:'Calculava trajetórias de voo espacial à mão na NASA. Quando os computadores eletrônicos chegaram, John Glenn se recusou a decolar antes que ela conferisse os números da máquina. "Se ela disser que estão bons, eu vou."'},
 {n:'Dorothy Vaughan', y:'1910–2008', r:'Primeira supervisora negra da NASA', b:'Percebeu que os computadores eletrônicos tornariam obsoleto o trabalho de sua equipe de calculistas — e, em vez de esperar, aprendeu FORTRAN sozinha e treinou todas as mulheres do seu setor. Salvou a carreira de dezenas de colegas.'},
 {n:'Radia Perlman', y:'1951–', r:'Criadora do Spanning Tree Protocol', b:'Chamada de "mãe da internet", título que ela rejeita. Criou o STP, algoritmo que impede loops infinitos em redes com switches. Sem ele, redes locais com caminhos redundantes entrariam em colapso — e praticamente toda rede corporativa tem redundância.'},
 {n:'Adele Goldberg', y:'1945–', r:'Criadora do Smalltalk na Xerox PARC', b:'Desenvolveu o Smalltalk e os conceitos de programação orientada a objetos e interface gráfica com janelas sobrepostas. Foi ela quem apresentou o sistema a Steve Jobs na visita ao PARC — a visita que geraria o Macintosh.'},
 {n:'Carol Shaw', y:'1955–', r:'Primeira designer de jogos profissional', b:'Programadora da Atari e da Activision. Criou <em>River Raid</em> (1982), um dos maiores sucessos do Atari 2600, com um algoritmo de geração procedural que criava um rio infinito ocupando apenas alguns bytes de memória.'},
 {n:'Fei-Fei Li', y:'1976–', r:'Criadora do ImageNet', b:'Percebeu que o problema da visão computacional não era o algoritmo, mas a falta de dados. Montou o ImageNet, com 14 milhões de imagens rotuladas. Foi essa base que permitiu ao AlexNet provar, em 2012, que Deep Learning funcionava.'},
 {n:'Timnit Gebru', y:'1983–', r:'Pesquisadora de ética em IA', b:'Coautora de estudos que expuseram viés racial e de gênero em sistemas de reconhecimento facial comerciais — que erravam muito mais com mulheres de pele escura. Sua saída conturbada do Google em 2020 tornou pública a tensão entre pesquisa crítica e interesse corporativo.'},
 {n:'As programadoras do ENIAC', y:'1945', r:'Kay McNulty, Betty Jennings e mais quatro', b:'Seis mulheres programaram o primeiro computador eletrônico de propósito geral, sem manual e sem linguagem de programação — apenas os diagramas do circuito. Foram apresentadas à imprensa como "modelos" e ficaram fora da história oficial por quase cinquenta anos.'}
]},
notes:[{h:'Por que elas sumiram da história', p:'Nos anos 1940 e 50, montar o hardware era visto como a engenharia de verdade; programar era considerado trabalho de escritório, quase secretarial — e por isso entregue a mulheres. Quando ficou claro que o software era a parte difícil e valiosa, o campo foi reclassificado como masculino. Nos EUA, a proporção de mulheres formadas em cursos de computação caiu de 37% em 1984 — o pico histórico — para cerca de 23% na medição mais recente. Vale a nuance para discutir em sala: em números absolutos a quantidade de mulheres formadas dobrou no período; o que encolheu foi a <em>participação relativa</em>, porque o número de homens cresceu muito mais rápido.'}],
quiz:{q:'Qual invenção de Hedy Lamarr é base do Wi-Fi e do Bluetooth?', o:['O compilador','O salto de frequência (frequency hopping)','O Spanning Tree Protocol','A programação orientada a objetos'], a:1, fb:'Lamarr patenteou em 1942 um sistema de comunicação que salta entre frequências para resistir a interferência e interceptação. É o princípio do espalhamento espectral usado hoje em Wi-Fi, Bluetooth e GPS.'}
},

{
id:'pioneiros', t:'Os Pioneiros da Computação', tag:'História',
lead:'Os nomes que definiram como uma máquina pensa, como o código é escrito e como as redes se conectam. Clique nos cartões para conhecer a contribuição de cada um.',
w:{k:'people', cards:[
 {n:'Charles Babbage', y:'1791–1871', r:'Pai da computação', b:'Projetou a Máquina Diferencial e a Máquina Analítica — um computador mecânico com processador, memória e entrada por cartões perfurados, cem anos antes da eletrônica. Nunca terminou de construí-la, mas os projetos estavam corretos: em 1991 o Museu de Ciências de Londres montou uma e ela funcionou.'},
 {n:'Alan Turing', y:'1912–1954', r:'Pai da ciência da computação', b:'Criou a máquina de Turing, o modelo matemático que define o que é computável. Liderou a quebra do código Enigma em Bletchley Park, encurtando a Segunda Guerra em anos. Foi perseguido pelo Estado britânico por ser homossexual e morreu aos 41 anos.'},
 {n:'John von Neumann', y:'1903–1957', r:'Arquitetura de von Neumann', b:'Formalizou o modelo de computador com programa armazenado na mesma memória dos dados. Praticamente todo computador que você já usou segue essa arquitetura — inclusive com o gargalo que leva o nome dele.'},
 {n:'Claude Shannon', y:'1916–2001', r:'Pai da teoria da informação', b:'Provou, com 21 anos, que circuitos elétricos podem executar álgebra booleana — a ponte entre lógica e eletrônica. Depois criou a teoria da informação e definiu o <em>bit</em> como unidade fundamental. Sem ele não haveria compressão, criptografia nem comunicação digital.'},
 {n:'Dennis Ritchie', y:'1941–2011', r:'Criador do C e coautor do Unix', b:'Criou a linguagem C e, com Ken Thompson, o Unix. C é a base de Windows, Linux, macOS, Android e da maioria das linguagens modernas. Morreu uma semana depois de Steve Jobs e quase ninguém noticiou — embora seu trabalho esteja dentro de todo iPhone.'},
 {n:'Ken Thompson', y:'1943–', r:'Coautor do Unix', b:'Escreveu a primeira versão do Unix em 1969, criou a linguagem B (antecessora do C) e décadas depois cocriou a linguagem Go no Google. Sua filosofia — programas pequenos que fazem uma coisa bem e se conectam — organiza o Linux até hoje.'},
 {n:'Tim Berners-Lee', y:'1955–', r:'Criador da World Wide Web', b:'No CERN, juntou HTML, HTTP e URL para criar a web. A decisão mais importante que tomou foi liberar tudo sem patente e sem royalties. Se tivesse cobrado licença, a web como conhecemos não existiria.'},
 {n:'Vint Cerf', y:'1943–', r:'Coautor do TCP/IP', b:'Com Bob Kahn, projetou o conjunto de protocolos TCP/IP — as regras que permitem redes completamente diferentes conversarem entre si. É a fundação técnica sobre a qual a internet inteira roda.'},
 {n:'Linus Torvalds', y:'1969–', r:'Criador do Linux e do Git', b:'Escreveu o kernel Linux aos 21 anos, por hobby. Em 2005, precisando de um sistema de controle de versão para gerenciar o próprio kernel, criou o Git em duas semanas. Duas ferramentas que sustentam praticamente todo o desenvolvimento de software do mundo.'},
 {n:'Steve Jobs', y:'1955–2011', r:'Cofundador da Apple', b:'Não era engenheiro: era o editor. Sua contribuição foi insistir que tecnologia precisa ser desejável e simples de usar. Apple II, Macintosh, iPod, iPhone e iPad reformularam quatro indústrias distintas.'},
 {n:'Steve Wozniak', y:'1950–', r:'Engenheiro do Apple I e II', b:'Projetou sozinho o Apple I e o Apple II, com uma economia de componentes que virou lenda entre engenheiros. Foi ele quem construiu o computador que tornou a Apple possível.'},
 {n:'Bill Gates', y:'1955–', r:'Cofundador da Microsoft', b:'Entendeu antes de todo mundo que o valor migraria do hardware para o software. O licenciamento do MS-DOS para a IBM — mantendo o direito de vender a outros fabricantes — foi provavelmente a negociação mais lucrativa da história da tecnologia.'}
]},
notes:[{h:'A decisão que valia bilhões', p:'Em 1980 a IBM precisava de um sistema para seu PC. Gates comprou um sistema pronto por US$ 50 mil, adaptou e licenciou à IBM — mas exigiu manter o direito de vender para outros fabricantes. A IBM aceitou, achando que o dinheiro estava no hardware. Quando surgiram os clones de PC, todos precisaram do MS-DOS. A Microsoft ganhou o mercado sem fabricar um único computador.'}],
quiz:{q:'Qual foi a decisão de Tim Berners-Lee que tornou possível a web como a conhecemos?', o:['Ter criado o primeiro navegador','Ter liberado HTML, HTTP e URL sem patentes nem royalties','Ter trabalhado no CERN','Ter inventado o hipertexto'], a:1, fb:'O hipertexto já existia como conceito. O que Berners-Lee fez de decisivo foi liberar as especificações livremente — permitindo que qualquer pessoa, em qualquer lugar, criasse servidores e navegadores sem pedir licença a ninguém.'}
},

{
id:'bigtechs', t:'As Big Techs em 2026', tag:'Mercado',
lead:'Seis empresas concentram boa parte da infraestrutura digital do planeta. Entender o modelo de negócio de cada uma explica muito das decisões de produto que afetam você. Clique para explorar. <em style="font-size:15px;color:var(--ink-faint)">Dados de agosto de 2026 — confira os nomes antes de usar em prova.</em>',
w:{k:'bigtech', items:[
 {n:'Alphabet / Google', ceo:'Sundar Pichai', dom:'Internet e conhecimento',
  d:'O modelo é publicidade: quase 80% da receita vem de anúncios. Todo produto gratuito do Google — Busca, YouTube, Maps, Gmail, Android — existe para coletar sinais de intenção e vender atenção qualificada. Entender isso explica por que privacidade e modelo de negócio vivem em tensão ali.',
  prods:['Busca','YouTube','Android','Gemini','Chrome','Google Cloud','Waymo']},
 {n:'Microsoft', ceo:'Satya Nadella', dom:'Produtividade e nuvem',
  d:'Migrou de vender licenças de software em caixa para assinaturas corporativas e nuvem. O Azure e o Microsoft 365 são hoje o motor da empresa. A parceria com a OpenAI colocou o Copilot dentro do Windows, do Office e do GitHub — a mesma jogada do IE nos anos 90, agora com IA.',
  prods:['Windows','Azure','Microsoft 365','Copilot','GitHub','Xbox','LinkedIn']},
 {n:'Apple', ceo:'John Ternus (desde set/2026)', dom:'Dispositivos e experiência',
  d:'Vende hardware com margens altas e prende o usuário num ecossistema integrado. Fez da privacidade um argumento de venda — processamento de IA no próprio aparelho em vez da nuvem — o que é coerente com seu modelo: ela ganha vendendo aparelhos, não anúncios. <br><br><b>Mudança recente:</b> a Apple anunciou em abril de 2026 que Tim Cook, CEO desde 2011, passaria a Presidente Executivo (Executive Chairman), com <b>John Ternus</b> — até então chefe de engenharia de hardware — assumindo como CEO em <b>1º de setembro de 2026</b>.',
  prods:['iPhone','Mac','iPad','Apple Silicon','Vision Pro','App Store','iCloud']},
 {n:'Amazon', ceo:'Andy Jassy', dom:'Logística e nuvem',
  d:'O varejo é a face visível, mas a maior parte do lucro operacional vem da AWS. A Amazon vende a infraestrutura sobre a qual boa parte da internet roda — inclusive serviços de concorrentes diretos dela.',
  prods:['Amazon.com','AWS','Alexa','Prime Video','Kindle','Kuiper']},
 {n:'Meta', ceo:'Mark Zuckerberg', dom:'Redes sociais e metaverso',
  d:'Publicidade sobre dados comportamentais de bilhões de pessoas. Fez uma aposta contrária à do resto do mercado ao liberar os modelos Llama como código aberto — estratégia para impedir que concorrentes dominem a camada de IA em que a Meta chegou atrasada.',
  prods:['Facebook','Instagram','WhatsApp','Llama','Quest','Threads']},
 {n:'NVIDIA', ceo:'Jensen Huang', dom:'A espinha dorsal da IA',
  d:'Passou trinta anos fazendo placas para jogos e descobriu que sua arquitetura paralela era exatamente o que redes neurais precisavam. Hoje vende as GPUs que todas as outras big techs compram para treinar seus modelos — e o CUDA, sua plataforma de software, é a trava que dificulta a migração para concorrentes.',
  prods:['GPUs de IA','GeForce','CUDA','DGX','Omniverse']}
]},
notes:[{h:'A pergunta que revela tudo', p:'Ao analisar qualquer empresa de tecnologia, pergunte: <strong>de onde vem o dinheiro?</strong> Se o produto é gratuito, a receita vem de anúncios — e o incentivo é maximizar seu tempo de tela e a coleta de dados. Se vem de assinatura ou hardware, o incentivo é você continuar satisfeito e renovar. Não é questão de empresa boa ou má: é entender a que interesse o produto responde.'}],
quiz:{q:'De onde vem a maior parte do lucro operacional da Amazon?', o:['Da venda de produtos no site','Da AWS, sua divisão de computação em nuvem','Do Prime Video','Do Kindle'], a:1, fb:'A AWS responde pela maior parte do lucro operacional, mesmo representando uma fração menor da receita. O varejo opera com margens muito baixas; a nuvem, com margens altas.'}
},

{
id:'videogames', t:'A História dos Videogames', tag:'Cultura',
lead:'Os consoles são medidos em <strong>gerações</strong>, e cada uma trouxe um salto técnico específico. É também a indústria que financiou boa parte da evolução das placas de vídeo que você viu no Módulo 3.',
w:{k:'timeline', items:[
 {y:'1958', v:1958, t:'Tennis for Two', d:'William Higinbotham cria um jogo de tênis num osciloscópio para entreter visitantes de um laboratório nuclear. Não foi comercializado — mas é o primeiro videogame de que se tem registro.', tags:['Osciloscópio','Pioneiro'], era:'trans'},
 {y:'1962', v:1962, t:'Spacewar!', d:'Estudantes do MIT criam uma batalha espacial no PDP-1 e distribuem o código livremente. É o primeiro jogo a se espalhar entre computadores — e um dos primeiros exemplos de software livre.', tags:['MIT','PDP-1','Código aberto'], era:'trans'},
 {y:'1972', v:1972, t:'1ª geração — Magnavox Odyssey e PONG', d:'O primeiro console doméstico chega ao mercado, com overlays de plástico colados na TV para simular cores. O PONG da Atari transforma videogame em fenômeno de bar.', tags:['Odyssey','Atari','PONG'], era:'ic'},
 {y:'1977', v:1978, t:'2ª geração — Atari 2600', d:'Cartuchos intercambiáveis: o console deixa de ter jogos fixos e vira uma plataforma. Nasce a indústria de desenvolvedores independentes de jogos.', tags:['Cartucho','Plataforma'], era:'micro'},
 {y:'1983', v:1983, t:'O Crash de 1983', d:'Excesso de consoles, jogos de péssima qualidade e nenhum controle editorial derrubam o mercado americano em 97%. Milhares de cartuchos do E.T. da Atari foram literalmente enterrados no deserto do Novo México.', tags:['Colapso','-97%'], stat:'O mercado americano encolhe 97% em dois anos', era:'micro'},
 {y:'1985', v:1986, t:'3ª geração — NES salva a indústria', d:'A Nintendo reergue o mercado com um chip de autorização que impedia jogos não licenciados. Controle de qualidade forçado, mais Super Mario Bros. e Zelda. O SEGA Master System disputa o Brasil com força.', tags:['NES','Nintendo','Selo de qualidade'], era:'micro'},
 {y:'1990', v:1991, t:'4ª geração — 16 bits', d:'Super Nintendo contra Mega Drive: a guerra de console mais famosa da história, com Mario de um lado e Sonic do outro. O Game Boy inaugura o portátil de massa.', tags:['SNES','Mega Drive','Game Boy'], era:'micro'},
 {y:'1994', v:1996, t:'5ª geração — o 3D e o CD', d:'PlayStation, Nintendo 64 e Saturn trazem gráficos poligonais. Super Mario 64 define como se controla uma câmera em 3D — solução que praticamente todo jogo copia até hoje.', tags:['3D','CD-ROM','Mario 64'], era:'micro'},
 {y:'2000', v:2002, t:'6ª geração — PS2, Xbox e GameCube', d:'O PlayStation 2 vira o console mais vendido de todos os tempos (mais de 160 milhões confirmados pela Sony), em parte por ser um leitor de DVD barato para quem não tinha um. A Microsoft entra no mercado com o Xbox e o Xbox Live inaugura o online em consoles.', tags:['PS2','Xbox Live','DVD'], stat:'PS2: 160+ milhões — recorde ameaçado pelo Switch (156,6 mi em 2026)', era:'micro'},
 {y:'2005', v:2008, t:'7ª geração — HD e movimento', d:'Xbox 360 e PS3 levam o jogo para alta definição. O Nintendo Wii ignora a corrida gráfica e aposta em controle por movimento — e vende mais que os dois.', tags:['HD','Wii','Online'], era:'micro'},
 {y:'2013', v:2018, t:'8ª e 9ª gerações', d:'PS4, Xbox One, PS5 e Xbox Series X. O Nintendo Switch une console e portátil numa peça só. Modelos de assinatura (Game Pass) e jogos em nuvem mudam a lógica de propriedade dos jogos.', tags:['Switch','Game Pass','Nuvem'], era:'ai'}
]},
notes:[{h:'O que os jogos deram à computação', p:'A demanda por gráficos em tempo real financiou o desenvolvimento das GPUs. Essas mesmas GPUs, com sua arquitetura massivamente paralela, viraram o hardware que treina modelos de inteligência artificial. Sem trinta anos de gamers comprando placas de vídeo caras, provavelmente não haveria ChatGPT.'}],
quiz:{q:'O que causou o Crash dos videogames de 1983?', o:['A chegada dos computadores pessoais','Excesso de consoles e jogos sem nenhum controle de qualidade','A crise do petróleo','A falência da Nintendo'], a:1, fb:'Qualquer um podia lançar jogo para Atari 2600, e o mercado foi inundado de títulos ruins. Os consumidores perderam a confiança e as vendas caíram 97%. A Nintendo resolveu isso com um chip que só permitia rodar jogos licenciados.'}
},

{
id:'jogos-pedagogicos', t:'Jogos com Valor Pedagógico', tag:'Educação',
lead:'Nem todo jogo bom é jogo educativo — e nem todo jogo educativo é bom. O critério útil é: <strong>qual competência a mecânica realmente exercita?</strong> Clique em cada título para ver a análise.',
w:{k:'skillmap', items:[
 {n:'Human Resource Machine', cat:'Lógica e programação', s:['Algoritmos','Loops','Depuração','Otimização'],
  d:'Você programa um funcionário de escritório com um conjunto minúsculo de instruções — essencialmente Assembly com fantasia. Ensina, sem citar o nome, o que são registradores, saltos condicionais e laços.'},
 {n:'7 Billion Humans', cat:'Lógica e programação', s:['Paralelismo','Concorrência','Sincronização'],
  d:'A continuação, agora com dezenas de trabalhadores executando o mesmo programa ao mesmo tempo. Introduz de forma natural os problemas de programação paralela: condição de corrida, sincronização, deadlock.'},
 {n:'Baba Is You', cat:'Lógica e programação', s:['Lógica formal','Abstração','Regras'],
  d:'As regras do jogo são objetos dentro do jogo, e você as reescreve empurrando palavras. É um exercício puro de lógica formal e pensamento abstrato — provavelmente o quebra-cabeça mais inteligente da última década.'},
 {n:'Screeps: World', cat:'Lógica e programação', s:['JavaScript','Sistemas distribuídos','Automação'],
  d:'Um MMO em que você não controla nada diretamente: escreve JavaScript real que roda no servidor 24 horas por dia comandando suas unidades. Programação de verdade com consequências persistentes.'},
 {n:'SpaceChem', cat:'STEM', s:['Otimização','Pensamento sistêmico','Química'],
  d:'Monte fábricas moleculares programando manipuladores em ciclos. Combina noções de química com o desafio de otimizar um processo — o mesmo raciocínio de projetar um pipeline de dados.'},
 {n:'Kerbal Space Program', cat:'Ciências e física', s:['Física orbital','Engenharia','Tentativa e erro'],
  d:'Física orbital simulada com rigor. Ensina, na marra, conceitos como delta-v, janelas de transferência e o fato contraintuitivo de que acelerar numa órbita te leva para mais longe, não para frente. A NASA já elogiou publicamente.'},
 {n:'Poly Bridge 1 & 2', cat:'Ciências e física', s:['Estruturas','Orçamento','Iteração'],
  d:'Construir pontes que aguentem carga dentro de um orçamento. Tensão, compressão e o valor de testar antes de entregar — engenharia civil em forma de quebra-cabeça.'},
 {n:'Cities: Skylines', cat:'Gestão e sistemas', s:['Planejamento urbano','Sistemas complexos','Trade-offs'],
  d:'Gerir uma cidade expõe interdependências: mais estradas geram mais trânsito, zoneamento afeta poluição, impostos afetam migração. É a melhor introdução acessível a pensamento sistêmico que existe em jogo.'},
 {n:'Plague Inc: Evolved', cat:'Gestão e sistemas', s:['Epidemiologia','Crescimento exponencial','Estratégia'],
  d:'Simula propagação de doenças com modelo epidemiológico razoável. Foi usado por órgãos de saúde pública como ferramenta de comunicação sobre crescimento exponencial e medidas de contenção.'},
 {n:'Civilization VI', cat:'História e geopolítica', s:['História','Economia','Diplomacia','Longo prazo'],
  d:'O modo Discovery Tour remove o jogo e deixa só o conteúdo histórico curado por especialistas, navegável. O jogo principal ensina planejamento de longo prazo e o custo de oportunidade de cada decisão.'},
 {n:'Dorfromantik', cat:'Raciocínio espacial', s:['Raciocínio espacial','Planejamento','Calma'],
  d:'Encaixar peças hexagonais de paisagem maximizando conexões. Exercita rotação mental e planejamento antecipado num ritmo sem pressão — bom para introduzir raciocínio espacial sem gerar ansiedade.'},
 {n:'RISK: Global Domination', cat:'Estratégia', s:['Probabilidade','Visão sistêmica','Negociação'],
  d:'Avaliar risco com dados, negociar alianças temporárias e pensar vários turnos à frente. Bom veículo para discutir probabilidade aplicada e teoria dos jogos.'},
 {n:'Hollow Knight / Silksong', cat:'Competências individuais', s:['Resiliência','Padrões','Coordenação'],
  d:'<strong>Atenção ao classificar:</strong> é um jogo excelente, mas não desenvolve lógica estruturada nem trabalho em equipe — é single-player e baseado em precisão e memorização de padrões. O que ele treina de verdade é resiliência: lidar com frustração e persistir depois de falhar muitas vezes. Também é competência, só que outra.'}
]},
notes:[{h:'Como avaliar um jogo antes de levar para a aula', p:'Pergunte três coisas. <strong>1)</strong> A competência está na <em>mecânica</em> ou só no tema? Um jogo com cenário histórico não ensina história se a mecânica for tiro. <strong>2)</strong> O erro ensina alguma coisa ou só pune? <strong>3)</strong> O aluno consegue explicar o que fez? Se não consegue verbalizar a estratégia, provavelmente não houve aprendizagem transferível.'}],
quiz:{q:'Por que Hollow Knight, apesar de excelente, não entra na categoria de lógica e trabalho em equipe?', o:['Porque é muito difícil','Porque a mecânica central é precisão e memorização de padrões, e é single-player','Porque não tem conteúdo educativo','Porque é pago'], a:1, fb:'A competência tem que estar na mecânica. Hollow Knight exerce reflexo, observação de padrões e resiliência — competências reais, mas diferentes de raciocínio lógico estruturado e colaboração.'}
}
]});

 x:['O ruído incomodava, mas é sintoma do problema térmico, não a causa da mudança de estratégia.',

    'Frequência de clock não é patenteável dessa forma. A AMD competia com outra abordagem, não com um monopólio legal.',
    'Sistemas operacionais não impõem teto de frequência. O limite era do silício.']},

{q:'Qual empresa criou a arquitetura de 64 bits (x86-64) usada nos PCs até hoje?',
 o:['Intel','AMD','IBM','ARM'], a:1,
 w:'A AMD lançou o AMD64 em 2003, estendendo o x86 para 64 bits sem quebrar compatibilidade com o software de 32 bits existente. A aposta da Intel, o Itanium, era incompatível com o passado e fracassou — a Intel acabou licenciando a arquitetura da concorrente.',
 x:['A Intel criou o x86 original, mas sua tentativa de 64 bits (Itanium) não vingou justamente por abandonar a compatibilidade.',
    null,
    'A IBM tem arquiteturas próprias de 64 bits, como o POWER, mas não é a usada nos PCs.',
    'A ARM tem sua própria arquitetura de 64 bits (AArch64), usada em celulares e Apple Silicon, não em PCs x86.']},

{q:'Você instala 16 GB de RAM em um computador com Windows de 32 bits. Quanto o sistema conseguirá usar?',
 o:['16 GB normalmente','Cerca de 4 GB — o restante fica inacessível','8 GB, exatamente metade','Nada, o sistema não inicializa'], a:1,
 w:'Com 32 bits formam-se 2³² endereços, o que equivale exatamente a 4 GB. O processador não tem número disponível para chamar o byte seguinte. Na prática o Windows mostra ainda menos, cerca de 3,2 GB, porque parte dessa faixa é reservada para placa de vídeo e outros dispositivos.',
 x:['A limitação é de endereçamento, não de hardware instalado. A memória existe fisicamente e permanece invisível.',
    null,
    'Não há divisão pela metade; o teto é fixo em 4 GB, independentemente de quanto foi instalado.',
    'O sistema inicializa normalmente — apenas ignora o que passa do limite.']},

{q:'Por que existe a pasta "Arquivos de Programas (x86)" em um Windows de 64 bits?',
 o:['Para guardar programas antigos que serão desinstalados','Para separar programas de 32 bits, que usam bibliotecas incompatíveis','Porque a Microsoft nunca removeu uma pasta legada','Para armazenar drivers de dispositivos'], a:1,
 w:'Um Windows de 64 bits roda programas de 32 bits normalmente, mas eles carregam DLLs de 32 bits, incompatíveis com as de 64. Separar em duas pastas evita que o sistema misture as versões, mantendo a retrocompatibilidade sem conflito.',
 x:['Não há nada de temporário ali: são programas em uso normal, apenas compilados para 32 bits.',
    null,
    'Não é descuido — é uma decisão deliberada de arquitetura, com o mesmo raciocínio aplicado às pastas de sistema.',
    'Drivers ficam em System32 e DriverStore, não em Arquivos de Programas.']},

{q:'Por que a arquitetura RISC domina celulares, tablets e o Apple Silicon?',
 o:['Porque é mais barata de licenciar','Porque instruções simples e uniformes consomem muito menos energia','Porque executa mais programas que a CISC','Porque foi inventada depois da CISC'], a:1,
 w:'Em dispositivo a bateria, eficiência energética é o critério que decide. Hardware simples significa menos transístores chaveando por instrução. O Apple Silicon provou que dá para ter isso sem abrir mão de desempenho de alto nível.',
 x:['O licenciamento ARM tem custo real e não é o fator determinante — a eficiência é.',
    null,
    'É o contrário: o parque de software x86 (CISC) é muito maior. O RISC vence por eficiência, não por compatibilidade.',
    'A ordem cronológica não confere vantagem por si. Aliás, ambas as filosofias amadureceram em paralelo nos anos 1980.']},

{q:'Um processador Intel moderno recebe uma instrução CISC complexa. O que ele faz internamente?',
 o:['Executa a instrução inteira em um único ciclo','Quebra a instrução em micro-operações que funcionam como RISC','Converte a instrução em código ARM','Rejeita a instrução e pede uma versão simplificada'], a:1,
 w:'A fronteira entre CISC e RISC ficou borrada. Por fora o chip fala CISC, aceitando instruções complexas e mantendo compatibilidade com décadas de software. Por dentro, um decodificador as quebra em micro-operações simples e uniformes — exatamente a filosofia RISC.',
 x:['Instruções complexas levam vários ciclos justamente por realizarem múltiplas tarefas.',
    null,
    'Não há conversão para ARM: são conjuntos de instruções incompatíveis entre si.',
    'O processador não rejeita instruções válidas do seu próprio conjunto.']},

{q:'O que é o "gargalo de Von Neumann"?',
 o:['O superaquecimento da CPU em cargas altas','A disputa entre instruções e dados pelo mesmo barramento até a memória','A falta de espaço em disco durante a execução','O limite de 4 GB de memória endereçável'], a:1,
 w:'Na arquitetura de Von Neumann, instruções e dados compartilham a mesma via até a memória. Enquanto um trafega, o outro espera, e a CPU frequentemente fica ociosa. A memória cache existe em grande parte para amenizar esse problema.',
 x:['Calor é um problema real de engenharia, mas não tem relação com a organização dos barramentos.',
    null,
    'Espaço em disco é questão de armazenamento, não de arquitetura de barramento.',
    'Esse é o limite do endereçamento de 32 bits, assunto diferente.']},

{q:'Um Arduino usa arquitetura Harvard. Qual é a vantagem disso para um microcontrolador?',
 o:['Permite trocar o programa com facilidade','Instruções e dados são buscados simultaneamente, o que dá previsibilidade de tempo','Reduz o custo de fabricação do chip','Aumenta a quantidade de memória disponível'], a:1,
 w:'Com memórias e barramentos separados, a CPU busca instrução e dado ao mesmo tempo, sem gargalo. Isso garante tempo de execução previsível — requisito central em sistemas de tempo real, que precisam responder a um sensor dentro de um prazo garantido.',
 x:['É justamente o oposto: a separação torna o programa menos flexível de trocar, já que não fica na mesma memória dos dados.',
    null,
    'Duas memórias e dois barramentos tendem a encarecer o projeto, não baratear.',
    'A arquitetura organiza o acesso; não amplia a capacidade total de memória.']},

{q:'Por que as GPUs se tornaram o hardware preferido para treinar redes neurais?',
 o:['Porque têm mais memória que as CPUs','Porque a arquitetura SIMD aplica o mesmo cálculo a milhares de dados em paralelo','Porque foram projetadas originalmente para inteligência artificial','Porque operam em frequências de clock mais altas'], a:1,
 w:'Sombrear um milhão de pixels e multiplicar as matrizes de uma rede neural são, matematicamente, o mesmo tipo de problema: a mesma operação repetida sobre volumes enormes de dados. A GPU foi construída para isso — a IA apenas descobriu que podia usar a mesma ferramenta.',
 x:['A quantidade de memória ajuda, mas uma CPU pode ter até mais RAM disponível. O diferencial é a forma de processar.',
    null,
    'Foram projetadas para gráficos em tempo real, décadas antes do boom da IA. O uso em IA foi uma reaplicação.',
    'GPUs costumam operar em frequência mais baixa que CPUs. A força está na quantidade de núcleos, não na velocidade de cada um.']},

{q:'Entre 2011 e 2016 a Intel aumentou o desempenho cerca de 5% ao ano e manteve 4 núcleos como padrão por sete anos. O que mudou esse cenário?',
 o:['Uma nova regulamentação antitruste','O lançamento do AMD Ryzen, com a arquitetura Zen, em 2017','O fim da Lei de Moore','A migração dos consumidores para celulares'], a:1,
 w:'A arquitetura Zen recuperou 52% de IPC de uma vez e devolveu concorrência real ao mercado. Em dois anos o padrão do desktop pulou para 6 e 8 núcleos com preços menores. Monopólio não é problema abstrato: aparece no que você consegue comprar.',
 x:['Não houve ação antitruste determinante nesse período específico.',
    null,
    'A Lei de Moore desacelerou, mas isso é limitação física — não explica a retomada acelerada a partir de 2017.',
    'O mercado móvel cresceu, mas quem forçou a Intel a acelerar no desktop foi um concorrente direto no desktop.']}
];

ATIV.mem = [
{q:'Por que a memória DRAM recebe o nome de "dinâmica"?',
 o:['Porque muda de frequência conforme a carga de trabalho','Porque os capacitores perdem carga e precisam ser constantemente recarregados','Porque pode ser trocada com o computador ligado','Porque seu tamanho varia conforme a necessidade'], a:1,
 w:'Cada bit é uma carga elétrica em um capacitor microscópico, que vaza em milissegundos. O circuito de refresh reescreve todas as células milhares de vezes por segundo. Sem esse trabalho contínuo, os dados evaporariam — daí o "dinâmica".',
 x:['A frequência é ajustada pelo controlador de memória, mas não é isso que dá nome à tecnologia.',
    null,
    'Troca a quente não existe em memória de desktop. Em servidores há recursos especiais, mas nada a ver com o nome.',
    'A capacidade do pente é fixa, definida na fabricação.']},

{q:'Por que a SRAM é usada como cache do processador e não como memória principal?',
 o:['Porque não perde dados ao desligar','Porque é rapidíssima, mas caríssima — inviável em gigabytes','Porque só a Intel sabe fabricá-la','Porque dispensa energia para funcionar'], a:1,
 w:'Uma célula SRAM usa 6 transístores; uma DRAM usa 1 transístor e 1 capacitor. Isso a torna muito mais rápida e várias vezes mais cara por bit. Dá para pagar por alguns megabytes de cache, mas não por dezesseis gigabytes de memória principal.',
 x:['SRAM também é volátil: perde tudo sem energia, como a DRAM.',
    null,
    'É fabricada por diversas empresas e vem embutida em processadores de todos os fabricantes.',
    'Precisa de energia constante para manter os transístores no estado correto.']},

{q:'Falta luz enquanto você digita um trabalho que ainda não salvou. Por que o texto se perde?',
 o:['O arquivo foi corrompido no disco','O texto estava apenas na RAM, que é volátil','A ROM foi apagada pela queda de energia','O sistema de arquivos travou no meio da gravação'], a:1,
 w:'Enquanto você digita, o texto vive na memória RAM. Salvar é justamente o ato de copiá-lo para o armazenamento não volátil. Sem energia, a RAM esquece tudo em milissegundos, porque cada bit é uma carga elétrica que precisa ser mantida ativamente.',
 x:['Não houve corrupção: o arquivo sequer chegou a existir no disco.',
    null,
    'A ROM é não volátil por natureza e preserva seu conteúdo indefinidamente.',
    'Não havia gravação em andamento — é exatamente esse o ponto.']},

{q:'Quando alguém fala em "ROM de 256 GB" no celular, por que o termo está tecnicamente errado?',
 o:['Porque celulares não têm ROM','Porque aquilo é armazenamento interno em memória flash regravável, não ROM','Porque ROM só existe em computadores de mesa','Porque a capacidade real seria menor'], a:1,
 w:'A ROM verdadeira do aparelho é minúscula e guarda apenas o bootloader. Os 256 GB anunciados são memória flash NAND, regravável milhares de vezes — o oposto conceitual de "somente leitura". O termo pegou por hábito de mercado, mas confunde os dois conceitos.',
 x:['Celulares têm ROM sim: é ela que permite o aparelho iniciar.',
    null,
    'ROM existe em praticamente todo dispositivo eletrônico programável, inclusive celulares.',
    'A capacidade anunciada corresponde à real, descontada a diferença entre bases de contagem.']},

{q:'Coloque em ordem, do mais rápido para o mais lento: RAM, registradores, SSD, cache L1.',
 o:['RAM, cache L1, registradores, SSD','Registradores, cache L1, RAM, SSD','Cache L1, registradores, RAM, SSD','Registradores, RAM, cache L1, SSD'], a:1,
 w:'Registradores respondem em cerca de 1 ciclo, o cache L1 em poucos ciclos, a RAM em torno de 200 ciclos e o SSD em milhares. Essa é exatamente a ordem da pirâmide da hierarquia de memória, e ela também é a ordem decrescente de custo por bit.',
 x:['A RAM não é mais rápida que o cache nem que os registradores; é justamente o contrário.',
    null,
    'O cache L1 é rápido, mas os registradores ficam dentro da própria unidade de execução — não há nada mais próximo da CPU.',
    'A RAM é bem mais lenta que o cache L1. Essa ordem inverte dois níveis vizinhos.']},

{q:'Por que não se fabricam computadores usando apenas registradores, que são o tipo mais rápido de memória?',
 o:['Porque perderiam os dados ao desligar','Porque o custo e a área ocupada no chip seriam proibitivos','Porque a CPU não conseguiria endereçá-los','Porque não funcionariam com sistemas operacionais atuais'], a:1,
 w:'Registradores são caríssimos por bit e ocupam área nobre dentro do processador. Uma máquina com gigabytes de registradores teria custo impraticável. A hierarquia existe para dar a ilusão de memória grande e rápida a um custo viável.',
 x:['Todos os níveis rápidos são voláteis, inclusive o cache e a RAM. Isso não distingue os registradores.',
    null,
    'O endereçamento é limitado por projeto, mas a barreira real é econômica e física, não de endereçamento.',
    'Sistemas operacionais se adaptariam. O impedimento é o custo de silício.']},

{q:'Por que uma cache pequena consegue atender a maioria dos acessos de um programa?',
 o:['Porque a cache comprime os dados','Por causa do princípio da localidade: programas reacessam os mesmos dados e seus vizinhos','Porque o compilador prevê todo o fluxo de execução','Porque a cache guarda o programa inteiro'], a:1,
 w:'Localidade temporal significa reacessar o mesmo dado em pouco tempo; localidade espacial significa acessar dados vizinhos. Laços e vetores exibem os dois comportamentos. Por isso mais de 95% das leituras em processadores modernos são atendidas pelo cache, sem tocar na RAM.',
 x:['Não há compressão em cache. O ganho vem do padrão de acesso dos programas.',
    null,
    'O compilador otimiza, mas não consegue prever fluxos que dependem de dados de entrada em tempo de execução.',
    'A cache tem megabytes e os programas têm gigabytes. Guardar tudo é impossível — daí a importância da localidade.']},

{q:'Qual foi a primeira memória de acesso aleatório verdadeiramente prática e não volátil, usada por cerca de quinze anos?',
 o:['O tubo de Williams','A linha de retardo de mercúrio','A memória de núcleo magnético','A DRAM da Intel'], a:2,
 w:'Anéis de ferrite atravessados por fios, magnetizados em um sentido ou no outro, tecidos à mão por operárias. Confiável e não volátil, dominou dos anos 1950 até a chegada da DRAM. A expressão "core dump" vem justamente dessa tecnologia.',
 x:['O tubo de Williams era volátil, precisava de reescrita constante e era sensível até a vibração.',
    'A linha de retardo de mercúrio não permitia acesso aleatório: era preciso esperar o pulso "dar a volta".',
    null,
    'A DRAM é volátil e foi ela que aposentou o núcleo magnético, a partir de 1970.']},

{q:'Qual característica torna a memória HBM adequada para treinar modelos de inteligência artificial?',
 o:['Ser não volátil','Ser empilhada verticalmente junto à GPU, oferecendo largura de banda enorme','Custar menos que a DDR5','Dispensar refresh'], a:1,
 w:'Treinar redes neurais exige mover volumes enormes de dados de uma vez. A HBM empilha camadas de memória coladas ao processador gráfico, entregando mais de 800 GB/s por pilha. O que ela otimiza é largura de banda, não latência.',
 x:['A HBM é volátil, como toda variante de DRAM.',
    null,
    'É consideravelmente mais cara que a DDR5, justamente pela complexidade do empilhamento.',
    'É uma DRAM e portanto precisa de refresh normalmente.']},

{q:'Um técnico quer melhorar o desempenho de um computador que trava ao abrir muitas abas do navegador. Qual upgrade ataca a causa mais provável?',
 o:['Trocar o processador por um de frequência maior','Aumentar a memória RAM','Instalar um cooler mais potente','Trocar a placa de vídeo'], a:1,
 w:'Cada aba ocupa memória. Quando a RAM se esgota, o sistema passa a usar o disco como memória virtual (swap), e o desempenho despenca — é exatamente a sensação de travamento. Mais RAM mantém tudo na camada rápida da hierarquia.',
 x:['Uma CPU mais rápida não resolve falta de espaço de trabalho: o gargalo não é cálculo.',
    null,
    'Refrigeração melhor evita redução de frequência por calor, mas não tem relação com abas abertas.',
    'A placa de vídeo acelera a renderização, e não altera a quantidade de memória disponível para os dados das abas.']}
];

/* ============================================================
   1) BALANCEAMENTO DO GABARITO
   ------------------------------------------------------------
   As 120 questões foram redigidas com a alternativa correta
   quase sempre na segunda posição. Sem correção, o aluno
   acertaria a maior parte marcando sempre a letra B.

   Aqui as alternativas são permutadas por um embaralhamento
   DETERMINÍSTICO, cuja semente vem do próprio texto do
   enunciado. Consequências:
     · a ordem é idêntica em qualquer máquina e em qualquer
       recarga — essencial para impressão e para o professor
       conferir o gabarito com a turma;
     · o vetor de justificativas (x) acompanha a permutação;
     · o índice da resposta correta (a) é recalculado.
   Nenhum texto das explicações cita letras, então a permutação
   é segura: as letras exibidas são geradas a partir do índice.
   ============================================================ */
(function balancearGabarito() {

  // hash FNV-1a: transforma o enunciado numa semente estável
  const seedOf = str => {
    let h = 2166136261;
    for (let i = 0; i < str.length; i++) {
      h ^= str.charCodeAt(i);
      h = Math.imul(h, 16777619);
    }
    return h >>> 0;
  };

  // mulberry32: gerador pseudoaleatório pequeno e reprodutível
  const rngOf = seed => () => {
    seed = (seed + 0x6D2B79F5) >>> 0;
    let t = seed;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };

  Object.values(ATIV).forEach(qs => qs.forEach(q => {
    const n = q.o.length;
    if (!Array.isArray(q.x) || q.x.length !== n) return;   // segurança

    const oldO = q.o.slice();
    const oldX = q.x.slice();
    const oldA = q.a;

    const rand = rngOf(seedOf(q.q));
    const idx = oldO.map((_, i) => i);
    for (let i = n - 1; i > 0; i--) {          // Fisher-Yates determinístico
      const j = Math.floor(rand() * (i + 1));
      const tmp = idx[i]; idx[i] = idx[j]; idx[j] = tmp;
    }

    q.o = idx.map(i => oldO[i]);
    q.x = idx.map(i => oldX[i]);
    q.a = idx.indexOf(oldA);
  }));
})();

  let pins = '';
  const n = Math.max(3, Math.floor(w / 12));

    const px = x + (w / (n + 1)) * (i + 1) - 2;

    pins += `<rect x="${px}" y="${y + h}" width="4" height="5" fill="${C.ink}"/>`;
  }
  return `<g>${pins}${bx(x, y, w, h, 3, fill || C.s2)}${label ? tx(x + w / 2, y + h / 2 + 3.5, label, 9, C.deep) : ''}</g>`;
};

  }
  return `<g>${teeth}<circle cx="${cx}" cy="${cy}" r="${r - 1}" fill="${C.s2}" stroke="${col || C.ink}" stroke-width="2.4"/><circle cx="${cx}" cy="${cy}" r="${r * 0.33}" fill="${C.s0}" stroke="${col || C.ink}" stroke-width="2"/></g>`;

  return `${chip(52, 34, 96, 72, '', C.s2)}${cores}${tx(100, 126, n + ' núcleos trabalhando em paralelo', 9, C.ink, 500)}`;
};

/* ---- índice plano de tópicos ---- */
const FLAT = [];
MODULES.forEach((m, mi) => m.topics.forEach(t => FLAT.push({ ...t, mod: m, modIdx: mi })));
const byId = id => FLAT.find(t => t.id === id);

const state = { current: FLAT[0].id, seen: new Set(), timers: [] };

function clearTimers() { state.timers.forEach(t => clearInterval(t) || clearTimeout(t)); state.timers = []; }
function later(fn, ms) { const t = setTimeout(fn, ms); state.timers.push(t); return t; }

/* ============================================================

   ============================================================ */
function buildNav() {
  const nav = $('#nav');
  nav.innerHTML = MODULES.map((m, i) => `
    <div class="mod" data-mod="${m.id}" data-open="${i === 0 ? 1 : 0}">
      <button class="mod-btn" data-toggle="${m.id}">
        <span class="mod-idx">${i + 1}</span>
        <span class="mod-name">${esc(m.name)}</span>
        <svg class="mod-chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
      </button>
      <div class="mod-list">
        ${m.topics.map(t => `
          <button class="tp-btn${t.activity ? ' is-act' : ''}" data-go="${t.id}">
            <span class="tp-dot"></span><span class="tp-label">${t.activity ? 'Atividade · 10 questões' : esc(t.t)}</span>
          </button>`).join('')}
      </div>
    </div>`).join('');

  nav.addEventListener('click', e => {
    const tg = e.target.closest('[data-toggle]');
    if (tg) {
      const mod = nav.querySelector(`.mod[data-mod="${tg.dataset.toggle}"]`);
      mod.dataset.open = mod.dataset.open === '1' ? '0' : '1';
      return;
    }
    const go = e.target.closest('[data-go]');
    if (go) { navigate(go.dataset.go); document.body.dataset.nav = ''; }
  });
}

function syncNav() {
  $$('.tp-btn').forEach(b => {
    const on = b.dataset.go === state.current;
    b.setAttribute('aria-current', on ? 'true' : 'false');
    b.dataset.done = state.seen.has(b.dataset.go) ? '1' : '0';
  });
  const t = byId(state.current);
  const mod = $(`.mod[data-mod="${t.mod.id}"]`);
  if (mod) mod.dataset.open = '1';
  const n = state.seen.size, tot = FLAT.length;
  $('#progVal').textContent = `${n} / ${tot}`;
  $('#progBar').style.width = (n / tot * 100).toFixed(1) + '%';
}

function navigate(id, skipHash) {
  if (!byId(id)) id = FLAT[0].id;
  state.current = id;
  state.seen.add(id);
  if (!skipHash) history.replaceState(null, '', '#' + id);
  render();
  syncNav();
  window.scrollTo({ top: 0, behavior: 'instant' });
  $('.canvas').scrollTop = 0;
}

/* ============================================================
   RENDER DO TÓPICO
   ============================================================ */
function render() {
  clearTimers();
  const t = byId(state.current);
  const idx = FLAT.findIndex(x => x.id === t.id);
  const prev = FLAT[idx - 1], next = FLAT[idx + 1];

  $('#crumb').innerHTML = `<span>${esc(t.mod.name)}</span><span class="crumb-sep">/</span><b>${esc(t.t)}</b>`;
  $('#prevBtn').disabled = !prev;
  $('#nextBtn').disabled = !next;

  const notes = (t.notes || []).map(n => `
    <div class="card">
      <div class="card-title" style="margin-bottom:9px"><h3 class="h-md">${n.h}</h3></div>
      <p class="body">${n.p}</p>
    </div>`).join('');

  const quiz = t.quiz ? `
    <div class="quiz" data-quiz>
      <div class="eyebrow" style="margin-bottom:9px">Verifique seu entendimento</div>
      <div class="quiz-q">${t.quiz.q}</div>
      <div class="quiz-opts">
        ${t.quiz.o.map((o, i) => `<button class="quiz-opt" data-opt="${i}"><span class="k">${'ABCD'[i]}</span><span>${o}</span></button>`).join('')}
      </div>
      <div class="quiz-fb"></div>
    </div>` : '';

  $('#view').innerHTML = `
    <div class="anim">
      <p class="credit-line">Linha do Tempo Tecnológica · <b>Elaborado por: Professor Eber Santana</b></p>
      <header class="topic-head">
        <div class="topic-kicker">
          <span class="chip chip-accent">${esc(t.mod.name)}</span>
          <span class="chip">${esc(t.tag)}</span>
          <span class="chip">${idx + 1} de ${FLAT.length}</span>
        </div>
        <h1 class="h-xl">${esc(t.t)}</h1>
        <p class="topic-lead">${t.lead}</p>
      </header>
      <section class="card" id="wcard">
        <div class="card-head">
          <div class="card-title"><span class="lab">${t.activity ? '10 questões · com explicação' : 'Interativo'}</span></div>
        </div>
        <div class="stage" id="stage"></div>
        <div class="hint" id="hint"></div>
      </section>
      ${t.extra ? '<section class="card" id="xcard"><div class="card-head"><div class="card-title"><span class="lab">Dados</span></div></div><div class="stage" id="xstage"></div></section>' : ''}
      ${notes}
      ${quiz}
      <nav class="pager">
        ${prev ? `<a href="#${prev.id}" data-go="${prev.id}"><span class="pg-lab">← Anterior</span><span class="pg-name">${esc(prev.t)}</span></a>` : '<span></span>'}
        ${next ? `<a class="nx" href="#${next.id}" data-go="${next.id}"><span class="pg-lab">Próximo →</span><span class="pg-name">${esc(next.t)}</span></a>` : '<span></span>'}
      </nav>
    </div>`;

  mountWidget($('#stage'), t.w, $('#hint'), t);
  if (t.extra) mountWidget($('#xstage'), t.extra, null, t);
  if (t.quiz) bindQuiz($('[data-quiz]'), t.quiz);

  $$('.pager [data-go]').forEach(a => a.addEventListener('click', e => { e.preventDefault(); navigate(a.dataset.go); }));
}

function bindQuiz(root, q) {
  const fb = $('.quiz-fb', root);
  $$('.quiz-opt', root).forEach(btn => btn.addEventListener('click', () => {
    if (root.dataset.done) return;
    root.dataset.done = '1';
    const i = +btn.dataset.opt;
    $$('.quiz-opt', root).forEach((b, j) => {
      b.disabled = true;
      if (j === q.a) b.dataset.state = 'ok';
      else if (j === i) b.dataset.state = 'no';
    });
    fb.innerHTML = (i === q.a ? '<strong>Correto. </strong>' : '<strong>Não é essa. </strong>') + q.fb;
    fb.classList.add('on');
  }));
}

function setHint(node, txt) {
  if (!node) return;
  node.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 16v-4M12 8h.01"/></svg><span>${txt}</span>`;
}

/* ============================================================
   DISPATCH DE WIDGETS
   ============================================================ */
const W = {};
function mountWidget(stage, w, hint, topic) {
  if (!w || !W[w.k]) { stage.innerHTML = ''; return; }
  try { W[w.k](stage, w, hint, topic); }
  catch (err) { stage.innerHTML = '<p class="cap">Não foi possível carregar esta animação.</p>'; console.error(err); }
}

/* ---------------- TIMELINE ---------------- */
W.timeline = (stage, w, hint, topic) => {
  const items = w.items;
  const arts = (topic && ART_MAP[topic.id]) || null;
  const vals = items.map((it, i) => it.v != null ? it.v : i);
  const min = Math.min(...vals), max = Math.max(...vals), span = (max - min) || 1;
  let cur = 0;

  stage.innerHTML = `
    <div class="tl">
      <div class="tl-track-wrap">
        <div class="tl-rail" id="rail">
          <div class="tl-line"></div><div class="tl-fill" id="fill"></div>
        </div>
      </div>
      <div class="tl-controls">
        <button class="btn btn-sec btn-sm" id="tlPrev">←</button>
        <input type="range" class="tl-slider" id="tlR" min="0" max="${items.length - 1}" value="0" step="1" aria-label="Percorrer a linha do tempo">
        <button class="btn btn-sec btn-sm" id="tlNext">→</button>
        <button class="btn btn-primary btn-sm" id="tlPlay">▶ Reproduzir</button>
      </div>
      <div class="tl-detail" id="tlD"></div>
    </div>`;

  const rail = $('#rail', stage);
  const n = items.length;
  // posição híbrida: parte proporcional ao tempo real (mostra a aceleração),
  // parte uniforme (evita que os marcos modernos se sobreponham)
  const posOf = i => 6 + (0.42 * ((vals[i] - min) / span) + 0.58 * (n > 1 ? i / (n - 1) : 0)) * 88;

  items.forEach((it, i) => {
    const b = document.createElement('button');
    b.className = 'tl-node'; b.style.left = posOf(i) + '%';
    b.setAttribute('aria-label', it.y + ' — ' + it.t);
    b.dataset.i = i;
    rail.appendChild(b);
  });
  const tick = document.createElement('span');
  tick.className = 'tl-tick'; rail.appendChild(tick);
  const e1 = document.createElement('span'); e1.className = 'tl-edge a'; e1.textContent = items[0].y;
  const e2 = document.createElement('span'); e2.className = 'tl-edge b'; e2.textContent = items[n - 1].y;
  rail.appendChild(e1); rail.appendChild(e2);

  function draw() {
    const pct = posOf(cur);
    $('#fill', stage).style.width = pct + '%';
    tick.style.left = clamp(pct, 9, 91) + '%';
    tick.textContent = items[cur].y;
    $$('.tl-node', stage).forEach((n, i) => {
      n.dataset.active = i === cur ? '1' : '0';
      n.dataset.past = vals[i] <= vals[cur] ? '1' : '0';
    });
    const it = items[cur];
    const era = ERAS[it.era];
    const art = arts && arts[cur] ? artSvg(arts[cur]) : '';
    $('#tlD', stage).innerHTML = `
      <div class="tl-card anim${art ? ' has-art' : ''}">
        <div class="tl-left">
          <div><div class="tl-year">${esc(it.y)}</div>${era ? `<small style="color:${era.c}">${esc(era.n)}</small>` : ''}</div>
          ${art ? `<figure class="art-pane"><span class="art-cap">Figura</span>${art}</figure>` : ''}
        </div>
        <div class="tl-body">
          <h4>${esc(it.t)}</h4>
          <p>${it.d}</p>
          ${it.tags ? `<div class="tl-tags">${it.tags.map(t => `<span class="tl-tag">${esc(t)}</span>`).join('')}</div>` : ''}
          ${it.stat ? `<div class="tl-stat">${esc(it.stat)}</div>` : ''}
        </div>
      </div>`;
    $('#tlR', stage).value = cur;
  }
  function go(i) { cur = clamp(i, 0, items.length - 1); draw(); }

  rail.addEventListener('click', e => { const n = e.target.closest('.tl-node'); if (n) go(+n.dataset.i); });
  $('#tlR', stage).addEventListener('input', e => go(+e.target.value));
  $('#tlPrev', stage).addEventListener('click', () => go(cur - 1));
  $('#tlNext', stage).addEventListener('click', () => go(cur + 1));

  let playing = null;
  $('#tlPlay', stage).addEventListener('click', e => {
    if (playing) { clearInterval(playing); playing = null; e.target.textContent = '▶ Reproduzir'; return; }
    e.target.textContent = '❙❙ Pausar';
    if (cur >= items.length - 1) go(0);
    playing = setInterval(() => {
      if (cur >= items.length - 1) { clearInterval(playing); playing = null; e.target.textContent = '▶ Reproduzir'; return; }
      go(cur + 1);
    }, 2600);
    state.timers.push(playing);
  });

  draw();
  setHint(hint, 'Arraste o controle, clique nos pontos da linha ou use Reproduzir para percorrer automaticamente.');
};

/* ---------------- BINÁRIO ---------------- */
W.binary = (stage, w, hint) => {
  const bits = [0, 0, 0, 0, 1, 0, 1, 1];
  const weights = [128, 64, 32, 16, 8, 4, 2, 1];
  stage.innerHTML = `
    <div class="bin-bits" id="bits"></div>
    <div class="bin-out">
      <div><div class="bin-eq" id="eq"></div></div>
      <div style="text-align:center"><div class="eyebrow">Decimal</div><div class="bin-res" id="res">0</div></div>
    </div>
    <div class="ctl-row" style="margin-top:16px;justify-content:center">
      <span class="cap">Ou converta decimal → binário:</span>
      <input type="text" id="dec" inputmode="numeric" placeholder="0–255" style="width:110px;text-align:center" aria-label="Número decimal">
      <button class="btn btn-sec btn-sm" id="conv">Converter</button>
    </div>
    <div class="bin-div" id="divs"></div>`;

  const bitsEl = $('#bits', stage);
  bitsEl.innerHTML = weights.map((v, i) => `
    <div class="bin-bit" data-on="${bits[i]}">
      <button class="bin-toggle" data-i="${i}" aria-pressed="${!!bits[i]}" aria-label="Bit de valor ${v}">${bits[i]}</button>
      <span class="bin-w">${v}</span>
    </div>`).join('');

  function upd() {
    let total = 0; const parts = [];
    bits.forEach((b, i) => { if (b) { total += weights[i]; parts.push(weights[i]); } });
    $('#res', stage).textContent = total;
    $('#eq', stage).innerHTML = parts.length
      ? `${bits.join('')} &nbsp;=&nbsp; ${parts.join(' + ')} &nbsp;=&nbsp; <strong style="color:var(--ink)">${total}</strong><br><span style="color:var(--ink-faint)">${total % 2 ? 'ímpar — o bit de valor 1 está ligado' : 'par — o bit de valor 1 está desligado'}</span>`
      : `${bits.join('')} &nbsp;=&nbsp; nenhuma casa ligada &nbsp;=&nbsp; <strong style="color:var(--ink)">0</strong>`;
    $$('.bin-bit', stage).forEach((d, i) => {
      d.dataset.on = bits[i];
      const b = $('.bin-toggle', d);
      b.textContent = bits[i]; b.setAttribute('aria-pressed', !!bits[i]);
    });
  }
  bitsEl.addEventListener('click', e => {
    const b = e.target.closest('.bin-toggle'); if (!b) return;
    const i = +b.dataset.i; bits[i] = bits[i] ? 0 : 1; upd(); $('#divs', stage).innerHTML = '';
  });

  $('#conv', stage).addEventListener('click', () => {
    const n = clamp(parseInt($('#dec', stage).value, 10) || 0, 0, 255);
    $('#dec', stage).value = n;
    for (let i = 0; i < 8; i++) bits[i] = (n >> (7 - i)) & 1;
    upd();
    let x = n; const steps = [];
    if (n === 0) steps.push('0 ÷ 2 = 0, resto <b>0</b>');
    while (x > 0) { steps.push(`${x} ÷ 2 = ${Math.floor(x / 2)}, resto <b>${x % 2}</b>`); x = Math.floor(x / 2); }
    $('#divs', stage).innerHTML = `<div class="eyebrow" style="margin-bottom:6px">Divisões sucessivas por 2</div>${steps.join('<br>')}<br><span class="q">Lendo os restos de baixo para cima: <b style="color:var(--accent)">${n.toString(2)}</b></span>`;
  });
  $('#dec', stage).addEventListener('keydown', e => { if (e.key === 'Enter') $('#conv', stage).click(); });

  upd();
  setHint(hint, 'Clique nos interruptores para ligar e desligar cada bit — o valor decimal se atualiza sozinho.');
};

/* ---------------- SORTER ---------------- */
W.sorter = (stage, w, hint) => {
  const items = w.items.map((x, i) => ({ ...x, id: 'it' + i, at: 'pool' }));
  stage.innerHTML = `
    <div class="sorter">
      <div>
        <div class="eyebrow" style="margin-bottom:8px">Arraste daqui (ou clique para escolher a caixa)</div>
        <div class="sort-pool" id="pool" data-bin="pool"></div>
      </div>
      <div class="sort-bins" id="bins">
        ${w.bins.map(b => `<div class="sort-bin" data-bin="${b.id}"><h5>${esc(b.n)}</h5><div class="sb-desc">${esc(b.d)}</div><div class="sort-items"></div></div>`).join('')}
      </div>
      <div class="ctl-row">
        <button class="btn btn-primary btn-sm" id="check">Conferir</button>
        <button class="btn btn-ghost btn-sm" id="reset">Recomeçar</button>
        <span class="sort-score" id="score"></span>
      </div>
    </div>`;

  let picked = null;
  function draw() {
    $('#pool', stage).innerHTML = '';
    $$('.sort-bin .sort-items', stage).forEach(n => n.innerHTML = '');
    items.forEach(it => {
      const host = it.at === 'pool' ? $('#pool', stage) : $(`.sort-bin[data-bin="${it.at}"] .sort-items`, stage);
      const b = document.createElement('div');
      b.className = 'pill-item'; b.draggable = true; b.dataset.id = it.id; b.textContent = it.n;
      if (it.ok != null) b.dataset.ok = it.ok ? '1' : '0';
      if (picked === it.id) b.style.outline = '2px solid var(--accent)';
      host.appendChild(b);
    });
  }
  function move(id, bin) { const it = items.find(x => x.id === id); if (it) { it.at = bin; delete it.ok; } picked = null; draw(); }

  stage.addEventListener('dragstart', e => {
    const p = e.target.closest('.pill-item'); if (!p) return;
    e.dataTransfer.setData('text/plain', p.dataset.id); p.classList.add('dragging');
  });
  stage.addEventListener('dragend', e => { const p = e.target.closest('.pill-item'); if (p) p.classList.remove('dragging'); });
  stage.addEventListener('dragover', e => {
    const z = e.target.closest('[data-bin]'); if (!z) return;
    e.preventDefault(); z.classList.add('over');
  });
  stage.addEventListener('dragleave', e => { const z = e.target.closest('[data-bin]'); if (z) z.classList.remove('over'); });
  stage.addEventListener('drop', e => {
    const z = e.target.closest('[data-bin]'); if (!z) return;
    e.preventDefault(); z.classList.remove('over');
    move(e.dataTransfer.getData('text/plain'), z.dataset.bin);
  });
  stage.addEventListener('click', e => {
    const p = e.target.closest('.pill-item');
    if (p) { picked = picked === p.dataset.id ? null : p.dataset.id; draw(); return; }
    const z = e.target.closest('[data-bin]');
    if (z && picked) move(picked, z.dataset.bin);
  });

  $('#check', stage).addEventListener('click', () => {
    let ok = 0, placed = 0;
    items.forEach(it => { if (it.at !== 'pool') { placed++; it.ok = it.at === it.bin; if (it.ok) ok++; } });
    draw();
    $('#score', stage).innerHTML = placed === 0
      ? 'Coloque ao menos um item numa caixa.'
      : `<span style="color:${ok === items.length ? 'var(--ok)' : 'var(--ink)'}">${ok} de ${items.length} corretos</span>${placed < items.length ? ` · ${items.length - placed} ainda não classificados` : ''}`;
  });
  $('#reset', stage).addEventListener('click', () => { items.forEach(it => { it.at = 'pool'; delete it.ok; }); $('#score', stage).textContent = ''; draw(); });

  draw();
  setHint(hint, 'Arraste os itens para as caixas — ou clique num item e depois na caixa, se preferir.');
};

        <div class="isa-meter"><span>Instruções no programa</span><b>4</b></div>
        <div class="isa-meter"><span>Ciclos de clock</span><b id="rc">—</b></div>
      </div>
    </div>
    <div class="wall-msg" id="isam" style="margin-top:14px">Ambos calculam <span class="mono">A × B</span> e guardam o resultado. Clique em Executar para comparar.</div>
    <div class="ctl-row" style="margin-top:14px"><button class="btn btn-primary btn-sm" id="go">▶ Executar nos dois</button></div>`;

  $('#go', stage).addEventListener('click', () => {
    $$('.isa-step', stage).forEach(s => { s.dataset.on = '0'; s.dataset.done = '0'; });
    $('#cc', stage).textContent = '—'; $('#rc', stage).textContent = '—';
    const a = $$('#c1 .isa-step', stage), b = $$('#c2 .isa-step', stage);
    let i = 0, j = 0;
    const t1 = setInterval(() => {
      if (i > 0) a[i - 1].dataset.done = '1';
      if (i >= a.length) { clearInterval(t1); $('#cc', stage).textContent = '4'; return; }
      a[i].dataset.on = '1'; i++;
    }, 620);
    const t2 = setInterval(() => {
      if (j > 0) b[j - 1].dataset.done = '1';
      if (j >= b.length) {
        clearInterval(t2); $('#rc', stage).textContent = '4';
        $('#isam', stage).innerHTML = 'Mesmo resultado, mesmo número de ciclos — mas por caminhos opostos. O <b>CISC</b> esconde a complexidade dentro de um hardware caro que decodifica a instrução grande. O <b>RISC</b> expõe cada passo, exigindo mais do compilador mas permitindo um chip simples, previsível e muito mais econômico em energia. Por isso o RISC domina onde há bateria.';
        return;
      }
      b[j].dataset.on = '1'; j++;
    }, 620);
    state.timers.push(t1, t2);
  });
  setHint(hint, 'Execute e compare: o número de instruções muda, o trabalho realizado é o mesmo.');
};

W.pdu = (stage, w, hint) => {
  const steps = [
    { n: 'Dados', l: 'Camada 7 · Aplicação', h: [], p: 'GET /index.html HTTP/1.1', c: '#7B4FD8', d: 'Sua mensagem original, do jeito que o programa a produziu. Ainda não há nenhuma informação de entrega — só o conteúdo.' },

    { n: 'Pacote', l: 'Camada 3 · Rede', h: [{ t: 'IP 192.168.1.10 → 8.8.8.8', c: '#2E8B62' }, { t: 'TCP · 443', c: '#346BF1' }], p: 'GET /index.html', c: '#2E8B62', d: 'O IP adiciona os endereços lógicos de origem e destino. Agora o pacote sabe para qual máquina, em qualquer lugar do mundo, ele precisa chegar.' },
    { n: 'Quadro', l: 'Camada 2 · Enlace', h: [{ t: 'MAC 00:1A:2B → 00:5F:9C', c: '#B58A1E' }, { t: 'IP', c: '#2E8B62' }, { t: 'TCP', c: '#346BF1' }], p: 'GET /index.html', f: { t: 'FCS', c: '#B58A1E' }, c: '#B58A1E', d: 'O quadro adiciona os endereços MAC do próximo salto e um rodapé FCS para verificação de erros. Esses MACs mudam a cada equipamento no caminho.' },
    { n: 'Bits', l: 'Camada 1 · Física', h: [], p: '', bits: true, c: '#C4562F', d: 'Tudo vira sinal elétrico, pulso de luz ou onda de rádio. Nesse ponto não existe mais "mensagem" — só zeros e uns atravessando o meio físico.' }
  ];
  let i = 0, dir = 1;
  stage.innerHTML = `
    <div class="enc-view" id="ev"></div>
    <div class="wall-msg" id="ed" style="margin-top:12px"></div>
    <div class="ctl-row" style="margin-top:14px">
      <button class="btn btn-primary btn-sm" id="enc">▼ Encapsular (enviar)</button>
      <button class="btn btn-sec btn-sm" id="dec">▲ Desencapsular (receber)</button>
      <button class="btn btn-ghost btn-sm" id="rst">Reiniciar</button>
    </div>`;
  function draw() {
    const s = steps[i];
    const ev = $('#ev', stage);
    if (s.bits) {
      ev.innerHTML = `<div class="enc-name"><b>${s.n}</b><span>${s.l}</span></div>
        <div class="enc-bits">01000111 01000101 01010100 00100000 00101111 01101001 01101110 01100100 01100101 01111000 00101110 01101000 01110100 01101101 01101100</div>`;
    } else {
      ev.innerHTML = `<div class="enc-name"><b>${s.n}</b><span>${s.l}</span></div>
        <div class="enc-layer anim" style="border-color:${s.c};background:${s.c}12">
          ${s.h.map(h => `<span class="enc-hdr" style="background:${h.c}">${esc(h.t)}</span>`).join('')}
          <span class="enc-payload">${esc(s.p)}</span>
          ${s.f ? `<span class="enc-ftr" style="background:${s.f.c}">${esc(s.f.t)}</span>` : ''}
        </div>`;
    }
    $('#ed', stage).innerHTML = `<b>${esc(s.n)}</b> — ${s.d}`;
  }
  function run(d) {
    dir = d; if (d > 0) i = 0; else i = steps.length - 1;
    draw();
    const iv = setInterval(() => {
      i += d;
      if (i < 0 || i >= steps.length) { i = clamp(i, 0, steps.length - 1); clearInterval(iv); return; }
      draw();
    }, 1900);
    state.timers.push(iv);
  }
  $('#enc', stage).addEventListener('click', () => run(1));
  $('#dec', stage).addEventListener('click', () => run(-1));
  $('#rst', stage).addEventListener('click', () => { i = 0; draw(); });
  draw();
  setHint(hint, 'Encapsular = descer a pilha ganhando cabeçalhos. Desencapsular = subir removendo um por um.');
};

      </div>
      <div class="vm-list">
        ${vms.map((v, i) => `
          <div class="vm-card">
            <h6><span class="vm-os" style="background:${v.c}"></span>${esc(v.n)}</h6>
            <div class="cap" style="margin-bottom:7px">${esc(v.os)}</div>
            <div class="vm-ctl"><span style="min-width:52px">vCPU <b class="mono num" id="c${i}">${v.cpu}</b></span><input type="range" data-vm="${i}" data-k="cpu" min="0" max="16" value="${v.cpu}" aria-label="vCPU de ${esc(v.n)}"></div>

          </div>`).join('')}
      </div>
    </div>
    <div class="wall-msg" id="vmm" style="margin-top:14px"></div>`;
  function draw() {
    const c = vms.reduce((s, v) => s + v.cpu, 0), r = vms.reduce((s, v) => s + v.ram, 0);
    const oc = c > w.host.cpu, or = r > w.host.ram;
    $('#gcv', stage).textContent = `${c} / ${w.host.cpu}`;
    $('#grv', stage).textContent = `${r} / ${w.host.ram} GB`;
    $('#gcb', stage).style.width = Math.min(100, c / w.host.cpu * 100) + '%';

    else { m.dataset.tone = 'good'; m.innerHTML = `<b>Alocação equilibrada.</b> ${c} de ${w.host.cpu} vCPU e ${r} de ${w.host.ram} GB de RAM. Sobra folga para picos de uso e para o próprio hypervisor, que também consome recursos.`; }
  }
  stage.addEventListener('input', e => {
    const s = e.target.closest('[data-vm]'); if (!s) return;
    vms[+s.dataset.vm][s.dataset.k] = +s.value; draw();
  });
  draw();
  setHint(hint, 'Aumente a RAM das VMs além dos 64 GB do servidor e veja o que o hypervisor faz.');
};

/* ---------------- ATIVIDADE DO MÓDULO ---------------- */
W.exam = (stage, w, hint) => {
  const QS = w.qs;
  const N = QS.length;
  const ans = new Array(N).fill(null);   // índice marcado pelo aluno
  let i = 0, done = false;

  stage.innerHTML = `
    <div class="ex-top">
      <div class="ex-count" id="exC"></div>
      <div class="ex-dots" id="exD">${QS.map(() => '<i></i>').join('')}</div>
    </div>
    <div id="exBody"></div>`;

  const dots = () => {
    $$('#exD i', stage).forEach((d, j) => {
      if (ans[j] == null) d.dataset.s = (j === i && !done) ? 'now' : '';
      else d.dataset.s = ans[j] === QS[j].a ? 'ok' : 'no';
    });
  };

  function drawQ() {
    const q = QS[i], picked = ans[i];
    $('#exC', stage).innerHTML = `Questão ${i + 1} <span>de ${N}</span>`;
    $('#exBody', stage).innerHTML = `
      <div class="anim">
        <p class="ex-q">${q.q}</p>
        <div class="ex-opts" id="exO">
          ${q.o.map((o, j) => `<button class="ex-opt" data-j="${j}"><span class="k">${'ABCDE'[j]}</span><span>${o}</span></button>`).join('')}
        </div>
        <div class="ex-why" id="exW"></div>
        <div class="ex-nav" id="exN"></div>
      </div>`;
    if (picked != null) reveal(picked, true);
    else navBtns();
    dots();
  }

  function navBtns() {
    const answered = ans[i] != null;
    const last = i === N - 1;
    const allDone = ans.every(a => a != null);
    $('#exN', stage).innerHTML = `
      ${i > 0 ? '<button class="btn btn-ghost btn-sm" data-nav="prev">← Anterior</button>' : ''}
      ${answered && !last ? '<button class="btn btn-primary btn-sm" data-nav="next">Próxima questão →</button>' : ''}
      ${answered && last && allDone ? '<button class="btn btn-primary btn-sm" data-nav="fim">Ver resultado</button>' : ''}
      ${answered && last && !allDone ? '<button class="btn btn-sec btn-sm" data-nav="pend">Ir para as não respondidas</button>' : ''}
      ${!answered ? '<span class="cap">Escolha uma alternativa para ver a explicação.</span>' : ''}`;
  }

  function reveal(j, silent) {
    const q = QS[i];
    ans[i] = j;
    const correct = j === q.a;
    $$('.ex-opt', stage).forEach((b, k) => {
      b.disabled = true;
      if (k === q.a) b.dataset.state = 'ok';
      else if (k === j) b.dataset.state = 'no';
    });
    const wrongWhy = (!correct && q.x && q.x[j]) ? q.x[j] : null;
    $('#exW', stage).innerHTML = `
      ${wrongWhy ? `<div class="ex-box wrong"><span class="lab">Por que a alternativa ${'ABCDE'[j]} não serve</span><p>${wrongWhy}</p></div>` : ''}
      <div class="ex-box right">
        <span class="lab">${correct ? 'Correto · por quê' : `Resposta correta: ${'ABCDE'[q.a]} · por quê`}</span>
        <p>${q.w}</p>
      </div>`;
    $('#exW', stage).classList.add('on');
    navBtns();
    dots();
    if (!silent && correct === false) { /* mantém o aluno na questão para ler */ }
  }

  function result() {
    done = true;
    const ok = ans.filter((a, j) => a === QS[j].a).length;
    const pct = Math.round(ok / N * 100);
    const tone = pct >= 70 ? 'var(--ok)' : pct >= 50 ? 'var(--warn)' : 'var(--signal)';
    const verdict = pct >= 90 ? 'Domínio consolidado.'
      : pct >= 70 ? 'Bom desempenho.'
      : pct >= 50 ? 'Base razoável, com lacunas.'
      : 'Vale revisar o módulo antes de seguir.';
    const advice = pct >= 90 ? 'Você acertou quase tudo. Siga para o próximo módulo com segurança.'
      : pct >= 70 ? 'A maior parte do conteúdo está clara. Releia abaixo as questões que errou — a explicação de cada uma aponta exatamente onde o raciocínio se desviou.'
      : pct >= 50 ? 'Metade do caminho feito. Volte aos tópicos das questões erradas, refaça as animações e tente a atividade de novo.'
      : 'Não tem problema: é para isso que serve a atividade. Releia o módulo com calma, mexa nas animações de cada tópico e volte aqui depois.';

    $('#exC', stage).innerHTML = `Resultado <span>· ${N} questões</span>`;
    $('#exBody', stage).innerHTML = `
      <div class="ex-score anim">
        <div class="ex-ring" style="background:conic-gradient(${tone} ${pct}%, var(--surface-3) 0)">
          <div style="width:104px;height:104px;border-radius:50%;background:var(--surface);display:grid;place-items:center">
            <div><div class="n">${ok}<span style="font-size:20px;color:var(--ink-faint)">/${N}</span></div><div class="d">${pct}% de acerto</div></div>
          </div>
        </div>
        <p class="ex-verdict">${verdict}</p>
        <p class="ex-advice">${advice}</p>
        <div class="ex-nav" style="justify-content:center">
          <button class="btn btn-primary btn-sm" data-nav="redo">Refazer a atividade</button>
          <button class="btn btn-sec btn-sm" data-nav="q1">Revisar questão a questão</button>
        </div>
        <div class="ex-review">
          ${QS.map((q, j) => {
            const good = ans[j] === q.a;
            return `<div class="ex-rev" data-ok="${good ? 1 : 0}">
              <div class="qn">Questão ${j + 1} · ${good ? 'acertou' : 'errou'}</div>
              <div class="qt">${q.q}</div>
              <div class="qa"><em>Resposta correta (${'ABCDE'[q.a]}):</em> ${q.o[q.a]}<br>${q.w}</div>
            </div>`;
          }).join('')}
        </div>
      </div>`;
    dots();
  }

  stage.addEventListener('click', e => {
    const opt = e.target.closest('.ex-opt');
    if (opt && !opt.disabled) { reveal(+opt.dataset.j); return; }
    const nav = e.target.closest('[data-nav]');
    if (!nav) return;
    const a = nav.dataset.nav;
    if (a === 'next') { i = Math.min(N - 1, i + 1); drawQ(); }
    else if (a === 'prev') { i = Math.max(0, i - 1); drawQ(); }
    else if (a === 'fim') result();
    else if (a === 'pend') { const k = ans.findIndex(x => x == null); i = k < 0 ? 0 : k; drawQ(); }
    else if (a === 'q1') { done = false; i = 0; drawQ(); }
    else if (a === 'redo') { ans.fill(null); done = false; i = 0; drawQ(); }
    stage.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  });

  $('#exD', stage).addEventListener('click', e => {
    const list = $$('#exD i', stage), t = e.target.closest('i');
    if (!t) return;
    i = list.indexOf(t); done = false; drawQ();
  });

  drawQ();
  setHint(hint, 'Responda uma questão de cada vez. A explicação aparece assim que você marca uma alternativa — e você pode voltar em qualquer questão pelos traços acima.');
};
