MODULES.push({
id:'hw', name:'Anatomia do Computador', topics:[

{
id:'pc-por-dentro', t:'O PC por Dentro', tag:'Hardware',
lead:'Abra o gabinete e você encontra sempre as mesmas seis peças, em qualquer computador do mundo. Clique nos pontos do diagrama para descobrir a função de cada uma — e por que ela está exatamente naquele lugar.',
w:{k:'hotspot', parts:[
 {id:'cpu', x:44, y:34, n:'Processador (CPU)', role:'O cérebro', d:'Executa as instruções, faz os cálculos e toma as decisões lógicas. Fica no centro da placa-mãe porque precisa da menor distância possível até a memória — em bilhões de operações por segundo, alguns centímetros de trilha fazem diferença.'},
 {id:'ram', x:66, y:28, n:'Memória RAM', role:'A mesa de trabalho', d:'Guarda os dados dos programas que estão abertos agora. É rapidíssima, mas volátil: desligou, apagou. Os pentes ficam colados na CPU justamente para encurtar o caminho dos dados.'},
 {id:'mb', x:50, y:56, n:'Placa-mãe', role:'O sistema nervoso', d:'Não processa nada — ela conecta tudo. Os barramentos gravados nela levam energia e dados entre CPU, RAM, GPU e armazenamento, definindo quais peças o computador aceita.'},
 {id:'gpu', x:30, y:66, n:'Placa de Vídeo (GPU)', role:'O artista', d:'Faz milhares de cálculos simples em paralelo. Nasceu para desenhar triângulos em jogos, mas essa mesma arquitetura paralela é o que hoje treina modelos de inteligência artificial.'},
 {id:'ssd', x:76.5, y:60.5, n:'Armazenamento (SSD/HD)', role:'O arquivo', d:'Guarda o sistema operacional, os programas e seus arquivos de forma permanente. O SSD não tem partes móveis e é dezenas de vezes mais rápido que um HD magnético.'},
 {id:'psu', x:22, y:86, n:'Fonte de Alimentação', role:'O coração', d:'Converte os 127/220 V alternados da tomada nas tensões contínuas de 12 V, 5 V e 3,3 V que os componentes exigem. Fonte ruim é a causa mais subestimada de travamentos.'},
 {id:'cooler', x:44, y:16, n:'Cooler', role:'O pulmão', d:'Transistores chaveando bilhões de vezes por segundo geram calor, e silício quente reduz a frequência para se proteger. Sem refrigeração, a CPU não queima — ela fica lenta.'}
]},
notes:[{h:'A regra que organiza tudo', p:'Repare no padrão: quanto mais rápido o componente precisa conversar com a CPU, mais perto dele ele fica. CPU e RAM se tocam. O SSD, que é mais lento, pode ficar longe. Essa é a mesma lógica que rege a hierarquia de memória que você vai ver no Módulo 4.'}],
quiz:{q:'Qual componente NÃO processa nem armazena dados, mas é indispensável porque conecta todos os outros?', o:['A fonte de alimentação','A placa-mãe','O cooler','A memória RAM'], a:1, fb:'A placa-mãe é a infraestrutura: seus barramentos definem quem conversa com quem, em que velocidade, e quais peças o computador sequer aceita.'}
},

{
id:'perifericos', t:'Periféricos: Entrada, Saída e Híbridos', tag:'Classificação',
lead:'Periférico é tudo que fica <strong>fora</strong> do processamento central. A classificação segue o sentido da informação: entra no computador, sai dele, ou os dois. Arraste cada dispositivo para a caixa certa — alguns são mais traiçoeiros do que parecem.',
w:{k:'sorter',
 bins:[
  {id:'in', n:'Entrada', d:'Levam informação de fora para dentro do computador'},
  {id:'out', n:'Saída', d:'Levam informação de dentro para fora'},
  {id:'both', n:'Híbridos', d:'Fazem os dois sentidos'}
 ],
 items:[
  {n:'Teclado', bin:'in'}, {n:'Mouse', bin:'in'}, {n:'Scanner', bin:'in'},
  {n:'Microfone', bin:'in'}, {n:'Webcam', bin:'in'}, {n:'Leitor de código de barras', bin:'in'},
  {n:'Monitor', bin:'out'}, {n:'Impressora', bin:'out'}, {n:'Caixa de som', bin:'out'},
  {n:'Projetor', bin:'out'}, {n:'Plotter', bin:'out'},
  {n:'Monitor touchscreen', bin:'both'}, {n:'Multifuncional', bin:'both'},
  {n:'Headset', bin:'both'}, {n:'Pendrive', bin:'both'}, {n:'Roteador', bin:'both'}
 ]},
notes:[{h:'A pegadinha dos híbridos', p:'Um monitor comum só exibe: é saída. Um monitor touchscreen exibe <em>e</em> registra seu toque: é híbrido. O headset tem fone (saída) e microfone (entrada). O pendrive lê e grava. Sempre pergunte: a informação viaja nos dois sentidos?'}],
quiz:{q:'Por que uma impressora multifuncional é classificada como periférico híbrido?', o:['Porque usa tinta e papel','Porque imprime (saída) e digitaliza (entrada)','Porque se conecta por USB','Porque tem visor próprio'], a:1, fb:'A função de scanner leva informação do papel para o computador (entrada) e a impressão leva do computador para o papel (saída). Dois sentidos = híbrido.'}
},

{
id:'cpu-ram-kernel', t:'CPU, RAM e Kernel: o Trio que Move Tudo', tag:'Conceito',
lead:'Abrir um programa parece instantâneo, mas envolve uma coreografia entre três atores. Aperte "Executar" e acompanhe passo a passo o que acontece quando você dá dois cliques num ícone.',
w:{k:'flow', lanes:[
 {id:'user', n:'Você', s:'Dá dois cliques no ícone'},
 {id:'kernel', n:'Kernel', s:'O maestro do sistema'},
 {id:'ssd', n:'SSD / HD', s:'Onde o programa mora'},
 {id:'ram', n:'Memória RAM', s:'A mesa de trabalho'},
 {id:'cpu', n:'CPU', s:'Quem executa de fato'}
], steps:[
 {lane:'user', pkt:'clique', note:'Você clica no ícone. O sistema operacional recebe o evento do mouse e identifica qual programa deve iniciar.'},
 {lane:'kernel', pkt:'pedido', note:'O kernel recebe o pedido e faz o primeiro trabalho pesado: verificar se você tem permissão, reservar espaço de memória e criar um processo com identidade própria (PID).'},
 {lane:'ssd', pkt:'ler .exe', note:'O kernel manda o driver de armazenamento buscar o arquivo executável no disco. Aqui está o gargalo: o SSD é milhares de vezes mais lento que a CPU.'},
 {lane:'ram', pkt:'carregar', note:'O programa é copiado do disco para a RAM. É por isso que o segundo clique é sempre mais rápido: parte dele já está em memória.'},
 {lane:'cpu', pkt:'executar', note:'Agora sim a CPU busca as instruções na RAM e começa a executá-las, uma a uma, bilhões de vezes por segundo. A janela aparece na tela.'},
 {lane:'kernel', pkt:'agendar', note:'O kernel continua trabalhando o tempo todo: alterna a CPU entre dezenas de processos (escalonamento), impede que um programa leia a memória do outro e media todo acesso ao hardware.'}
]},
notes:[{h:'A analogia do escritório', p:'A <strong>CPU</strong> é o funcionário que faz o trabalho. A <strong>RAM</strong> é a mesa: quanto maior, mais projetos abertos ao mesmo tempo sem precisar guardar e buscar de novo. O <strong>SSD</strong> é o arquivo de aço no canto da sala. E o <strong>kernel</strong> é o gerente que decide quem usa o quê, quando, e impede que um funcionário mexa na mesa do outro.'}],
quiz:{q:'Por que abrir um programa pela segunda vez costuma ser mais rápido?', o:['A CPU aumenta a frequência','Partes do programa continuam carregadas na RAM','O SSD desfragmenta sozinho','O kernel reduz a segurança'], a:1, fb:'O sistema mantém em RAM (no chamado cache de páginas) partes de arquivos recém-usados. Como a RAM é ordens de grandeza mais rápida que o disco, o segundo carregamento pula a etapa mais lenta.'}
},

{
id:'conectores', t:'Conectores e Portas Físicas', tag:'Referência',
lead:'A traseira de um PC é um museu vivo: convivem ali portas de 1987 e de 2024. Clique em cada conector para ver o que ele transporta, quando surgiu e se ainda vale a pena usar.',
w:{k:'connectors', items:[
 {n:'HDMI', era:'2003', cat:'Vídeo', status:'live', d:'Transmite vídeo e áudio de alta definição num único cabo. É o padrão dominante em TVs, monitores e consoles. As versões 2.1 suportam 4K a 120 Hz e 8K a 60 Hz.'},
 {n:'DisplayPort', era:'2006', cat:'Vídeo', status:'live', d:'Preferido no mundo dos PCs para monitores de alto desempenho. Suporta taxas de atualização altíssimas e conecta vários monitores em série (daisy chain), coisa que o HDMI não faz bem.'},
 {n:'VGA', era:'1987', cat:'Vídeo', status:'legacy', d:'Vídeo analógico de 15 pinos, azul. A imagem perde qualidade com o comprimento do cabo. Ainda aparece em projetores de escola e equipamentos corporativos antigos.'},
 {n:'USB-A', era:'1996', cat:'Dados', status:'live', d:'O clássico retangular que só entra de um jeito (e nunca na primeira tentativa). Mouse, teclado, pendrive, carregador — carrega tudo há quase 30 anos.'},
 {n:'USB-C', era:'2014', cat:'Dados', status:'live', d:'Reversível, encaixa dos dois lados. Transporta dados em alta velocidade, vídeo e até 240 W de energia — pode carregar um notebook inteiro. É o padrão que está unificando todos os outros.'},
 {n:'Thunderbolt', era:'2011', cat:'Dados', status:'live', d:'Fisicamente idêntico ao USB-C (marcado com um raio), mas com tecnologia muito mais rápida: até 40 Gbps. Permite ligar placas de vídeo externas e vários monitores de altíssima resolução.'},
 {n:'RJ45 (Ethernet)', era:'1985', cat:'Rede', status:'live', d:'A porta de rede cabeada. Oferece a conexão mais estável e de menor latência que existe — por isso continua obrigatória em servidores, consoles e qualquer coisa que não pode cair.'},
 {n:'P2 / 3,5 mm', era:'1964', cat:'Áudio', status:'live', d:'O plugue redondo de áudio analógico. Verde para fone e caixa de som, rosa para microfone, azul para entrada de linha. Sobreviveu a seis décadas de tecnologia.'},
 {n:'Cartão SD', era:'1999', cat:'Armazenamento', status:'live', d:'Leitor de cartão de memória, essencial para fotógrafos e videomakers transferirem arquivos direto da câmera sem cabo.'},
 {n:'Lightning', era:'2012', cat:'Dados', status:'legacy', d:'Conector proprietário da Apple para iPhones e iPads. Foi aposentado em favor do USB-C: a diretiva europeia do carregador único passou a valer para celulares em dezembro de 2024, e a Apple tirou de linha seu último aparelho com Lightning em fevereiro de 2025.'},
 {n:'eSATA', era:'2004', cat:'Armazenamento', status:'dead', d:'Conectava HDs externos na mesma velocidade de um disco interno. Foi engolido pelo USB 3.0 e pelo USB-C, que fazem o mesmo e ainda entregam energia.'},
 {n:'FireWire', era:'1995', cat:'Dados', status:'dead', d:'Padrão de alta velocidade dos anos 2000, muito usado em filmadoras digitais e áudio profissional. Praticamente extinto.'},
 {n:'PS/2', era:'1987', cat:'Periféricos', status:'dead', d:'Conectores redondos dedicados: roxo para teclado, verde para mouse. Substituídos pelo USB — mas ainda aparecem em placas-mãe para compatibilidade com BIOS antigas.'},
 {n:'Paralela', era:'1970', cat:'Periféricos', status:'dead', d:'A famosa "porta de impressora": enorme, com 25 pinos. Transmitia 8 bits ao mesmo tempo, o que parecia rápido até o USB serial provar o contrário.'},
 {n:'Serial (RS-232)', era:'1960', cat:'Periféricos', status:'legacy', d:'Usada nos anos 80 e 90 para mouses antigos e modems. Sobrevive em equipamentos industriais, roteadores e switches — onde é o console de emergência.'}
]},
notes:[{h:'Por que o USB-C está vencendo', p:'Ele não é só mais um conector: é um <em>túnel</em>. Dentro do mesmo plugue podem trafegar dados USB, sinal DisplayPort, protocolo Thunderbolt e até 240 W de energia. Isso permite substituir HDMI, USB-A, carregador e eSATA por uma única porta — e essa consolidação é a razão real da sua adoção.'}],
quiz:{q:'Thunderbolt e USB-C usam o mesmo plugue físico. Qual a diferença real?', o:['Nenhuma, são sinônimos','Thunderbolt é só para Apple','Thunderbolt é um protocolo muito mais rápido que usa o formato USB-C','USB-C não transmite vídeo'], a:2, fb:'O formato do conector e o protocolo que roda dentro dele são coisas separadas. Thunderbolt (até 40 Gbps) usa o formato USB-C, mas nem toda porta USB-C é Thunderbolt — procure o símbolo do raio.'}
}
]});

MODULES.push({
id:'cpu', name:'Processadores e Arquiteturas', topics:[

{
id:'intel', t:'A Linha do Tempo da Intel', tag:'Fabricante',
lead:'De um chip de calculadora japonesa em 1971 a processadores com unidade neural dedicada. Cinco décadas em que a Intel definiu — e por muito tempo monopolizou — o que significa "compatível com PC".',
w:{k:'timeline', items:[
 {y:'1971', v:1971, t:'Intel 4004', d:'O primeiro microprocessador comercial do mundo. Quatro bits, 2.300 transístores, 740 kHz. Foi encomendado por uma fabricante japonesa de calculadoras que nem imaginava o que estava financiando.', tags:['4 bits','Primeiro do mundo'], stat:'2.300 transístores · litografia de 10.000 nm', era:'micro'},
 {y:'1978', v:1978, t:'8086 / 8088 — Nasce o x86', d:'A arquitetura de 16 bits que a IBM escolheu para seu PC em 1981. Essa decisão de compatibilidade amarrou o mercado por 45 anos: seu processador atual ainda entende instruções do 8086.', tags:['x86','IBM PC'], era:'micro'},
 {y:'1985', v:1985, t:'Intel 386', d:'Primeiro x86 de 32 bits, com multitarefa real e memória protegida em hardware. É o chip que tornou possível rodar Windows de verdade, com vários programas ao mesmo tempo sem um derrubar o outro.', tags:['32 bits','Multitarefa'], era:'micro'},
 {y:'1989', v:1989, t:'Intel 486', d:'Integra o coprocessador matemático e o cache L1 dentro do próprio chip. Interfaces gráficas deixam de ser lentas e o computador vira um eletrodoméstico plausível.', tags:['Cache L1','FPU integrada'], era:'micro'},
 {y:'1993', v:1993, t:'Pentium', d:'Arquitetura superescalar: duas instruções por ciclo. A Intel abandona números (que não podiam ser registrados como marca) e inventa um nome — o começo do marketing de processador.', tags:['Superescalar','Marca'], era:'micro'},
 {y:'1997', v:1997, t:'Pentium II e MMX', d:'Instruções dedicadas a multimídia. O PC passa a tocar vídeo e áudio decentemente, o que coincide com a chegada da internet nas casas.', tags:['MMX','Multimídia'], era:'micro'},
 {y:'2000', v:2000, t:'Pentium 4 — a corrida do clock', d:'A Intel aposta tudo em frequência: chega a 3,8 GHz. E bate num muro físico — consumo e calor crescem mais rápido que o desempenho. A estratégia falha e força uma virada.', tags:['NetBurst','3,8 GHz'], stat:'O fim da era "mais MHz = melhor"', era:'micro'},
 {y:'2006', v:2006, t:'Core 2 Duo', d:'A resposta ao muro do clock: em vez de um núcleo mais rápido, dois núcleos na mesma frequência. Começa a era do paralelismo no desktop.', tags:['Dual-core','Eficiência'], era:'micro'},
 {y:'2008', v:2008, t:'Core i7 (Nehalem)', d:'Inaugura a nomenclatura i3/i5/i7, traz o controlador de memória para dentro do chip e ressuscita o Hyper-Threading: 4 núcleos físicos aparecem como 8 lógicos.', tags:['Hyper-Threading','i3/i5/i7'], era:'micro'},
 {y:'2017', v:2017, t:'Core i9', d:'A AMD lança o Ryzen e quebra uma década de estagnação. A Intel responde criando um tier acima do i7 e a contagem de núcleos no desktop explode.', tags:['Concorrência','Muitos núcleos'], era:'micro'},
 {y:'2021', v:2021, t:'12ª Geração — Arquitetura Híbrida', d:'Núcleos P (performance) e núcleos E (eficiência) no mesmo chip, ideia emprestada dos processadores de celular. O escalonador do sistema operacional precisa aprender a decidir onde colocar cada tarefa.', tags:['P-cores','E-cores'], era:'ai'},
 {y:'2024', v:2024, t:'Core Ultra — a NPU', d:'Uma terceira unidade entra no chip: a NPU (Neural Processing Unit), especializada em inferência de IA local. Rodar modelos sem enviar dados à nuvem vira requisito de projeto.', tags:['NPU','IA local'], stat:'CPU + GPU + NPU num único encapsulamento', era:'ai'}
]},
notes:[{h:'A lição do Pentium 4', p:'Entre 2000 e 2005 a indústria acreditava que o caminho era aumentar a frequência indefinidamente. O consumo cresce aproximadamente com o cubo da frequência — dobrar o clock exige oito vezes mais energia. O muro térmico foi real, e a saída foi paralelismo. Toda a computação moderna, das GPUs à IA, é consequência dessa derrota.'}],
quiz:{q:'Por que a Intel abandonou a estratégia de simplesmente aumentar a frequência de clock?', o:['Porque os usuários reclamaram do ruído','Porque o consumo e o calor crescem muito mais rápido que o desempenho','Porque a AMD registrou a patente','Porque o Windows não suportava'], a:1, fb:'É física: a dissipação de potência escala de forma muito mais agressiva que o ganho de desempenho. Chegando perto de 4 GHz, o chip esquentava demais para ser refrigerado — daí a virada para múltiplos núcleos.'}
},

{
id:'amd', t:'A Linha do Tempo da AMD', tag:'Fabricante',
lead:'A história da AMD é a de uma empresa que começou <strong>copiando legalmente</strong> os chips da Intel, virou pioneira dos 64 bits, quase quebrou, e voltou. É o melhor estudo de caso sobre por que a concorrência importa.',
w:{k:'timeline', items:[
 {y:'1969–1991', v:1982, t:'A era dos clones', d:'A IBM exigia uma segunda fonte de fabricação para não depender de um único fornecedor. A Intel foi obrigada a licenciar seus projetos, e a AMD passou a produzir Am286, Am386 e Am486 — legalmente idênticos, mais baratos e às vezes mais rápidos.', tags:['Am286','Am386','Licenciamento'], era:'micro'},
 {y:'1996', v:1996, t:'K5 e K6 — arquitetura própria', d:'A AMD projeta do zero, sem copiar. O K6 compete de igual para igual com o Pentium e prova que a empresa consegue inovar sozinha.', tags:['K5','K6','Independência'], era:'micro'},
 {y:'1999', v:1999, t:'Athlon e a barreira de 1 GHz', d:'Em março de 2000 a AMD chega a 1 GHz antes da Intel. Pela primeira vez a "segunda fonte" lidera a indústria em desempenho bruto.', tags:['Athlon','K7','1 GHz'], stat:'Primeira CPU x86 a atingir 1 GHz', era:'micro'},
 {y:'2003', v:2003, t:'x86-64 — o golpe de mestre', d:'A Intel apostava no Itanium, uma arquitetura de 64 bits incompatível com o passado. A AMD estende o x86 para 64 bits mantendo total compatibilidade. O mercado escolhe a AMD, e a Intel é obrigada a licenciar a arquitetura da concorrente.', tags:['AMD64','Opteron','Retrocompatível'], stat:'A arquitetura de 64 bits que você usa hoje é da AMD', era:'micro'},
 {y:'2005', v:2005, t:'Athlon 64 X2', d:'Primeiro processador dual-core de verdade para desktop, com dois núcleos num único die. A Intel responde colando dois chips no mesmo encapsulamento.', tags:['Dual-core','Nativo'], era:'micro'},
 {y:'2011–2016', v:2013, t:'Bulldozer — os anos de crise', d:'Uma arquitetura modular que compartilhava unidades entre núcleos. Muitos núcleos no papel, desempenho baixo por núcleo na prática. A AMD quase desaparece do mercado de desktop — mas se salva fornecendo os chips do PlayStation 4 e do Xbox One.', tags:['IPC baixo','Consoles'], era:'micro'},
 {y:'2017', v:2017, t:'Ryzen — o renascimento', d:'A arquitetura Zen, liderada por Jim Keller, recupera 52% de IPC de uma vez. A AMD volta a competir, e a Intel — parada havia anos — é forçada a acelerar. Todo mundo ganha.', tags:['Zen','IPC +52%','Chiplets'], stat:'8 núcleos pelo preço de 4 da concorrência', era:'micro'},
 {y:'2019–2022', v:2021, t:'Zen 2 e Zen 3 — chiplets em 7 nm', d:'A AMD monta o processador com pequenos blocos (chiplets) fabricados separadamente. Rendimento de produção sobe, custo cai, e a AMD assume a liderança em desempenho por vários anos.', tags:['7 nm','Chiplets','TSMC'], era:'micro'},
 {y:'2023+', v:2024, t:'Zen 4/5, DDR5 e NPU', d:'Suporte a DDR5 e PCIe 5.0, cache 3D empilhado verticalmente (V-Cache) e unidade neural integrada nas linhas móveis. A disputa com a Intel volta a ser de igual para igual.', tags:['DDR5','V-Cache','NPU'], era:'ai'}
]},
notes:[{h:'Por que isso importa para você', p:'Entre 2011 e 2016, sem concorrência real, a Intel aumentou o desempenho cerca de 5% ao ano e manteve 4 núcleos como padrão por sete anos. Em 2017 o Ryzen chegou e, em dois anos, o padrão do desktop pulou para 6 e 8 núcleos com preços menores. Monopólio não é um problema abstrato — ele aparece no que você consegue comprar.'}],
quiz:{q:'Qual empresa criou a arquitetura de 64 bits (x86-64) usada nos PCs até hoje?', o:['Intel','AMD','IBM','ARM'], a:1, fb:'A AMD criou o AMD64 em 2003, estendendo o x86 sem quebrar compatibilidade. A aposta da Intel (Itanium) era incompatível com softwares de 32 bits e fracassou — a Intel acabou licenciando a arquitetura da AMD.'}
},

{
id:'x86-x64', t:'x86 (32 bits) vs x64 (64 bits)', tag:'Arquitetura',
lead:'A diferença entre 32 e 64 bits não é "velocidade" — é <strong>quantos endereços de memória o processador consegue nomear</strong>. Arraste o controle abaixo e veja onde exatamente um sistema de 32 bits bate no muro.',
w:{k:'memwall'},
notes:[
 {h:'A conta que explica tudo', p:'Com 32 bits você forma 2³² endereços diferentes = 4.294.967.296 bytes = exatamente <strong>4 GB</strong>. Não importa quanta RAM você instale: o processador de 32 bits não tem número suficiente para chamar o byte 4.294.967.297. Com 64 bits são 2⁶⁴ endereços = 16 exabytes — um limite tão distante que ninguém chegou perto.'},
 {h:'Por que ainda existe a pasta "Arquivos de Programas (x86)"?', p:'Um Windows de 64 bits roda programas de 32 bits normalmente, mas precisa separá-los — eles carregam bibliotecas (DLLs) diferentes e incompatíveis. A pasta com "(x86)" no nome é onde o sistema guarda os programas antigos, mantendo a retrocompatibilidade sem confundir as versões.'}
],
quiz:{q:'Você instala 16 GB de RAM num computador com Windows de 32 bits. Quanto ele vai usar?', o:['16 GB, normalmente','Cerca de 4 GB — o resto é inacessível','8 GB, metade','Nada, o sistema não liga'], a:1, fb:'O limite de 4 GB é de endereçamento, não de hardware. Na prática o sistema mostra ainda menos (~3,2 GB), porque parte da faixa de endereços é reservada para placa de vídeo e outros dispositivos.'}
},

{
id:'cisc-risc', t:'CISC vs RISC: Duas Filosofias', tag:'Arquitetura',
lead:'Existem duas maneiras opostas de projetar o conjunto de instruções de um processador: <strong>poucas instruções que fazem muito</strong> ou <strong>muitas instruções que fazem pouco</strong>. Execute a mesma operação nos dois estilos e compare.',
w:{k:'ciscrisc'},
notes:[
 {h:'CISC — Complex Instruction Set Computer', p:'Uma única instrução <code>MULT</code> pode carregar dois valores da memória, multiplicá-los e guardar o resultado. Programas ficam curtos, mas o hardware que decodifica isso é complexo, caro e consome mais. É a filosofia do x86 (Intel e AMD).'},
 {h:'RISC — Reduced Instruction Set Computer', p:'Cada instrução faz uma coisa só e dura um ciclo de clock. O mesmo trabalho exige mais instruções, mas o hardware fica simples, previsível e muito eficiente em energia. É a filosofia do ARM — celulares, tablets, Apple Silicon e a maioria dos supercomputadores modernos.'},
 {h:'A curiosidade moderna', p:'Hoje a fronteira está borrada. Processadores x86 modernos recebem instruções CISC e as quebram internamente em <em>micro-operações</em> que funcionam exatamente como RISC. Por fora falam CISC, por dentro são RISC — o melhor dos dois mundos.'}
],
quiz:{q:'Por que a arquitetura RISC domina celulares e tablets?', o:['Porque é mais barata de licenciar','Porque instruções simples e uniformes consomem muito menos energia','Porque roda mais programas','Porque foi inventada depois'], a:1, fb:'Eficiência energética é o critério que decide em dispositivos a bateria. Hardware simples significa menos transístores chaveando por instrução — e o Apple Silicon provou que dá para ter isso sem abrir mão de desempenho.'}
},

{
id:'arquiteturas', t:'Von Neumann, Harvard e o Paralelismo', tag:'Arquitetura',
lead:'Como o processador conversa com a memória define o teto de desempenho de toda a máquina. Alterne entre as arquiteturas abaixo e observe o tráfego nos barramentos — o problema fica visível.',
w:{k:'arch'},
notes:[
 {h:'SIMD — uma instrução, muitos dados', p:'Aplicar o mesmo cálculo a milhares de dados ao mesmo tempo. É exatamente o que uma GPU faz: sombrear um milhão de pixels ou multiplicar as matrizes de uma rede neural são o mesmo problema matemático. Foi por isso que placas de vídeo viraram o hardware da inteligência artificial.'},
 {h:'MIMD — várias instruções, vários dados', p:'Cada núcleo executa um programa diferente sobre dados diferentes. É o modelo de qualquer CPU multicore e de supercomputadores — bom para tarefas independentes, não para o mesmo cálculo repetido.'},
 {h:'As fronteiras: neuromórfica e quântica', p:'A computação <strong>neuromórfica</strong> imita neurônios biológicos, com consumo energético baixíssimo para reconhecimento de padrões. A <strong>quântica</strong> usa qubits que existem em superposição (0 e 1 ao mesmo tempo) e ataca problemas de fatoração e simulação molecular impossíveis para máquinas clássicas. Nenhuma delas substitui seu PC — são ferramentas para problemas específicos.'}
],
quiz:{q:'O que é o "gargalo de Von Neumann"?', o:['A CPU esquentar demais','Instruções e dados disputarem o mesmo barramento até a memória','A falta de espaço em disco','O limite de 4 GB de RAM'], a:1, fb:'Na arquitetura de Von Neumann, instruções e dados compartilham a mesma via até a memória. A CPU frequentemente fica ociosa esperando — e é isso que a memória cache existe para amenizar.'}
}

lead:'Antes do chip de silício, guardar um único bit exigia um tubo de raios catódicos, um tubo de mercúrio ou um anel de ferrite costurado à mão. A história da RAM é a história de tornar a lembrança barata.',
w:{k:'timeline', items:[

 {y:'1948', v:1948, t:'Linha de retardo de mercúrio', d:'Pulsos sonoros percorriam um tubo cheio de mercúrio; o bit era o som viajando. Para ler um dado, era preciso esperar ele "dar a volta" — memória sem acesso aleatório de verdade.', tags:['Acústica','Sequencial'], era:'valve'},
 {y:'1953', v:1953, t:'Memória de núcleo magnético', d:'Minúsculos anéis de ferrite atravessados por fios, magnetizados em um sentido ou no outro. Não volátil, confiável e tecida à mão por operárias. Dominou por quinze anos — e é dela que vem a expressão "core dump".', tags:['Ferrite','Não volátil'], stat:'Custava cerca de US$ 1 por bit', era:'trans'},
 {y:'1966', v:1966, t:'DRAM — Robert Dennard', d:'Um transístor e um capacitor por bit. Simples, minúsculo e baratíssimo — mas o capacitor perde carga e precisa ser recarregado milhares de vezes por segundo. É o "refresh" que dá o D de Dynamic.', tags:['1T1C','IBM'], era:'ic'},
 {y:'1970', v:1970, t:'Intel 1103', d:'A primeira DRAM comercial, com 1 kbit. Em três anos tornou a memória de núcleo magnético obsoleta e fez a Intel virar uma empresa de verdade.', tags:['1 kbit','Comercial'], era:'ic'},
 {y:'anos 80', v:1985, t:'Módulos SIMM', d:'Chips soldados numa placa que você encaixa. Trocar memória deixa de ser trabalho de técnico especializado e vira algo que o usuário faz em casa.', tags:['SIMM','Modular'], era:'micro'},
 {y:'1993', v:1993, t:'SDRAM — sincronizada', d:'A memória passa a operar no mesmo relógio da placa-mãe, eliminando esperas de sincronização. Ganho de desempenho sem aumentar a frequência.', tags:['Síncrona','Clock'], era:'micro'},
 {y:'2000', v:2000, t:'DDR — dupla taxa', d:'Transfere dados na subida <em>e</em> na descida do sinal de clock: o dobro de dados na mesma frequência. Cada geração seguinte dobra novamente a largura de banda.', tags:['DDR','Double Data Rate'], era:'micro'},
 {y:'2007–2020', v:2014, t:'DDR3 e DDR4', d:'Tensão cai de 1,8 V para 1,2 V enquanto a banda multiplica. Menos energia e mais desempenho ao mesmo tempo — o padrão que sustentou a era dos notebooks.', tags:['DDR3','DDR4','1,2 V'], era:'micro'},
 {y:'2021+', v:2023, t:'DDR5, LPDDR5X e HBM', d:'DDR5 dobra a banda de novo. A LPDDR5X alimenta celulares com consumo mínimo. E a HBM empilha memória verticalmente colada à GPU — é ela que torna viável treinar modelos de IA.', tags:['DDR5','HBM','IA'], stat:'HBM3: mais de 800 GB/s por pilha', era:'ai'}

notes:[{h:'Curiosidade que coloca tudo em perspectiva', p:'O computador de bordo da Apollo 11, que levou três pessoas à Lua e as trouxe de volta em 1969, tinha cerca de <strong>72 KB de memória total</strong>. Uma única foto do seu celular ocupa cinquenta vezes isso.'}],
quiz:{q:'Por que a DRAM é chamada de "dinâmica"?', o:['Porque muda de velocidade conforme a carga','Porque os capacitores perdem carga e precisam ser recarregados constantemente','Porque pode ser trocada com o PC ligado','Porque muda de tamanho'], a:1, fb:'Cada bit é uma carga num capacitor microscópico, que vaza em milissegundos. O circuito de <em>refresh</em> reescreve todas as células milhares de vezes por segundo — sem isso, os dados evaporam.'}

{
id:'ram-rom', t:'RAM vs ROM: o Teste da Tomada', tag:'Comparação',
lead:'A diferença entre os dois tipos de memória fica óbvia num experimento de um segundo: <strong>desligue a energia</strong>. Clique no interruptor abaixo e veja o que sobrevive.',
w:{k:'powertoggle'},
notes:[
 {h:'RAM — Random Access Memory', p:'Volátil, rapidíssima, feita para leitura e escrita constantes. Guarda tudo que está acontecendo agora: abas do navegador, o documento que você ainda não salvou, o jogo aberto. Medida em gigabytes (8, 16, 32 GB).'},
 {h:'ROM — Read-Only Memory', p:'Não volátil, mais lenta, focada em leitura. Guarda as instruções essenciais para a máquina ligar — a BIOS/UEFI que testa o hardware e encontra o sistema operacional. Sem ROM, o computador não saberia nem por onde começar.'},
 {h:'Cuidado com o termo "ROM do celular"', p:'Quando alguém fala em "ROM de 128 GB" num smartphone, está usando o termo errado por hábito. Aquilo é <strong>armazenamento interno</strong> (memória flash regravável), não ROM de verdade. A ROM real do aparelho é minúscula e guarda só o bootloader.'}
],
quiz:{q:'Você está escrevendo um trabalho e ainda não salvou quando falta luz. Por que o texto se perde?', o:['O arquivo corrompeu no HD','Ele estava só na RAM, que é volátil','A ROM apagou','O sistema de arquivos travou'], a:1, fb:'Enquanto você digita, o texto vive na RAM. Salvar é justamente o ato de copiá-lo para o armazenamento não volátil (SSD/HD). Sem energia, a RAM esquece tudo em instantes.'}
},

{
id:'classificacao-mem', t:'Classificação de Memória e Armazenamento', tag:'Mapa',
lead:'Todo dispositivo de guardar bits cai em uma de duas famílias: <strong>volátil e rápido</strong> ou <strong>permanente e mais lento</strong>. Clique em cada tipo para ver onde ele mora no seu computador.',
w:{k:'memtree', branches:[

  {n:'DRAM', s:'Dynamic RAM', d:'Um transístor e um capacitor por bit. Barata o suficiente para vir em gigabytes, lenta o suficiente para precisar do cache SRAM na frente. É a memória principal — os pentes que você encaixa na placa-mãe.', k:['Memória principal','DDR4/DDR5','Precisa refresh']},
  {n:'GDDR / HBM', s:'Memória de vídeo', d:'Variantes de DRAM otimizadas para largura de banda em vez de latência. A GPU precisa mover volumes enormes de dados de uma vez — e a HBM, empilhada verticalmente, é o que viabiliza treinar redes neurais.', k:['VRAM','Alta banda','GPU e IA']}
 ]},
 {id:'sto', n:'Armazenamento — não volátil', items:[
  {n:'HDD', s:'Disco rígido magnético', d:'Pratos girando a 5.400 ou 7.200 rpm com uma cabeça de leitura que voa a nanômetros da superfície. Tem partes móveis, é lento e frágil a impacto — mas ainda é imbatível em custo por terabyte para grandes volumes.', k:['Magnético','Peças móveis','Barato por TB']},
  {n:'SSD SATA', s:'Estado sólido', d:'Memória flash NAND sem nenhuma parte móvel. Silencioso, resistente a choque e cerca de 5× mais rápido que um HD — mas limitado pela interface SATA a aproximadamente 550 MB/s.', k:['Flash NAND','~550 MB/s','SATA']},
  {n:'SSD NVMe (M.2)', s:'Conectado ao PCIe', d:'O mesmo flash, mas conversando diretamente com a CPU pelo barramento PCIe em vez do antigo protocolo SATA. Chega a 7.000 MB/s — mais de dez vezes um SSD SATA.', k:['PCIe','Até 7 GB/s','Formato M.2']},
  {n:'Removível', s:'Pendrive e cartão SD', d:'Flash NAND portátil. Prático para transporte, mas com número limitado de ciclos de escrita e controladores simples — não é mídia confiável para backup de longo prazo.', k:['Portátil','Vida útil menor','USB / SD']}
 ]}
]},
notes:[{h:'Volátil não significa ruim', p:'A volatilidade é o preço da velocidade. Uma célula SRAM mantém o bit ativamente com transístores energizados — por isso é instantânea e por isso morre sem energia. O flash guarda a carga numa "gaiola" isolada que dura anos, mas escrever nela é comparativamente lento. Não existe memória boa em tudo; existe a memória certa para cada camada.'}],
quiz:{q:'Por que a SRAM é usada como cache da CPU e não como memória principal?', o:['Porque é não volátil','Porque é rápida mas caríssima — inviável em gigabytes','Porque só a Intel a fabrica','Porque não precisa de energia'], a:1, fb:'Uma célula SRAM usa 6 transístores contra 1 transístor + 1 capacitor da DRAM. Isso a torna muito mais rápida e muitas vezes mais cara por bit — viável em megabytes de cache, impossível em gigabytes.'}

{

lead:'Nenhuma tecnologia é rápida, grande e barata ao mesmo tempo. A solução da engenharia foi <strong>empilhar</strong>: camadas pequenas e velozes perto da CPU, camadas enormes e lentas longe dela. Clique em cada nível.',

 {n:'Cache L1 / L2 / L3', w:48, c:'#346BF1', sp:'2 a 40 ciclos', cost:'Muito alto', cap:'KB a dezenas de MB', d:'SRAM dentro do chip. O L1 é minúsculo e instantâneo, o L3 é maior e compartilhado entre núcleos. Existe por um motivo só: esconder da CPU o quanto a RAM é lenta.'},
 {n:'Memória principal (RAM)', w:64, c:'#2E8B62', sp:'~200 ciclos', cost:'Médio', cap:'8 a 128 GB', d:'DRAM volátil. Guarda os programas em execução. Duzentos ciclos parece pouco, mas nesse tempo a CPU poderia ter feito centenas de operações — daí a importância do cache.'},

 {n:'Arquivamento (fita, nuvem fria)', w:100, c:'#8B7355', sp:'Segundos a minutos', cost:'Mínimo', cap:'Petabytes', d:'Fitas magnéticas LTO e armazenamento frio em nuvem. Sim, fita ainda é usada em 2026: é a mídia mais barata e durável por terabyte que existe para backup de longo prazo.'}
]},

quiz:{q:'Por que não fabricamos computadores só com registradores, que são os mais rápidos?', o:['Porque perderiam os dados','Porque o custo e o espaço físico seriam proibitivos','Porque a CPU não suportaria','Porque não funcionam com Windows'], a:1, fb:'Registradores são caríssimos por bit e ocupam área nobre dentro do chip. Uma máquina com gigabytes de registradores custaria mais que um prédio. A hierarquia existe exatamente para dar a <em>ilusão</em> de memória grande e rápida a um custo viável.'}

w:{k:'timeline', items:[

 {y:'1991', v:1991, t:'Cabeças magnetorresistivas (MR)', d:'Uma cabeça de leitura separada e muito mais sensível permite empacotar bits muito mais perto uns dos outros. A densidade dispara.', tags:['MR','Densidade'], era:'micro'},
 {y:'1997', v:1997, t:'GMR — Magnetorresistência Gigante', d:'Descoberta física premiada com o Nobel de 2007. Multiplicou a sensibilidade de leitura e viabilizou os HDs de dezenas de gigabytes que popularizaram o MP3 e o vídeo digital.', tags:['Nobel 2007','Gigante'], stat:'Prêmio Nobel de Física de 2007', era:'micro'},
 {y:'2003', v:2003, t:'Interface SATA', d:'Substitui o cabo IDE de 40 vias por um cabo fino de 7 pinos, com mais banda e conexão a quente. Simplifica a montagem de PCs de forma permanente.', tags:['SATA','7 pinos'], era:'micro'},
 {y:'2005', v:2005, t:'Gravação perpendicular (PMR)', d:'Os bits deixam de ser gravados deitados e passam a ficar "em pé" na superfície. Cabem muito mais no mesmo espaço — foi o que levou o HD doméstico de 100 GB para 1 TB.', tags:['PMR','Vertical'], era:'micro'},
 {y:'2013', v:2013, t:'HDs selados com hélio', d:'Hélio tem 1/7 da densidade do ar: menos turbulência, menos atrito e menos energia. Permite empilhar mais pratos no mesmo gabinete.', tags:['Hélio','7+ pratos'], era:'micro'},
 {y:'hoje', v:2025, t:'HAMR, MAMR e 30 TB+', d:'Um laser (HAMR) ou micro-ondas (MAMR) aquece momentaneamente o ponto de gravação, permitindo usar material magneticamente mais estável. Em 2026 a Seagate já entrega discos de 44 TB para data centers, e no varejo encontram-se modelos de 30 a 36 TB. O HD perdeu a guerra da velocidade para o SSD, mas segue imbatível em custo por terabyte.', tags:['HAMR','44 TB','Data center'], stat:'44 TB ≈ 8,8 milhões de vezes o RAMAC de 1956', era:'ai'}
]},
notes:[{h:'A cabeça que voa', p:'A cabeça de leitura de um HD moderno paira a cerca de 3 nanômetros da superfície do prato, que gira a 7.200 rpm. Em escala: é como um Boeing 747 voando a 3 milímetros do chão, a 1.000 km/h, contando cada folha de grama. Por isso derrubar um HD ligado é fatal.'}],
quiz:{q:'Por que o HD ainda é fabricado, se o SSD é muito mais rápido?', o:['Porque dura mais tempo','Porque tem custo por terabyte muito menor — essencial em data centers','Porque é mais seguro contra vírus','Porque o SSD não funciona em servidores'], a:1, fb:'Em armazenamento de grande volume — nuvem, backup, arquivamento — o que decide é o custo por terabyte, e nesse critério o HD ainda vence com folga. Velocidade só importa onde os dados são acessados o tempo todo.'}
},

{
id:'pendrive', t:'O Pendrive e o Padrão USB', tag:'Mídia',
lead:'Em 2000 um pendrive guardava 8 MB e custava caro. Vinte e cinco anos depois, o mesmo objeto guarda 2 TB — <strong>250 mil vezes mais</strong> — e você provavelmente tem um perdido numa gaveta.',
w:{k:'timeline', items:[
 {y:'1998–99', v:1999, t:'A ideia (e a briga de patentes)', d:'Três empresas reivindicam a invenção quase ao mesmo tempo: M-Systems (Israel), Netac (China) e Trek 2000 (Singapura). A disputa judicial nunca teve vencedor claro.', tags:['M-Systems','Netac','Trek 2000'], era:'micro'},
 {y:'2000', v:2000, t:'ThumbDrive — 8 MB', d:'O primeiro pendrive comercial da Trek 2000. Oito megabytes: não caberiam nem duas fotos de celular de hoje. Mesmo assim era seis vezes um disquete e não precisava de leitor especial.', tags:['8 MB','USB 1.1'], stat:'8 MB ≈ 5,5 disquetes', era:'micro'},
 {y:'2001–04', v:2003, t:'USB 2.0 e a queda do disquete', d:'480 Mbps de velocidade e capacidades que saltam de 64 MB para 512 MB. Plug and play, sem driver e sem partes móveis — o disquete perde qualquer argumento e desaparece.', tags:['480 Mbps','Fim do disquete'], era:'micro'},
 {y:'2008–13', v:2010, t:'USB 3.0 SuperSpeed', d:'5 Gbps, dez vezes mais que o 2.0, e o conector azul característico. Em 2009 a Kingston lança o marco de 128 GB; em 2013 chega o primeiro pendrive de 1 TB.', tags:['5 Gbps','128 GB','1 TB'], era:'micro'},
 {y:'2017+', v:2020, t:'USB-C e criptografia', d:'Conector reversível, capacidades de até 2 TB e criptografia AES-256 por hardware em modelos corporativos. O pendrive vira também uma ferramenta de segurança — e de risco, quando perdido.', tags:['USB-C','2 TB','AES-256'], era:'ai'},
 {y:'hoje', v:2025, t:'O declínio silencioso', d:'A nuvem e o compartilhamento por link substituíram o pendrive no dia a dia. Ele sobrevive onde a rede não chega: instalação de sistemas operacionais, ambientes isolados e transferências grandes sem internet.', tags:['Nuvem','Boot','Nicho'], era:'ai'}
]},
notes:[{h:'Cuidado: pendrive não é backup', p:'A memória flash de um pendrive comum suporta um número limitado de ciclos de escrita e pode perder a carga se ficar anos sem energia. Controladores baratos falham sem aviso. Para backup real, use pelo menos dois lugares diferentes — a regra 3-2-1: três cópias, em duas mídias, com uma fora do local.'},{h:'Cuidado com pendrives "de 8 TB" baratos', p:'O teto real de pendrives de marca conhecida hoje é de <strong>2 TB</strong>. Anúncios de 4 TB, 8 TB ou mais em marketplaces são quase sempre fraude: o firmware é adulterado para reportar uma capacidade falsa ao sistema operacional. Você copia os arquivos, o computador diz que deu certo, e meses depois descobre que tudo além dos poucos gigabytes reais virou lixo. Testar com ferramentas como o H2testw antes de confiar é hábito de técnico.'}],
quiz:{q:'O que fez o pendrive aposentar o disquete tão rapidamente entre 2001 e 2004?', o:['O preço mais baixo','Capacidade muito maior, sem partes móveis e reconhecimento automático (plug and play)','O formato colorido','A obrigatoriedade por lei'], a:1, fb:'Foi a combinação: centenas de vezes mais capacidade, resistência física (sem disco girando) e o fato de funcionar em qualquer computador sem instalar driver nenhum.'}
},

{
id:'filesystems', t:'Sistemas de Arquivos: NTFS, ext4, APFS e exFAT', tag:'Prática',
lead:'Formatar um pendrive parece detalhe até o dia em que um arquivo de 5 GB simplesmente não copia. O sistema de arquivos é o conjunto de regras de como os bits são organizados — e cada um tem limites. Teste abaixo.',
w:{k:'filecopy',
 files:[
  {n:'trabalho.docx', size:0.002, lab:'2 MB'},
  {n:'apresentacao.pptx', size:0.08, lab:'80 MB'},
  {n:'video-aula.mp4', size:3.2, lab:'3,2 GB'},
  {n:'backup-completo.iso', size:9.5, lab:'9,5 GB'}
 ],
 fss:[
  {id:'fat32', n:'FAT32', max:4, d:'Compatível com absolutamente tudo, mas com limite rígido de 4 GB por arquivo e 2 TB por partição.', os:'Todos'},
  {id:'exfat', n:'exFAT', max:99999, d:'O tradutor universal: sem limites práticos e lido por Windows, macOS e Linux. Não tem journaling, então evite remover sem ejetar.', os:'Todos'},
  {id:'ntfs', n:'NTFS', max:99999, d:'Padrão do Windows. Permissões por usuário, journaling e compressão. O macOS lê mas não escreve sem software extra.', os:'Windows'},
  {id:'ext4', n:'ext4', max:99999, d:'Padrão do Linux. Diferencia maiúsculas de minúsculas e é muito eficiente com milhares de arquivos pequenos. Windows não lê nativamente.', os:'Linux'},
  {id:'apfs', n:'APFS', max:99999, d:'Padrão do macOS desde 2017. Otimizado para SSD, com clonagem instantânea de arquivos e snapshots para backup. Windows não lê.', os:'macOS'}
 ]},
notes:[
 {h:'O erro clássico da vida real', p:'Você formata um pendrive em FAT32 porque "funciona em tudo", copia um filme de 5 GB e recebe "o arquivo é grande demais para o sistema de arquivos de destino". Não é falta de espaço — é o teto de 4 GB por arquivo do FAT32, herdado de 1996. A solução é exFAT.'},
 {h:'Resumo prático para decorar', p:'Pendrive que vai circular entre computadores diferentes → <strong>exFAT</strong>. HD interno de Windows → <strong>NTFS</strong>. Linux → <strong>ext4</strong>. Mac → <strong>APFS</strong>. Cartão de câmera pequeno → FAT32 ainda serve.'}
],
quiz:{q:'Qual sistema de arquivos você deve usar num HD externo que vai ser usado em Windows, Mac e Linux, com arquivos grandes?', o:['FAT32','NTFS','exFAT','ext4'], a:2, fb:'O exFAT foi criado exatamente para isso: sem o limite de 4 GB do FAT32 e com suporte nativo de leitura e escrita nos três sistemas — algo que NTFS, ext4 e APFS não oferecem.'}
}

MODULES.push({
id:'so', name:'Sistemas Operacionais', topics:[

{
id:'camadas-so', t:'As Camadas: do Hardware até Você', tag:'Conceito',
lead:'Entre o seu clique e o transístor que muda de estado existem quatro camadas bem definidas. Cada uma só conversa com a vizinha — e é essa separação que impede que um programa mal escrito derrube a máquina inteira.',
w:{k:'stack', kind:'os', levels:[
 {n:'Usuário', s:'Você, o operador', d:'Quem tem a intenção. Você não fala com o hardware — você fala com um programa, e é ele que traduz seu desejo em chamadas de sistema.', protos:['Clique','Toque','Teclado','Voz']},
 {n:'Software de aplicação', s:'Navegador, editor, jogo', d:'Os programas que resolvem seu problema. Nenhum deles sabe como escrever num SSD ou desenhar um pixel — para isso pedem ao sistema operacional através de chamadas de sistema (system calls).', protos:['Chrome','Word','VS Code','Photoshop']},
 {n:'Sistema operacional', s:'Interface, arquivos, segurança', d:'A camada de serviços: gerencia janelas, organiza arquivos em pastas, controla contas e permissões, instala programas. É a parte do SO que você enxerga e configura.', protos:['Explorer','Permissões','Serviços']},
 {n:'Kernel', s:'O núcleo, o maestro', d:'O coração do sistema. Decide qual processo usa a CPU e por quanto tempo (escalonamento), aloca e protege a memória, e é o único que tem permissão para conversar diretamente com o hardware.', protos:['Escalonador','Memória','Syscalls']},
 {n:'Drivers', s:'Tradutores de hardware', d:'Cada peça de hardware fala uma língua própria. O driver é o dicionário: converte o pedido genérico do kernel ("escreva esses bytes") no comando específico daquele modelo de placa ou impressora.', protos:['GPU','Rede','Áudio','USB']},
 {n:'Hardware', s:'A fundação física', d:'CPU, memória, barramentos, discos. Onde os elétrons realmente se movem. Tudo acima é abstração construída para tornar isso utilizável por seres humanos.', protos:['CPU','RAM','SSD','I/O']}
]},
notes:[{h:'Por que essa separação existe', p:'Se qualquer programa pudesse falar direto com o hardware, um erro num jogo poderia sobrescrever a memória do seu banco. O kernel roda em <em>modo privilegiado</em> e os programas em <em>modo usuário</em>; a única ponte entre os dois são as chamadas de sistema, que o kernel valida uma por uma. Essa fronteira é a base de toda a segurança de um sistema operacional.'}],
quiz:{q:'Qual camada é a única autorizada a conversar diretamente com o hardware?', o:['O software de aplicação','O kernel','A interface gráfica','O usuário'], a:1, fb:'O kernel roda em modo privilegiado e é o único com acesso direto ao hardware. Aplicações precisam pedir por meio de chamadas de sistema — que o kernel valida antes de executar.'}
},

{
id:'windows', t:'Windows: 40 Anos de Interface', tag:'Sistema',
lead:'De uma casca gráfica sobre o MS-DOS até um sistema com IA integrada. O Windows é o caso mais visível de como <strong>compatibilidade com o passado</strong> pode ser a maior força e o maior peso de um produto.',
w:{k:'timeline', items:[
 {y:'1985', v:1985, t:'Windows 1.0', d:'Nem era um sistema operacional: era um programa gráfico que rodava por cima do MS-DOS. As janelas não podiam nem se sobrepor — ficavam lado a lado, como azulejos.', tags:['Sobre MS-DOS','Sem sobreposição'], era:'micro'},
 {y:'1990', v:1990, t:'Windows 3.0 e 3.1', d:'O primeiro sucesso comercial de verdade. Gerenciador de Programas, suporte a memória estendida e — decisivo para a adoção — o Paciência, que ensinou milhões de pessoas a usar o mouse.', tags:['3.x','Sucesso comercial'], era:'micro'},
 {y:'1995', v:1995, t:'Windows 95 — o divisor de águas', d:'Menu Iniciar, Barra de Tarefas, nomes de arquivo longos e Plug and Play. A campanha de lançamento usou "Start Me Up" dos Rolling Stones e pessoas fizeram fila na madrugada. Vendeu 7 milhões de cópias em cinco semanas.', tags:['Menu Iniciar','Barra de Tarefas','Plug and Play'], stat:'7 milhões de cópias em 5 semanas', era:'micro'},
 {y:'1998', v:1998, t:'Windows 98', d:'Suporte a USB que funcionava de verdade e o Internet Explorer integrado ao sistema — decisão que geraria o maior processo antitruste da história da tecnologia.', tags:['USB','IE integrado','Antitruste'], era:'micro'},
 {y:'2000', v:2000, t:'Windows ME', d:'Voltado ao uso doméstico e multimídia, mas instável e cheio de bugs. É lembrado como a pior versão já lançada — e a última da linha baseada em MS-DOS.', tags:['Instável','Fim do DOS'], era:'micro'},
 {y:'2001', v:2001, t:'Windows XP', d:'Unifica a linha doméstica com o núcleo NT (estável, de servidor). O resultado foi tão bom que muita gente se recusou a atualizar por mais de uma década — a Microsoft teve que estender o suporte até 2014.', tags:['Núcleo NT','Longevidade'], stat:'13 anos de suporte oficial', era:'micro'},
 {y:'2007', v:2007, t:'Windows Vista', d:'Traz o visual Aero Glass e o UAC (controle de conta de usuário), um avanço real de segurança. Mas exigia hardware que quase ninguém tinha e ficou marcado como lento.', tags:['Aero','UAC','Pesado'], era:'micro'},
 {y:'2009', v:2009, t:'Windows 7', d:'O Vista corrigido: mesma base, muito mais leve e rápido. Recuperou a confiança e virou o queridinho de uma geração inteira de usuários.', tags:['Estável','Amado'], era:'micro'},
 {y:'2012', v:2012, t:'Windows 8', d:'Aposta radical no toque: tela inicial com blocos dinâmicos e sem Menu Iniciar. Em desktop com mouse foi rejeitado com força, e o 8.1 trouxe o botão de volta às pressas.', tags:['Blocos','Sem Iniciar','Rejeitado'], era:'micro'},
 {y:'2015', v:2015, t:'Windows 10', d:'"Windows como serviço": atualizações contínuas em vez de versões numeradas. A Microsoft anunciou que seria "a última versão do Windows" — e voltou atrás seis anos depois.', tags:['Como serviço','Atualização contínua'], era:'micro'},
 {y:'2021+', v:2024, t:'Windows 11 e o Copilot', d:'Menu Iniciar centralizado, exigência de TPM 2.0 para segurança por hardware e integração profunda de IA generativa através do Copilot. Os PCs Copilot+ trazem NPU dedicada.', tags:['TPM 2.0','Copilot','NPU'], era:'ai'}
]},
notes:[{h:'O peso da retrocompatibilidade', p:'Um programa compilado para Windows 95 tem boa chance de ainda rodar no Windows 11. Isso é quase único na indústria e é a razão de o Windows dominar o ambiente corporativo — mas também explica por que o sistema carrega décadas de código antigo, com todas as brechas de segurança que vêm junto.'}],
quiz:{q:'Qual foi a maior mudança técnica do Windows XP em relação ao Windows ME?', o:['A interface azul','Adotou o núcleo NT, muito mais estável, na linha doméstica','Passou a ter Menu Iniciar','Incluiu o Internet Explorer'], a:1, fb:'Até o ME, a linha doméstica ainda dependia do MS-DOS. O XP unificou tudo sobre o kernel NT — projetado para servidores, com memória protegida de verdade. Daí veio o salto de estabilidade.'}
},

{
id:'linux', t:'Linux: o Hobby que Domina o Mundo', tag:'Sistema',
lead:'"Estou fazendo um sistema operacional livre (só um hobby, nada grande e profissional como o GNU)." Foi assim que Linus Torvalds anunciou o Linux em 1991. Hoje ele roda em <strong>todos os 500 maiores supercomputadores</strong> do planeta — sem exceção, desde 2017.',
w:{k:'timeline', items:[
 {y:'1991', v:1991, t:'O anúncio no comp.os.minix', d:'Um estudante finlandês de 21 anos publica num grupo de discussão que está escrevendo um kernel por diversão. A mensagem termina pedindo sugestões — e centenas de pessoas respondem com código.', tags:['Torvalds','Kernel','Hobby'], era:'micro'},
 {y:'1992', v:1992, t:'Licença GNU GPL', d:'A decisão mais importante da história do projeto. A GPL garante que qualquer melhoria feita por qualquer pessoa volte para a comunidade. Empresas passam a poder usar sem medo de perder o acesso.', tags:['GPL','Software Livre'], stat:'A licença que viabilizou tudo', era:'micro'},
 {y:'1993–94', v:1994, t:'Slackware, Debian e o kernel 1.0', d:'Surgem as primeiras distribuições — o kernel empacotado com programas, instalador e gerenciador de pacotes. Debian nasce com um compromisso formal com software livre que sobrevive até hoje.', tags:['Slackware','Debian','v1.0'], era:'micro'},
 {y:'1996', v:1996, t:'Tux, o pinguim', d:'Torvalds escolhe um pinguim como mascote, inspirado por ter sido bicado por um no zoológico australiano. Um mascote simpático parece detalhe, mas ajudou a tirar do Linux a fama de coisa só para especialistas.', tags:['Tux','Mascote'], era:'micro'},
 {y:'1998', v:1998, t:'IBM e Oracle entram', d:'Gigantes corporativas começam a investir bilhões. O Linux deixa de ser projeto de entusiastas e vira infraestrutura crítica de negócios.', tags:['IBM','Oracle','Corporativo'], era:'micro'},
 {y:'2004', v:2004, t:'Ubuntu', d:'Mark Shuttleworth financia uma distribuição com foco em facilidade de uso e ciclo de lançamento previsível. É o Linux que tenta — com sucesso parcial — chegar ao desktop comum.', tags:['Canonical','Desktop','Usabilidade'], era:'micro'},
 {y:'2008', v:2008, t:'Android', d:'O Google constrói o Android sobre o kernel Linux. De repente, bilhões de pessoas carregam Linux no bolso sem saber. É de longe a maior base instalada do kernel: o Google anunciou mais de 3 bilhões de aparelhos ativos em 2021 e nunca mais atualizou o número oficialmente — estimativas de mercado hoje falam em cerca de 4 bilhões.', tags:['Google','Bilhões','Móvel'], stat:'3 bi anunciados em 2021 · ~4 bi estimados hoje', era:'micro'},
 {y:'2011+', v:2015, t:'A nuvem é Linux', d:'AWS, Azure e Google Cloud rodam sobre Linux. Contêineres Docker e Kubernetes — a base da computação moderna — são tecnologias nativas do kernel Linux.', tags:['AWS','Docker','Kubernetes'], stat:'~92% dos sites rodam em servidores tipo Unix', era:'micro'},
 {y:'hoje', v:2025, t:'Presença global', d:'Servidores, supercomputadores, roteadores, TVs, carros, satélites, o rover Perseverance em Marte e o helicóptero Ingenuity. Praticamente tudo que não é um PC de mesa ou um iPhone roda Linux.', tags:['Onipresente','Embarcado','Marte'], stat:'500 dos 500 maiores supercomputadores', era:'ai'}
]},
notes:[{h:'Kernel não é distribuição', p:'O <strong>Linux</strong> é apenas o kernel — cerca de 30 milhões de linhas de código que falam com o hardware. Uma <strong>distribuição</strong> (Ubuntu, Fedora, Debian) é o kernel + utilitários GNU + interface gráfica + gerenciador de pacotes. Por isso muitos insistem no nome "GNU/Linux": metade do sistema que você usa não é o kernel.'}],
quiz:{q:'Qual decisão de 1992 foi determinante para o crescimento do Linux?', o:['A criação do mascote Tux','A adoção da licença GNU GPL','O lançamento do Ubuntu','O apoio da IBM'], a:1, fb:'A GPL obriga quem distribui uma versão modificada a liberar o código dela. Isso criou um ciclo em que toda melhoria volta para o projeto — e deu às empresas a garantia de que nunca perderiam o acesso ao que financiaram.'}
},

{
id:'macos', t:'macOS: Quatro Eras de Nomes', tag:'Sistema',
lead:'O macOS é o único sistema de grande porte cujo histórico de versões pode ser contado pelos <strong>nomes</strong>: primeiro números, depois felinos, depois pontos turísticos da Califórnia. Cada mudança de nome marca uma virada técnica real.',
w:{k:'timeline', items:[
 {y:'1984', v:1984, t:'System 1 — o Macintosh 128K', d:'A primeira interface gráfica comercial de sucesso, com mouse, ícones, janelas e a metáfora da lixeira. Rodava em 128 KB de RAM e não tinha multitarefa nem pastas de verdade.', tags:['GUI','Mouse','128 KB'], era:'micro'},
 {y:'1991', v:1991, t:'System 7', d:'Cores, multitarefa cooperativa e o Finder como conhecemos. Ficou tanto tempo em uso que virou sinônimo de "Mac clássico".', tags:['Cores','Multitarefa'], era:'micro'},
 {y:'1997–99', v:1998, t:'Mac OS 8 e 9 — o fim da era clássica', d:'Jobs volta à Apple e encontra um sistema tecnicamente esgotado: sem memória protegida, um programa travado derrubava a máquina. O Mac OS 9 é o último dessa linhagem.', tags:['Retorno de Jobs','Fim do clássico'], era:'micro'},
 {y:'2001', v:2001, t:'Mac OS X 10.0 Cheetah', d:'Reconstrução total sobre o NeXTSTEP, com núcleo Unix (BSD). Ganha memória protegida, multitarefa real e um terminal Unix de verdade — o que fez o Mac virar máquina preferida de desenvolvedores.', tags:['Unix','BSD','NeXTSTEP'], stat:'A base Unix que o Mac usa até hoje', era:'micro'},
 {y:'2002–07', v:2005, t:'Jaguar, Panther, Tiger, Leopard', d:'A era dos grandes felinos amadurece o sistema: Spotlight (busca instantânea em todo o disco), Dashboard, Exposé e o Time Machine — backup automático que qualquer pessoa consegue usar.', tags:['Spotlight','Time Machine','Exposé'], era:'micro'},
 {y:'2009', v:2009, t:'Snow Leopard', d:'Uma versão inteira dedicada a não adicionar recursos: só otimização, correção e redução de tamanho. Virou lenda entre usuários justamente por isso.', tags:['Otimização','Sem novidades'], era:'micro'},
 {y:'2013', v:2013, t:'Mavericks — os felinos acabam', d:'A Apple esgota os grandes felinos e passa a usar pontos turísticos da Califórnia. Também torna o sistema gratuito, algo inédito para um SO pago de desktop.', tags:['Califórnia','Gratuito'], era:'micro'},
 {y:'2014–19', v:2017, t:'Yosemite a Catalina', d:'Design flat alinhado ao iOS, mudança de nome para "macOS", sistema de arquivos APFS otimizado para SSD, Modo Escuro e o fim do iTunes, dividido em três aplicativos.', tags:['APFS','Modo Escuro','Flat'], era:'micro'},
 {y:'2020', v:2020, t:'Big Sur e o Apple Silicon', d:'A Apple abandona os processadores Intel e passa a usar seus próprios chips ARM (M1). O ganho de desempenho por watt é tão grande que força toda a indústria a repensar a arquitetura dos notebooks.', tags:['M1','ARM','Transição'], stat:'Terceira mudança de arquitetura da Apple', era:'micro'},
 {y:'2021–24', v:2023, t:'Monterey a Sequoia', d:'Stage Manager para organizar janelas, widgets na área de trabalho, continuidade com iPhone e iPad, e a chegada da Apple Intelligence — IA generativa processada no próprio aparelho.', tags:['Apple Intelligence','Continuidade'], era:'ai'},
 {y:'2025–26', v:2026, t:'macOS 26 Tahoe — a numeração muda', d:'A Apple abandona a sequência de versões e passa a numerar pelo ano, pulando direto do macOS 15 para o <strong>macOS 26</strong>, para alinhar todos os seus sistemas sob o mesmo número. Vem com a nova linguagem visual Liquid Glass. O sucessor, macOS 27, já está anunciado.', tags:['macOS 26','Tahoe','Numeração por ano'], stat:'Do macOS 15 direto para o 26 — alinhado ao ano', era:'ai'}
]},
notes:[{h:'O macOS é Unix certificado', p:'Não é "parecido com Unix": o macOS tem certificação UNIX 03 formal do The Open Group. Isso significa que abrir o Terminal do Mac te dá o mesmo ambiente de comandos de um servidor Linux — e é a razão real de tantos desenvolvedores usarem MacBook para trabalhar com servidores que rodam Linux.'}],
quiz:{q:'Qual foi a mudança técnica mais profunda da história do macOS?', o:['A adoção do Modo Escuro','A reconstrução sobre o núcleo Unix (NeXTSTEP) no Mac OS X, em 2001','O fim do iTunes','O sistema de arquivos APFS'], a:1, fb:'O Mac OS X jogou fora o sistema clássico inteiro e recomeçou sobre uma base Unix. Foi essa mudança que trouxe memória protegida, multitarefa real e o terminal — a fundação de tudo que veio depois.'}
},

{
id:'estrutura-dirs', t:'Onde os Arquivos Moram', tag:'Prática',
lead:'Cada sistema organiza o disco de um jeito, e conhecer essa lógica é o que separa quem usa o computador de quem o administra. Clique nas pastas para entender a função de cada uma.',
w:{k:'dirtree', cols:[
 {os:'Windows', root:'C:\\', items:[
  {n:'C:\\', d:'A raiz do disco principal. O Windows herdou do MS-DOS a ideia de dar uma letra para cada unidade — C: é o disco do sistema porque A: e B: eram os disquetes.'},
  {n:'  Windows\\', d:'O sistema operacional propriamente dito: executáveis, bibliotecas DLL, drivers. Mexer aqui manualmente é quase sempre má ideia.'},

{
id:'servidores', t:'Windows Server vs Linux Server', tag:'Servidores',
lead:'Um servidor entrega serviços — arquivos, sites, autenticação, banco de dados. Os dois mundos fazem exatamente as mesmas coisas, com nomes e filosofias diferentes. Alterne abaixo para ver o equivalente de cada serviço.',
w:{k:'services', rows:[
 {k:'Compartilhamento de arquivos', win:'SMB / CIFS (nativo)', lin:'Samba ou NFS', d:'O Samba existe justamente para falar o protocolo SMB da Microsoft a partir do Linux — é o que permite um servidor Linux servir arquivos para PCs Windows sem que ninguém perceba.'},
 {k:'Servidor web', win:'IIS (Internet Information Services)', lin:'Apache ou Nginx', d:'O Nginx domina a internet moderna por lidar melhor com muitas conexões simultâneas usando menos memória que o Apache.'},
 {k:'Domínio e usuários', win:'Active Directory (AD)', lin:'OpenLDAP ou FreeIPA', d:'O Active Directory é o maior trunfo do Windows Server: centraliza contas, senhas e políticas de todos os computadores da rede num só lugar, com interface gráfica.'},
 {k:'Distribuição de IPs', win:'DHCP Server', lin:'ISC-DHCP ou Kea', d:'Ambos entregam endereços IP automaticamente aos dispositivos que entram na rede. Mesma função, mesmo protocolo.'},
 {k:'Resolução de nomes', win:'DNS Server', lin:'BIND9 ou Unbound', d:'O BIND é o servidor DNS mais antigo e usado da internet. No Windows, DNS e Active Directory são inseparáveis.'},
 {k:'Banco de dados', win:'SQL Server', lin:'MySQL, PostgreSQL ou MariaDB', d:'O PostgreSQL virou padrão em aplicações novas por ser gratuito, robusto e com recursos avançados. O SQL Server é forte em ambientes corporativos Microsoft.'},
 {k:'Acesso remoto', win:'RDP (Área de Trabalho Remota)', lin:'SSH (terminal) ou VNC (gráfico)', d:'O RDP entrega a área de trabalho inteira. O SSH entrega só o terminal — o que consome pouquíssima banda e é o motivo de administradores Linux conseguirem trabalhar de qualquer lugar.'},
 {k:'E-mail', win:'Microsoft Exchange', lin:'Postfix, Exim ou Zimbra', d:'Manter um servidor de e-mail próprio é raro hoje: a maioria das empresas usa Microsoft 365 ou Google Workspace por causa da complexidade de reputação e antispam.'},
 {k:'Virtualização', win:'Hyper-V', lin:'KVM ou Proxmox VE', d:'O KVM está dentro do próprio kernel Linux e é a base de praticamente toda a nuvem pública mundial.'},
 {k:'Contêineres', win:'Windows Containers', lin:'Docker, Podman, Kubernetes', d:'Contêineres são tecnologia nativa do Linux (cgroups e namespaces). O Windows implementou sua versão depois, e a maioria das imagens ainda é Linux.'}

 {h:'Quando escolher Windows Server', p:'Quando a empresa já vive no ecossistema Microsoft, precisa de Active Directory para gerenciar centenas de PCs Windows, e a equipe de TI trabalha melhor com interface gráfica. O custo é licença por servidor e por usuário (CAL).'},

 {h:'A analogia do garçom', p:'O servidor é um garçom que fala dois idiomas. Windows e Linux são idiomas diferentes, com sotaques e ferramentas próprias. Mas o prato que chega à mesa — o arquivo compartilhado, a página web, o endereço IP — é exatamente o mesmo.'}
],

{
id:'rede-composicao', t:'Do que é Feita uma Rede', tag:'Fundamento',
lead:'Toda rede — do seu Wi-Fi de casa a um data center — é feita das mesmas três coisas: <strong>dispositivos</strong>, <strong>meios de transmissão</strong> e <strong>protocolos</strong>. Falta um dos três e nada funciona.',
w:{k:'netmap'},
notes:[
 {h:'Dispositivos finais (hosts)', p:'Onde a informação nasce ou termina: notebook, celular, servidor, impressora, câmera. Cada um precisa de uma placa de rede e de um endereço IP para ser encontrado.'},
 {h:'Dispositivos intermediários', p:'Não geram informação — encaminham. O <strong>switch</strong> conecta máquinas dentro da mesma rede local usando endereços MAC. O <strong>roteador</strong> liga redes diferentes entre si e é sua porta para a internet. O <strong>access point</strong> transforma o cabo em Wi-Fi.'},
 {h:'Meios de transmissão', p:'<strong>Guiados</strong>: par trançado (o cabo azul de rede, até 100 m), fibra óptica (luz, quilômetros, imune a interferência) e coaxial (legado de TV a cabo). <strong>Não guiados</strong>: Wi-Fi, Bluetooth, 4G/5G — práticos, mas sujeitos a interferência e compartilhamento de banda.'},
 {h:'Protocolos', p:'As regras que todo mundo aceitou seguir. A pilha TCP/IP tem quatro camadas: Aplicação (HTTP, FTP), Transporte (TCP, UDP), Internet (IP) e Acesso à Rede. Sem esse acordo comum, dois computadores conectados fisicamente ainda assim não se entenderiam.'}
],
quiz:{q:'Qual a diferença fundamental entre um switch e um roteador?', o:['O switch é mais rápido','O switch conecta máquinas dentro da mesma rede local; o roteador liga redes diferentes','O roteador só funciona com Wi-Fi','Não há diferença técnica'], a:1, fb:'O switch trabalha na camada 2, com endereços MAC, dentro de uma LAN. O roteador trabalha na camada 3, com endereços IP, decidindo por qual caminho um pacote sai da sua rede para chegar a outra.'}
},

{
id:'osi', t:'O Modelo OSI: as 7 Camadas', tag:'Modelo',
lead:'O modelo OSI divide a comunicação em sete camadas independentes. Não é burocracia acadêmica: é o que permite trocar o Wi-Fi por cabo sem reescrever o navegador. Clique em cada camada para ver protocolos e ataques típicos.',

 {n:'Física', s:'Bits brutos no meio', pdu:'Bits', d:'Define voltagem, frequência, tipo de conector e como um 1 se distingue de um 0 no fio, na fibra ou no ar. Nenhuma inteligência: só sinal.', protos:['RJ45','Fibra óptica','Ondas de rádio','Hub'], attack:'<b>Ataques:</b> grampo físico no cabo, jamming (interferência proposital de Wi-Fi), acesso não autorizado à sala de equipamentos.'},
 {n:'Enlace', s:'Endereço MAC e acesso ao meio', pdu:'Quadro (Frame)', d:'Organiza os bits em quadros e cuida do endereçamento físico. Cada placa de rede tem um endereço MAC único de fábrica. É a camada do switch.', protos:['Ethernet','Wi-Fi 802.11','ARP','Switch'], attack:'<b>Ataques:</b> ARP Spoofing (fingir ser o roteador para interceptar tráfego) e MAC Flooding (inundar o switch até ele repassar tudo para todos).'},
 {n:'Rede', s:'Endereçamento lógico e roteamento', pdu:'Pacote', d:'Aqui vive o endereço IP. É a camada que decide o caminho que um pacote percorre entre redes — o trabalho do roteador. Sem ela não existiria internet.', protos:['IPv4','IPv6','ICMP','IPsec','Roteador'], attack:'<b>Ataques:</b> DDoS por inundação de ICMP, IP Spoofing (falsificar o endereço de origem) e fragmentação maliciosa de pacotes.'},
 {n:'Transporte', s:'Entrega fim a fim', pdu:'Segmento', d:'Escolhe entre confiabilidade e velocidade. O <strong>TCP</strong> confirma cada pedaço, reordena e retransmite o que se perdeu. O <strong>UDP</strong> dispara sem confirmar — ideal para vídeo ao vivo e jogos, onde chegar atrasado é pior que não chegar.', protos:['TCP','UDP','Portas','Controle de fluxo'], attack:'<b>Ataques:</b> TCP SYN Flood — abrir milhares de conexões incompletas até esgotar a memória do servidor.'},
 {n:'Sessão', s:'Abre, mantém e encerra o diálogo', pdu:'Dados', d:'Controla o início, a manutenção e o fim de uma conversa entre duas aplicações. É quem garante que sua sessão de login continue válida enquanto você navega.', protos:['NetBIOS','RPC','Sockets','Sessões'], attack:'<b>Ataques:</b> sequestro de sessão (session hijacking) — roubar o cookie ou token que identifica sua sessão já autenticada.'},
 {n:'Apresentação', s:'Traduz, comprime, criptografa', pdu:'Dados', d:'Converte os dados para um formato que a aplicação entenda: codificação de caracteres, compressão de imagem e — o mais importante hoje — criptografia TLS. O "s" do HTTPS mora aqui.', protos:['TLS/SSL','JPEG','ASCII','UTF-8'], attack:'<b>Ataques:</b> downgrade de TLS (forçar uma versão fraca da criptografia) e certificados forjados.'},
 {n:'Aplicação', s:'A interface com o usuário', pdu:'Dados', d:'A camada que você enxerga: navegador, cliente de e-mail, aplicativo. Não é o programa em si — é o protocolo que ele fala.', protos:['HTTP/HTTPS','DNS','SMTP','FTP','SSH'], attack:'<b>Ataques:</b> SQL Injection, XSS, abuso de API. É de longe a camada mais atacada, porque é a que aceita entrada humana.'}

notes:[

 {h:'OSI é modelo, TCP/IP é o que roda', p:'Na prática a internet usa a pilha TCP/IP, de quatro camadas. O OSI, com sete, continua sendo ensinado porque é uma ferramenta de diagnóstico melhor: quando algo quebra, perguntar "em que camada isso falhou?" reduz o problema pela metade a cada resposta.'}
],
quiz:{q:'Um site está fora do ar e o comando ping para o IP dele responde normalmente. Qual camada provavelmente está com problema?', o:['Camada 1 — Física','Camada 3 — Rede','Camada 7 — Aplicação','Camada 2 — Enlace'], a:2, fb:'Se o ping responde, as camadas 1, 2 e 3 estão funcionando: o pacote chega até a máquina. O problema está acima — provavelmente o serviço web (camada 7) parou. Esse raciocínio camada a camada é a base do diagnóstico de rede.'}

{

lead:'Sua mensagem não viaja sozinha. A cada camada que desce, ela ganha um envelope novo com informações de entrega. Execute a animação e acompanhe a mensagem sendo embrulhada — e desembrulhada do outro lado.',

 {h:'O plano de endereçamento', p:'A rede é <code>192.168.1.0/24</code> — ou seja, 254 endereços utilizáveis, de .1 a .254. A convenção mais comum reserva os primeiros para infraestrutura: <strong>.1</strong> para o gateway, <strong>.10 a .49</strong> para servidores e impressoras (IPs fixos), e <strong>.50 a .200</strong> para o DHCP distribuir automaticamente às estações.'},
 {h:'Por que servidores têm IP fixo', p:'Porque outros dispositivos precisam encontrá-los sempre no mesmo lugar. Se o servidor de arquivos mudasse de IP toda vez que reiniciasse, todos os atalhos e configurações da empresa quebrariam. Estações de trabalho não têm esse problema — ninguém precisa "achar" o PC da recepção.'},

{

lead:'Virtualizar é usar software para <strong>fatiar uma máquina física em várias máquinas lógicas</strong>, cada uma achando que tem o computador só para si. Distribua os recursos do servidor abaixo entre as máquinas virtuais e veja o que acontece quando você exagera.',

notes:[
 {h:'Por que isso mudou a TI', p:'Antes da virtualização, cada serviço exigia um servidor físico próprio — e a maioria ficava com 10% de uso. Você comprava, alimentava e refrigerava dez máquinas para fazer o trabalho de duas. A virtualização consolidou isso e derrubou o custo de infraestrutura em ordens de grandeza.'},
 {h:'Os quatro ganhos principais', p:'<strong>Custo</strong> — menos hardware, menos energia, menos refrigeração. <strong>Isolamento</strong> — se uma VM for invadida ou travar, as outras continuam intactas. <strong>Portabilidade</strong> — uma VM é um arquivo: dá para copiar, mover para outro servidor e restaurar em minutos. <strong>Snapshots</strong> — congele o estado antes de uma atualização e volte no tempo se algo der errado.'},
 {h:'Virtualização não é nuvem', p:'A virtualização é a <em>tecnologia</em> que cria ambientes virtuais. A nuvem é o <em>modelo de negócio</em> que entrega esses ambientes pela internet, sob demanda e com cobrança por uso. Toda nuvem usa virtualização, mas nem toda virtualização é nuvem — o servidor virtualizado no armário da sua empresa também é virtualização.'}
],
quiz:{q:'O que acontece se você alocar mais memória RAM às VMs do que o servidor físico possui?', o:['O hypervisor cria memória extra automaticamente','As VMs passam a usar disco como memória, ficando muito lentas, ou nem iniciam','O servidor desliga','Nada, o hypervisor divide igualmente'], a:1, fb:'Isso se chama <em>overcommit</em>. O hypervisor pode permitir, apostando que nem toda VM usará seu máximo ao mesmo tempo — mas se usarem, o sistema recorre a swap em disco e o desempenho despenca.'}
},

{

lead:'Existem três maneiras de rodar ambientes isolados, e a diferença está em <strong>quantas camadas existem entre o software e o hardware</strong>. Alterne abaixo e compare as pilhas.',
w:{k:'hypervisor', modes:[

quiz:{q:'Por que um contêiner sobe em segundos e uma máquina virtual leva minutos?', o:['O contêiner usa hardware mais rápido','O contêiner compartilha o kernel do host e não precisa iniciar um sistema operacional inteiro','A VM tem mais segurança','O contêiner roda em memória RAM'], a:1, fb:'Uma VM precisa fazer o boot de um sistema operacional completo — kernel, drivers, serviços. O contêiner é apenas um processo isolado usando o kernel que já está rodando: por isso a diferença de tempo e de tamanho.'}

{

lead:'A IA não nasceu em 2022. Ela tem setenta anos de história, dois "invernos" em que quase morreu, e uma virada recente que pegou até os especialistas de surpresa.',
w:{k:'timeline', items:[
 {y:'1950', v:1950, t:'O Teste de Turing', d:'Alan Turing propõe trocar a pergunta "máquinas podem pensar?" por uma verificável: uma máquina consegue conversar de forma indistinguível de um humano? A pergunta definiu o campo por sete décadas.', tags:['Turing','Filosofia'], era:'valve'},
 {y:'1956', v:1956, t:'Conferência de Dartmouth', d:'John McCarthy cunha o termo "inteligência artificial" e reúne os pesquisadores fundadores. A previsão do grupo era resolver o problema em um verão. Erraram por décadas.', tags:['McCarthy','Nascimento'], era:'trans'},
 {y:'1966–74', v:1970, t:'ELIZA e o otimismo inicial', d:'Um programa de 200 linhas simula um psicoterapeuta apenas reformulando as frases do usuário como perguntas. Muita gente se convenceu de que ELIZA entendia — a primeira lição sobre como confundimos fluência com compreensão.', tags:['ELIZA','Simbólica'], era:'ic'},
 {y:'1974–80', v:1977, t:'O primeiro inverno da IA', d:'As promessas não se cumprem, o financiamento seca. O problema era real: os computadores da época não tinham nem poder de processamento nem dados suficientes.', tags:['Inverno','Corte de verbas'], era:'ic'},
 {y:'1980s', v:1985, t:'Sistemas especialistas', d:'A abordagem muda: em vez de inteligência geral, sistemas com milhares de regras "se-então" escritas por especialistas humanos para um domínio estreito, como diagnóstico médico. Funcionavam — mas eram impossíveis de manter.', tags:['Regras','Domínio estreito'], era:'micro'},
 {y:'1997', v:1997, t:'Deep Blue vence Kasparov', d:'O computador da IBM derrota o campeão mundial de xadrez. Não havia aprendizado nenhum: era força bruta, avaliando 200 milhões de posições por segundo. Ainda assim, foi um marco simbólico enorme.', tags:['IBM','Força bruta','Xadrez'], stat:'200 milhões de posições por segundo', era:'micro'},

 {y:'2017', v:2017, t:'"Attention Is All You Need"', d:'Pesquisadores do Google publicam a arquitetura <em>Transformer</em>. É o artigo técnico que torna possível tudo que veio depois — GPT, Gemini, Claude. Poucos perceberam a importância na hora.', tags:['Transformer','Google','Artigo'], stat:'O artigo que criou a era dos LLMs', era:'micro'},
 {y:'2022–23', v:2023, t:'A explosão do ChatGPT', d:'Um chatbot construído sobre um modelo de linguagem em larga escala teria chegado a cerca de 100 milhões de usuários em dois meses — a estimativa é de analistas de mercado, não um dado oficial da OpenAI, mas mesmo com ressalvas foi a adoção mais rápida já registrada para um produto de consumo. A IA sai do laboratório e entra na conversa cotidiana.', tags:['LLM','Adoção recorde'], stat:'~100 milhões de usuários em cerca de 2 meses (estimativa)', era:'ai'},
 {y:'2024', v:2024, t:'Multimodalidade nativa', d:'Os modelos deixam de processar só texto: passam a entender imagem, áudio e vídeo no mesmo espaço de representação. Você aponta a câmera para um circuito e pergunta o que está errado.', tags:['Multimodal','Visão','Áudio'], era:'ai'},
 {y:'2025–26', v:2026, t:'Agentes e IA como infraestrutura', d:'Os modelos deixam de apenas responder e passam a <em>executar</em>: usar ferramentas, navegar, escrever e rodar código, encadear tarefas. A discussão se desloca para governança, viés algorítmico, consumo energético e impacto no trabalho.', tags:['Agentes','Ferramentas','Ética'], era:'ai'}

 {h:'Por que funcionou agora e não antes', p:'A ideia de rede neural é de 1943 e o algoritmo de retropropagação é de 1986. O que faltava eram três coisas que só existiram juntas por volta de 2012: <strong>dados</strong> em escala de internet, <strong>GPUs</strong> capazes de fazer milhões de multiplicações de matriz em paralelo, e <strong>arquiteturas</strong> melhores. A teoria esperou o hardware quarenta anos.'},
 {h:'O que discutir em sala', p:'Viés algorítmico (modelos aprendem os preconceitos dos dados de treino), autoria e direito autoral, consumo de água e energia dos data centers, e o efeito sobre profissões inteiras. Nenhuma dessas questões é técnica — todas são decisões humanas sobre como usar a ferramenta.'}
