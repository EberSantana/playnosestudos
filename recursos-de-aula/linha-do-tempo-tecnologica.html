        <button class="svc-row" data-i="${i}" style="text-align:left;cursor:pointer">
          <span class="svc-k">${esc(r.k)}</span>
          <span class="svc-v win">${esc(r.win)}</span>
          <span class="svc-v lin">${esc(r.lin)}</span>
        </button>`).join('')}
    </div>
    <div class="dt-note" id="sd" style="margin-top:14px"></div>`;
  function pick(i) {
    sel = i;
    $$('.svc-row[data-i]', stage).forEach((b, j) => b.style.borderColor = j === i ? 'var(--accent)' : '');
    $('#sd', stage).innerHTML = `<b>${esc(w.rows[i].k)}.</b> ${w.rows[i].d}`;
  }
  $('#sr', stage).addEventListener('click', e => { const b = e.target.closest('[data-i]'); if (b) pick(+b.dataset.i); });
  pick(0);
  setHint(hint, 'Clique em cada linha para entender o equivalente entre os dois mundos.');
};

/* ============================================================
   BUSCA GLOBAL
   ============================================================ */
const strip = h => String(h).replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim();
const norm = s => strip(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');

// varre recursivamente o objeto do widget colhendo todo texto legível
function harvest(v, out, depth) {
  if (depth > 6 || v == null) return out;
  if (typeof v === 'string') { if (v.length > 1 && !/^#[0-9a-f]{3,8}$/i.test(v)) out.push(v); return out; }
  if (Array.isArray(v)) { v.forEach(x => harvest(x, out, depth + 1)); return out; }
  if (typeof v === 'object') { Object.values(v).forEach(x => harvest(x, out, depth + 1)); return out; }
  return out;
}

const INDEX = FLAT.map(t => {
  const parts = [t.t, t.tag, t.mod.name, strip(t.lead)];
  (t.notes || []).forEach(n => parts.push(n.h, strip(n.p)));
  if (t.quiz) parts.push(strip(t.quiz.q), t.quiz.o.join(' '), strip(t.quiz.fb));
  harvest(t.w, parts, 0);
  const body = parts.filter(Boolean).join(' · ');
  return { id: t.id, t: t.t, mod: t.mod.name, body, n: norm(body), nt: norm(t.t) };
});

function snippet(body, terms) {
  const nb = norm(body);
  let at = -1;
  for (const term of terms) { const i = nb.indexOf(term); if (i >= 0) { at = i; break; } }
  if (at < 0) return '';
  const start = Math.max(0, at - 46);
  let s = body.slice(start, start + 150);
  if (start > 0) s = '…' + s;
  if (start + 150 < body.length) s += '…';
  let out = esc(s);
  terms.forEach(term => {
    if (!term) return;
    // marca ignorando acentos: compara posição a posição
    const no = norm(out);
    let i = no.indexOf(term), guard = 0;
    while (i >= 0 && guard++ < 8) {
      out = out.slice(0, i) + '' + out.slice(i, i + term.length) + '' + out.slice(i + term.length);
      const nn = norm(out);
      i = nn.indexOf(term, i + term.length + 2);
    }
  });
  return out.replace(//g, '<mark>').replace(//g, '</mark>');
}

function runSearch(raw) {
  const nav = $('#nav'), res = $('#results');
  const q = norm(raw);
  if (!q) { nav.hidden = false; res.hidden = true; res.innerHTML = ''; return; }
  const terms = q.split(/\s+/).filter(x => x.length > 1);
  if (!terms.length) { nav.hidden = false; res.hidden = true; return; }

  // palavra inteira vale muito mais que trecho no meio de outra palavra:
  // "ada" deve achar Ada Lovelace antes de "camada" e "alocada"
  const whole = term => new RegExp('(^|[^a-z0-9])' + term.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '([^a-z0-9]|$)');

  const hits = INDEX.map(e => {
    let score = 0, all = true;
    terms.forEach(term => {
      const w = whole(term);
      const inTitle = e.nt.includes(term), wordTitle = w.test(e.nt);
      const inBody = e.n.includes(term), wordBody = w.test(e.n);
      if (!inTitle && !inBody) all = false;
      if (wordTitle) score += 60; else if (inTitle) score += 8;
      if (wordBody) score += 10 + Math.min(12, (e.n.split(w).length - 1) * 2);
      else if (inBody) score += 0.5;
    });
    return all ? { e, score } : null;
  }).filter(Boolean).sort((a, b) => b.score - a.score || a.e.t.localeCompare(b.e.t)).slice(0, 24);

  nav.hidden = true; res.hidden = false;
  if (!hits.length) {
    res.innerHTML = `<div class="res-empty">Nada encontrado para <strong>${esc(raw)}</strong>.<br><br>A busca cobre títulos, textos, animações e questões dos 46 tópicos. Tente uma palavra mais curta.</div>`;
    return;
  }
  res.innerHTML = `<div class="res-count">${hits.length} ${hits.length === 1 ? 'tópico' : 'tópicos'}</div>` +
    hits.map((h, i) => {
      const sn = snippet(h.e.body, terms);
      return `<button class="res-item${i === 0 ? ' sel' : ''}" data-go="${h.e.id}">
        <span class="res-t">${esc(h.e.t)}</span>
        <span class="res-m">${esc(h.e.mod)}</span>
        ${sn ? `<span class="res-s">${sn}</span>` : ''}
      </button>`;
    }).join('');
}

const qEl = $('#q'), resEl = $('#results');
qEl.addEventListener('input', e => runSearch(e.target.value));
resEl.addEventListener('click', e => {
  const b = e.target.closest('[data-go]');
  if (b) { navigate(b.dataset.go); qEl.value = ''; runSearch(''); document.body.dataset.nav = ''; }
});
qEl.addEventListener('keydown', e => {
  const items = $$('.res-item', resEl);
  if (e.key === 'Escape') { qEl.value = ''; runSearch(''); qEl.blur(); return; }
  if (!items.length) return;
  let i = items.findIndex(x => x.classList.contains('sel'));
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    e.preventDefault();
    i = clamp(i + (e.key === 'ArrowDown' ? 1 : -1), 0, items.length - 1);
    items.forEach(x => x.classList.remove('sel'));
    items[i].classList.add('sel');
    items[i].scrollIntoView({ block: 'nearest' });
  }
  if (e.key === 'Enter') { e.preventDefault(); (items[i < 0 ? 0 : i]).click(); }
});

/* ============================================================
   BOOT
   ============================================================ */
buildNav();
$('#prevBtn').addEventListener('click', () => { const i = FLAT.findIndex(x => x.id === state.current); if (i > 0) navigate(FLAT[i - 1].id); });
$('#nextBtn').addEventListener('click', () => { const i = FLAT.findIndex(x => x.id === state.current); if (i < FLAT.length - 1) navigate(FLAT[i + 1].id); });
$('#menuBtn').addEventListener('click', () => { document.body.dataset.nav = document.body.dataset.nav === 'open' ? '' : 'open'; });
$('#scrim').addEventListener('click', () => { document.body.dataset.nav = ''; });

const sunIcon = '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>';
const moonIcon = '<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>';
function applyTheme(t) {
  document.documentElement.setAttribute('data-theme', t);
  $('#themeIcon').innerHTML = t === 'dark' ? sunIcon : moonIcon;
}
$('#themeBtn').addEventListener('click', () => {
  const cur = document.documentElement.getAttribute('data-theme');
  const sysDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
  const now = cur ? cur : (sysDark ? 'dark' : 'light');
  applyTheme(now === 'dark' ? 'light' : 'dark');
});
$('#themeIcon').innerHTML = window.matchMedia('(prefers-color-scheme: dark)').matches ? sunIcon : moonIcon;

$('#projBtn').addEventListener('click', () => {
  const on = document.body.dataset.proj === '1';
  document.body.dataset.proj = on ? '' : '1';
  $('#projBtn').setAttribute('aria-pressed', on ? 'false' : 'true');
});
$('#printBtn').addEventListener('click', () => window.print());

document.addEventListener('keydown', e => {
  if (/input|textarea|select/i.test(e.target.tagName)) return;
  if (e.key === '/' || (e.key === 'k' && (e.metaKey || e.ctrlKey))) {
    e.preventDefault(); document.body.dataset.nav = 'open'; qEl.focus(); qEl.select(); return;
  }
  if (e.key === 'Escape' && document.body.dataset.proj === '1') { $('#projBtn').click(); return; }
  if (e.key === 'p' || e.key === 'P') { $('#projBtn').click(); return; }
  if (e.key === 'ArrowRight') $('#nextBtn').click();
  if (e.key === 'ArrowLeft') $('#prevBtn').click();
});

navigate((location.hash || '').replace('#', '') || FLAT[0].id, true);
</script>
