<!doctype html>
<html lang="pt-BR" data-a11y-cores>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="../aparencia.js"></script>
</head>
<body>
<title>Projeto de Redes</title>
<meta name="description" content="Ambiente de estudo de Projeto de Redes com 5 módulos da metodologia Top-Down, caderno, flashcards, V ou F e PBL.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root{
  --bg:#EEF2F0; --panel:#FFFFFF; --panel-2:#F6F8F7; --ink:#16261C; --ink-2:#3F4F5B; --muted:#5B6871;
  --line:#D5DDDA; --accent:#1F5135; --accent-ink:#FFFFFF; --accent-soft:#E3EEE7;
  --ok:#23845A; --ok-soft:#DDF1E7; --bad:#C23B31; --bad-soft:#F8E0DD; --warn:#A97400; --warn-soft:#F6ECCF;
  --blue:#2A5B87; --blue-soft:#DDE8F2; --side:#16261C; --side-ink:#DCE5EA; --side-muted:#8FA1AC; --side-hi:#22313D;
  --shadow:0 1px 2px rgba(21,33,43,.06),0 4px 14px rgba(21,33,43,.06);
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Source Sans 3","Segoe UI",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0F171D; --panel:#16222B; --panel-2:#1B2933; --ink:#E4ECEF; --ink-2:#B8C6CD; --muted:#8699A4;
    --line:#2A3A45; --accent:#6BAA68; --accent-ink:#12241A; --accent-soft:#1A2D20;
    --ok:#4CC08A; --ok-soft:#153526; --bad:#F07A6F; --bad-soft:#3D1E1B; --warn:#E3B34B; --warn-soft:#3A2F12;
    --blue:#7FB0DD; --blue-soft:#1A2E40; --side:#0B140E; --side-ink:#DCE5EA; --side-muted:#7E909B; --side-hi:#1A2630;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0F171D; --panel:#16222B; --panel-2:#1B2933; --ink:#E4ECEF; --ink-2:#B8C6CD; --muted:#8699A4;
  --line:#2A3A45; --accent:#6BAA68; --accent-ink:#12241A; --accent-soft:#1A2D20;
  --ok:#4CC08A; --ok-soft:#153526; --bad:#F07A6F; --bad-soft:#3D1E1B; --warn:#E3B34B; --warn-soft:#3A2F12;
  --blue:#7FB0DD; --blue-soft:#1A2E40; --side:#0B140E; --side-ink:#DCE5EA; --side-muted:#7E909B; --side-hi:#1A2630;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;margin:0}
code,.mono{font-family:var(--f-mono);font-size:.88em}
code{background:var(--panel-2);border:1px solid var(--line);border-radius:4px;padding:0 .3em;white-space:nowrap}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;line-height:1.1;margin:0;letter-spacing:.01em}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,textarea:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:grid;grid-template-columns:290px minmax(0,1fr);min-height:100vh}
/* Sidebar */
.side{background:var(--side);color:var(--side-ink);padding:22px 16px;display:flex;flex-direction:column;gap:18px;position:sticky;top:env(safe-area-inset-top,0px);height:100vh;overflow-y:auto}
.brand{display:flex;flex-direction:column;gap:4px;padding:0 6px}
.brand .eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.brand h1{font-size:28px;font-weight:700;color:#fff}
:root[data-theme="dark"] .brand h1{color:var(--side-ink)}
.brand .back{font-size:13px;color:#7FBF7A;text-decoration:none;margin-top:4px}
.brand .back:hover{text-decoration:underline}
.brand .sub{font-size:13px;color:var(--side-muted)}
.global{padding:12px;border:1px solid var(--side-hi);border-radius:8px;display:flex;flex-direction:column;gap:8px}
.global .row{display:flex;justify-content:space-between;font-size:13px;color:var(--side-muted)}
.global .row b{color:var(--side-ink);font-variant-numeric:tabular-nums}
.bar{height:6px;background:var(--side-hi);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.nav{display:flex;flex-direction:column;gap:4px;list-style:none;margin:0;padding:0}
.nav button{width:100%;text-align:left;background:none;border:0;border-radius:8px;padding:10px;display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:start;color:var(--side-ink)}
.nav button:hover{background:var(--side-hi)}
.nav button[aria-current="true"]{background:var(--side-hi);box-shadow:inset 3px 0 0 var(--accent)}
.nav .num{font-family:var(--f-mono);font-size:12px;color:var(--side-muted);border:1px solid var(--side-hi);border-radius:5px;text-align:center;padding:3px 0}
.nav button[aria-current="true"] .num{color:var(--accent);border-color:var(--accent)}
.nav .t{font-size:14px;line-height:1.3;font-weight:600}
.ports{display:flex;gap:3px;margin-top:6px}
.ports span{width:14px;height:6px;border-radius:1px;background:rgba(255,255,255,.14)}
.ports span.on{background:#3FCB84}
.ports span.half{background:#E3B34B}
.side .foot{margin-top:auto;font-size:12px;color:var(--side-muted);padding:0 6px;display:flex;flex-direction:column;gap:6px}
/* Main */
.main{padding-inline:clamp(16px,4vw,48px);padding-block:28px 64px;min-width:0}
.wrap{max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.mhead{display:flex;flex-direction:column;gap:8px}
#b-eyebrow,#g-pts{color:#7FBF7A!important}
.mhead .eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.mhead h2{font-size:clamp(30px,4.2vw,44px);font-weight:700}
.mhead p{margin:0;color:var(--ink-2);max-width:68ch}
.tabs{display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:0}
.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:10px 12px;font-weight:600;color:var(--muted);display:flex;gap:8px;align-items:center;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tabs .count{font-family:var(--f-mono);font-size:11px;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:1px 7px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:clamp(16px,2.4vw,24px)}
.hint{display:flex;gap:12px;align-items:flex-start;background:var(--blue-soft);color:var(--ink);border-radius:8px;padding:12px 14px;font-size:15px}
.hint b{font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--blue);padding-top:3px;white-space:nowrap}
.stack{display:flex;flex-direction:column;gap:14px}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:7px;padding:8px 14px;font-weight:600;font-size:15px}
.btn:hover{border-color:var(--ink-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.05)}
.btn.small{padding:5px 10px;font-size:14px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
/* Resumo */
.resumo{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.resumo .item{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.resumo .item h3{font-size:19px;font-weight:600;color:var(--ink)}
.resumo .item p{margin:0;color:var(--ink-2);font-size:15px}
.story{border-left:3px solid var(--accent);background:var(--accent-soft);padding:14px 16px;border-radius:0 8px 8px 0;font-size:15.5px}
.story b{font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);display:block;margin-bottom:4px}
.mapgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.mapgrid button{text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:4px}
.mapgrid button:hover{border-color:var(--accent)}
.mapgrid .k{font-family:var(--f-display);font-size:30px;font-weight:700;color:var(--accent);line-height:1}
.mapgrid .l{font-weight:600}
.mapgrid .d{font-size:13px;color:var(--muted)}
/* Caderno */
.q{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.q .top{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start}
.q .n{font-family:var(--f-mono);font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:2px 6px;font-variant-numeric:tabular-nums;margin-top:2px}
.q .text{font-weight:600}
.q .type{font-family:var(--f-mono);font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--blue)}
.answer{background:var(--ok-soft);border-radius:8px;padding:12px 14px;font-size:15.5px}
.answer .lbl{font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ok);display:block;margin-bottom:4px}
.self{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:14px;color:var(--muted)}
.self button{border:1px solid var(--line);background:var(--panel);border-radius:14px;padding:3px 11px;font-size:14px}
.self button[aria-pressed="true"].ok{background:var(--ok);border-color:var(--ok);color:#fff}
.self button[aria-pressed="true"].mid{background:var(--warn);border-color:var(--warn);color:#fff}
.self button[aria-pressed="true"].no{background:var(--bad);border-color:var(--bad);color:#fff}
.q.done{border-color:color-mix(in srgb,var(--ok) 45%,var(--line))}
/* Flashcards */
.fc-wrap{display:flex;flex-direction:column;gap:14px;align-items:stretch}
.fc-meta{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;font-size:14px;color:var(--muted)}
.fc-meta b{font-variant-numeric:tabular-nums;color:var(--ink)}
.card3d{perspective:1400px;width:100%}
.card{position:relative;width:100%;min-height:260px;transform-style:preserve-3d;transition:transform .5s;cursor:pointer;border:0;background:none;padding:0;text-align:left}
.card.flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:12px;padding:28px;display:flex;flex-direction:column;justify-content:center;gap:12px;border:1px solid var(--line);box-shadow:var(--shadow)}
.face.front{background:var(--panel)}
.face.back{background:var(--side);color:var(--side-ink);transform:rotateY(180deg);border-color:var(--side)}
.face .tag{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.face .big{font-family:var(--f-display);font-size:clamp(24px,3.4vw,34px);font-weight:600;line-height:1.15}
.face .body{font-size:17px}
.face .tip{font-size:13px;color:var(--muted);margin-top:auto}
.face.back .tip{color:var(--side-muted)}
.face.back code{background:var(--side-hi);border-color:var(--side-hi);color:var(--side-ink)}
.dots{display:flex;gap:4px;flex-wrap:wrap}
.dots span{width:18px;height:6px;border-radius:2px;background:var(--line)}
.dots span.cur{background:var(--ink)}
.dots span.k{background:var(--ok)}
.dots span.r{background:var(--warn)}
/* V/F */
.vf{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.vf .stmt{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start}
.vf .opts{display:flex;gap:8px;flex-wrap:wrap}
.vf .opts button{min-width:118px;border:1.5px solid var(--line);background:var(--panel-2);border-radius:8px;padding:8px 14px;font-weight:700;letter-spacing:.02em}
.vf .opts button:hover:not([disabled]){border-color:var(--ink-2)}
.vf .opts button[disabled]{cursor:default}
.vf .opts button.right{background:var(--ok);border-color:var(--ok);color:#fff}
.vf .opts button.wrong{background:var(--bad);border-color:var(--bad);color:#fff}
.vf textarea{width:100%;min-height:62px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:inherit;font-size:15px;background:var(--panel-2);color:var(--ink);resize:vertical}
.verdict{border-radius:8px;padding:12px 14px;font-size:15.5px}
.verdict.good{background:var(--ok-soft)}
.verdict.bad{background:var(--bad-soft)}
.verdict .lbl{font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;display:block;margin-bottom:4px}
.verdict.good .lbl{color:var(--ok)}
.verdict.bad .lbl{color:var(--bad)}
.score{display:flex;gap:16px;flex-wrap:wrap;align-items:center;font-size:15px}
.score .pill{font-family:var(--f-mono);font-size:13px;border-radius:12px;padding:3px 10px;font-variant-numeric:tabular-nums}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.n{background:var(--panel-2);color:var(--ink-2);border:1px solid var(--line)}
/* PBL */
.pbl{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.pbl header{background:var(--side);color:var(--side-ink);padding:18px 22px;display:flex;flex-direction:column;gap:4px}
.pbl header .tag{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.pbl header h3{font-size:26px;color:#fff;font-weight:700}
:root[data-theme="dark"] .pbl header h3{color:var(--side-ink)}
.pbl .inner{padding:18px 22px;display:flex;flex-direction:column;gap:16px}
.pbl h4{font-family:var(--f-mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--blue);margin:0 0 6px}
.pbl p{margin:0}
.pbl ol,.pbl ul{margin:0;padding-left:1.3em;display:flex;flex-direction:column;gap:4px}
.pbl .cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px}
.steps div{border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:14px;background:var(--panel-2)}
.steps div b{display:block;font-family:var(--f-mono);font-size:11px;color:var(--accent);letter-spacing:.08em;text-transform:uppercase}
.gate{display:flex;gap:10px;align-items:center;flex-wrap:wrap;border-top:1px dashed var(--line);padding-top:14px}
.gate label{display:flex;gap:8px;align-items:center;font-size:15px}
.gate input{width:18px;height:18px;accent-color:var(--accent)}
.sol{background:var(--ok-soft);border-radius:8px;padding:14px 16px}
.sol .lbl{font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ok);display:block;margin-bottom:6px}
.sol ul{margin:0}
.tablewrap{overflow-x:auto}
table.rub{border-collapse:collapse;width:100%;font-size:14px;min-width:560px}
table.rub th,table.rub td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
table.rub th{background:var(--panel-2);font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:14px;color:var(--bad)}
.topbar{display:none}
.theme{background:none;border:1px solid var(--side-hi);color:var(--side-muted);border-radius:6px;padding:4px 8px;font-size:12px;align-self:flex-start}

/* Laboratório visual */
.lab{display:flex;flex-direction:column;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:clamp(14px,2.2vw,20px);margin:0}
.lab-head{display:flex;flex-direction:column;gap:4px}
.lab-head h3{font-size:24px;font-weight:700}
.lab .cap{color:var(--ink-2);font-size:15px;margin:0;max-width:75ch}
.lab .stage{overflow-x:auto;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:8px}
.lab svg{display:block;width:100%;height:auto;min-width:600px}
.lab canvas{display:block;min-width:600px;border-radius:6px;cursor:crosshair}
.lab .ctrls{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.lab select,.lab input[type=text]{font:inherit;font-size:15px;padding:7px 10px;border:1px solid var(--line);border-radius:7px;background:var(--panel);color:var(--ink)}
.lab input[type=text]{min-width:min(280px,100%)}
.lab .info{background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:12px 14px;font-size:15.5px;min-height:3.2em}
.lab .info .k{display:block;font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin-bottom:4px;font-weight:600}
.lab .info .k.ok{color:var(--ok)} .lab .info .k.bad{color:var(--bad)} .lab .info .k.mid{color:var(--warn)}
.muted{color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex-wrap:wrap}
.seg button{border:0;background:var(--panel);padding:7px 12px;font-weight:600;font-size:14px;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.chk{display:inline-flex;gap:6px;align-items:center;font-size:14.5px}
.chk input{accent-color:var(--accent);width:17px;height:17px}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:14px}
.chip{font-family:var(--f-mono);font-size:13px;border:1px dashed var(--line);border-radius:12px;padding:2px 10px;color:var(--muted)}
.chip.on{border-style:solid;border-color:var(--ok);background:var(--ok-soft);color:var(--ok)}
.msgs{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:8px}
.msg{margin:0;font-family:var(--f-mono);font-size:13px;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px 10px;white-space:pre-wrap}
.term{margin:0;background:#0E151B;color:#CFE3D6;font-family:var(--f-mono);font-size:13px;border-radius:8px;padding:12px 14px;white-space:pre-wrap;min-height:120px;max-height:280px;overflow:auto}
.side-table{overflow-x:auto}
.ltable{border-collapse:collapse;font-size:14px;min-width:260px}
.ltable caption{text-align:left;font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);padding-bottom:4px}
.ltable th,.ltable td{border:1px solid var(--line);padding:5px 10px;text-align:left}
.ltable th{background:var(--panel-2);font-weight:600}
.ltable td.ok{color:var(--ok);font-weight:600}
.apts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.apt{display:flex;flex-direction:column;gap:4px;align-items:flex-start;text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:10px 12px;font-weight:600;font-size:14px}
.apt:hover{border-color:var(--accent)}
.apt .door{width:22px;height:30px;border:2px solid var(--ink-2);border-radius:3px 3px 0 0;position:relative}
.apt .door::after{content:"";position:absolute;right:3px;top:13px;width:4px;height:4px;border-radius:50%;background:var(--accent)}
.apt .pt{font-size:12px;color:var(--blue)}
.wires{display:flex;flex-wrap:wrap;gap:6px}
.wire{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--panel);border-radius:18px;padding:5px 12px 5px 6px;font-size:14px;font-weight:600}
.wire .sw{width:28px;height:14px;border-radius:7px;background:var(--c);border:1px solid rgba(0,0,0,.25)}
.wire[data-s="1"] .sw{background:repeating-linear-gradient(55deg,#F4F4F2 0 5px,var(--c) 5px 9px)}
.wire[disabled]{opacity:.35;cursor:not-allowed}
.sliders{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:8px 18px}

<script>
const COURSE = {"id": "projeto-redes-v1", "eyebrow": "Disciplina · Projeto de Redes", "titulo": "Projeto de Redes", "autor": "Prof. Eber Santana", "curso": "Projeto de Redes de Computadores", "apresentacao": "Cinco módulos que seguem a metodologia **Top-Down**: das metas do negócio ao teste e à documentação da rede, acompanhando **Leo**, um técnico recém-formado, e suas mentoras Clara e Ana em projetos reais.", "referencias": ["OPPENHEIMER, P. *Top-Down Network Design*. 3. ed. Cisco Press, 2011.", "ABNT NBR 14565 — Cabeamento estruturado para edifícios comerciais.", "ANSI/TIA-568 — Commercial Building Telecommunications Cabling Standard.", "SANTANA, E. *E-book: Projeto de Redes de Computadores* e *Storytelling de Projeto de Redes*."], "modulos": [{"id": "p1", "titulo": "Metodologia Top-Down", "subtitulo": "Capítulo 1 · metas, desempenho, baseline e tráfego", "objetivo": "Aplicar a metodologia Top-Down: transformar metas e restrições do negócio em requisitos técnicos, definir parâmetros de desempenho, caracterizar a rede existente e analisar o tráfego.", "resumo": [["Top-Down × Bottom-Up", "Top-Down começa pelas metas do negócio e pelos usuários; Bottom-Up começa pelos cabos e equipamentos. Em projetos complexos, Top-Down é mais seguro."], ["Metas e restrições", "Metas: o que a organização quer alcançar. Restrições: orçamento, prazo, pessoal técnico e políticas. Juntas geram os requisitos técnicos."], ["Parâmetros de desempenho", "Largura de banda (capacidade), vazão (taxa real), latência (ms), jitter (variação da latência) e disponibilidade (em “noves”)."], ["Baseline", "Raio-x da rede atual: diagramas físico e lógico, inventário de ativos e dados de desempenho. Ferramentas: Zabbix, Grafana, PRTG, Wireshark, ping, traceroute, snmpwalk."], ["Análise de tráfego", "Quais aplicações, quem usa, de onde para onde e em que horário. NetFlow, sFlow e J-Flow coletam os fluxos; o resultado orienta QoS ou upgrade de link."], ["Ciclo", "O projeto não termina na implementação: monitorar, analisar e otimizar continuamente."]], "historia": "Leo, recém-contratado pela Inovatech, quer começar passando cabos Cat6a e configurando o switch. Clara, a diretora de tecnologia, o interrompe: “Você está pensando nos tijolos antes de ter a planta da casa”. O primeiro passo não é conectar um cabo. É **conversar** com a CEO, com o financeiro e com os usuários.", "historiaTitulo": "A saga de Leo", "caderno": [{"q": "Explique a diferença entre as abordagens Top-Down e Bottom-Up no projeto de redes.", "a": "Top-Down começa pelo topo: objetivos do negócio e necessidades dos usuários, depois a parte lógica e só no fim a física. Bottom-Up começa pelos cabos e equipamentos. O Top-Down garante que cada decisão técnica sirva a um propósito.", "t": "Discursiva"}, {"q": "Use a analogia da casa sem planta para justificar o Top-Down.", "a": "Construir sem planta leva a estrutura instável, cômodos mal distribuídos e problemas elétricos. Projetar rede sem método leva a redes lentas, inseguras e que não atendem ao usuário. O Top-Down é a planta.", "t": "Discursiva"}, {"q": "Diferencie metas de negócio e restrições, com dois exemplos de cada.", "a": "Metas: objetivos estratégicos (abrir filial, suportar videoconferência HD, melhorar a internet). Restrições: limites que moldam o projeto (orçamento, prazo, falta de pessoal técnico qualificado, políticas da empresa).", "t": "Comparação"}, {"q": "No caso da rede varejista com Wi-Fi em 50 lojas, liste um requisito técnico derivado e duas restrições.", "a": "Requisitos: até 100 usuários simultâneos por loja, captive portal para capturar dados, gerência centralizada na matriz. Restrições: até R$ 200.000, implementação em 3 meses, equipe local com pouco conhecimento (solução de fácil manutenção).", "t": "Estudo de caso"}, {"q": "Defina largura de banda, vazão, latência, jitter e disponibilidade.", "a": "Largura de banda: capacidade máxima do link (bps). Vazão: taxa real alcançada, geralmente menor. Latência: tempo da origem ao destino (ms). Jitter: variação da latência. Disponibilidade: porcentagem do tempo em que a rede funciona (ex.: 99,999%).", "t": "Conceitos"}, {"q": "Explique a analogia da rodovia para os parâmetros de desempenho.", "a": "Largura de banda é o número de pistas; vazão, os carros que realmente passam por hora; latência, o tempo total da viagem; jitter, a imprevisibilidade desse tempo (às vezes 30, às vezes 50 minutos).", "t": "Discursiva"}, {"q": "Quais parâmetros definir para videoconferência HD? E para um backup noturno?", "a": "Videoconferência: mínimo de 5 Mbps por usuário, latência até 150 ms, jitter até 30 ms e perda abaixo de 1%. Backup noturno: o principal é a vazão, para caber na janela de tempo; a latência importa pouco.", "t": "Aplicação"}, {"q": "O que é network baseline e por que é obrigatório?", "a": "É a documentação e análise da topologia, configuração e desempenho da rede existente. É obrigatório porque raramente se projeta do zero: é preciso conhecer o ponto de partida, os problemas e as oportunidades, como o médico que pede exames antes de diagnosticar.", "t": "Discursiva"}, {"q": "Quais três grupos de documentação são coletados na caracterização da rede existente?", "a": "Diagramas de rede (físico e lógico), inventário de ativos (modelos, versões, configurações) e análise de desempenho (uso médio e de pico, latência, CPU e memória dos equipamentos).", "t": "Discursiva"}, {"q": "Para que serve a análise de tráfego e quais tecnologias coletam os fluxos?", "a": "Para saber quais aplicações consomem a rede, quem usa, de onde para onde e em que horários, orientando QoS ou aumento de link. NetFlow, sFlow e J-Flow, embutidos em roteadores e switches.", "t": "Discursiva"}, {"q": "No caso da Clínica Saúde Plena, quais foram os quatro achados do diagnóstico?", "a": "Meta: PEP rápido e teleconsultas estáveis, crescimento de 20%, orçamento R$ 15.000, execução fora do expediente. Rede: um roteador doméstico e todos na mesma rede Wi-Fi. Link de 50 Mbps entregando 20 Mbps no pico. Tráfego: streaming de música e backups para o Google Drive durante o dia.", "t": "Estudo de caso"}, {"q": "Quais foram as quatro ações da solução para a Clínica Saúde Plena?", "a": "Link de fibra empresarial de 200 Mbps simétricos; firewall/roteador profissional com VLANs (administração, teleconsulta e visitantes com limite de banda); QoS priorizando PEP e teleconsultas; backups agendados após a meia-noite.", "t": "Discursiva"}, {"q": "Explique o erro “focar só na largura de banda” e como o Top-Down o evita.", "a": "A empresa contrata 1 Gbps e a lentidão continua, porque o problema era latência alta ou firewall subdimensionado. Analisar vários parâmetros (latência, jitter, vazão) dá o diagnóstico certo: não adianta alargar a rodovia se o asfalto é ruim ou o pedágio é lento.", "t": "Discursiva"}, {"q": "No escritório de contabilidade, 70% da banda era UDP na porta 443 saindo de um servidor interno. Qual a causa provável e o próximo passo?", "a": "UDP 443 é típico do QUIC, usado por serviços do Google. Provavelmente um cliente de sincronização em nuvem subindo arquivos no horário de trabalho. Próximo passo: acessar o servidor, ver serviços e logs e limitar a banda do software ou agendar a sincronização para a noite.", "t": "Diagnóstico"}], "flash": [{"f": "Top-Down", "b": "Projeto que começa pelas metas do negócio e pelos usuários e termina nos equipamentos."}, {"f": "Bottom-Up", "b": "Projeto que começa pelos cabos e equipamentos. Arriscado em redes complexas."}, {"f": "Restrição", "b": "Limite do projeto: orçamento, prazo, pessoal técnico, políticas."}, {"f": "Largura de banda", "b": "Capacidade máxima de transmissão de um link, em bps."}, {"f": "Vazão (throughput)", "b": "Taxa real de transferência, normalmente menor que a largura de banda."}, {"f": "Latência", "b": "Tempo que o pacote leva da origem ao destino, em ms."}, {"f": "Jitter", "b": "Variação da latência. Crítico para voz e vídeo."}, {"f": "Disponibilidade", "b": "Porcentagem do tempo em que a rede funciona. Ex.: 99,999% (“cinco noves”)."}, {"f": "Network baseline", "b": "Raio-x documentado da rede existente: topologia, configuração e desempenho."}, {"f": "NetFlow / sFlow", "b": "Tecnologias de roteadores e switches que coletam dados sobre os fluxos de tráfego."}, {"f": "QoS", "b": "Qualidade de Serviço: prioriza um tipo de tráfego (ex.: ERP) sobre outros."}, {"f": "Links simétricos", "b": "Mesma velocidade de download e de upload."}], "vf": [{"s": "Na metodologia Top-Down, a escolha dos equipamentos é uma das primeiras decisões do projeto.", "v": false, "j": "Falso. A escolha de hardware é uma das **últimas** decisões: só acontece depois das metas, dos requisitos e da análise de tráfego."}, {"s": "Orçamento, prazo e equipe técnica limitada são exemplos de restrições do projeto.", "v": true, "j": "Verdadeiro. As restrições moldam as soluções possíveis."}, {"s": "Vazão e largura de banda são sinônimos.", "v": false, "j": "Falso. Largura de banda é a **capacidade** máxima; vazão é a **taxa real** alcançada, geralmente menor."}, {"s": "Jitter é a variação da latência e é crítico para voz e vídeo.", "v": true, "j": "Verdadeiro."}, {"s": "Para um backup noturno, a latência é o parâmetro mais crítico.", "v": false, "j": "Falso. No backup noturno o mais importante é a **vazão**, para transferir tudo dentro da janela de tempo."}, {"s": "Uma disponibilidade de 99,999% é chamada de “cinco noves”.", "v": true, "j": "Verdadeiro."}, {"s": "Como quase todo projeto é feito do zero, a caracterização da rede existente é opcional.", "v": false, "j": "Falso. É raro projetar do zero; a caracterização (baseline) é um passo **obrigatório**."}, {"s": "Wireshark, Zabbix, Grafana e PRTG ajudam a caracterizar a rede existente.", "v": true, "j": "Verdadeiro, junto com ping, traceroute e snmpwalk."}, {"s": "A análise de tráfego pode justificar tanto uma política de QoS quanto a contratação de um link maior.", "v": true, "j": "Verdadeiro. Depende de o tráfego ser legítimo para o negócio ou não."}, {"s": "Se a rede está lenta, aumentar a velocidade do link sempre resolve.", "v": false, "j": "Falso. A causa pode ser **latência** alta ou um firewall subdimensionado; é preciso analisar vários parâmetros."}, {"s": "Na Clínica Saúde Plena, a solução incluiu uma rede de visitantes com limite de banda.", "v": true, "j": "Verdadeiro. A VLAN de visitantes separa pacientes e celulares pessoais da rede do PEP."}, {"s": "O projeto de rede termina quando a rede é implementada.", "v": false, "j": "Falso. O projeto é um **ciclo** contínuo de monitoramento, análise e otimização."}], "pbl": [{"titulo": "Aulas ao vivo para 500 alunos", "duracao": "3 aulas", "cenario": "Uma universidade quer transmitir aulas ao vivo em HD para 500 alunos ao mesmo tempo. Os alunos interagem por chat e enviam arquivos de até 50 MB. O orçamento é limitado, a equipe de TI é pequena e tudo precisa estar pronto antes do próximo semestre.", "problema": "Como aplicar o Top-Down para transformar esse desejo em metas, restrições e requisitos técnicos mensuráveis?", "perguntas": ["Quais são as metas de negócio por trás das aulas online?", "Quais restrições limitam a solução?", "Quanta banda 500 transmissões HD exigem (considere 4 Mbps cada)?", "Como reduzir a carga no servidor central e o esforço da equipe pequena?"], "entregaveis": ["Quadro com pelo menos 3 metas, 3 restrições e 4 requisitos", "Cálculo da banda necessária", "Mapa Top-Down: negócio → requisitos → lógica → física"], "solucao": ["Metas: expandir o alcance para outras cidades, criar nova fonte de receita, manter a qualidade de ensino.", "Restrições: orçamento limitado, equipe de TI enxuta, prazo até o início do semestre.", "Banda: 500 × 4 Mbps = **2 Gbps**, mais o tráfego de chat e arquivos.", "Requisitos: baixa latência e jitter, uso de **CDN** para aliviar o servidor e aproximar o conteúdo, plataforma de gerência centralizada para a equipe pequena."]}, {"titulo": "A internet da clínica caiu de novo", "duracao": "2 aulas", "cenario": "A Clínica Saúde Plena (30 funcionários) tem o prontuário eletrônico (PEP) na nuvem lento e teleconsultas que caem. Há um único roteador doméstico, todos no mesmo Wi-Fi, link de 50 Mbps que entrega 20 Mbps no pico, streaming de música nos consultórios e backups durante o dia. Orçamento: R$ 15.000; obras só fora do expediente.", "problema": "Quais parâmetros de desempenho definir e qual solução propor, respeitando orçamento e horário?", "perguntas": ["Quais metas e restrições a clínica tem?", "Que latência, banda e jitter o PEP e a teleconsulta exigem?", "O que o baseline e a análise de tráfego revelam?", "Quais ações resolvem o problema sem estourar o orçamento?"], "entregaveis": ["Tabela de parâmetros por aplicação", "Diagnóstico com as causas", "Plano de ação com custos estimados e cronograma fora do expediente"], "solucao": ["Parâmetros: PEP com latência máxima de 50 ms; teleconsulta com 2 Mbps dedicados por sessão, latência até 100 ms e jitter abaixo de 20 ms.", "Causas: rede plana sem separação, roteador doméstico, vazão real baixa no pico, tráfego não essencial (streaming e backups) no horário de atendimento.", "Solução: link de fibra empresarial de 200 Mbps simétricos; firewall profissional com VLANs (administração, teleconsulta, visitantes com limite de banda); QoS priorizando PEP e teleconsulta; backups após a meia-noite."]}], "lab": ["topdown", "perf"]}, {"id": "p2", "titulo": "Projeto da Rede Lógica", "subtitulo": "Capítulo 2 · topologia, redundância, segmentação e protocolos", "objetivo": "Projetar a rede lógica: escolher a topologia, planejar balanceamento e caminhos de backup, aplicar multihoming, NAT, DMZ, VLAN e VPN, definir endereçamento e nomenclatura, estratégias de segurança e gerência e protocolos de comutação e roteamento.", "resumo": [["Topologias", "Estrela: ponto central, falha dele para tudo. Malha: vários caminhos, alta confiabilidade. Barramento: um cabo compartilhado, falha nele derruba tudo."], ["Redundância", "Balanceamento de carga distribui acessos entre servidores. Caminho de backup assume quando o principal falha (ex.: dois links)."], ["Multihoming e NAT", "Multihoming: mais de um provedor ao mesmo tempo. NAT: vários dispositivos privados compartilham um IP público."], ["DMZ, VLAN e VPN", "DMZ isola servidores públicos da rede interna. VLAN divide uma rede física em redes lógicas. VPN cria túnel criptografado pela internet."], ["Endereços e nomes", "Plano IP com espaço para crescer (ex.: `10.10.0.0/16`) e nomes padronizados como `BR-SP-FIN-SRV01`."], ["Protocolos", "STP evita loops na camada 2. OSPF calcula as melhores rotas dentro da empresa. BGP escolhe caminhos entre provedores, por políticas."]], "historia": "Na ConectaTudo, Ana mostra a Leo que uma boa rede é uma “arquitetura invisível”. Semanas depois da entrega, uma obra rompe a fibra do provedor principal e um servidor web queima. O tráfego passa sozinho para o segundo provedor, o balanceador tira o servidor defeituoso do grupo, e **ninguém na empresa percebe nada**.", "historiaTitulo": "A saga de Leo", "caderno": [{"q": "O que é topologia de rede e quais são suas duas dimensões?", "a": "É o mapa de como os nós estão conectados. Tem a dimensão física (cabos) e a lógica (fluxo de dados).", "t": "Discursiva"}, {"q": "Compare estrela, malha e barramento quanto ao ponto de falha.", "a": "Estrela: falha num dispositivo não afeta os outros, mas a falha do ponto central paralisa a rede. Malha: múltiplos caminhos, alta confiabilidade, usada em ambientes críticos como aeroportos. Barramento: um cabo compartilhado; se ele falhar, a rede toda cai.", "t": "Comparação"}, {"q": "Diferencie balanceamento de carga e caminho de backup, com um exemplo de cada.", "a": "Balanceamento distribui o tráfego entre vários servidores para evitar sobrecarga (e-commerce na Black Friday). Caminho de backup é uma rota alternativa que assume se a principal falhar (segundo link de internet).", "t": "Discursiva"}, {"q": "O que é multihoming e qual a analogia usada?", "a": "Conectar a rede a mais de um provedor ao mesmo tempo, para redundância e otimização. É como ter duas portas de casa dando para ruas diferentes.", "t": "Discursiva"}, {"q": "Explique o NAT com a analogia do recepcionista.", "a": "O NAT permite que vários dispositivos privados compartilhem um único IP público. Para fora, toda a correspondência vai para o endereço do prédio (IP público); o recepcionista (roteador) sabe para qual sala (dispositivo) entregar.", "t": "Discursiva"}, {"q": "O que é uma DMZ e por que usar uma em vez de redirecionar uma porta para um servidor interno?", "a": "É uma sub-rede isolada que hospeda servidores públicos (como o site), separada da rede interna. Redirecionar porta para um servidor interno expõe a rede interna; na DMZ, um invasor que comprometa o servidor público não chega direto aos escritórios.", "t": "Discursiva"}, {"q": "O que é uma VLAN e quais dois benefícios ela traz?", "a": "Uma rede local virtual que segmenta uma rede física em várias redes lógicas independentes. Benefícios: segurança (isolamento) e organização (e melhor desempenho, por reduzir o tráfego desnecessário).", "t": "Discursiva"}, {"q": "Para que serve uma VPN e qual a analogia do carro-forte?", "a": "Cria um túnel seguro e criptografado sobre a internet pública para acessar uma rede privada. É como mandar um cartão-postal num cofre lacrado dentro de um carro-forte: mesmo interceptado, ninguém lê.", "t": "Discursiva"}, {"q": "Interprete o nome `BR-SP-FIN-SRV01` e explique a vantagem de uma nomenclatura padronizada.", "a": "Brasil, São Paulo, Financeiro, Servidor 01. Um nome padronizado revela na hora localização, departamento e função, o que facilita a gerência, bem mais do que lembrar um IP.", "t": "Discursiva"}, {"q": "O que é defesa em camadas? Dê quatro exemplos de barreiras.", "a": "Usar várias barreiras de segurança combinadas: firewall no perímetro, VLANs para segmentar, antivírus nos dispositivos e autenticação de dois fatores.", "t": "Discursiva"}, {"q": "Qual a diferença entre protocolos de comutação e de roteamento?", "a": "Comutação atua dentro da mesma rede local (camada 2), como o carteiro no bairro. Roteamento encontra o melhor caminho entre redes diferentes (camada 3), como o centro de distribuição entre cidades.", "t": "Discursiva"}, {"q": "Qual problema o STP resolve e como?", "a": "Em redes com caminhos redundantes na camada 2, os quadros podem circular em loop infinito (tempestade de broadcast). O STP bloqueia temporariamente uma das rotas; se a principal falhar, desbloqueia a de backup.", "t": "Discursiva"}, {"q": "Compare OSPF e BGP.", "a": "OSPF é o “GPS interno” da empresa: calcula a rota mais rápida dentro da própria rede; os roteadores trocam seus mapas e calculam juntos. BGP é o protocolo da internet: escolhe caminhos entre grandes redes (provedores) com base em políticas e acordos.", "t": "Comparação"}, {"q": "Descreva a solução lógica da startup de 50 funcionários em dois andares com site próprio.", "a": "Topologia em estrela (roteador principal e switch por andar); endereçamento `10.10.0.0/16` para crescer; VLANs por departamento (Engenharia, Vendas, Administração); site na DMZ; dois provedores (multihoming) com BGP; VPN para home office.", "t": "Estudo de caso"}], "flash": [{"f": "Topologia em estrela", "b": "Todos ligados a um ponto central. Se o centro falha, a rede para."}, {"f": "Topologia em malha", "b": "Cada nó ligado a vários outros. Múltiplos caminhos, alta confiabilidade."}, {"f": "Balanceamento de carga", "b": "Distribui o tráfego entre vários servidores para evitar sobrecarga."}, {"f": "Failover", "b": "Passagem automática para o caminho ou equipamento de backup quando o principal falha."}, {"f": "Multihoming", "b": "Rede ligada a mais de um provedor de internet ao mesmo tempo."}, {"f": "NAT", "b": "Vários dispositivos privados saem para a internet com um único IP público."}, {"f": "DMZ", "b": "Sub-rede isolada para servidores públicos, separada da rede interna."}, {"f": "VLAN", "b": "Rede lógica independente criada dentro de uma rede física."}, {"f": "VPN", "b": "Túnel criptografado sobre a internet para acessar uma rede privada."}, {"f": "STP", "b": "Spanning Tree Protocol: bloqueia caminhos redundantes para evitar loops na camada 2."}, {"f": "OSPF", "b": "Protocolo de roteamento interno que calcula o caminho mais curto."}, {"f": "BGP", "b": "Protocolo de roteamento entre provedores, baseado em políticas."}], "vf": [{"s": "Na topologia em estrela, a falha do ponto central paralisa toda a rede.", "v": true, "j": "Verdadeiro. É o ponto único de falha dessa topologia."}, {"s": "A topologia em barramento é a mais indicada para ambientes críticos, como aeroportos.", "v": false, "j": "Falso. Ambientes críticos usam **malha**, que oferece vários caminhos. No barramento, uma falha no cabo derruba tudo."}, {"s": "O balanceamento de carga distribui acessos entre vários servidores.", "v": true, "j": "Verdadeiro. Evita que um único servidor fique sobrecarregado."}, {"s": "Multihoming significa usar várias VLANs dentro do mesmo switch.", "v": false, "j": "Falso. Multihoming é ligar a rede a **mais de um provedor** de internet."}, {"s": "O NAT permite que vários dispositivos com IP privado compartilhem um único IP público.", "v": true, "j": "Verdadeiro."}, {"s": "Servidores internos podem ser expostos com segurança à internet por simples redirecionamento de porta.", "v": false, "j": "Falso. Isso é um risco enorme; o correto é colocar os servidores públicos numa **DMZ**."}, {"s": "Uma VLAN divide uma rede física em várias redes lógicas isoladas.", "v": true, "j": "Verdadeiro. É como usar biombos para dividir um salão."}, {"s": "Uma VPN dispensa criptografia porque usa um cabo exclusivo entre os escritórios.", "v": false, "j": "Falso. A VPN roda **sobre a internet pública** e depende de criptografia para formar o túnel seguro."}, {"s": "O STP evita que quadros fiquem circulando em loop em redes com caminhos redundantes.", "v": true, "j": "Verdadeiro. Ele bloqueia temporariamente uma das rotas."}, {"s": "O OSPF é o protocolo usado entre grandes provedores da internet.", "v": false, "j": "Falso. Entre provedores usa-se o **BGP**. O OSPF é usado **dentro** da rede da empresa."}, {"s": "Uma rede “plana”, sem VLANs, é mais segura porque é mais simples.", "v": false, "j": "Falso. A rede plana gera **insegurança** e baixo desempenho; a correção é segmentar com VLANs."}, {"s": "Uma nomenclatura padronizada facilita a gerência da rede.", "v": true, "j": "Verdadeiro. O nome já revela local, setor e função do equipamento."}], "pbl": [{"titulo": "A nova sede da ConectaTudo", "duracao": "3 aulas", "cenario": "A ConectaTudo, startup de 50 funcionários, vai ocupar dois andares com Engenharia, Vendas e Administração. Ela hospeda o próprio site, tem vendedores em home office e não pode ficar fora do ar se um provedor falhar.", "problema": "Como desenhar a rede lógica da nova sede: topologia, segmentação, endereçamento, redundância e acesso remoto?", "perguntas": ["Qual topologia usar e onde ficam os switches?", "Quantas VLANs criar e qual plano de IPs deixa espaço para crescer?", "Onde colocar o servidor do site?", "Como manter a empresa online se um provedor cair?", "Como os vendedores remotos entram na rede com segurança?"], "entregaveis": ["Diagrama lógico com VLANs, DMZ e links", "Plano de endereçamento por VLAN", "Padrão de nomes para os equipamentos", "Justificativa de cada protocolo escolhido (STP, OSPF, BGP)"], "solucao": ["Topologia em estrela: roteador/firewall principal e um switch por andar; links redundantes entre switches protegidos pelo **STP**.", "VLANs: Engenharia, Vendas, Administração e Visitantes; bloco `10.10.0.0/16` dividido por VLAN (ex.: `10.10.10.0/24`, `10.10.20.0/24`…).", "Servidor do site na **DMZ**, separado da rede interna.", "Dois provedores (**multihoming**) com **BGP** para balancear e ter caminho de backup; **OSPF** internamente.", "**VPN** de acesso remoto para os vendedores; nomes como `BR-SE-ENG-SW01`."]}, {"titulo": "Três redes numa clínica", "duracao": "2 aulas", "cenario": "Uma clínica médica usa uma única rede para os computadores da recepção, os prontuários dos médicos e o Wi-Fi dos pacientes. Um contador acessa arquivos da clínica de casa, e a loja online de produtos da clínica caiu na última promoção por excesso de acessos.", "problema": "Quais conceitos da rede lógica resolvem os três problemas: dados expostos, acesso remoto inseguro e site que cai?", "perguntas": ["Qual o risco de pacientes na mesma rede dos prontuários?", "Como o contador acessa os arquivos com segurança?", "Como evitar que a loja caia no pico de acessos?", "Onde entram DMZ e NAT nesse desenho?"], "entregaveis": ["Diagrama antes e depois", "Tabela problema → conceito → solução", "Parágrafo explicando a solução para a dona da clínica, sem jargão"], "solucao": ["Dados expostos: criar **três VLANs** isoladas (administração, médicos e visitantes/Wi-Fi).", "Acesso remoto: **VPN**, o túnel criptografado que funciona como carro-forte para os dados.", "Site que cai: **balanceador de carga** distribuindo os acessos entre vários servidores, com escalabilidade horizontal no pico.", "A loja fica na **DMZ**; o **NAT** permite que toda a rede interna saia com um IP público."]}], "lab": ["topology", "zones"]}, {"id": "p3", "titulo": "Projeto da Rede Física", "subtitulo": "Capítulo 3 · cabeamento estruturado, LAN e WAN", "objetivo": "Projetar a infraestrutura física: cabeamento estruturado segundo as normas, seleção de tecnologias de LAN (Ethernet, Wi-Fi, switches, PoE) e de WAN (links dedicados, MPLS, VPN).", "resumo": [["Cabeamento estruturado", "Metodologia padronizada e hierárquica: backbone (vertical) e cabeamento horizontal até as áreas de trabalho. Normas ABNT NBR 14565 e ANSI/TIA-568."], ["Componentes", "Patch panels, tomadas de telecomunicações, racks e patch cords, além dos cabos de par trançado e fibra."], ["LAN com fio", "Fast Ethernet 100 Mbps, Gigabit 1 Gbps, 10 Gigabit 10 Gbps. Comum: 1 Gbps nas estações e 10 Gbps em servidores e backbone."], ["Switches e PoE", "Escolha por portas, velocidade, gerenciamento e PoE, que alimenta telefones IP, câmeras e APs pelo cabo de rede."], ["WAN", "Link dedicado de fibra: máximo desempenho e custo. MPLS: rede privada da operadora com QoS. VPN site-to-site: ótimo custo-benefício, depende da internet."], ["Investimento", "Cabeamento é investimento de 10 a 15 anos. Economizar em categoria inferior sai mais caro depois."]], "historia": "Leo e Ana projetam a sede da InovaTech: Cat6a em todo o escritório, rack de 42U numa sala climatizada, duas tomadas por mesa, backbone de fibra entre os andares, switches Gigabit com PoE, APs Wi-Fi 6 e dois links: fibra de 1 Gbps e rádio de 200 Mbps como backup.", "historiaTitulo": "A saga de Leo", "caderno": [{"q": "Defina cabeamento estruturado e explique por que ele é hierárquico.", "a": "Metodologia padronizada para instalar a infraestrutura de cabos (dados, telefonia e outras mídias) num prédio ou campus. É hierárquico porque organiza a rede em backbone (vertical), que liga salas de equipamentos, e cabeamento horizontal, que chega às áreas de trabalho.", "t": "Discursiva"}, {"q": "Explique a analogia do sistema circulatório para o cabeamento estruturado.", "a": "O coração é o rack ou sala de equipamentos; as artérias principais são o backbone vertical; os vasos menores são o cabeamento horizontal; as partes do corpo são as áreas de trabalho e os dispositivos.", "t": "Discursiva"}, {"q": "Quais são as normas de cabeamento citadas e por que são importantes?", "a": "ABNT NBR 14565 (Brasil) e ANSI/TIA-568 (internacional). Definem boas práticas de projeto e instalação e garantem confiabilidade e compatibilidade com vários equipamentos e aplicações.", "t": "Discursiva"}, {"q": "Liste os componentes do cabeamento estruturado além dos cabos.", "a": "Patch panels (painéis de conexão), tomadas de telecomunicações nas áreas de trabalho, racks e patch cords (cordões de manobra).", "t": "Discursiva"}, {"q": "Onde usar par trançado e onde usar fibra óptica num prédio?", "a": "Par trançado (Cat6, Cat6a) no cabeamento horizontal até as mesas. Fibra no backbone vertical entre andares e entre prédios de um campus, pela distância, velocidade e imunidade a interferência.", "t": "Discursiva"}, {"q": "Quais são as velocidades Ethernet disponíveis e qual configuração é comum em escritórios?", "a": "Fast Ethernet 100 Mbps, Gigabit 1 Gbps e 10 Gigabit 10 Gbps. Comum: Gigabit nas estações e 10 Gigabit para servidores e backbone.", "t": "Discursiva"}, {"q": "Quais critérios usar para escolher um switch?", "a": "Número de portas, velocidade de cada porta, se precisa ser gerenciável e se deve fornecer PoE para telefones IP, câmeras e pontos de acesso.", "t": "Discursiva"}, {"q": "O que é PoE e qual vantagem ele trouxe no projeto da InovaTech?", "a": "Power over Ethernet: alimentação elétrica pelo próprio cabo de rede. Na InovaTech alimentou telefones VoIP e câmeras IP, simplificando a instalação (sem tomada elétrica em cada ponto).", "t": "Discursiva"}, {"q": "Compare link dedicado, MPLS e VPN como tecnologias de WAN.", "a": "Link dedicado de fibra: conexão privada e exclusiva, maior desempenho e confiabilidade, mais caro. MPLS: rede privada virtual da operadora, alto desempenho e QoS, bom para filiais com VoIP e vídeo. VPN: túnel criptografado sobre a internet, ótimo custo-benefício, desempenho depende da internet.", "t": "Comparação"}, {"q": "Quando a VPN sobre a internet não é a melhor escolha de WAN?", "a": "Quando há aplicações críticas sensíveis a latência e perda (sistemas em tempo real, videoconferência de alta qualidade entre matriz e filial), porque a internet pública não dá garantias. Aí o MPLS pode ser necessário.", "t": "Discursiva"}, {"q": "Descreva as decisões de WAN da InovaTech.", "a": "VPN de acesso remoto para os vendedores em outros estados; para a internet, dois provedores diferentes: fibra de 1 Gbps como principal e rádio de 200 Mbps como backup (failover).", "t": "Estudo de caso"}, {"q": "Por que “economizar no cabeamento” é um equívoco?", "a": "O cabeamento é a fundação da rede e dura de 10 a 15 anos. Categoria inferior ou instalação fora das normas trazem problemas de desempenho, diagnóstico difícil e custo muito maior para refazer depois.", "t": "Discursiva"}, {"q": "Recomende cabeamento, LAN e WAN para uma clínica de 15 funcionários com prontuário eletrônico e Wi-Fi para pacientes.", "a": "Cabeamento Cat6 certificado. LAN: switches Gigabit com PoE; dois APs Wi-Fi 6, um para funcionários (WPA3) e outro em VLAN separada para pacientes, com portal cativo. WAN: fibra de 300 a 500 Mbps e VPN de acesso remoto para os médicos.", "t": "Projeto"}, {"q": "Uma empresa com switches Gigabit e computadores novos acha a rede lenta. O cabo é Cat5, de 10 anos atrás. Qual a causa e a solução?", "a": "O Cat5 é o gargalo: seu desempenho garantido é de 100 Mbps, dez vezes menos que os equipamentos. Solução: trocar todo o cabeamento horizontal por Cat6 ou Cat6a.", "t": "Diagnóstico"}], "flash": [{"f": "Cabeamento estruturado", "b": "Instalação padronizada e hierárquica de cabos num prédio ou campus."}, {"f": "Backbone vertical", "b": "Cabeamento principal que liga andares e salas de equipamentos. Normalmente fibra."}, {"f": "Cabeamento horizontal", "b": "Liga o rack do andar às tomadas das áreas de trabalho."}, {"f": "ABNT NBR 14565", "b": "Norma brasileira de cabeamento estruturado."}, {"f": "ANSI/TIA-568", "b": "Norma internacional de cabeamento estruturado."}, {"f": "Patch panel", "b": "Painel de conexão no rack onde chegam os cabos horizontais."}, {"f": "Patch cord", "b": "Cordão de manobra que liga o patch panel ao switch ou o PC à tomada."}, {"f": "Rack 42U", "b": "Gabinete padronizado com 42 unidades de altura para equipamentos."}, {"f": "PoE", "b": "Power over Ethernet: energia pelo cabo de rede para telefones IP, câmeras e APs."}, {"f": "MPLS", "b": "Serviço da operadora que cria rede privada com QoS entre filiais."}, {"f": "VPN site-to-site", "b": "Túnel criptografado que liga duas redes de escritório pela internet."}, {"f": "Link de backup (failover)", "b": "Segundo link, de outro provedor, que assume se o principal falhar."}], "vf": [{"s": "O cabeamento estruturado organiza a infraestrutura em backbone e cabeamento horizontal.", "v": true, "j": "Verdadeiro. É uma organização hierárquica."}, {"s": "A ABNT NBR 14565 é a norma brasileira de cabeamento estruturado.", "v": true, "j": "Verdadeiro. A referência internacional é a ANSI/TIA-568."}, {"s": "O backbone entre andares costuma ser feito com cabo coaxial.", "v": false, "j": "Falso. O backbone entre andares e prédios costuma usar **fibra óptica**, pela velocidade, distância e imunidade a interferências."}, {"s": "Patch cords são os cordões de manobra que conectam os dispositivos.", "v": true, "j": "Verdadeiro."}, {"s": "Uma configuração comum é Gigabit nas estações e 10 Gigabit nos servidores e no backbone.", "v": true, "j": "Verdadeiro."}, {"s": "PoE permite alimentar câmeras IP e telefones VoIP pelo cabo de rede.", "v": true, "j": "Verdadeiro."}, {"s": "Um único roteador Wi-Fi potente no centro do escritório garante cobertura completa.", "v": false, "j": "Falso. Paredes, obstáculos e interferência limitam a cobertura; é preciso um **site survey** para definir quantidade e posição dos APs."}, {"s": "O link dedicado de fibra é a opção de WAN mais barata.", "v": false, "j": "Falso. É a de **maior desempenho e maior custo**. A VPN sobre internet é a de melhor custo-benefício."}, {"s": "O MPLS oferece QoS e é indicado para filiais com VoIP e videoconferência.", "v": true, "j": "Verdadeiro."}, {"s": "A VPN sobre a internet oferece garantia de latência e de perda de pacotes.", "v": false, "j": "Falso. A internet pública **não oferece garantias**; o desempenho da VPN varia com ela."}, {"s": "Cabeamento Cat5 limita a rede a cerca de 100 Mbps mesmo com switches Gigabit.", "v": true, "j": "Verdadeiro, segundo o exercício do capítulo: vira o gargalo da rede."}, {"s": "Cabeamento deve ser planejado como investimento de 1 a 2 anos.", "v": false, "j": "Falso. O cabeamento é um investimento de longo prazo, de **10 a 15 anos**."}], "pbl": [{"titulo": "Dois andares da InovaTech", "duracao": "3 aulas", "cenario": "A InovaTech, software house de 50 funcionários, vai ocupar um escritório de dois andares. Usa telefones VoIP e câmeras IP, os desenvolvedores trabalham com notebooks e a equipe de vendas fica em vários estados. A empresa não pode parar se o link principal cair.", "problema": "Como projetar a rede física da InovaTech: cabeamento, LAN e WAN, pensando em 10 anos de uso?", "perguntas": ["Qual categoria de cabo e quantas tomadas por mesa?", "Onde ficam os racks e o que liga os andares?", "Quais switches e APs escolher?", "Como conectar os vendedores e garantir a internet se o link principal falhar?"], "entregaveis": ["Planta simplificada com racks, backbone e pontos", "Lista de equipamentos com especificação (portas, velocidade, PoE, padrão Wi-Fi)", "Desenho da WAN com links principal e de backup"], "solucao": ["Cabeamento **Cat6a** em todo o escritório (suporta 10 Gbps), duas tomadas por mesa, seguindo a NBR 14565.", "Rack de 42U em sala climatizada no 1º andar, rack menor no 2º, ligados por **backbone de fibra**.", "Switches Gigabit com **PoE** para VoIP e câmeras; APs **Wi-Fi 6** nos dois andares e rede separada para visitantes.", "WAN: **VPN de acesso remoto** para vendas; fibra de 1 Gbps como principal e rádio de 200 Mbps de outro provedor como backup (failover)."]}, {"titulo": "Matriz em Aracaju, filial no interior", "duracao": "2 aulas", "cenario": "Uma rede de farmácias tem a matriz em Aracaju e três filiais no interior de Sergipe. O sistema de vendas é em tempo real e a matriz faz videoconferências diárias com os gerentes. As filiais têm orçamento pequeno e internet de qualidade variável.", "problema": "Qual tecnologia de WAN usar para ligar a matriz às filiais equilibrando custo, desempenho e segurança?", "perguntas": ["Quais aplicações são sensíveis a latência e perda?", "Quanto custa cada opção (dedicado, MPLS, VPN) em relação às outras?", "Dá para combinar tecnologias?", "Que LAN cada filial precisa?"], "entregaveis": ["Tabela comparativa das três tecnologias para o caso", "Diagrama da WAN proposta", "Recomendação com justificativa de custo × desempenho"], "solucao": ["Sensíveis: sistema de vendas em tempo real e videoconferência, que sofrem com latência e perda.", "Opção equilibrada: **MPLS** para garantir QoS às aplicações críticas entre matriz e filiais; **VPN site-to-site** sobre a internet como caminho de backup mais barato.", "Se o orçamento não comportar MPLS, VPN site-to-site em todas as filiais, com QoS local e link de internet de melhor qualidade na matriz, sabendo que o desempenho dependerá da internet.", "LAN das filiais: switch Gigabit, cabeamento Cat6 e AP com rede separada para clientes."]}], "lab": ["building", "wan"]}, {"id": "p4", "titulo": "Projeto de Rede sem Fio", "subtitulo": "Capítulo 4 · padrões, frequências, site survey e segurança", "objetivo": "Planejar uma rede sem fio: características, ambientes indoor e outdoor, padrões 802.11, modos de operação, métricas, frequências, site survey e segurança.", "resumo": [["Wi-Fi", "Rede que usa ondas de rádio em vez de cabos. Vantagens: mobilidade, flexibilidade e escalabilidade. Desafios: interferência, atenuação e segurança."], ["Indoor × outdoor", "Indoor: paredes, móveis e pessoas atenuam o sinal e criam zonas mortas. Outdoor: distância, chuva e neblina; equipamentos mais robustos."], ["Padrões 802.11", "b 11 Mbps · g 54 Mbps · n 600 Mbps (MIMO) · ac/Wi-Fi 5 1,3 Gbps (MU-MIMO) · ax/Wi-Fi 6 9,6 Gbps (OFDMA)."], ["Frequências", "2,4 GHz: mais alcance, mais interferência e poucos canais. 5 GHz: mais velocidade e canais, menos alcance. 6 GHz: Wi-Fi 6E."], ["Site survey", "Planejamento, análise de espectro, survey preditivo, survey ativo/passivo no local e relatório com mapas de calor."], ["Segurança", "WEP (inseguro) < WPA < WPA2 (AES) < WPA3. Autenticação por PSK ou 802.1X/RADIUS. Ocultar SSID e filtrar MAC são medidas complementares."]], "historia": "Leo recebe a planta da **Galeria Conectada**: um salão com pé-direito duplo, salas de concreto de paredes grossas e um jardim de esculturas a céu aberto, tudo para a inauguração em menos de um mês. Ana sorri: antes de comprar qualquer AP, eles vão fazer um site survey.", "historiaTitulo": "A saga de Leo", "caderno": [{"q": "O que é uma rede sem fio e qual a analogia dos walkie-talkies?", "a": "Uma rede que usa ondas de rádio em vez de cabos. Na biblioteca, em vez de amarrar o bilhete numa pedra e jogar (cabo), você fala no walkie-talkie e o amigo ouve no dele: a comunicação vai pelo ar.", "t": "Discursiva"}, {"q": "Cite três vantagens e três desafios das redes Wi-Fi.", "a": "Vantagens: mobilidade, flexibilidade para adicionar dispositivos e escalabilidade (basta um novo AP). Desafios: interferência (micro-ondas, telefones sem fio, outras redes), atenuação do sinal e segurança, pois os dados vão pelo ar.", "t": "Discursiva"}, {"q": "Compare os desafios de uma rede indoor e de uma outdoor.", "a": "Indoor: atenuação por paredes, portas, móveis e pessoas, criando zonas mortas; exige posicionamento cuidadoso dos APs. Outdoor: distância e clima (chuva, neblina) enfraquecem o sinal; exige equipamentos robustos para intempéries.", "t": "Comparação"}, {"q": "Complete a tabela: frequência e velocidade de 802.11b, g, n, ac e ax.", "a": "802.11b: 2,4 GHz, 11 Mbps. 802.11g: 2,4 GHz, 54 Mbps. 802.11n: 2,4 e 5 GHz, 600 Mbps. 802.11ac (Wi-Fi 5): 5 GHz, 1,3 Gbps. 802.11ax (Wi-Fi 6/6E): 2,4, 5 e 6 GHz, 9,6 Gbps.", "t": "Tabela"}, {"q": "O que significam MIMO, MU-MIMO e OFDMA e em que padrões apareceram?", "a": "MIMO (802.11n): múltiplas antenas para aumentar velocidade e alcance. MU-MIMO (802.11ac): MIMO multiusuário, atendendo vários dispositivos ao mesmo tempo. OFDMA (802.11ax): divide o canal para atender muitos dispositivos com eficiência em ambientes densos.", "t": "Discursiva"}, {"q": "Diferencie o modo infraestruturado do modo ad-hoc, com a topologia de cada um.", "a": "Infraestruturado: todos se conectam a um AP, que se liga à rede cabeada; topologia em estrela, como o terminal de um aeroporto. Ad-hoc: os dispositivos se conectam diretamente, sem AP; topologia em malha, como amigos conversando num parque.", "t": "Comparação"}, {"q": "Quais são as três métricas de desempenho do Wi-Fi e suas unidades?", "a": "Taxa de transferência (throughput), em Mbps ou Gbps. Latência (ping), em ms. Intensidade do sinal, em dBm.", "t": "Discursiva"}, {"q": "Qual sinal é mais forte: −50 dBm ou −80 dBm? Por quê?", "a": "−50 dBm. O dBm do Wi-Fi costuma ser negativo, e quanto mais perto de zero, mais forte o sinal.", "t": "Discursiva"}, {"q": "Compare as faixas de 2,4 GHz, 5 GHz e 6 GHz.", "a": "2,4 GHz: maior alcance, mais interferência e poucos canais (estrada antiga que vai longe, com trânsito). 5 GHz: mais velocidade e canais, menos alcance (autoestrada moderna). 6 GHz: exclusiva do Wi-Fi 6E, muitos canais e sem dispositivos antigos (pista particular).", "t": "Comparação"}, {"q": "Descreva as cinco etapas de um site survey.", "a": "1) Planejamento: planta baixa e requisitos. 2) Análise de espectro: fontes de interferência de RF. 3) Survey preditivo: simulação em software com a planta e os materiais. 4) Survey ativo/passivo no local: medir sinal, taxa e latência andando pelo local. 5) Relatório: mapas de calor e posições dos APs.", "t": "Procedimento"}, {"q": "Ordene WEP, WPA, WPA2 e WPA3 da mais fraca à mais forte e comente cada um.", "a": "WEP: obsoleto e inseguro (fechadura de brinquedo). WPA: melhor que o WEP, com vulnerabilidades conhecidas. WPA2: o mais usado, com AES (porta de cofre). WPA3: o mais recente, mais forte contra força bruta e melhor em redes abertas.", "t": "Discursiva"}, {"q": "Diferencie autenticação por PSK e por 802.1X/RADIUS.", "a": "PSK (Pre-Shared Key): uma senha compartilhada por todos. 802.1X com servidor RADIUS: cada usuário tem login e senha individuais, típico de empresas (WPA2/WPA3-Enterprise).", "t": "Discursiva"}, {"q": "Ocultar o SSID e filtrar MAC tornam a rede segura? Explique.", "a": "Não sozinhos. Ocultar o SSID não impede atacantes determinados de encontrarem a rede, e o filtro de MAC pode ser contornado. São camadas extras que só complementam criptografia forte e autenticação.", "t": "Discursiva"}, {"q": "O sinal é ótimo na sala e péssimo no quarto, com o roteador ao lado da TV. Cite três ações.", "a": "1) Mover o roteador para um local central e elevado, como o corredor. 2) Se for dual-band, usar 2,4 GHz no quarto, que atravessa melhor as paredes. 3) Instalar um repetidor ou um sistema mesh entre a sala e o quarto.", "t": "Diagnóstico"}], "flash": [{"f": "802.11", "b": "Família de padrões Wi-Fi definida pelo IEEE."}, {"f": "Wi-Fi 5", "b": "802.11ac: 5 GHz, até 1,3 Gbps, MU-MIMO."}, {"f": "Wi-Fi 6", "b": "802.11ax: até 9,6 Gbps, OFDMA, para ambientes densos."}, {"f": "Wi-Fi 6E", "b": "Wi-Fi 6 usando também a faixa de 6 GHz."}, {"f": "MIMO", "b": "Múltiplas antenas para aumentar velocidade e alcance (desde o 802.11n)."}, {"f": "Modo infraestruturado", "b": "Dispositivos ligados a um ponto de acesso. Topologia em estrela."}, {"f": "Modo ad-hoc", "b": "Dispositivos ligados diretamente, sem AP. Topologia em malha."}, {"f": "dBm", "b": "Unidade da intensidade do sinal. −50 dBm é mais forte que −80 dBm."}, {"f": "2,4 GHz × 5 GHz", "b": "2,4: mais alcance e mais interferência. 5: mais velocidade e menos alcance."}, {"f": "Site survey", "b": "Estudo do local para posicionar os APs: preditivo, ativo/passivo e relatório com mapa de calor."}, {"f": "WPA3", "b": "Protocolo de segurança Wi-Fi mais recente e forte contra força bruta."}, {"f": "802.1X / RADIUS", "b": "Autenticação individual por usuário em redes corporativas."}], "vf": [{"s": "Interferência, atenuação e segurança são os principais desafios das redes sem fio.", "v": true, "j": "Verdadeiro."}, {"s": "Em redes indoor, paredes e móveis podem criar zonas mortas de sinal.", "v": true, "j": "Verdadeiro. Eles absorvem e refletem as ondas de rádio."}, {"s": "O 802.11ac opera nas faixas de 2,4 GHz e 5 GHz.", "v": false, "j": "Falso. Pela tabela do capítulo, o 802.11ac (Wi-Fi 5) opera em **5 GHz**. Quem opera nas duas é o 802.11n; o 802.11ax usa 2,4, 5 e 6 GHz."}, {"s": "O 802.11ax (Wi-Fi 6) foi pensado para ambientes com muitos dispositivos conectados.", "v": true, "j": "Verdadeiro, com tecnologias como o OFDMA."}, {"s": "No modo ad-hoc todos os dispositivos precisam de um ponto de acesso central.", "v": false, "j": "Falso. Isso é o modo **infraestruturado**. No ad-hoc os dispositivos se conectam diretamente."}, {"s": "Um sinal de −80 dBm é mais forte que um de −50 dBm.", "v": false, "j": "Falso. Quanto mais perto de zero, mais forte: **−50 dBm é mais forte**."}, {"s": "A faixa de 2,4 GHz tem maior alcance, mas sofre mais interferência que a de 5 GHz.", "v": true, "j": "Verdadeiro. Micro-ondas e telefones sem fio também usam essa faixa."}, {"s": "A faixa de 6 GHz é usada pelo padrão Wi-Fi 6E.", "v": true, "j": "Verdadeiro."}, {"s": "No site survey, o survey preditivo dispensa a medição no local.", "v": false, "j": "Falso. O survey ativo/passivo no local **valida e ajusta** o modelo preditivo."}, {"s": "O WEP ainda é considerado seguro para redes domésticas.", "v": false, "j": "Falso. O WEP é **obsoleto e inseguro**. O mínimo recomendado é WPA2, e WPA3 quando disponível."}, {"s": "O WPA2 usa o padrão de criptografia AES.", "v": true, "j": "Verdadeiro."}, {"s": "Ocultar o SSID impede que atacantes encontrem a rede.", "v": false, "j": "Falso. É uma medida simples, mas **não impede** atacantes determinados."}], "pbl": [{"titulo": "A Galeria Conectada", "duracao": "3 aulas", "cenario": "Um novo espaço de arte tem um salão principal com pé-direito duplo, salas menores com paredes grossas de concreto e um jardim de esculturas a céu aberto. Visitantes vão usar um app com áudio-guia e a equipe usa tablets para vendas. A inauguração é em menos de um mês.", "problema": "Como projetar uma rede sem fio que cubra salão, salas de concreto e jardim, com desempenho e segurança para equipe e visitantes?", "perguntas": ["Que desafios cada ambiente (salão, salas de concreto, jardim) impõe?", "Qual padrão e quais faixas usar?", "Como será o site survey?", "Como separar a rede da equipe da rede dos visitantes?", "Que sinal mínimo aceitar em cada área?"], "entregaveis": ["Planta com a posição proposta dos APs e mapa de calor estimado", "Roteiro do site survey (5 etapas)", "Configuração das redes: SSID, segurança, autenticação", "Justificativa dos equipamentos indoor e outdoor"], "solucao": ["Salão: muitos visitantes ao mesmo tempo, então **Wi-Fi 6 (802.11ax)** com vários APs. Salas de concreto: forte atenuação, então um AP por sala. Jardim: APs **outdoor** robustos para intempéries.", "5 GHz para desempenho perto dos APs e 2,4 GHz como apoio para alcance.", "Site survey: planta, análise de espectro, survey preditivo, medições no local e relatório com mapas de calor; meta de sinal acima de −65 dBm.", "Rede da equipe com **WPA2/WPA3-Enterprise (802.1X)**; rede de visitantes separada e isolada."]}, {"titulo": "Wi-Fi da consultoria", "duracao": "2 aulas", "cenario": "Uma consultoria com 15 funcionários ocupa 200 m² com divisórias. Usa notebooks, smartphones e uma sala de reuniões com smart TV para videoconferência HD. Os dados dos clientes são confidenciais e visitantes precisam de internet.", "problema": "Que padrão, quantos APs e que configuração de segurança atendem a consultoria com bom custo-benefício?", "perguntas": ["Quais aplicações a rede precisa suportar?", "Wi-Fi 5 ou Wi-Fi 6? Por quê?", "Quantos APs e onde, considerando as divisórias?", "Como autenticar funcionários e separar visitantes?"], "entregaveis": ["Levantamento de requisitos", "Planta com os APs e as medições de sinal", "Ficha de configuração das duas redes"], "solucao": ["Requisitos: web, e-mail, arquivos no servidor local e videoconferência HD; segurança dos dados dos clientes é prioridade.", "Padrão **802.11ac (Wi-Fi 5)** pelo custo-benefício; **dois APs de teto** para evitar sombras das divisórias.", "Site survey simplificado com app no smartphone, garantindo sinal acima de **−65 dBm** na sala de reuniões e nas mesas.", "Rede “Consultoria-Corp” com **WPA2-Enterprise (802.1X)**, login individual; rede “Consultoria-Visitantes” isolada da rede interna."]}], "lab": ["wifi", "wsec"]}, {"id": "p5", "titulo": "Teste e Documentação", "subtitulo": "Capítulo 5 · plano de testes, documentação e ferramentas", "objetivo": "Elaborar e executar testes de rede (conectividade, desempenho, failover e segurança), definir o conteúdo da documentação do projeto e escolher ferramentas de apoio.", "resumo": [["Plano de testes", "Roteiro que valida cada aspecto da rede antes da produção, como o ensaio geral de uma peça de teatro."], ["Tipos de teste", "Conectividade (`ping`), desempenho (`iperf`, Speedtest), failover (desligar o link principal) e segurança (OpenVAS, Nmap)."], ["Documentação", "Topologia física e lógica, planilha de IPs, backup das configurações e políticas de segurança. É a planta da casa."], ["Ferramentas", "Diagramas: Visio, Lucidchart, draw.io. Projetos: Jira, Trello. Monitoramento: Zabbix, SolarWinds NPM, Grafana. Inventário: NetBox."], ["Erros comuns", "Não ter plano formal, documentação desatualizada e testar só conectividade."], ["Regra de ouro", "Atualizar a documentação a cada mudança. Documentação incorreta pode ser pior do que nenhuma."]], "historia": "Na InovaTech, Clara recebe Leo numa sala cheia de caixas e cabos saindo das paredes: “Bem-vindo ao caos organizado”. A missão dele agora é provar que a rede funciona e deixar tudo escrito, para que qualquer pessoa consiga manter e expandir a rede no futuro.", "historiaTitulo": "A saga de Leo", "caderno": [{"q": "O que é a elaboração de testes num projeto de rede?", "a": "O processo de planejar, criar e executar verificações para garantir que a rede atende a todos os requisitos técnicos e de negócio, da conectividade básica a simulações de carga e avaliações de segurança, antes de entrar em produção.", "t": "Discursiva"}, {"q": "Explique a analogia do ensaio geral de teatro para os testes.", "a": "Antes da estreia (implantação), atores (dispositivos), cenário (infraestrutura física) e roteiro (configurações) são testados; cada cena é um caso de teste. Falhas são corrigidas no ensaio, não na frente do público.", "t": "Discursiva"}, {"q": "Como fazer um teste de conectividade? Dê um exemplo de comando.", "a": "Verificar se um dispositivo se comunica com outro, geralmente com ping. Ex.: `ping 192.168.1.1` a partir de um computador para testar a comunicação com o roteador.", "t": "Discursiva"}, {"q": "Como o `iperf` é usado num teste de desempenho?", "a": "Configura-se um servidor iperf num lado da rede e um cliente no outro; o teste mede a taxa de transferência máxima (largura de banda) entre os dois pontos.", "t": "Discursiva"}, {"q": "O que é um teste de failover? Dê um exemplo.", "a": "Simular a falha de um componente crítico para ver se a redundância funciona. Ex.: desconectar o cabo do link principal e verificar se o tráfego passa sozinho para o link secundário.", "t": "Discursiva"}, {"q": "Por que “a rede pinga” não significa que a rede está pronta?", "a": "Porque conectividade é só um aspecto. É preciso testar desempenho, segurança e redundância: uma rede que só responde ao ping pode ser lenta, insegura ou não aguentar uma falha.", "t": "Discursiva"}, {"q": "Liste os quatro conteúdos essenciais da documentação de uma rede.", "a": "Topologia (diagramas físico e lógico), planilha de endereçamento IP, cópias de segurança das configurações dos dispositivos e políticas de segurança (regras de firewall, VPN, acesso).", "t": "Discursiva"}, {"q": "Por que guardar cópias das configurações function st(mid){ return S[mid] || (S[mid] = {cad:{}, fc:{}, vf:{}, vfj:{}, pbl:{}}); }

const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt = s => esc(s).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>").replace(/\*([^*]+)\*/g, "<em>$1</em>");
const h = (tag, attrs={}, html="") => { const e = document.createElement(tag); for (const k in attrs) { if (k === "class") e.className = attrs[k]; else if (k.startsWith("on")) e.addEventListener(k.slice(2), attrs[k]); else e.setAttribute(k, attrs[k]); } if (html) e.innerHTML = html; return e; };

const TABS = [
  {id:"resumo", label:"Resumo"},
  {id:"lab", label:"Laboratório visual"},
  {id:"caderno", label:"Caderno"},
  {id:"flash", label:"Flashcards"},

];

function modTotals(m){
  const s = st(m.id);
  const cad = Object.entries(s.cad).filter(([k, v]) => /^\d+$/.test(k) && v).length;
  const fc = Object.keys(s.fc).length;
  const vf = Object.keys(s.vf).length;
  const pbl = Object.values(s.pbl).filter(v => v === "sol").length;
  const total = m.caderno.length + m.flash.length + m.vf.length + m.pbl.length;
  const done = cad + fc + vf + pbl;
  return {cad, fc, vf, pbl, total, done};
}
/* Pontuação: caderno 10/6/2 · flashcard 3/1 · V ou F 10 (acerto) ou 2 (tentativa) · PBL 20 */
const PONTOS = {cad:{ok:10, mid:6, no:2}, fc:{k:3, r:1}, vfOk:10, vfErr:2, pbl:20};
function modPoints(m){
  const s = st(m.id); let p = 0;
  Object.entries(s.cad).forEach(([k, v]) => { if (/^\d+$/.test(k)) p += PONTOS.cad[v] || 0; });
  Object.values(s.fc).forEach(v => p += PONTOS.fc[v] || 0);
  Object.entries(s.vf).forEach(([i, v]) => p += (m.vf[i] && v === m.vf[i].v) ? PONTOS.vfOk : PONTOS.vfErr);
  Object.values(s.pbl).forEach(v => { if (v === "sol") p += PONTOS.pbl; });
  return p;
}
function modMax(m){ return m.caderno.length * 10 + m.flash.length * 3 + m.vf.length * 10 + m.pbl.length * 20; }
function totalPoints(){ return COURSE.modulos.reduce((a, m) => a + modPoints(m), 0); }
function portState(done, total){ return done === 0 ? "" : (done >= total ? "on" : "half"); }

function renderNav(cur){
  const nav = document.getElementById("nav"); nav.innerHTML = "";
  let T = 0, D = 0;
  const home = h("li"); const hb = h("button", {"aria-current": String(cur === "home"), onclick: () => go("home")},
    `<span class="num">≡</span><span><span class="t">Visão geral</span></span>`);
  home.append(hb); nav.append(home);
  const rk = h("li"); rk.append(h("button", {"aria-current": String(cur === "ranking"), onclick: () => go("ranking")}, `<span class="num">★</span><span><span class="t">Pontuação e ranking</span></span>`)); nav.append(rk);
  COURSE.modulos.forEach((m, i) => {
    const t = modTotals(m); T += t.total; D += t.done;
    const li = h("li");
    const ports = [["cad", m.caderno.length], ["fc", m.flash.length], ["vf", m.vf.length], ["pbl", m.pbl.length]]
      .map(([k, n]) => `<span class="${portState(t[k], n)}" title="${k}"></span>`).join("");
    const b = h("button", {"aria-current": String(cur === m.id), onclick: () => go(m.id)},
      `<span class="num">${String(i+1).padStart(2,"0")}</span><span><span class="t">${esc(m.titulo)}</span><span class="ports" aria-label="${t.done} de ${t.total} feitas">${ports}</span></span>`);
    li.append(b); nav.append(li);
  });
  const pct = T ? Math.round(D / T * 100) : 0;
  document.getElementById("g-pct").textContent = pct + "%";
  document.getElementById("g-bar").style.width = pct + "%";
  document.getElementById("g-detail").textContent = `${D} de ${T} atividades`;
  document.getElementById("g-pts").textContent = `${totalPoints()} pts`;
}

let curMod = "home", curTab = "resumo";
function go(mid, tab){
  curMod = mid; curTab = tab || "resumo";
  try { history.replaceState(null, "", "#" + mid); } catch(e) {}
  render(); window.scrollTo({top:0});
}
function render(){
  renderNav(curMod);

  const t = modTotals(m);
  const counts = {lab: (m.lab || []).length, resumo: m.resumo.length, caderno: `${t.cad}/${m.caderno.length}`, flash: `${t.fc}/${m.flash.length}`, vf: `${t.vf}/${m.vf.length}`, pbl: `${t.pbl}/${m.pbl.length}`};

      `${tb.label}${tb.id === "resumo" || (tb.id === "lab" && !(m.lab || []).length) ? "" : ` <span class="count">${counts[tb.id]}</span>`}`));
  });
  v.append(tabs);
  const body = h("div", {class:"stack", role:"tabpanel"}); v.append(body);
  ({lab: renderLab, resumo: renderResumo, caderno: renderCaderno, flash: renderFlash, vf: renderVF, pbl: renderPBL})[curTab](body, m);
  const nav = h("div", {class:"btnrow"});
  const prev = COURSE.modulos[idx-1], next = COURSE.modulos[idx+1];
  if (prev) nav.append(h("button", {class:"btn", onclick: () => go(prev.id)}, `← ${esc(prev.titulo)}`));
  if (next) nav.append(h("button", {class:"btn", onclick: () => go(next.id)}, `${esc(next.titulo)} →`));
  const reset = h("button", {class:"btn small", style:"margin-left:auto", onclick: () => {
    reset.hidden = true;

             h("button", {class:"btn small", onclick: () => { c.remove(); reset.hidden = false; }}, "Cancelar"));
    nav.append(c);
  }}, "Recomeçar módulo");
  nav.append(reset);
  v.append(nav);
}

async function enviarPontos(silencioso){
  if (!RANK_URL || !PERFIL) return {ok:false, erro:"sem configuração"};
  const detalhe = {}; let feitas = 0, total = 0;
  COURSE.modulos.forEach(m => { const t = modTotals(m); detalhe[m.id] = modPoints(m); feitas += t.done; total += t.total; });
  const corpo = {acao:"salvar", disciplina: COURSE.id, turma: PERFIL.turma, id: PERFIL.id, apelido: PERFIL.apelido, nome: PERFIL.nome, curso: PERFIL.curso, turno: PERFIL.turno, pin: PERFIL.pin, pontos: totalPoints(), feitas, total, detalhe};
  try {
    const r = await fetch(RANK_URL, {method:"POST", body: JSON.stringify(corpo)});
    const j = await r.json();
    return j;
  } catch(e) { return {ok:false, erro:"Sem conexão com o ranking. Verifique a internet."}; }
}
