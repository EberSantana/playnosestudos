  document.getElementById('pct').textContent=done.size;
  document.getElementById('bar').style.width=(done.size/160*100)+'%';
  document.querySelectorAll('[data-modchip]').forEach(c=>{ c.querySelector('small').textContent=modCount(+c.dataset.modchip)+'/40'; });
}
const $=s=>document.querySelector(s);

/* ============ NAVEGAÇÃO ============ */
function paintNav(){
  let h=`<button class="chip" data-tab="home" aria-pressed="${tab==='home'}">Início</button>`;
  MODS.forEach((m,i)=>{ h+=`<button class="chip" data-tab="${i}" data-modchip="${i}" aria-pressed="${tab===i}">Módulo ${i+1} · ${m.name} <small>${modCount(i)}/40</small></button>`; });
  h+=`<button class="chip" data-tab="lab" aria-pressed="${tab==='lab'}">Laboratório</button>`;
  $('#nav').innerHTML=h;
  const s=$('#sub');
  if(typeof tab==='number'){
    s.hidden=false;
    s.innerHTML=KINDS.map(k=>`<button class="chip" data-sub="${k[0]}" aria-pressed="${sub===k[0]}">${k[1]}</button>`).join('');
  } else s.hidden=true;
}
function go(t,sb){ tab=t; if(sb) sub=sb; paintNav(); render(); }
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-tab]'); if(t){ const v=t.dataset.tab; go(v==='home'||v==='lab'?v:+v, 'resumo'); return; }
  const s=e.target.closest('[data-sub]'); if(s){ go(tab,s.dataset.sub); return; }
  handleItemClick(e);
});

/* ============ RENDER ============ */
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
function render(){
  const c=$('#content');
  if(tab==='home') c.innerHTML=homeHtml();
  else if(tab==='lab'){ c.innerHTML=labHtml(); initLab(); }
  else {
    const m=MODS[tab];
    let h=`<div><div class="eyebrow">Módulo ${tab+1}</div><h2>${m.name}: ${m.sub}</h2></div>`;
    if(sub==='resumo') h+=`<div class="card"><h3>Ideias principais</h3>${m.resumo}</div><p class="hint">Cada módulo tem 40 atividades: 8 de caderno, 10 flashcards, 2 PBL, 10 de verdadeiro ou falso e 10 de quiz.</p>`;
    if(sub==='caderno') h+=`<p class="lead">Resolva no caderno. Anote sua resposta aqui para liberar a conferência.</p><div class="grid">`+m.caderno.map((q,i)=>cadernoHtml(q,i)).join('')+`</div>`;
    if(sub==='flash') h+=`<p class="lead">Tente lembrar antes de virar o cartão. Escreva o que você sabe e depois confira.</p><div class="grid">`+m.flash.map((q,i)=>flashHtml(q,i)).join('')+`</div>`;
    if(sub==='pbl') h+=`<p class="lead">Aprendizagem baseada em problemas. Resolva cada passo no caderno, escreva sua resposta e depois veja a solução.</p>`+m.pbl.map((p,i)=>pblHtml(p,i)).join('');
    if(sub==='vf') h+=`<p class="lead">Escolha verdadeiro ou falso e justifique com suas palavras. O gabarito vem depois.</p><div class="grid">`+m.vf.map((q,i)=>vfHtml(q,i)).join('')+`</div>`;
    if(sub==='quiz') h+=`<p class="lead">Toque na alternativa que você acha correta. A explicação aparece em seguida.</p><div class="grid">`+m.quiz.map((q,i)=>quizHtml(q,i)).join('')+`</div>`;
    c.innerHTML=h; applyDone();
  }
}
function applyDone(){ document.querySelectorAll('.item[data-id]').forEach(el=>{ if(done.has(el.dataset.id)) el.classList.add('done'); }); }
const ctx=(m,k,i,extra='')=>`data-id="m${m}-${k}-${i}" data-kind="${k}" data-i="${i}" ${extra}`;

function cadernoHtml(q,i){ return `<article class="item" ${ctx(tab,'caderno',i)}>
  <span class="tag">ATIVIDADE ${i+1}</span><p>${q[0]}</p>
  <div><label for="c${i}">Sua resposta</label><textarea id="c${i}" data-gate placeholder="Anote como você resolveu"></textarea></div>
  <button class="btn" data-act="reveal" disabled>Conferir resposta</button><div class="slot"></div></article>`; }
function flashHtml(q,i){ return `<article class="item" ${ctx(tab,'flash',i)}>
  <span class="tag">CARTÃO ${i+1}</span><h4>${q[0]}</h4>
  <div><label for="f${i}">O que você lembra?</label><textarea id="f${i}" data-gate placeholder="Responda antes de virar"></textarea></div>
  <button class="btn" data-act="reveal" disabled>Virar cartão</button><div class="slot"></div></article>`; }
function vfHtml(q,i){ return `<article class="item" ${ctx(tab,'vf',i)}>
  <span class="tag">AFIRMAÇÃO ${i+1}</span><p>${q[0]}</p>
  <div class="vf" role="group" aria-label="Sua escolha"><button data-act="pick" data-v="1" aria-pressed="false">Verdadeiro</button><button data-act="pick" data-v="0" aria-pressed="false">Falso</button></div>
  <div><label for="v${i}">Justifique</label><textarea id="v${i}" data-gate placeholder="Por que você escolheu essa opção?"></textarea></div>
  <button class="btn" data-act="reveal" disabled>Conferir</button><div class="slot"></div></article>`; }
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function quizHtml(q,i){
  const order=shuffle(q[1].map((t,k)=>k));
  return `<article class="item" ${ctx(tab,'quiz',i)}>
  <span class="tag">QUESTÃO ${i+1}</span><p>${q[0]}</p>
  <div class="opts">${order.map(k=>`<button data-act="opt" data-k="${k}">${esc(q[1][k])}</button>`).join('')}</div><div class="slot"></div></article>`; }
function pblHtml(p,pi){ return `<section class="card" data-pbl="${pi}">
  <h3>PBL ${pi+1}: ${p.title}</h3><div class="scene"><p>${p.scene}</p></div>
  <div class="steps">${p.steps.map((s,si)=>`<div class="item step" ${ctx(tab,'pbls',pi+'-'+si,'data-p="'+pi+'" data-s="'+si+'"').replace('data-id="m'+tab+'-pbls-'+pi+'-'+si+'"','data-id="m'+tab+'-pblstep-'+pi+'-'+si+'"')}>
    <span class="tag">PASSO ${si+1}</span><p>${s[0]}</p>
    <div><label for="p${pi}_${si}">Sua resolução</label><textarea id="p${pi}_${si}" data-gate placeholder="Escreva o que você encontrou"></textarea></div>
    <button class="btn" data-act="reveal" disabled>Ver solução do passo</button><div class="slot"></div></div>`).join('')}</div></section>`; }

function ans(label,html){ return `<div class="answer"><b class="k">${label}</b><div>${html}</div></div>`; }

function handleItemClick(e){
  const b=e.target.closest('[data-act]'); if(!b) return;
  const it=b.closest('.item'); if(!it) return;
  const m=tab, kind=it.dataset.kind, act=b.dataset.act;
  if(act==='pick'){ it.querySelectorAll('[data-act=pick]').forEach(x=>x.setAttribute('aria-pressed',x===b)); gate(it); return; }
  if(act==='opt'){
    const q=MODS[m].quiz[+it.dataset.i]; const k=+b.dataset.k;
    it.querySelectorAll('.opts button').forEach(x=>{ x.disabled=true; if(+x.dataset.k===q[2]) x.classList.add('right'); });
    if(k!==q[2]) b.classList.add('wrong');
    it.querySelector('.slot').innerHTML=`<div class="verdict ${k===q[2]?'ok':'no'}">${k===q[2]?'Correto.':'Não foi dessa vez.'}</div>`+ans('Explicação',q[3]);
    mark(it.dataset.id); it.classList.add('done'); return;
  }
  if(act==='reveal' && !b.disabled){
    const slot=it.querySelector('.slot'); b.disabled=true; b.hidden=true;
    it.querySelectorAll('textarea').forEach(t=>t.readOnly=true);
    if(kind==='caderno'){ slot.innerHTML=ans('Resposta',MODS[m].caderno[+it.dataset.i][1])+'<p class="hint">Compare com a sua. Se for diferente, refaça o cálculo no caderno.</p>'; }
    else if(kind==='flash'){ slot.innerHTML=ans('Resposta',esc(MODS[m].flash[+it.dataset.i][1])); }
    else if(kind==='vf'){
      const q=MODS[m].vf[+it.dataset.i]; const sel=it.querySelector('[data-act=pick][aria-pressed=true]').dataset.v==='1';
      it.querySelectorAll('[data-act=pick]').forEach(x=>x.disabled=true);
      slot.innerHTML=`<div class="verdict ${sel===q[1]?'ok':'no'}">${sel===q[1]?'Sua escolha bate com o gabarito.':'Sua escolha diverge do gabarito.'}</div>`+ans('Gabarito: '+(q[1]?'Verdadeiro':'Falso'),esc(q[2]));
    }
    else if(kind==='pbls'){
      const p=+it.dataset.p,s=+it.dataset.s; slot.innerHTML=ans('Solução',MODS[m].pbl[p].steps[s][1]);
      const card=it.closest('[data-pbl]');
      if(card.querySelectorAll('.step .answer').length===MODS[m].pbl[p].steps.length) mark('m'+m+'-pbl-'+p);
    }
    if(kind!=='pbls'){ mark(it.dataset.id); it.classList.add('done'); }
  }
}
document.addEventListener('input',e=>{ const t=e.target.closest('textarea[data-gate]'); if(t){ const it=t.closest('.item'); if(it) gate(it); } });
function gate(it){
  const ta=it.querySelector('textarea[data-gate]'), btn=it.querySelector('[data-act=reveal]'); if(!ta||!btn) return;
  let ok=ta.value.trim().length>=3;
  if(it.dataset.kind==='vf') ok=ok && !!it.querySelector('[data-act=pick][aria-pressed=true]');
  btn.disabled=!ok;
}

/* ============ INÍCIO ============ */
function homeHtml(){ return `
 <div class="card">
  <h2>Comece pelo prédio</h2>
  <p class="lead">Imagine um prédio com 256 apartamentos. Se todo mundo grita no corredor, ninguém se entende. Dividido em 4 blocos de 64, cada bloco tem seu corredor e sua portaria. Isso é <b>subnetting</b>.</p>
  <div class="building" aria-label="Prédio dividido em 4 blocos">
   <div><b>Bloco A</b>192.168.1.0/26<br>64 endereços</div><div><b>Bloco B</b>192.168.1.64/26<br>64 endereços</div>
   <div><b>Bloco C</b>192.168.1.128/26<br>64 endereços</div><div><b>Bloco D</b>192.168.1.192/26<br>64 endereços</div>
  </div>
  <p class="hint">Prédio = rede /24 · Blocos = sub-redes · Portaria = roteador · Gritar no corredor = broadcast</p>
 </div>
 <div class="grid">
  <div class="card"><h3>Como estudar</h3><ul class="clean"><li>Leia o <b>Resumo</b> do módulo.</li><li>Resolva no <b>caderno</b> antes de conferir.</li><li>Faça os cartões, o PBL, o V ou F e o quiz.</li><li>Use o <b>Laboratório</b> para verificar seus cálculos.</li></ul></div>
  <div class="card"><h3>Trilha dos módulos</h3><ul class="clean">${MODS.map((m,i)=>`<li><b>Módulo ${i+1}</b>: ${m.name}, ${m.sub}</li>`).join('')}</ul></div>
  <div class="card"><h3>Sugestão de aulas</h3><ul class="clean"><li><b>Aula 1</b>: módulos 1 e 2 (1º ano)</li><li><b>Aula 2</b>: módulo 3 e laboratório (1º ano)</li><li><b>2º ano</b>: módulo 4, com VLSM</li></ul></div>
 </div>`; }

/* ============ LABORATÓRIO ============ */
function ip2int(s){ const p=s.trim().split('.'); if(p.length!==4) return null; let n=0; for(const x of p){ if(!/^\d{1,3}$/.test(x)||+x>255) return null; n=n*256+ +x; } return n>>>0; }
function int2ip(n){ return [n>>>24&255,n>>>16&255,n>>>8&255,n&255].join('.'); }
function maskOf(c){ return c===0?0:(0xFFFFFFFF<<(32-c))>>>0; }
function bitsHtml(n,cidr,borrow){ let h='<div class="bits">'; for(let o=0;o<4;o++){ h+='<span class="oct">'; for(let b=0;b<8;b++){ const i=o*8+b; const bit=(n>>>(31-i))&1; const cl=i<cidr?'net':(i<cidr+borrow?'sub':'host'); h+=`<span class="b ${cl}">${bit}</span>`; } h+='</span>'; } return h+'</div>'; }
function labHtml(){ return `
 <div><div class="eyebrow">Laboratório</div><h2>Confira seus cálculos</h2><p class="lead">Faça primeiro no caderno. Depois use as ferramentas para conferir.</p></div>
 <section class="card"><h3>1. Calculadora de rede</h3>
  <div class="row"><div><label for="lip">Endereço IP</label><input id="lip" class="mono" type="text" value="192.168.1.77"></div>
  <div><label for="lcidr">Prefixo (/1 a /30)</label><input id="lcidr" class="mono" type="number" min="1" max="30" value="26"></div></div>
  <div id="lout"></div></section>
 <section class="card"><h3>2. Divisor de redes (bits emprestados)</h3>
  <div class="row"><div><label for="dip">Rede base</label><input id="dip" class="mono" type="text" value="192.168.1.0"></div>
  <div><label for="dcidr">Prefixo base</label><input id="dcidr" class="mono" type="number" min="8" max="28" value="24"></div>
  <div><label for="dbits">Bits emprestados: <b id="dbv">2</b></label><input id="dbits" type="range" min="1" max="6" value="2"></div></div>
  <div id="dout"></div></section>
 <section class="card"><h3>3. Quantos hosts eu preciso?</h3>
  <div class="row"><div><label for="hn">Número de dispositivos</label><input id="hn" class="mono" type="number" min="1" max="1000000" value="50"></div></div>
  <div id="hout"></div></section>`; }
function initLab(){
  const calc=()=>{
    const ip=ip2int($('#lip').value), c=+$('#lcidr').value, o=$('#lout');
    if(ip===null||!(c>=1&&c<=30)){ o.innerHTML='<p class="err">Digite um IP válido (4 octetos de 0 a 255) e um prefixo de 1 a 30.</p>'; return; }
    const m=maskOf(c), net=(ip&m)>>>0, bc=(net|(~m>>>0))>>>0, h=32-c;
    o.innerHTML=`<div class="kv"><div><span>Máscara</span><b>${int2ip(m)} /${c}</b></div><div><span>Endereço de rede</span><b>${int2ip(net)}</b></div><div><span>Broadcast</span><b>${int2ip(bc)}</b></div>
    <div><span>Faixa utilizável</span><b>${int2ip(net+1)} a ${int2ip(bc-1)}</b></div><div><span>Salto no octeto que muda</span><b>${2**(h%8===0?8:h%8)}</b></div><div><span>Hosts utilizáveis</span><b>${(2**h-2).toLocaleString('pt-BR')} (2^${h} − 2)</b></div></div>
    ${bitsHtml(ip,c,0)}<div class="legend"><span><i style="background:var(--accent)"></i>bits de rede</span><span><i style="background:var(--surface2)"></i>bits de host</span></div>`;
  };
  const div=()=>{
    const ip=ip2int($('#dip').value), c=+$('#dcidr').value; let b=+$('#dbits').value; const o=$('#dout');
    if(ip===null||!(c>=8&&c<=28)){ o.innerHTML='<p class="err">Digite uma rede válida e um prefixo de 8 a 28.</p>'; return; }
    const maxb=Math.min(6,30-c); if(b>maxb){ b=maxb; $('#dbits').value=b; } $('#dbits').max=maxb; $('#dbv').textContent=b;
    const nc=c+b, m=maskOf(nc), size=2**(32-nc), n=2**b, base=(ip&maskOf(c))>>>0;
    let rows=''; for(let i=0;i<Math.min(n,64);i++){ const s=(base+i*size)>>>0, e=(s+size-1)>>>0; rows+=`<tr><td>${i+1}</td><td>${int2ip(s)}/${nc}</td><td>${int2ip(s+1)} a ${int2ip(e-1)}</td><td>${int2ip(e)}</td></tr>`; }
    o.innerHTML=`<div class="kv"><div><span>Nova máscara</span><b>${int2ip(m)} /${nc}</b></div><div><span>Sub-redes (2^${b})</span><b>${n}</b></div><div><span>Endereços por sub-rede</span><b>${size}</b></div><div><span>Hosts utilizáveis</span><b>${size-2}</b></div></div>
    ${bitsHtml(base,c,b)}<div class="legend"><span><i style="background:var(--accent)"></i>rede original</span><span><i style="background:var(--amber)"></i>bits emprestados</span><span><i style="background:var(--surface2)"></i>host restante</span></div>
    <div class="tbl"><table><thead><tr><th>#</th><th>Rede</th><th>Hosts utilizáveis</th><th>Broadcast</th></tr></thead><tbody>${rows}</tbody></table></div>${n>64?'<p class="hint">Mostrando as 64 primeiras sub-redes.</p>':''}`;
  };
  const hosts=()=>{
    const n=+$('#hn').value, o=$('#hout'); if(!(n>=1)){ o.innerHTML='<p class="err">Digite um número maior que zero.</p>'; return; }
    let h=2; while(2**h-2<n) h++; if(32-h<1){ o.innerHTML='<p class="err">Número grande demais para IPv4.</p>'; return; }
    const c=32-h; o.innerHTML=`<div class="kv"><div><span>Bits de host necessários</span><b>${h}</b></div><div><span>Máscara</span><b>${int2ip(maskOf(c))} /${c}</b></div><div><span>Hosts utilizáveis</span><b>${(2**h-2).toLocaleString('pt-BR')}</b></div><div><span>Sobram</span><b>${(2**h-2-n).toLocaleString('pt-BR')}</b></div></div>`;
  };
  ['#lip','#lcidr'].forEach(s=>$(s).addEventListener('input',calc));
  ['#dip','#dcidr','#dbits'].forEach(s=>$(s).addEventListener('input',div));
  $('#hn').addEventListener('input',hosts);
  calc(); div(); hosts();
}

paintNav(); paintProgress(); render();
</script>

window.PROGRESSO_DADOS = () => { const det = {}; MODS.forEach((m,i)=>{ det["m"+(i+1)] = modCount(i); }); return { feitas: done.size, total: 160, pontos: done.size*10, detalhe: det }; };
