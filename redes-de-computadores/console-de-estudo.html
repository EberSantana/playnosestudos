/* ---------- 1. Encapsulamento ---------- */
LABS_IMPL.encap=function(el,api){
  const L=[
   {n:5,name:"Aplicação",pdu:"Dados",hdr:null,info:"O app de mensagens cria os dados: “Olá, Beto!”."},
   {n:4,name:"Transporte",pdu:"Segmento",hdr:"TCP · porta origem 50123 → destino 8080 · seq 1",info:"O Sr. TCP acrescenta portas e número de sequência."},
   {n:3,name:"Rede",pdu:"Datagrama",hdr:"IP · 10.0.1.50 → 189.12.34.56",info:"A Sra. IP cola os endereços IP de origem e destino."},
   {n:2,name:"Enlace",pdu:"Quadro",hdr:"Ethernet · MAC placa de Ana → MAC AA:BB:CC:DD:EE:FF (roteador)",trl:"CRC",info:"O Sr. Enlace usa o ARP, põe os MACs do próximo salto e o CRC."},
   {n:1,name:"Física",pdu:"Bits",hdr:null,info:"Tudo vira sinais elétricos no par trançado: 0110 1000 0110 1001…"}
  ];
  let phase="send", step=0, msg="Clique na camada que age primeiro no computador de Ana.";
  function order(){ return phase==="send"?L:[...L].reverse(); }
  function draw(){
    const ord=order(), active=ord.slice(0,step);
    const present=phase==="send"?active:L.slice(0,5-step);
    // monta caixas aninhadas
    let inner=`<div class="enc-data">“Olá, Beto!”</div>`;
    const layersOn=phase==="send"?present.map(x=>x.n):present.map(x=>x.n);
    [4,3,2].forEach(n=>{ const l=L.find(x=>x.n===n);
      if(layersOn.includes(n)) inner=`<div class="enc-box enc-${n}"><span class="enc-h">${api.esc(l.hdr)}</span>${inner}${l.trl?`<span class="enc-h enc-t">${l.trl}</span>`:""}</div>`;});
    const bits=layersOn.includes(1)&&phase==="send"&&step===5;
    const done=phase==="recv"&&step===5;
    el.innerHTML=`
      <div class="lab-split">
        <div><div class="eyebrow">${phase==="send"?"Computador de Ana · descendo a pilha":"Computador de Beto · subindo a pilha"}</div>
          <div class="enc-btns">${[5,4,3,2,1].map(n=>{const l=L.find(x=>x.n===n);const used=active.some(a=>a.n===n);
            return `<button class="btn enc-l ${used?"used":""}" data-n="${n}" ${used||done?"disabled":""}><span class="mono">${n}</span> ${l.name}</button>`;}).join("")}</div>
        </div>
        <div style="min-width:0"><div class="eyebrow">O pacote agora · ${step===0&&phase==="send"?"vazio":(done?"entregue ao app":(order()[step-1]||{}).pdu||"")}</div>
          <div class="enc-stage ${bits?"bits":""}">${step===0&&phase==="send"?`<span class="hint">Nada criado ainda.</span>`:(bits?`<div class="enc-bits mono">01001111 01101100 11100001 00101100 00100000 01000010 01100101 01110100 01101111 00100001 …</div>`:inner)}</div>
          <p class="lab-msg" aria-live="polite">${msg}</p>
          ${phase==="send"&&step===5?`<button class="btn primary" id="enc-go">Enviar pelo cabo até Beto →</button>`:""}
          ${done?`<button class="btn" id="enc-re">Recomeçar</button>`:""}
        </div>
      </div>`;
    el.querySelectorAll(".enc-l").forEach(b=>b.onclick=()=>{
      const want=order()[step];
      if(+b.dataset.n===want.n){ step++; msg=`<b>Camada ${want.n} · ${want.name}.</b> ${want.info}`;
        if(phase==="recv"){ msg=`<b>Camada ${want.n} · ${want.name}.</b> ${["Os sinais viram bits de novo.","Confere o MAC de destino e o CRC e retira o quadro.","Confere o IP de destino e retira o cabeçalho IP.","Lê a porta 8080, confere a sequência, envia ACK e retira o segmento.","O app recebe “Olá, Beto!”. Missão cumprida!"][step-1]}`;
          if(step===5){ api.complete(); }
        }
      } else { msg=`<span class="bad-t">Ainda não.</span> ${phase==="send"?"No envio, os dados descem da camada 5 até a 1.":"Na recepção, os dados sobem da camada 1 até a 5."} Tente outra.`; }
      draw();
    });
    const go=el.querySelector("#enc-go"); if(go) go.onclick=()=>{phase="recv";step=0;msg="O sinal chegou ao computador de Beto. Qual camada age primeiro na recepção?";draw();};
    const re=el.querySelector("#enc-re"); if(re) re.onclick=()=>{phase="send";step=0;msg="Clique na camada que age primeiro no computador de Ana.";draw();};
  }
  draw();
};

/* ---------- 2. DNS ---------- */
LABS_IMPL.dns=function(el,api){
  const DOM={"www.ifs.edu.br":{tld:".br",ip:"200.17.x.x"},"www.google.com":{tld:".com",ip:"142.250.x.x"},"portal.mec.gov.br":{tld:".br",ip:"200.130.x.x"}};
  const STEPS=["Computador consulta o servidor DNS local","DNS local consulta um servidor raiz","Servidor raiz indica o servidor do domínio de topo","Servidor do domínio de topo indica o autoritativo","Servidor autoritativo devolve o IP"];
  let dom="www.ifs.edu.br", cache={}, picked=[], solved=false, shuffled=STEPS.map((s,i)=>i).sort(()=>Math.random()-.5), anim=[], msg="";
  function draw(){
    const d=DOM[dom];
    el.innerHTML=`
      <div class="controls"><label class="hint" for="dns-d">Domínio</label>
        <select id="dns-d" class="sel">${Object.keys(DOM).map(k=>`<option ${k===dom?"selected":""}>${k}</option>`).join("")}</select>
        ${solved?`<button class="btn primary" id="dns-run">Resolver ${dom}</button><button class="btn" id="dns-clr">Limpar cache</button>`:""}
      </div>
      ${!solved?`<p class="hint" style="margin:12px 0 6px">Clique nas etapas na ordem em que acontecem. Resolver o desafio libera o simulador.</p>
      <div class="chips">${shuffled.map(i=>`<button class="chip ${picked.includes(i)?"on":""}" data-i="${i}" ${picked.includes(i)?"disabled":""}>${picked.includes(i)?`<b class="mono">${picked.indexOf(i)+1}</b> `:""}${STEPS[i]}</button>`).join("")}</div>`:""}
      <ol class="dns-flow">${anim.map(a=>`<li class="${a.c||""}"><span class="mono">${a.t} ms</span> ${a.s}</li>`).join("")}</ol>
      <p class="lab-msg" aria-live="polite">${msg}</p>
      <div class="cache"><span class="eyebrow">Cache do DNS local</span> ${Object.keys(cache).length?Object.keys(cache).map(k=>`<span class="pill mono">${k} → ${cache[k]}</span>`).join(" "):`<span class="hint">vazio</span>`}</div>
      <p class="hint">IPs ilustrativos.</p>`;
    el.querySelector("#dns-d").onchange=e=>{dom=e.target.value;anim=[];msg="";draw();};
    el.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{
      const i=+b.dataset.i;
      if(i===picked.length){ picked.push(i); msg=""; if(picked.length===5){solved=true;msg="Ordem correta! Agora resolva um domínio e depois resolva de novo para ver o cache.";api.complete();} }
      else { msg=`<span class="bad-t">Fora de ordem.</span> Lembre: a consulta começa perto de você e desce a hierarquia até quem tem a resposta.`; }
      draw();});
    const run=el.querySelector("#dns-run");
    if(run) run.onclick=()=>{
      anim=[]; msg="";
      if(cache[dom]){ anim=[{t:1,s:"Computador consulta o servidor DNS local"},{t:2,s:`Resposta direto do cache: ${dom} → ${cache[dom]}`,c:"ok"}]; msg="Só 1 consulta. O cache evita repetir a cadeia inteira."; draw(); return; }
      const seq=[[8,"Computador consulta o servidor DNS local"],[25,"DNS local consulta um servidor raiz"],[42,`Raiz responde: pergunte ao servidor de ${d.tld}`],[60,`Servidor ${d.tld} responde: pergunte ao autoritativo de ${dom.split(".").slice(-3).join(".")}`],[78,`Autoritativo devolve: ${dom} → ${d.ip}`]];
      let k=0; run.disabled=true;
      const tick=()=>{ anim.push({t:seq[k][0],s:seq[k][1],c:k===4?"ok":""}); k++; draw();
        if(k<seq.length) setTimeout(tick,450); else { cache[dom]=d.ip; msg="4 consultas a partir do DNS local. Clique em Resolver de novo para ver o cache."; draw(); } };
      tick();
    };
    const clr=el.querySelector("#dns-clr"); if(clr) clr.onclick=()=>{cache={};anim=[];msg="Cache limpo.";draw();};
  }
  draw();
};

/* ---------- 3. TCP x UDP ---------- */
LABS_IMPL.tcpudp=function(el,api){
  let proto="TCP", loss=25, res=null, ran={TCP:false,UDP:false};
  function run(){
    const N=8, rows=[]; let rtt=proto==="TCP"?1:0, maxTry=0, delivered=0;
    for(let i=1;i<=N;i++){
      const tries=[]; let ok=false, t=0;
      do{ const lost=Math.random()*100<loss; tries.push(lost); t++; ok=!lost; }while(proto==="TCP"&&!ok&&t<6);
      if(ok) delivered++; maxTry=Math.max(maxTry,t); rows.push({i,tries,ok});
    }
    rtt+= proto==="TCP"? 1+rows.reduce((a,r)=>a+(r.tries.length-1),0) : 1;
    res={rows,delivered,N,rtt};
    if(loss>=20){ ran[proto]=true; if(ran.TCP&&ran.UDP) api.complete(); }
  }
  function draw(){
    el.innerHTML=`
      <div class="controls">
        <div class="seg" role="group" aria-label="Protocolo">${["TCP","UDP"].map(p=>`<button class="btn ${p===proto?"primary":""}" data-p="${p}">${p}</button>`).join("")}</div>
        <label class="hint" for="loss">Perda de pacotes: <b class="mono">${loss}%</b></label>
        <input type="range" id="loss" min="0" max="50" step="5" value="${loss}">
        <button class="btn primary" id="send">Enviar 8 segmentos</button>
      </div>
      ${proto==="TCP"?`<div class="hs"><span class="pill mono">SYN →</span><span class="pill mono">← SYN-ACK</span><span class="pill mono">ACK →</span><span class="hint">handshake antes dos dados</span></div>`:`<div class="hs"><span class="hint">UDP: sem handshake, sem ACK, sem retransmissão.</span></div>`}
      ${res?`<div class="tl">${res.rows.map(r=>`<div class="tl-row"><span class="mono tl-n">seg ${r.i}</span><span class="tl-tries">${r.tries.map(l=>`<span class="tl-p ${l?"lost":"okp"}" title="${l?"perdido":"entregue"}">${l?"✕":"✓"}</span>`).join("")}</span><span class="tl-s ${r.ok?"ok-t":"bad-t"}">${r.ok?(r.tries.length>1?`entregue após ${r.tries.length-1} retransmissão(ões)`:"entregue"):"perdido para sempre"}</span></div>`).join("")}</div>
      <div class="stats"><span class="score">Entregues: ${res.delivered}/${res.N}</span><span class="score">Tempo: ${res.rtt} RTT</span></div>
      <p class="lab-msg">${proto==="TCP"?"O TCP entregou tudo, mas cada perda custou tempo extra (retransmissão). Bom para arquivos e e-mail.":"O UDP terminou rápido, mas o que se perdeu não volta. Bom para vídeo ao vivo, jogos e VoIP."}</p>`:`<p class="hint" style="margin-top:12px">Para concluir, rode os dois protocolos com perda de pelo menos 20%.</p>`}
      <p class="hint">Status: TCP ${ran.TCP?"✓":"·"} · UDP ${ran.UDP?"✓":"·"}</p>`;
    el.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>{proto=b.dataset.p;res=null;draw();});
    el.querySelector("#loss").oninput=e=>{loss=+e.target.value;el.querySelector('label[for="loss"] b').textContent=loss+"%";};
    el.querySelector("#send").onclick=()=>{run();draw();};
  }
  draw();
};

/* ---------- 4. Sub-redes ---------- */
LABS_IMPL.subnet=function(el,api){
  let ok=0, ch=null, checked=null;
  const PRE=[24,25,26,27,28,30];
  function gen(){ const p=PRE[Math.floor(Math.random()*PRE.length)], b=2**(32-p), o3=Math.floor(Math.random()*250)+1, o4=Math.floor(Math.random()*254)+1;
    const base=["192.168","10.10","172.16"][Math.floor(Math.random()*3)];
    const net=Math.floor(o4/b)*b; ch={ip:`${base}.${o3}.${o4}`,p,b,pre:`${base}.${o3}.`,net,bc:net+b-1,hosts:b-2,o4}; checked=null; }
  gen();
  function mask(p){ const last=256-2**(32-p); return `255.255.255.${last===256?0:last}`; }
  function draw(){
    const c=ch;
    el.innerHTML=`
      <div class="sn-q"><span class="eyebrow">Desafio · acertos completos ${ok}/3</span><div class="sn-ip mono">${c.ip}/${c.p}</div><div class="hint mono">máscara ${mask(c.p)}</div></div>
      <div class="sn-f">
        <label>Endereço de rede<input id="sn-net" class="inp mono" placeholder="${c.pre}?" ${checked?"readonly":""} value="${checked?checked.net:""}"></label>
        <label>Broadcast<input id="sn-bc" class="inp mono" placeholder="${c.pre}?" ${checked?"readonly":""} value="${checked?checked.bc:""}"></label>
        <label>Hosts utilizáveis<input id="sn-h" class="inp mono" inputmode="numeric" placeholder="?" ${checked?"readonly":""} value="${checked?checked.h:""}"></label>
      </div>
      <div class="controls">${checked?`<button class="btn primary" id="sn-new">Novo desafio</button>`:`<button class="btn primary" id="sn-chk" disabled>Conferir</button><span class="hint">Preencha os três campos.</span>`}</div>
      ${checked?`<div class="answer ${checked.all?"":"badl"}"><div class="eyebrow">${checked.all?"Tudo certo!":"Confira o cálculo"} · rede ${checked.r1?"✓":"✕"} · broadcast ${checked.r2?"✓":"✕"} · hosts ${checked.r3?"✓":"✕"}</div>
        <p>/${c.p} deixa ${32-c.p} bits para hosts, então cada bloco tem 2^${32-c.p} = ${c.b} endereços. Os blocos no último octeto começam em múltiplos de ${c.b}. O ${c.o4} (binário <span class="mono">${c.o4.toString(2).padStart(8,"0")}</span>) cai no bloco que começa em ${c.net}.<br>
        Rede: <b class="mono">${c.pre}${c.net}</b> · Broadcast: <b class="mono">${c.pre}${c.bc}</b> · Hosts: ${c.b} − 2 = <b>${c.hosts}</b> (de ${c.pre}${c.net+1} a ${c.pre}${c.bc-1}).</p></div>`:""}`;
    const ins=["#sn-net","#sn-bc","#sn-h"].map(s=>el.querySelector(s)), btn=el.querySelector("#sn-chk");
    if(btn){ ins.forEach(i=>i.oninput=()=>{btn.disabled=!ins.every(x=>x.value.trim());});
      btn.onclick=()=>{ const v=ins.map(i=>i.value.trim()); const norm=s=>s.replace(/\s/g,"");
        const r1=norm(v[0])===c.pre+c.net||norm(v[0])===String(c.net), r2=norm(v[1])===c.pre+c.bc||norm(v[1])===String(c.bc), r3=+v[2]===c.hosts;
        checked={net:v[0],bc:v[1],h:v[2],r1,r2,r3,all:r1&&r2&&r3}; if(checked.all){ok++; if(ok>=3) api.complete();} draw(); }; }
    const nw=el.querySelector("#sn-new"); if(nw) nw.onclick=()=>{gen();draw();};
  }
  draw();
};

/* ---------- 5. Hub x Switch ---------- */
LABS_IMPL.switch=function(el,api){
  const H=[{n:"A",mac:"AA:AA:AA:AA:AA:AA",p:1},{n:"B",mac:"BB:BB:BB:BB:BB:BB",p:2},{n:"C",mac:"CC:CC:CC:CC:CC:CC",p:3},{n:"D",mac:"DD:DD:DD:DD:DD:DD",p:4}];
  let dev="switch", from="A", to="C", table={}, recv=[], log=[], flags={hub:false,flood:false,direct:false};
  function send(bcast){
    const s=H.find(h=>h.n===from), d=bcast?null:H.find(h=>h.n===to);
    if(!bcast&&s===d){ log.unshift("Escolha origem e destino diferentes."); return; }
    let line;
    if(dev==="hub"){ recv=H.filter(h=>h!==s).map(h=>h.n); flags.hub=true;
      line=`HUB: quadro de ${s.n} repetido para todas as portas. ${bcast?"":`Só ${d.n} aceita; os outros descartam.`} Todos disputam o mesmo domínio de colisão.`; }
    else{
      const learned=!table[s.mac]; table[s.mac]=s.p;
      if(bcast){ recv=H.filter(h=>h!==s).map(h=>h.n); line=`SWITCH: broadcast (FF:FF:FF:FF:FF:FF) vai para todas as portas, exceto a de origem.`; }
      else if(table[d.mac]){ recv=[d.n]; flags.direct=true; line=`SWITCH: conhece ${d.n} na porta ${table[d.mac]} → envia só para ela.`; }
      else { recv=H.filter(h=>h!==s).map(h=>h.n); flags.flood=true; line=`SWITCH: não conhece o MAC de ${d.n} → inunda (flooding) todas as portas, menos a de origem.`; }
      if(learned) line+=` Aprendeu: ${s.mac} está na porta ${s.p}.`;
    }
    log.unshift(line); log=log.slice(0,6);
    if(flags.hub&&flags.flood&&flags.direct) api.complete();
  }
  function draw(){
    el.innerHTML=`
      <div class="controls">
        <div class="seg" role="group" aria-label="Equipamento">${["hub","switch"].map(x=>`<button class="btn ${x===dev?"primary":""}" data-d="${x}">${x==="hub"?"Hub":"Switch"}</button>`).join("")}</div>
        <label class="hint">De <select id="sw-f" class="sel">${H.map(h=>`<option ${h.n===from?"selected":""}>${h.n}</option>`).join("")}</select></label>
        <label class="hint">Para <select id="sw-t" class="sel">${H.map(h=>`<option ${h.n===to?"selected":""}>${h.n}</option>`).join("")}</select></label>
        <button class="btn primary" id="sw-s">Enviar quadro</button><button class="btn" id="sw-b">Broadcast</button>
      </div>
      <div class="sw-net">
        <div class="sw-dev"><b>${dev==="hub"?"HUB":"SWITCH"}</b><span class="mono hint">${dev==="hub"?"1 domínio de colisão":"4 domínios de colisão"} · 1 domínio de broadcast</span>
          <div class="sw-ports">${H.map(h=>`<span class="sw-port ${recv.includes(h.n)?"hot":""} ${h.n===from&&recv.length?"src":""}">${h.p}</span>`).join("")}</div></div>
        <div class="sw-hosts">${H.map(h=>`<div class="sw-host ${recv.includes(h.n)?(h.n===to||!H.find(x=>x.n===to)?"got":"got"):""} ${h.n===from&&recv.length?"src":""}"><b>PC ${h.n}</b><span class="mono">${h.mac}</span><span class="hint">porta ${h.p}${recv.includes(h.n)?" · recebeu":""}</span></div>`).join("")}</div>
      </div>
      <div class="lab-split2">
        <div><div class="eyebrow">Tabela MAC do switch</div>
          <table class="tbl"><thead><tr><th>MAC</th><th>Porta</th></tr></thead><tbody>${Object.keys(table).length?Object.entries(table).map(([m,p])=>`<tr><td class="mono">${m}</td><td class="mono">${p}</td></tr>`).join(""):`<tr><td colspan="2" class="hint">vazia</td></tr>`}</tbody></table>
          <button class="btn sm" id="sw-clr" style="margin-top:6px">Limpar tabela</button></div>
        <div style="min-width:0"><div class="eyebrow">O que aconteceu</div><ul class="log">${log.map(l=>`<li>${l}</li>`).join("")||`<li class="hint">Envie um quadro.</li>`}</ul></div>
      </div>
      <p class="hint">Para concluir: use o hub uma vez, provoque uma inundação no switch e depois um envio direto. ${flags.hub?"✓":"·"} hub · ${flags.flood?"✓":"·"} inundação · ${flags.direct?"✓":"·"} direto</p>`;
    el.querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>{dev=b.dataset.d;recv=[];draw();});
    el.querySelector("#sw-f").onchange=e=>{from=e.target.value;};
    el.querySelector("#sw-t").onchange=e=>{to=e.target.value;};
    el.querySelector("#sw-s").onclick=()=>{send(false);draw();};
    el.querySelector("#sw-b").onclick=()=>{send(true);draw();};
    el.querySelector("#sw-clr").onclick=()=>{table={};recv=[];log.unshift("Tabela MAC apagada (como ao religar o switch).");draw();};
  }
  draw();
};

/* ---------- 6. Crimpagem ---------- */
LABS_IMPL.crimp=function(el,api){
  const W={bl:{n:"Branco-laranja",c:"#E07A2E",s:1},l:{n:"Laranja",c:"#E07A2E"},bv:{n:"Branco-verde",c:"#3C9A5F",s:1},v:{n:"Verde",c:"#3C9A5F"},baz:{n:"Branco-azul",c:"#2F6DB5",s:1},az:{n:"Azul",c:"#2F6DB5"},bm:{n:"Branco-marrom",c:"#8A5A3B",s:1},m:{n:"Marrom",c:"#8A5A3B"}};
  const STD={T568B:["bl","l","bv","az","baz","v","bm","m"],T568A:["bv","v","bl","az","baz","l","bm","m"]};
  let std="T568B", slots=Array(8).fill(null), tested=null, wins={T568B:false,T568A:false};
  let pool=Object.keys(W).sort(()=>Math.random()-.5);
  const sw=k=>W[k].s?`background:repeating-linear-gradient(90deg,${W[k].c} 0 6px,#F4F4F0 6px 10px)`:`background:${W[k].c}`;
  function draw(){
    const free=pool.filter(k=>!slots.includes(k));
    el.innerHTML=`
      <div class="controls"><div class="seg" role="group" aria-label="Padrão">${["T568B","T568A"].map(x=>`<button class="btn ${x===std?"primary":""}" data-s="${x}">${x}</button>`).join("")}</div>
        <span class="hint">Clique num fio para colocá-lo no próximo pino livre. Clique num pino para tirar o fio.</span></div>
      <div class="cr-pool">${free.map(k=>`<button class="cr-wire" data-w="${k}"><i style="${sw(k)}"></i>${W[k].n}</button>`).join("")||`<span class="hint">Todos os fios estão no conector.</span>`}</div>
      <div class="cr-plug">${slots.map((k,i)=>`<button class="cr-slot ${tested?(tested[i]?"good":"bad"):""}" data-i="${i}" aria-label="Pino ${i+1}"><span class="mono">${i+1}</span>${k?`<i style="${sw(k)}"></i><small>${W[k].n}</small>`:`<small class="hint">vazio</small>`}</button>`).join("")}</div>
      <div class="controls"><button class="btn primary" id="cr-t" ${slots.includes(null)?"disabled":""}>Crimpar e testar</button><button class="btn" id="cr-r">Recomeçar</button></div>
      ${tested?`<div class="cr-tester"><span class="eyebrow">Testador</span>${tested.map((g,i)=>`<span class="led ${g?"on":"off"}">${i+1}</span>`).join("")}<span class="lab-msg">${tested.every(Boolean)?`Cabo aprovado no padrão ${std}!`:`LEDs vermelhos indicam pinos fora do padrão ${std}. Corte o conector e refaça.`}</span></div>`:""}
      <p class="hint">Concluído com T568B: ${wins.T568B?"✓":"·"} · Desafio extra T568A (ponta de cabo crossover): ${wins.T568A?"✓":"·"}</p>`;
    el.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>{std=b.dataset.s;tested=null;draw();});
    el.querySelectorAll(".cr-wire").forEach(b=>b.onclick=()=>{const i=slots.indexOf(null); if(i>=0){slots[i]=b.dataset.w;tested=null;draw();}});
    el.querySelectorAll(".cr-slot").forEach(b=>b.onclick=()=>{slots[+b.dataset.i]=null;tested=null;draw();});
    el.querySelector("#cr-t").onclick=()=>{tested=slots.map((k,i)=>k===STD[std][i]); if(tested.every(Boolean)){wins[std]=true; if(wins.T568B) api.complete();} draw();};
    el.querySelector("#cr-r").onclick=()=>{slots=Array(8).fill(null);pool=Object.keys(W).sort(()=>Math.random()-.5);tested=null;draw();};
  }
  draw();
};

/* ---------- 7. Canais Wi-Fi ---------- */
LABS_IMPL.wifi=function(el,api){
  let ch={A:6,B:6,C:6};
  const COLORS={A:"var(--accent)",B:"var(--blue)",C:"var(--ok)"};
  const ov=(a,b)=>Math.abs(a-b)<5;
  function draw(){
    const keys=["A","B","C"], probs={};
    keys.forEach(k=>probs[k]=keys.filter(o=>o!==k&&ov(ch[k],ch[o])));
    const clean=keys.every(k=>!probs[k].length);
    if(clean) api.complete();
    const X=f=>20+(f-2400)/(2490-2400)*560;
    const arcs=keys.map(k=>{const fc=2412+5*(ch[k]-1), x1=X(fc-11), x2=X(fc+11), xc=X(fc);
      return `<path d="M${x1} 130 Q ${xc} ${-10} ${x2} 130" fill="${COLORS[k]}" fill-opacity=".18" stroke="${COLORS[k]}" stroke-width="2"/><text x="${xc}" y="${48+keys.indexOf(k)*14}" text-anchor="middle" font-size="11" fill="var(--ink)" font-family="var(--f-mono)">AP ${k} · c${ch[k]}</text>`;}).join("");
    const ticks=Array.from({length:13},(_,i)=>i+1).map(n=>{const x=X(2412+5*(n-1));return `<line x1="${x}" x2="${x}" y1="130" y2="135" stroke="var(--muted)"/><text x="${x}" y="148" text-anchor="middle" font-size="10" fill="var(--muted)" font-family="var(--f-mono)">${n}</text>`;}).join("");
    el.innerHTML=`
      <div class="wf-rooms">${keys.map(k=>`<div class="wf-room ${probs[k].length?"bad":"good"}"><b>Sala ${k}</b>
        <label class="hint">Canal <select class="sel" data-k="${k}">${Array.from({length:13},(_,i)=>i+1).map(n=>`<option ${n===ch[k]?"selected":""}>${n}</option>`).join("")}</select></label>
        <span class="${probs[k].length?"bad-t":"ok-t"}">${probs[k].length?"Interferência com "+probs[k].map(p=>"AP "+p).join(" e "):"Canal limpo"}</span></div>`).join("")}</div>
      <div class="wf-spec"><svg viewBox="0 0 600 160" role="img" aria-label="Espectro de 2,4 GHz com os canais escolhidos"><line x1="20" x2="580" y1="130" y2="130" stroke="var(--muted)"/>${ticks}${arcs}<text x="20" y="158" font-size="10" fill="var(--muted)" font-family="var(--f-mono)">2,4 GHz · canais de 22 MHz espaçados de 5 MHz</text></svg></div>
      <p class="lab-msg" aria-live="polite">${clean?"Sem sobreposição! Os três APs podem transmitir ao mesmo tempo sem disputar o espectro.":"Canais a menos de 5 números de distância se sobrepõem. Afaste-os até não haver interferência."}</p>`;
    el.querySelectorAll("select[data-k]").forEach(s=>s.onchange=()=>{ch[s.dataset.k]=+s.value;draw();});
  }
  draw();
};

/* ---------- 8. Quebre a topologia ---------- */
LAB_INFO.topo={t:"Quebre a topologia",d:"Escolha uma topologia e clique em equipamentos ou cabos para simular falhas. Veja quem continua se comunicando."};
LABS_IMPL.topo=function(el,api){
  const H=(id,x,y,l)=>({id,x,y,l:l||id,k:"host"}), D=(id,x,y,l,k)=>({id,x,y,l,k:k||"sw"});
  const T={
   estrela:{n:"Estrela",nodes:[D("S",300,160,"Switch"),H("A",300,40),H("B",420,95),H("C",420,225),H("D",300,280),H("E",180,225),H("F",180,95)],links:[["S","A"],["S","B"],["S","C"],["S","D"],["S","E"],["S","F"]],tip:"Derrube um cabo de computador e depois o switch central. Compare."},
   barramento:{n:"Barramento",nodes:[D("t1",80,160,"","tap"),D("t2",176,160,"","tap"),D("t3",272,160,"","tap"),D("t4",368,160,"","tap"),D("t5",464,160,"","tap"),D("t6",560,160,"","tap"),H("A",80,60),H("B",176,260),H("C",272,60),H("D",368,260),H("E",464,60),H("F",560,260)],links:[["t1","t2"],["t2","t3"],["t3","t4"],["t4","t5"],["t5","t6"],["t1","A"],["t2","B"],["t3","C"],["t4","D"],["t5","E"],["t6","F"]],tip:"Clique num trecho do cabo principal (linha horizontal)."},
   anel:{n:"Anel",ring:true,nodes:[H("A",300,40),H("B",410,100),H("C",410,220),H("D",300,280),H("E",190,220),H("F",190,100)],links:[["A","B"],["B","C"],["C","D"],["D","E"],["E","F"],["F","A"]],tip:"Derrube um único computador. Depois ative o anel duplo e repita."},
   arvore:{n:"Árvore",nodes:[D("R",300,40,"Raiz"),D("S1",170,140,"SW 1"),D("S2",430,140,"SW 2"),H("A",80,260),H("B",170,260),H("C",260,260),H("D",340,260),H("E",430,260),H("F",520,260)],links:[["R","S1"],["R","S2"],["S1","A"],["S1","B"],["S1","C"],["S2","D"],["S2","E"],["S2","F"]],tip:"Derrube um switch de ramo e depois a raiz."},
   malha:{n:"Malha",nodes:[H("A",300,40),H("B",450,130),H("C",395,275),H("D",205,275),H("E",150,130)],links:[["A","B"],["A","C"],["A","D"],["A","E"],["B","C"],["B","D"],["B","E"],["C","D"],["C","E"],["D","E"]],tip:"Tente isolar um nó cortando cabos. Quantos cortes são precisos?"},
   hibrida:{n:"Híbrida",nodes:[D("S1",300,70,"SW 1"),D("S2",420,220,"SW 2"),D("S3",180,220,"SW 3"),H("A",230,20),H("B",370,20),H("C",530,180),H("D",500,290),H("E",100,290),H("F",70,180)],links:[["S1","S2"],["S2","S3"],["S3","S1"],["S1","A"],["S1","B"],["S2","C"],["S2","D"],["S3","E"],["S3","F"]],tip:"Switches em anel com estrelas penduradas. Corte um cabo entre switches."}
  };
  let cur="estrela", downN=new Set(), downL=new Set(), duplo=false, tested=new Set();
  const lk=l=>l[0]+"-"+l[1];
  function analyze(){
    const t=T[cur], hosts=t.nodes.filter(n=>n.k==="host"&&!downN.has(n.id));
    if(t.ring&&!duplo&&(downN.size||downL.size)) return {ok:new Set(),broken:true,hosts};
    const adj={}; t.nodes.forEach(n=>{if(!downN.has(n.id)) adj[n.id]=[];});
    t.links.forEach(l=>{ if(!downL.has(lk(l))&&adj[l[0]]&&adj[l[1]]){adj[l[0]].push(l[1]);adj[l[1]].push(l[0]);} });
    let best=new Set();
    Object.keys(adj).forEach(s=>{ const seen=new Set([s]),q=[s]; while(q.length){const v=q.shift();adj[v].forEach(w=>{if(!seen.has(w)){seen.add(w);q.push(w);}});}
      const hs=new Set([...seen].filter(id=>hosts.some(h=>h.id===id))); if(hs.size>best.size) best=hs; });
    return {ok:best,broken:false,hosts};
  }
  function draw(){
    const t=T[cur], r=analyze(), total=t.nodes.filter(n=>n.k==="host").length;
    const N=id=>t.nodes.find(n=>n.id===id);
    const lines=t.links.map(l=>{const a=N(l[0]),b=N(l[1]),k=lk(l),dn=downL.has(k),main=a.k==="tap"&&b.k==="tap";
      return `<g class="tp-link" data-l="${k}" tabindex="0" role="button" aria-label="${main?"Trecho do cabo principal":(a.k==="tap"||b.k==="tap"?"Cabo do computador "+(a.k==="host"?a.l:b.l):"Cabo "+a.l+"–"+b.l)}"><line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="transparent" stroke-width="16"/><line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="${dn?"var(--bad)":"var(--muted)"}" stroke-width="${main?5:2.5}" stroke-dasharray="${dn?"6 5":"0"}"/></g>`;}).join("");
    const ring2=t.ring&&duplo?`<polygon points="${t.nodes.map(n=>(300+(n.x-300)*.78)+","+(160+(n.y-160)*.78)).join(" ")}" fill="none" stroke="var(--blue)" stroke-width="2.5" stroke-dasharray="5 4"/><text x="300" y="165" text-anchor="middle" font-size="11" fill="var(--blue)" font-family="var(--f-mono)">anel reserva</text>`:"";
    const nodes=t.nodes.map(n=>{ if(n.k==="tap") return `<circle cx="${n.x}" cy="${n.y}" r="4" fill="var(--muted)"/>`;
      const dn=downN.has(n.id), isH=n.k==="host", ok=r.ok.has(n.id);
      const fill=dn?"var(--bad)":(isH?(ok&&r.ok.size>1?"var(--ok)":"var(--panel2)"):"var(--ink)");
      const tc=dn?"var(--panel)":(isH?(ok&&r.ok.size>1?"var(--panel)":"var(--ink)"):"var(--bg)");
      return `<g class="tp-node" data-n="${n.id}" tabindex="0" role="button" aria-label="${isH?"Computador":"Equipamento"} ${n.l}"><rect x="${n.x-(isH?20:30)}" y="${n.y-14}" width="${isH?40:60}" height="28" rx="6" fill="${fill}" stroke="${dn?"var(--bad)":"var(--line)"}"/><text x="${n.x}" y="${n.y+4}" text-anchor="middle" font-size="12" font-weight="700" fill="${tc}" font-family="var(--f-mono)">${dn?"✕":n.l}</text></g>`;}).join("");
    const connected=r.broken?0:(r.ok.size>1?r.ok.size:0);
    const msg=r.broken?"O anel simples se rompeu: os dados circulam num só sentido e não completam o caminho. Ninguém se comunica."
      :(downN.size||downL.size?`${connected} de ${total} computadores ainda se comunicam entre si.`:"Rede funcionando. Clique em um cabo ou equipamento para simular uma falha.");
    el.innerHTML=`
      <div class="controls"><div class="seg tp-seg" role="group" aria-label="Topologia">${Object.keys(T).map(k=>`<button class="btn sm ${k===cur?"primary":""}" data-t="${k}">${T[k].n}${tested.has(k)?" ✓":""}</button>`).join("")}</div></div>
      ${t.ring?`<label class="chk" style="margin-top:8px"><input type="checkbox" id="tp-d" ${duplo?"checked":""}> Anel duplo (segundo anel no sentido contrário)</label>`:""}
      <div class="tp-wrap"><svg viewBox="0 0 600 320" role="img" aria-label="Topologia ${t.n}">${ring2}${lines}${nodes}</svg></div>
      <div class="stats"><span class="score">Cabos: ${t.links.filter(l=>N(l[0]).k!=="tap"||N(l[1]).k!=="tap").length+(t.links.some(l=>N(l[0]).k==="tap"&&N(l[1]).k==="tap")?1:0)}</span><span class="score ${connected===total?"":"warn"}">Conectados: ${connected}/${total}</span><button class="btn sm" id="tp-r">Consertar tudo</button></div>
      <p class="lab-msg" aria-live="polite">${msg}</p>
      <p class="hint">Dica: ${t.tip} Para concluir, provoque falhas em pelo menos 4 topologias diferentes (${tested.size}/4).</p>`;
    el.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{cur=b.dataset.t;downN=new Set();downL=new Set();duplo=false;draw();});
    const toggle=(set,k)=>{ set.has(k)?set.delete(k):set.add(k); tested.add(cur); if(tested.size>=4) api.complete(); draw(); };
    el.querySelectorAll(".tp-node").forEach(g=>{g.onclick=()=>toggle(downN,g.dataset.n); g.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();toggle(downN,g.dataset.n);}};});
    el.querySelectorAll(".tp-link").forEach(g=>{g.onclick=()=>toggle(downL,g.dataset.l); g.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();toggle(downL,g.dataset.l);}};});
    const d=el.querySelector("#tp-d"); if(d) d.onchange=()=>{duplo=d.checked;draw();};
    el.querySelector("#tp-r").onclick=()=>{downN=new Set();downL=new Set();draw();};
  }
  draw();
};

</script>
<script>
(function(){
const KEY="redes-console-v1";
let S={};
try{ S=JSON.parse(localStorage.getItem(KEY)||"{}")||{}; }catch(e){ S={}; }
function save(){ try{ localStorage.setItem(KEY,JSON.stringify(S)); }catch(e){} if(window.progressoMudou) window.progressoMudou(); }
// Play nos Estudos: envia o progresso deste console para o professor e para o robô Bit.
window.PROGRESSO_ID="redes-console-v1";
window.PROGRESSO_DADOS=()=>{ const t=MODULES.reduce((a,m)=>a+ids(m).length,0); return {feitas:totalDone(), total:t, pontos:xp(), detalhe:{}}; };
function get(id){ return S[id]||(S[id]={}); }
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const $=(s,r=document)=>r.querySelector(s);

const TYPES=[
 {k:"caderno",label:"Caderno",n:8,intro:"Responda no seu caderno (ou no rascunho abaixo). A resposta só aparece depois que você marcar que respondeu ou escrever sua tentativa."},
 {k:"flash",label:"Flashcards",n:12,intro:"Leia o termo, tente lembrar a definição e só então vire o cartão. Depois diga com sinceridade se lembrou."},
 {k:"pbl",label:"PBL",n:4,intro:"Problemas reais para resolver em grupo. Escreva o plano de solução da equipe; a resposta-guia libera depois da tentativa."},
 {k:"vf",label:"V ou F",n:16,intro:"Marque Verdadeiro ou Falso e justifique com suas palavras. Só então confira a correção comentada."}
];
const TOTAL_PER=40;
const LEVELS=[[0,"Cabo desconectado"],[250,"Placa de rede"],[600,"Switch"],[1100,"Roteador"],[1800,"Provedor (ISP)"],[2600,"Backbone"],[3300,"Arquiteto de redes"]];
function xp(){
  let x=0;
  MODULES.forEach(m=>{ ids(m).forEach(id=>{const s=S[id]; if(s&&s.done){x+=10; if(s.correct) x+=5;}}); if(S[m.id+"-lab"]&&S[m.id+"-lab"].done) x+=30; (EXPLORE[m.id]||[]).forEach((_,i)=>{ if(S[m.id+"-ex-"+i]&&S[m.id+"-ex-"+i].done) x+=10; }); });
  if(S.quiz&&S.quiz.best) x+=S.quiz.best*3;
  return x;
}
function level(x){ let i=0; LEVELS.forEach((l,k)=>{if(x>=l[0]) i=k;}); return {i,name:LEVELS[i][1],next:LEVELS[i+1]?LEVELS[i+1][0]:null,cur:LEVELS[i][0]}; }

// brand mark: pinagem T568B
const WIRES=[["#F2F2F2","#E07A2E"],["#E07A2E"],["#F2F2F2","#3C9A5F"],["#2F6DB5"],["#F2F2F2","#2F6DB5"],["#3C9A5F"],["#F2F2F2","#8A5A3B"],["#8A5A3B"]];
$("#mark").innerHTML=WIRES.map(w=>w.length===2?`<i style="background:repeating-linear-gradient(180deg,${w[1]} 0 4px,${w[0]} 4px 7px)"></i>`:`<i style="background:${w[0]}"></i>`).join("");

function ids(m){
  const out=[];
  m.caderno.forEach((_,i)=>out.push(m.id+"-caderno-"+i));
  m.flash.forEach((_,i)=>out.push(m.id+"-flash-"+i));
  m.pbl.forEach((_,i)=>out.push(m.id+"-pbl-"+i));
  m.vf.forEach((_,i)=>out.push(m.id+"-vf-"+i));
  return out;
}
function doneCount(m,type){
  return ids(m).filter(id=>(!type||id.includes("-"+type+"-")) && S[id] && S[id].done).length;
}
function totalDone(){ return MODULES.reduce((a,m)=>a+doneCount(m),0); }

let view={mod:null,tab:"explorar",card:0,page:null};

function parseHash(){
  const h=(location.hash||"").replace("#","");
  const mm=h.match(/^(m[1-8])(?:-(explorar|caderno|flash|pbl|vf|lab))?$/);
  view.page=null;
  if(mm){ view.mod=mm[1]; view.tab=mm[2]||"explorar"; } else { view.mod=null; if(h==="desafio"||h==="relatorio") view.page=h; }
}
function setHash(){
  const h=view.mod?(view.mod+"-"+view.tab):(view.page||"inicio");
  if(location.hash!=="#"+h) history.replaceState(null,"","#"+h);
}

function renderTop(){
  const t=totalDone(), all=MODULES.length*TOTAL_PER;
  const x=xp(), lv=level(x);
  $("#ov-txt").textContent=t+" / "+all;
  $("#ov-bar").style.width=(100*t/all)+"%";
  $("#xp").innerHTML=`<b class="mono">${x} pts</b><span>Patente: ${lv.name}</span>`;
}
function renderRail(){
  $("#rail").innerHTML=`<div class="eyebrow rail-h">Módulos da disciplina</div>`+MODULES.map(m=>{
    const d=doneCount(m);
    return `<button class="mod-btn" data-mod="${m.id}" aria-current="${view.mod===m.id}">
      <span class="mod-num">${m.num}</span>
      <span><span class="mod-l">${esc(m.layer)}</span><div class="mod-t">${esc(m.title.replace(/^A Camada de /,"Camada de "))}</div>
      <div class="mod-p"><span class="bar"><span style="width:${100*d/TOTAL_PER}%"></span></span></div></span>
    </button>`;}).join("");
  $("#rail").insertAdjacentHTML("beforeend",`<button class="mod-btn extra" data-page="desafio" aria-current="${view.page==="desafio"}"><span class="mod-num">⚡</span><span><span class="mod-l">Todos os módulos</span><div class="mod-t">Desafio relâmpago</div></span></button>
    <button class="mod-btn extra" data-page="relatorio" aria-current="${view.page==="relatorio"}"><span class="mod-num">✓</span><span><span class="mod-l">Avaliação contínua</span><div class="mod-t">Relatório para o professor</div></span></button>`);
  $("#rail").querySelectorAll(".mod-btn").forEach(b=>b.onclick=()=>{ if(b.dataset.page){view.mod=null;view.page=b.dataset.page;} else {view.page=null;view.mod=b.dataset.mod;view.tab="explorar";view.card=0;} render(true);});
}

function renderHome(){
  const how=TYPES.map(t=>`<div><em>${t.n} por módulo</em><b>${t.label}</b><span>${esc(t.intro.split(". ")[0])}.</span></div>`).join("");
  const mods=MODULES.map(m=>{const d=doneCount(m);return `<button class="card gm" data-mod="${m.id}">
    <span class="eyebrow">Unidade ${m.num} · ${esc(m.layer)}</span><h3>${esc(m.title)}</h3><p>${esc(m.objetivo)}</p>
    <span class="row"><span class="bar"><span style="width:${100*d/TOTAL_PER}%"></span></span>${d}/40 ${S[m.id+"-lab"]&&S[m.id+"-lab"].done?"· lab ✓":""}</span></button>`;}).join("");
  const ementa=EMENTA.map(u=>`<div class="em"><b>${esc(u[0])}</b><span>${esc(u[1])}</span><span class="em-l">${u[2].map(id=>{const m=MODULES.find(x=>x.id===id);return `<button class="pill" data-mod="${id}">Módulo ${m.num}</button>`;}).join(" ")}</span></div>`).join("");
  $("#main").innerHTML=`
  <section class="card hero">
    <span class="eyebrow">Curso Técnico em Informática · Ambiente de estudo</span>
    <h1>Redes de Computadores</h1>
    <p>${MODULES.length} módulos que seguem a pilha TCP/IP, da visão geral até o cabo e o Wi-Fi. Cada módulo tem 40 atividades e um laboratório interativo: tente primeiro, depois confira. A resposta só aparece depois da sua tentativa.</p>
    <div class="how">${how}</div>
  </section>
  ${homeStatus()}
  <div class="sec-h"><h2>Módulos</h2><span class="eyebrow">${MODULES.length} módulos · ${MODULES.length*40} atividades · ${MODULES.length} laboratórios</span></div>
  <div class="grid-mods">${mods}</div>
  <div class="sec-h"><h2>Leitura complementar</h2></div>
  <section class="card story">
    <div class="stack" aria-hidden="true"><span>5 · Aplicação</span><span>4 · Transporte</span><span>3 · Rede</span><span>2 · Enlace</span><span>1 · Física</span></div>
    <div><span class="eyebrow">Storytelling</span><h3 style="font-size:1.2rem;margin-top:4px">A Incrível Jornada de um Pacote de Dados</h3>
    <p>Paco nasce no computador de Ana e viaja até Beto, em Manaus, descendo os cinco andares do edifício TCP/IP, passando por switch, roteadores e fibra óptica. Em cada módulo há um quadro “Na jornada do Paco” ligando o conteúdo ao capítulo correspondente.</p></div>
  </section>
  <div class="sec-h"><h2>Conteúdo programático</h2><span class="eyebrow">Onde cada unidade da ementa é trabalhada</span></div>
  <div class="ementa card">${ementa}</div>`;
  $("#main").querySelectorAll(".gm,.em .pill").forEach(b=>b.onclick=()=>{view.mod=b.dataset.mod;view.tab="explorar";view.card=0;render(true);});
  $("#main").querySelectorAll("[data-page]").forEach(b=>b.onclick=()=>{view.page=b.dataset.page;render(true);});
}

function renderModule(){
  const m=MODULES.find(x=>x.id===view.mod);
  const labDone=S[m.id+"-lab"]&&S[m.id+"-lab"].done;
  const exN=(EXPLORE[m.id]||[]).length, exD=(EXPLORE[m.id]||[]).filter((_,i)=>S[m.id+"-ex-"+i]&&S[m.id+"-ex-"+i].done).length;
  const tabs=`<button class="tab tab-ex" role="tab" data-tab="explorar" aria-selected="${view.tab==="explorar"}">Explorar<span class="cnt">${exD}/${exN} visuais</span></button>`+TYPES.map(t=>`<button class="tab" role="tab" data-tab="${t.k}" aria-selected="${view.tab===t.k}">${t.label}<span class="cnt">${doneCount(m,t.k)}/${t.n}</span></button>`).join("")
    +`<button class="tab tab-lab" role="tab" data-tab="lab" aria-selected="${view.tab==="lab"}">Laboratório<span class="cnt">${labDone?"concluído":"+30 pts"}</span></button>`;
  const T=view.tab==="lab"?{intro:LAB_INFO[LABS[m.id]].d}:view.tab==="explorar"?{intro:"Comece por aqui: imagens, linhas do tempo e animações para ver o conteúdo acontecer. Clique, arraste e experimente."}:TYPES.find(t=>t.k===view.tab);
  let extra="";
  if(view.tab==="vf"){
    const ans=m.vf.map((_,i)=>S[m.id+"-vf-"+i]).filter(x=>x&&x.done);
    const ok=ans.filter(x=>x.correct).length;
    extra=`<span class="score">Acertos: ${ok} / ${ans.length} conferidas</span>`;
  }
  $("#main").innerHTML=`
  <section class="card mhead">
    <span class="eyebrow">Unidade ${m.num} · ${esc(m.layer)} · ${doneCount(m)}/40 concluídas</span>
    <h1>${esc(m.title)}</h1>
    <p>${esc(m.objetivo)}</p>
    <div class="concepts">${m.conceitos.map(c=>`<div><b>${esc(c[0])}</b><span>${esc(c[1])}</span></div>`).join("")}</div>
    <div class="paco"><span class="tag">Na jornada do Paco</span><p>${esc(m.paco)}</p></div>
  </section>
  <div class="tabs" role="tablist">${tabs}</div>
  <div class="tab-intro"><p>${esc(T.intro)}</p>${extra}</div>
  <div id="pane"></div>
  <div class="reset" id="reset"><span>Quer refazer este módulo do zero?</span><button class="btn sm" id="reset-btn">Limpar respostas do módulo</button></div>`;
  $("#main").querySelectorAll(".tab").forEach(b=>b.onclick=()=>{view.tab=b.dataset.tab;view.card=0;render(false);});
  $("#reset-btn").onclick=()=>{
    $("#reset").innerHTML=`<span>Isso apaga suas respostas da Unidade ${m.num}.</span><button class="btn sm" id="r-no">Cancelar</button><button class="btn sm sel-bad" id="r-yes">Apagar</button>`;
    $("#r-no").onclick=()=>render(false);
    $("#r-yes").onclick=()=>{ids(m).forEach(id=>delete S[id]);delete S[m.id+"-lab"];(EXPLORE[m.id]||[]).forEach((_,i)=>delete S[m.id+"-ex-"+i]);save();render(false);};
  };
  const pane=$("#pane");
  if(view.tab==="caderno") paneCaderno(m,pane);
  if(view.tab==="flash") paneFlash(m,pane);
  if(view.tab==="pbl") panePBL(m,pane);
  if(view.tab==="vf") paneVF(m,pane);
  if(view.tab==="lab") paneLab(m,pane);
  if(view.tab==="explorar") paneExplore(m,pane);
}
function paneExplore(m,pane){
  pane.className="items";
  const list=EXPLORE[m.id]||[];
  pane.innerHTML=list.map((v,i)=>{const st=S[m.id+"-ex-"+i]||{};return `<section class="card ex-card"><div class="lab-head"><div><span class="eyebrow">Visual ${i+1} de ${list.length}</span><h2>${esc(v.t)}</h2><p class="hint" style="margin:4px 0 0">${esc(v.d)}</p></div><span class="badge ${st.done?"ok":""}" data-exb="${i}">${st.done?"Explorado · +10 pts":"A explorar"}</span></div><div class="ex-body" data-ex="${i}"></div></section>`;}).join("");
  list.forEach((v,i)=>{ const id=m.id+"-ex-"+i;
    EXE[v.type](pane.querySelector(`[data-ex="${i}"]`),v.spec,()=>{ const st=get(id); if(st.done) return; st.done=true; save(); refreshCounts(); toast("Visual explorado! +10 pts");
      const b=pane.querySelector(`[data-exb="${i}"]`); if(b){b.textContent="Explorado · +10 pts";b.classList.add("ok");}
      const tc=document.querySelector(".tab-ex .cnt"); if(tc){ const d=list.filter((_,k)=>S[m.id+"-ex-"+k]&&S[m.id+"-ex-"+k].done).length; tc.textContent=d+"/"+list.length+" visuais"; } }); });
}
function paneLab(m,pane){
  const key=LABS[m.id], info=LAB_INFO[key], st=get(m.id+"-lab");
  pane.className="";
  pane.innerHTML=`<section class="card lab"><div class="lab-head"><h2>${esc(info.t)}</h2><span class="badge ${st.done?"ok":""}" id="lab-badge">${st.done?"Concluído":"Em andamento"}</span></div><div id="lab-body"></div></section>`;
  LABS_IMPL[key](pane.querySelector("#lab-body"),{esc,complete:()=>{ if(!st.done){ st.done=true; save(); refreshCounts(); toast("Laboratório concluído! +30 pts"); const b=$("#lab-badge"); if(b){b.textContent="Concluído";b.classList.add("ok");} const tc=document.querySelector('.tab-lab .cnt'); if(tc) tc.textContent="concluído"; } }});
}
function toast(t){ const d=document.createElement("div"); d.className="toast"; d.textContent=t; document.body.appendChild(d); setTimeout(()=>d.remove(),2600); }
function homeStatus(){
  const x=xp(), lv=level(x), pct=lv.next?Math.round(100*(x-lv.cur)/(lv.next-lv.cur)):100;
  const badges=MODULES.map(m=>{const full=doneCount(m)===40&&S[m.id+"-lab"]&&S[m.id+"-lab"].done;return `<span class="bdg ${full?"on":""}" title="${esc(m.title)}">${m.num}</span>`;}).join("");
  const best=S.quiz&&S.quiz.best?S.quiz.best:0;
  return `<div class="status">
    <section class="card st-l"><span class="eyebrow">Seu nível</span><div class="lv">Nível ${lv.i+1} · ${lv.name}</div>
      <div class="bar" style="height:8px"><span style="width:${pct}%"></span></div>
      <span class="hint">${x} pts${lv.next?` · faltam ${lv.next-x} pts para a próxima patente`:" · patente máxima"}. Cada atividade vale 10 pts, acerto no V ou F +5, laboratório +30.</span>
      <div class="bdgs"><span class="hint">Selos de módulo completo (40 atividades + laboratório):</span> ${badges}</div></section>
    <section class="card st-r"><span class="eyebrow">Desafio relâmpago</span><div class="lv">10 questões · 90 segundos</div><span class="hint">V ou F sorteadas de todos os módulos. Seu recorde: ${best}/10.</span>
      <button class="btn primary" data-page="desafio">Começar desafio</button></section>
  </div>`;
}

/* ---------- Desafio relâmpago ---------- */
let QZ=null, QT=null;
function renderQuiz(){
  clearInterval(QT);
  const best=S.quiz&&S.quiz.best?S.quiz.best:0;
  if(!QZ||QZ.over&&QZ.reset){ QZ=null; }
  if(!QZ){
    $("#main").innerHTML=`<section class="card hero"><span class="eyebrow">Desafio relâmpago · todos os módulos</span><h1>10 questões em 90 segundos</h1>
      <p>Afirmações de Verdadeiro ou Falso sorteadas dos ${MODULES.length} módulos. Você vê a correção comentada logo depois de cada resposta. Cada acerto do seu recorde vale 3 pts.</p>
      <div class="controls"><button class="btn primary" id="qz-go">Começar</button><span class="score">Recorde: ${best}/10</span></div></section>`;
    $("#qz-go").onclick=()=>{ const pool=[]; MODULES.forEach(m=>m.vf.forEach(q=>pool.push({...q,mod:m.num}))); pool.sort(()=>Math.random()-.5);
      QZ={qs:pool.slice(0,10),i:0,ok:0,left:90,ans:null,over:false}; renderQuiz(); };
    return;
  }
  const q=QZ.qs[QZ.i];
  if(QZ.over){
    if(QZ.ok>best){ S.quiz={best:QZ.ok}; save(); renderTop(); }
    $("#main").innerHTML=`<section class="card hero"><span class="eyebrow">Resultado</span><h1>${QZ.ok}/10 acertos</h1>
      <p>${QZ.ok>best?"Novo recorde!":`Recorde: ${Math.max(best,QZ.ok)}/10.`} ${QZ.left<=0?"O tempo acabou.":""} Revise no módulo correspondente as afirmações que errou.</p>
      <div class="controls"><button class="btn primary" id="qz-again">Jogar de novo</button><button class="btn" id="qz-home">Voltar ao início</button></div></section>`;
    $("#qz-again").onclick=()=>{QZ=null;renderQuiz();$("#qz-go").click();};
    $("#qz-home").onclick=()=>{QZ=null;view.page=null;render(true);};
    return;
  }
  $("#main").innerHTML=`<section class="card item qz">
    <div class="qz-top"><span class="eyebrow">Questão ${QZ.i+1}/10 · Módulo ${q.mod}</span><span class="score" id="qz-t">${QZ.left}s</span><span class="score">Acertos ${QZ.ok}</span></div>
    <div class="bar" style="height:5px"><span id="qz-bar" style="width:${100*QZ.left/90}%"></span></div>
    <p class="qz-s">${esc(q.s)}</p>
    <div class="vfbtns">${QZ.ans===null?`<button class="btn vfbtn" data-a="true">Verdadeiro</button><button class="btn vfbtn" data-a="false">Falso</button>`:""}</div>
    ${QZ.ans!==null?`<div class="answer ${QZ.ans===q.v?"":"badl"}"><div class="eyebrow">${QZ.ans===q.v?"Acertou":"Errou"}</div><p>${esc(q.j)}</p></div><div class="controls"><button class="btn primary" id="qz-n">${QZ.i<9?"Próxima":"Ver resultado"}</button></div>`:""}
  </section>`;
  document.querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>{QZ.ans=b.dataset.a==="true"; if(QZ.ans===q.v) QZ.ok++; renderQuiz();});
  const n=$("#qz-n"); if(n) n.onclick=()=>{QZ.ans=null; QZ.i++; if(QZ.i>=10) QZ.over=true; renderQuiz();};
  if(QZ.ans===null){ QT=setInterval(()=>{ QZ.left--; const t=$("#qz-t"); if(t) t.textContent=QZ.left+"s"; const bb=$("#qz-bar"); if(bb) bb.style.width=(100*QZ.left/90)+"%";
    if(QZ.left<=0){ clearInterval(QT); QZ.over=true; renderQuiz(); } },1000); }
}

/* ---------- Relatório ---------- */
function renderReport(){
  const nome=S.nome||"";
  const lines=MODULES.map(m=>{
    const vf=m.vf.map((_,i)=>S[m.id+"-vf-"+i]).filter(x=>x&&x.done), ok=vf.filter(x=>x.correct).length;
    const lab=S[m.id+"-lab"]&&S[m.id+"-lab"].done;
    return {m,c:doneCount(m,"caderno"),f:doneCount(m,"flash"),p:doneCount(m,"pbl"),v:vf.length,ok,lab,t:doneCount(m)};
  });
  const txt=()=>`Relatório de estudo · Redes de Computadores\nAluno(a): ${S.nome||"(sem nome)"}\nData: ${new Date().toLocaleDateString("pt-BR")}\nPontos: ${xp()} · Patente: ${level(xp()).name} · Recorde no desafio: ${S.quiz&&S.quiz.best?S.quiz.best:0}/10\n\n`+
    lines.map(l=>`Módulo ${l.m.num} (${l.m.title}): ${l.t}/40 | caderno ${l.c}/8, flashcards ${l.f}/12, PBL ${l.p}/4, V/F ${l.v}/16 (${l.ok} acertos) | laboratório ${l.lab?"concluído":"pendente"}`).join("\n");
  $("#main").innerHTML=`<section class="card hero"><span class="eyebrow">Avaliação contínua</span><h1>Relatório para o professor</h1>
    <p>Preencha seu nome, copie o relatório e envie ao professor pelo canal combinado (AVA, e-mail ou mensagem).</p>
    <label class="hint" for="rp-n">Seu nome completo</label><input id="rp-n" class="inp" value="${esc(nome)}" placeholder="Nome e turma">
    <div class="tblwrap"><table class="tbl"><thead><tr><th>Módulo</th><th>Caderno</th><th>Flash</th><th>PBL</th><th>V/F</th><th>Acertos V/F</th><th>Lab</th><th>Total</th></tr></thead><tbody>
    ${lines.map(l=>`<tr><td>${l.m.num} · ${esc(l.m.title)}</td><td class="mono">${l.c}/8</td><td class="mono">${l.f}/12</td><td class="mono">${l.p}/4</td><td class="mono">${l.v}/16</td><td class="mono">${l.ok}</td><td>${l.lab?"✓":"–"}</td><td class="mono"><b>${l.t}/40</b></td></tr>`).join("")}</tbody></table></div>
    <textarea id="rp-t" readonly style="min-height:150px" class="mono"></textarea>
    <div class="controls"><button class="btn primary" id="rp-c">Copiar relatório</button><span class="hint" id="rp-s"></span></div></section>`;
  const ta=$("#rp-t"); ta.value=txt();
  $("#rp-n").oninput=e=>{S.nome=e.target.value;save();ta.value=txt();};
  $("#rp-c").onclick=()=>{ const done=()=>{$("#rp-s").textContent="Copiado. Cole na mensagem para o professor.";};
    try{ navigator.clipboard.writeText(ta.value).then(done,()=>{ta.select();$("#rp-s").textContent="Texto selecionado: use Ctrl+C para copiar.";}); }catch(e){ ta.select(); $("#rp-s").textContent="Texto selecionado: use Ctrl+C para copiar."; } };
}

function selfBtns(id){
  const st=get(id);
  return `<div class="self">Como você foi?
    <button class="btn sm ${st.self==="ok"?"sel-ok":""}" data-self="ok">Acertei</button>
    <button class="btn sm ${st.self==="rev"?"sel-bad":""}" data-self="rev">Preciso revisar</button></div>`;
}
function bindSelf(el,id){
  el.querySelectorAll("[data-self]").forEach(b=>b.onclick=()=>{const st=get(id);st.self=b.dataset.self;st.done=true;save();refreshCounts();
    el.querySelectorAll("[data-self]").forEach(x=>x.className="btn sm"+(x.dataset.self===st.self?(st.self==="ok"?" sel-ok":" sel-bad"):""));
    el.classList.add("done");});
}

function paneCaderno(m,pane){
  pane.className="items";
  pane.innerHTML=m.caderno.map((q,i)=>{
    const id=m.id+"-caderno-"+i, st=get(id);
    return `<article class="card item ${st.done?"done":""}" data-id="${id}">
      <div class="qhead"><span class="qn">C${String(i+1).padStart(2,"0")}</span><span class="qtext">${esc(q.q)}</span></div>
      <textarea id="${id}-t" placeholder="Rascunho da sua resposta (opcional se você respondeu no caderno)">${esc(st.text||"")}</textarea>
      <div class="controls">
        <label class="chk"><input type="checkbox" id="${id}-c" ${st.nb?"checked":""}> Respondi no caderno</label>
        <button class="btn primary" data-reveal ${st.revealed?"hidden":""}>Ver resposta</button>
        <span class="hint" data-hint>Marque a caixa ou escreva sua tentativa para liberar.</span>
      </div>
      <div data-ans ${st.revealed?"":"hidden"}>
        <div class="answer"><div class="eyebrow">Resposta esperada</div><p>${esc(q.a)}</p></div>
        <div style="margin-top:10px">${selfBtns(id)}</div>
      </div>
    </article>`;}).join("");
  pane.querySelectorAll(".item").forEach(el=>{
    const id=el.dataset.id, st=get(id), ta=$("textarea",el), cb=$("input",el), btn=$("[data-reveal]",el), hint=$("[data-hint]",el);
    const upd=()=>{const ok=cb.checked||ta.value.trim().length>=15;btn.disabled=!ok;hint.hidden=ok||st.revealed;};
    ta.oninput=()=>{st.text=ta.value;save();upd();};
    cb.onchange=()=>{st.nb=cb.checked;save();upd();};
    btn.onclick=()=>{st.revealed=true;save();btn.hidden=true;hint.hidden=true;$("[data-ans]",el).hidden=false;};
    upd(); bindSelf(el,id);
  });
}

function panePBL(m,pane){
  pane.className="items";
  pane.innerHTML=m.pbl.map((p,i)=>{
    const id=m.id+"-pbl-"+i, st=get(id);
    return `<article class="card item ${st.done?"done":""}" data-id="${id}">
      <div class="qhead"><span class="qn">P${i+1}</span><span class="pbl-t">${esc(p.t)}</span></div>
      <div class="case"><b>Situação-problema.</b> ${esc(p.c)}<ul>${p.tasks.map(t=>`<li>${esc(t)}</li>`).join("")}</ul></div>
      <textarea id="${id}-t" style="min-height:120px" placeholder="Plano de solução da equipe: hipóteses, testes e decisão">${esc(st.text||"")}</textarea>
      <div class="controls">
        <label class="chk"><input type="checkbox" id="${id}-c" ${st.nb?"checked":""}> A equipe resolveu no caderno</label>
        <button class="btn primary" data-reveal ${st.revealed?"hidden":""}>Ver resposta-guia</button>
        <span class="hint" data-hint>Escreva pelo menos algumas linhas do plano ou marque a caixa.</span>
      </div>
      <div data-ans ${st.revealed?"":"hidden"}>
        <div class="answer"><div class="eyebrow">Resposta-guia e critérios</div><p>${esc(p.a)}</p></div>
        <div style="margin-top:10px">${selfBtns(id)}</div>
      </div>
    </article>`;}).join("");
  pane.querySelectorAll(".item").forEach(el=>{
    const id=el.dataset.id, st=get(id), ta=$("textarea",el), cb=$("input",el), btn=$("[data-reveal]",el), hint=$("[data-hint]",el);
    const upd=()=>{const ok=cb.checked||ta.value.trim().length>=40;btn.disabled=!ok;hint.hidden=ok||st.revealed;};
    ta.oninput=()=>{st.text=ta.value;save();upd();};
    cb.onchange=()=>{st.nb=cb.checked;save();upd();};
    btn.onclick=()=>{st.revealed=true;save();btn.hidden=true;hint.hidden=true;$("[data-ans]",el).hidden=false;};
    upd(); bindSelf(el,id);
  });
}

function paneVF(m,pane){
  pane.className="items";
  pane.innerHTML=m.vf.map((q,i)=>{
    const id=m.id+"-vf-"+i, st=get(id);
    const res=st.done?`<span class="badge ${st.correct?"ok":"bad"}">${st.correct?"Acertou":"Errou"}</span>`:"";
    return `<article class="card item ${st.done?"done":""}" data-id="${id}">
      <div class="qhead"><span class="qn">VF${String(i+1).padStart(2,"0")}</span><span class="qtext">${esc(q.s)}</span>${res}</div>
      <div class="vfbtns">
        <button class="btn vfbtn" data-v="true" aria-pressed="${st.choice===true}" ${st.done?"disabled":""}>Verdadeiro</button>
        <button class="btn vfbtn" data-v="false" aria-pressed="${st.choice===false}" ${st.done?"disabled":""}>Falso</button>
      </div>
      <textarea id="${id}-t" placeholder="Justifique sua escolha (se for falso, diga o que tornaria a frase correta)" ${st.done?"readonly":""}>${esc(st.text||"")}</textarea>
      <div class="controls"><button class="btn primary" data-reveal ${st.done?"hidden":""}>Conferir</button><span class="hint" data-hint>Escolha V ou F e escreva a justificativa.</span></div>
      <div data-ans ${st.done?"":"hidden"}><div class="answer ${st.done&&!st.correct?"badl":""}"><div class="eyebrow" data-verdict>${st.done?(st.correct?"Correto":"Não foi dessa vez")+" · gabarito: "+(q.v?"Verdadeiro":"Falso"):""}</div><p>${esc(q.j)}</p></div></div>
    </article>`;}).join("");
  pane.querySelectorAll(".item").forEach((el,i)=>{
    const id=el.dataset.id, st=get(id), q=m.vf[i], ta=$("textarea",el), btn=$("[data-reveal]",el), hint=$("[data-hint]",el);
    const upd=()=>{const ok=(st.choice===true||st.choice===false)&&ta.value.trim().length>=10;btn.disabled=!ok;hint.hidden=ok||st.done;};
    el.querySelectorAll("[data-v]").forEach(b=>b.onclick=()=>{st.choice=b.dataset.v==="true";save();el.querySelectorAll("[data-v]").forEach(x=>x.setAttribute("aria-pressed",String(x===b)));upd();});
    ta.oninput=()=>{st.text=ta.value;save();upd();};
    btn.onclick=()=>{
      st.done=true; st.correct=(st.choice===q.v); save();
      render(false);
      const again=document.querySelector(`[data-id="${id}"]`); if(again) again.scrollIntoView({block:"nearest"});
    };
    upd();
  });
}

function paneFlash(m,pane){
  pane.className="";
  const n=m.flash.length;
  if(view.card>=n) view.card=0;
  const i=view.card, c=m.flash[i], id=m.id+"-flash-"+i, st=get(id);
  const dots=m.flash.map((_,k)=>{const s=S[m.id+"-flash-"+k]||{};return `<button aria-label="Cartão ${k+1}" data-go="${k}" class="${s.self==="ok"?"k":s.self==="rev"?"n":""} ${k===i?"cur":""}"></button>`;}).join("");
  pane.innerHTML=`<div class="deck">
    <button class="flip" id="flip" aria-label="Virar cartão">
      <div class="flip-in">
        <div class="face front"><span class="eyebrow">Termo</span><span class="pos">${i+1}/${n}</span><span class="big">${esc(c.f)}</span><span class="hint">Pense na definição. Clique ou toque para virar.</span></div>
        <div class="face back"><span class="eyebrow">Definição</span><span class="pos">${i+1}/${n}</span><span class="def">${esc(c.b)}</span></div>
      </div>
    </button>
    <div class="deck-ctrl" id="judge" hidden>
      <span class="hint">Você lembrou?</span>
      <button class="btn sm ${st.self==="ok"?"sel-ok":""}" data-j="ok">Lembrei</button>
      <button class="btn sm ${st.self==="rev"?"sel-bad":""}" data-j="rev">Não lembrei</button>
    </div>
    <div class="deck-ctrl">
      <button class="btn" id="prev">← Anterior</button>
      <button class="btn" id="shuffle">Embaralhar</button>
      <button class="btn" id="next">Próximo →</button>
    </div>
    <div class="dots">${dots}</div>
  </div>`;
  const flip=$("#flip"), judge=$("#judge");
  flip.onclick=()=>{flip.classList.toggle("on"); if(flip.classList.contains("on")) judge.hidden=false;};
  judge.querySelectorAll("[data-j]").forEach(b=>b.onclick=()=>{st.self=b.dataset.j;st.done=true;save();refreshCounts();
    view.card=(i+1)%n; paneFlash(m,pane);});
  $("#prev").onclick=()=>{view.card=(i-1+n)%n;paneFlash(m,pane);};
  $("#next").onclick=()=>{view.card=(i+1)%n;paneFlash(m,pane);};
  $("#shuffle").onclick=()=>{
    const order=m.flash.map((_,k)=>k).sort(()=>Math.random()-.5);
    view.card=order[0]===i?order[1]:order[0]; paneFlash(m,pane);
  };
  pane.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{view.card=+b.dataset.go;paneFlash(m,pane);});
}

function refreshCounts(){
  renderTop();
  const m=MODULES.find(x=>x.id===view.mod);
  if(m){
    document.querySelectorAll(".tab").forEach(t=>{const T=TYPES.find(x=>x.k===t.dataset.tab); if(T) t.querySelector(".cnt").textContent=doneCount(m,T.k)+"/"+T.n;});
    const e=document.querySelector(".mhead .eyebrow"); if(e) e.textContent=`Unidade ${m.num} · ${m.layer} · ${doneCount(m)}/40 concluídas`;
  }
  document.querySelectorAll(".mod-btn[data-mod]").forEach(b=>{const mm=MODULES.find(x=>x.id===b.dataset.mod);b.querySelector(".bar>span").style.width=(100*doneCount(mm)/TOTAL_PER)+"%";});
}

function render(scrollTop){
  setHash(); renderTop(); renderRail();
  clearInterval(QT);
  if(view.mod) renderModule(); else if(view.page==="desafio") renderQuiz(); else if(view.page==="relatorio") renderReport(); else renderHome();
  if(scrollTop) window.scrollTo({top:0});
}
$("#go-home").onclick=()=>{view.mod=null;view.page=null;render(true);};
window.addEventListener("hashchange",()=>{parseHash();render(true);});
parseHash(); render(false);
})();

</script>

<script src="../config.js"></script>

<script src="../acessibilidade.js" defer></script>
