pbl:[
{t:"A rede da escola de três prédios",c:"Uma escola tem um prédio administrativo, onde chega a internet, e dois blocos de salas a 60 m dele. Cada bloco tem 4 laboratórios. A direção quer uma rede organizada e que não pare inteira se um equipamento falhar.",tasks:["Classifique essa rede pela abrangência.","Escolha e desenhe a topologia física, justificando.","Aponte o ponto único de falha do seu projeto e como reduzi-lo."],a:"É uma LAN (rede de campus). A topologia mais adequada é a árvore, ou estrela estendida: um switch principal no prédio administrativo, ligado ao roteador; um switch em cada bloco; e uma estrela por laboratório. O ponto único de falha é o switch principal, e também o enlace entre os prédios. Para reduzir: ligar os dois blocos também entre si (malha parcial, formando uma topologia híbrida), manter um switch reserva e usar nobreak. Critérios: classificação correta, desenho coerente e identificação do ponto de falha."},
{t:"Interligando as escolas do município",c:"A secretaria de educação vai ligar por fibra 12 escolas espalhadas por bairros da cidade. Hoje, quando um cabo é rompido por obras, escolas inteiras ficam sem sistema por dias.",tasks:["Classifique essa rede.","Compare estrela a partir da secretaria, anel duplo e malha parcial.","Recomende uma topologia considerando custo e disponibilidade."],a:"É uma MAN. Estrela a partir da secretaria: simples, mas cada rompimento isola uma escola, e a falha no centro derruba todas. Anel (de preferência duplo): cada escola fica com dois caminhos até a secretaria, então um rompimento é contornado pelo outro lado, com custo moderado. Malha parcial: ainda mais resiliente, porém mais cara. Recomendação razoável: anel de fibra, com malha parcial ligando os pontos mais críticos. A justificativa deve equilibrar custo e disponibilidade."},
{t:"O data center está lento",c:"No data center do campus, os servidores do sistema acadêmico gravam e leem os dados num storage usando a mesma rede dos usuários. No período de matrículas, tudo fica lento: o sistema e também a internet dos laboratórios.",tasks:["Explique a causa da lentidão.","Proponha uma solução usando o conceito de SAN.","Desenhe como ficariam a LAN e a SAN."],a:"O tráfego de armazenamento (leitura e escrita de discos) é intenso e disputa a mesma rede com os usuários, congestionando os dois lados. A solução é criar uma SAN: uma rede dedicada e de alta velocidade, só entre os servidores e o storage (Fibre Channel ou iSCSI numa rede separada). No desenho, os servidores ficam com duas conexões: uma na LAN, para atender os usuários, e outra na SAN, para acessar o armazenamento."},
{t:"Detetives de RFC",c:"Cada equipe vai investigar a RFC de um protocolo estudado e apresentar em 5 minutos. Sugestões: DNS (RFCs 1034 e 1035), DHCP (RFC 2131), UDP (RFC 768), IP (RFC 791), TCP (RFC 9293). Fonte oficial: rfc-editor.org.",tasks:["Encontre a RFC e copie o título e o ano.","Leia o resumo (abstract) e explique em três frases o que o protocolo faz.","Verifique se ela foi atualizada ou tornada obsoleta por outra RFC e explique por quê."],a:"Uma boa apresentação traz: número, título e ano corretos; um resumo fiel do abstract em linguagem simples; e o status (por exemplo, a RFC 793 do TCP foi tornada obsoleta pela RFC 9293 em 2022, que reuniu décadas de correções). Também deve explicar que qualquer pessoa pode ler as RFCs gratuitamente e que a IETF não edita RFCs antigas: publica novas. Curiosidade para fechar: a RFC 1149, de 1º de abril de 1990, descreve, de brincadeira, o IP transmitido por pombos-correio."}

<script>
/* ===== Motor visual da aba Explorar ===== */
const EXE={};
const SVGNS="http://www.w3.org/2000/svg";
const exEsc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const RM=()=>{ try{return window.matchMedia("(prefers-reduced-motion: reduce)").matches;}catch(e){return false;} };

/* ---------- Ícones desenhados em SVG ---------- */
function icon(it){
  const {x,y}=it, ic=it.ic, S='stroke="var(--ink)" stroke-width="1.6"', P='fill="var(--panel)"';
  switch(ic){
   case "pc": return `<rect x="${x-20}" y="${y-18}" width="40" height="27" rx="3" ${P} ${S}/><rect x="${x-16}" y="${y-14}" width="32" height="19" rx="1" fill="var(--accent-soft)"/><line x1="${x}" y1="${y+9}" x2="${x}" y2="${y+15}" ${S}/><rect x="${x-11}" y="${y+14}" width="22" height="4" rx="2" ${P} ${S}/>`;
   case "notebook": return `<rect x="${x-17}" y="${y-17}" width="34" height="23" rx="3" ${P} ${S}/><rect x="${x-13}" y="${y-13}" width="26" height="15" fill="var(--accent-soft)"/><path d="M${x-23} ${y+6} h46 l-4 7 h-38 z" ${P} ${S}/>`;
   case "phone": return `<rect x="${x-10}" y="${y-18}" width="20" height="36" rx="4" ${P} ${S}/><rect x="${x-7}" y="${y-13}" width="14" height="23" fill="var(--accent-soft)"/><circle cx="${x}" cy="${y+14}" r="1.6" fill="var(--ink)"/>`;
   case "server": return `<rect x="${x-15}" y="${y-22}" width="30" height="44" rx="3" ${P} ${S}/>${[0,1,2].map(i=>`<line x1="${x-10}" y1="${y-12+i*11}" x2="${x+4}" y2="${y-12+i*11}" ${S}/><circle cx="${x+9}" cy="${y-12+i*11}" r="2" fill="var(--ok)"/>`).join("")}`;
   case "switch": case "hub": return `<rect x="${x-28}" y="${y-11}" width="56" height="22" rx="4" fill="${ic==="hub"?"var(--panel2)":"var(--ink)"}" ${S}/>${[0,1,2,3,4,5].map(i=>`<rect x="${x-22+i*8}" y="${y-3}" width="5" height="6" fill="${ic==="hub"?"var(--muted)":"var(--accent)"}"/>`).join("")}`;
   case "router": return `<ellipse cx="${x}" cy="${y+6}" rx="24" ry="9" fill="var(--blue)" ${S}/><rect x="${x-24}" y="${y-6}" width="48" height="12" fill="var(--blue)"/><line x1="${x-24}" y1="${y-6}" x2="${x-24}" y2="${y+6}" ${S}/><line x1="${x+24}" y1="${y-6}" x2="${x+24}" y2="${y+6}" ${S}/><ellipse cx="${x}" cy="${y-6}" rx="24" ry="9" fill="var(--blue)" ${S}/><path d="M${x-11} ${y-6} h22 M${x+6} ${y-10} l5 4 l-5 4 M${x-6} ${y-10} l-5 4 l5 4" stroke="var(--panel)" stroke-width="1.6" fill="none"/>`;
   case "cloud": return `<path d="M${x-40} ${y+16} a16 16 0 0 1 4 -30 a22 22 0 0 1 40 -6 a18 18 0 0 1 32 14 a14 14 0 0 1 -6 22 z" fill="var(--panel2)" stroke="var(--muted)" stroke-width="1.4" stroke-dasharray="4 3"/>`;
   case "ap": return `<rect x="${x-18}" y="${y-2}" width="36" height="12" rx="4" ${P} ${S}/><circle cx="${x}" cy="${y+4}" r="2" fill="var(--ok)"/>${[8,14,20].map(r=>`<path d="M${x-r} ${y-6} a${r} ${r} 0 0 1 ${2*r} 0" fill="none" stroke="var(--accent)" stroke-width="1.6"/>`).join("")}`;
   case "storage": return `<path d="M${x-18} ${y-14} v28 a18 6 0 0 0 36 0 v-28" ${P} ${S}/><ellipse cx="${x}" cy="${y-14}" rx="18" ry="6" fill="var(--panel2)" ${S}/><path d="M${x-18} ${y} a18 6 0 0 0 36 0" fill="none" ${S}/>`;
   case "building": return `<rect x="${x-22}" y="${y-24}" width="44" height="48" rx="2" ${P} ${S}/>${[0,1,2].map(r=>[0,1,2].map(c=>`<rect x="${x-16+c*12}" y="${y-18+r*13}" width="8" height="8" fill="var(--accent-soft)"/>`).join("")).join("")}`;
   case "house": return `<path d="M${x-20} ${y-2} L${x} ${y-20} L${x+20} ${y-2} V${y+18} H${x-20} Z" ${P} ${S}/><rect x="${x-5}" y="${y+5}" width="10" height="13" fill="var(--accent-soft)"/>`;
   case "jack": return `<rect x="${x-14}" y="${y-14}" width="28" height="28" rx="3" ${P} ${S}/><rect x="${x-7}" y="${y-5}" width="14" height="11" rx="1" fill="var(--ink)"/>`;
   case "panel": return `<rect x="${x-34}" y="${y-10}" width="68" height="20" rx="2" fill="var(--panel2)" ${S}/>${[0,1,2,3,4,5,6,7].map(i=>`<rect x="${x-29+i*8}" y="${y-4}" width="5" height="8" fill="var(--ink)"/>`).join("")}`;
   case "rack": return `<rect x="${x-26}" y="${y-40}" width="52" height="80" rx="3" fill="none" stroke="var(--muted)" stroke-width="2" stroke-dasharray="5 3"/>`;
   case "box": return `<rect x="${x-it.w/2}" y="${y-it.h/2}" width="${it.w}" height="${it.h}" rx="${it.rx||4}" fill="${it.fill||"var(--panel2)"}" ${S}/>${it.txt?`<text x="${x}" y="${y+4}" text-anchor="middle" font-size="${it.fs||12}" font-weight="700" fill="${it.tc||"var(--ink)"}" font-family="var(--f-mono)">${exEsc(it.txt)}</text>`:""}`;
   case "ring": return `<circle cx="${x}" cy="${y}" r="${it.r}" fill="${it.fill}" stroke="${it.stroke||"var(--ink)"}" stroke-width="${it.sw||1.4}"/>`;
   case "topo": return topoMini(x,y,it.v);
   case "dot": return `<circle cx="${x}" cy="${y}" r="${it.r||6}" fill="${it.fill||"var(--accent)"}"/>`;
   default: return "";
  }
}
function topoMini(x,y,v){
  const n=(cx,cy)=>`<circle cx="${cx}" cy="${cy}" r="6" fill="var(--panel)" stroke="var(--ink)" stroke-width="1.5"/>`;
  const l=(a,b,c,d)=>`<line x1="${a}" y1="${b}" x2="${c}" y2="${d}" stroke="var(--muted)" stroke-width="2"/>`;
  const box=`<rect x="${x-62}" y="${y-48}" width="124" height="96" rx="10" fill="var(--panel2)" stroke="var(--line)"/>`;
  const pts6=[0,1,2,3,4,5].map(i=>[x+34*Math.cos(i*Math.PI/3-Math.PI/2),y-4+30*Math.sin(i*Math.PI/3-Math.PI/2)]);
  if(v==="estrela") return box+pts6.map(p=>l(x,y-4,p[0],p[1])).join("")+pts6.map(p=>n(p[0],p[1])).join("")+`<rect x="${x-9}" y="${y-10}" width="18" height="12" rx="2" fill="var(--ink)"/>`;
  if(v==="anel") return box+pts6.map((p,i)=>l(p[0],p[1],pts6[(i+1)%6][0],pts6[(i+1)%6][1])).join("")+pts6.map(p=>n(p[0],p[1])).join("");
  if(v==="barramento"){ const xs=[-40,-20,0,20,40]; return box+l(x-50,y,x+50,y).replace('stroke-width="2"','stroke-width="4"')+xs.map((d,i)=>l(x+d,y,x+d,y+(i%2?22:-22))+n(x+d,y+(i%2?22:-22))).join(""); }
  if(v==="arvore"){ return box+l(x,y-30,x-28,y-4)+l(x,y-30,x+28,y-4)+[-42,-28,-14].map(d=>l(x-28,y-4,x+d,y+24)).join("")+[14,28,42].map(d=>l(x+28,y-4,x+d,y+24)).join("")+n(x,y-30)+n(x-28,y-4)+n(x+28,y-4)+[-42,-28,-14,14,28,42].map(d=>n(x+d,y+24)).join(""); }
  if(v==="malha"){ const p5=[0,1,2,3,4].map(i=>[x+34*Math.cos(i*2*Math.PI/5-Math.PI/2),y-2+32*Math.sin(i*2*Math.PI/5-Math.PI/2)]); let s=box; for(let i=0;i<5;i++)for(let j=i+1;j<5;j++) s+=l(p5[i][0],p5[i][1],p5[j][0],p5[j][1]); return s+p5.map(p=>n(p[0],p[1])).join(""); }
  if(v==="hibrida"){ const c=[[x,y-26],[x+28,y+10],[x-28,y+10]]; let s=box+l(c[0][0],c[0][1],c[1][0],c[1][1])+l(c[1][0],c[1][1],c[2][0],c[2][1])+l(c[2][0],c[2][1],c[0][0],c[0][1]);
    [[x-22,y-38],[x+22,y-38],[x+50,y+4],[x+42,y+32],[x-42,y+32],[x-50,y+4]].forEach((p,i)=>{const sw=c[Math.floor(i/2)];s+=l(sw[0],sw[1],p[0],p[1])+n(p[0],p[1]);});
    return s+c.map(p=>`<rect x="${p[0]-7}" y="${p[1]-5}" width="14" height="10" rx="2" fill="var(--ink)"/>`).join(""); }
  return box;
}
function centerOf(it){ return {x:it.x,y:it.y}; }

/* ---------- 1. Linha do tempo ---------- */
EXE.timeline=function(el,spec,done){
  const it=spec.items, min=it[0].y, max=it[it.length-1].y;
  let cur=0, seen=new Set([0]), timer=null;
  const pos=y=>4+92*(y-min)/Math.max(1,max-min);
  function draw(){
    const c=it[cur];
    el.innerHTML=`
      <div class="tl-wrap"><div class="tl-track">
        <div class="tl-line"></div><div class="tl-fill" style="width:${pos(c.y)}%"></div>
        ${it.map((x,i)=>`<button class="tl-dot ${i===cur?"cur":""} ${seen.has(i)?"seen":""}" style="left:${pos(x.y)}%;${i%2?"--off:1":""}" data-i="${i}" aria-label="${x.y}: ${exEsc(x.t)}"><span class="tl-yr mono">${x.y}</span></button>`).join("")}
      </div></div>
      <div class="tl-card">
        <div class="tl-art" aria-hidden="true">${c.ic?`<svg viewBox="0 0 120 90">${[].concat(c.ic).map((k,j,arr)=>icon({x:arr.length>1?35+j*50:60,y:46,ic:k})).join("")}</svg>`:""}<span class="tl-big mono">${c.y}</span></div>
        <div><span class="eyebrow">${c.y} · ${i18n(cur+1)} de ${it.length}</span><h3>${exEsc(c.t)}</h3><p>${exEsc(c.d)}</p></div>
      </div>
      <div class="controls ex-ctrl"><button class="btn" data-a="prev" ${cur===0?"disabled":""}>◀ Anterior</button><button class="btn" data-a="play">${timer?"⏸ Pausar":"▶ Reproduzir"}</button><button class="btn primary" data-a="next" ${cur===it.length-1?"disabled":""}>Próximo ▶</button><span class="hint">${seen.size}/${it.length} marcos vistos</span></div>`;
    el.querySelectorAll(".tl-dot").forEach(b=>b.onclick=()=>go(+b.dataset.i));
    el.querySelector('[data-a="prev"]').onclick=()=>go(cur-1);
    el.querySelector('[data-a="next"]').onclick=()=>go(cur+1);
    el.querySelector('[data-a="play"]').onclick=()=>{ if(timer){clearInterval(timer);timer=null;draw();return;} if(cur===it.length-1) cur=-1;
      timer=setInterval(()=>{ if(cur>=it.length-1||!el.isConnected){clearInterval(timer);timer=null;if(el.isConnected)draw();return;} go(cur+1,true); },2600); go(cur+1,true); };
  }
  function i18n(n){return n;}
  function go(i){ if(i<0||i>=it.length) return; cur=i; seen.add(i); if(seen.size===it.length) done(); draw(); }
  draw();
};

/* ---------- 2. Diagrama clicável (com passeio e desafio) ---------- */
EXE.hotspot=function(el,spec,done){
  const keys=spec.items.filter(i=>spec.info[i.k]).map(i=>i.k);
  const uniq=[...new Set(keys)];
  let sel=null, seen=new Set(), mode="explore", ch=0, chMsg="", touring=false;
  const byK=k=>spec.items.find(i=>i.k===k);
  function svg(){
    const E=(spec.edges||[]).map(e=>{const a=typeof e[0]==="number"?spec.items[e[0]]:byK(e[0]),b=typeof e[1]==="number"?spec.items[e[1]]:byK(e[1]); return `<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="${e[2]==="hot"?"var(--accent)":"var(--muted)"}" stroke-width="${e[3]||2}" ${e[2]==="dash"?'stroke-dasharray="6 4"':""}/>`;}).join("");
    const I=spec.items.map(it=>{ const click=!!spec.info[it.k], on=sel===it.k;
      const lab=it.l?`<text x="${it.x+(it.lx||0)}" y="${it.y+(it.ly!=null?it.ly:(it.ic==="box"?it.h/2+14:(it.ic==="ring"?0:34)))}" text-anchor="middle" font-size="${it.lfs||12.5}" fill="var(--ink)" font-family="var(--f-body)" font-weight="700">${exEsc(it.l)}</text>`:"";
      return `<g class="${click?"hs":""} ${on?"on":""} ${seen.has(it.k)&&click?"seen":""}" ${click?`data-k="${it.k}" tabindex="0" role="button" aria-label="${exEsc(spec.info[it.k].t)}"`:""}>${icon(it)}${lab}</g>`; }).join("");
    return `<svg viewBox="0 0 ${spec.w} ${spec.h}" class="hs-svg" role="img" aria-label="${exEsc(spec.alt||"Diagrama interativo")}">${spec.under||""}${E}${I}${spec.over||""}<circle id="hs-mark" r="9" cx="-20" cy="-20" fill="var(--accent)" stroke="var(--panel)" stroke-width="3"/></svg>`;
  }
  function panel(){
    if(mode==="challenge"){ const q=spec.challenge[ch];
      if(!q) return `<div class="answer"><div class="eyebrow">Desafio concluído</div><p>Você acertou todos os desafios desta imagem.</p></div><button class="btn" data-a="explore">Voltar a explorar</button>`;
      return `<div class="hs-q"><span class="eyebrow">Desafio ${ch+1}/${spec.challenge.length}</span><p class="qtext">${exEsc(q.q)}</p><p class="lab-msg">${chMsg}</p></div><button class="btn sm" data-a="explore">Sair do desafio</button>`; }
    if(!sel) return `<p class="hint">${exEsc(spec.hint||"Clique nas partes destacadas da imagem para descobrir o que cada uma faz.")}</p>`;
    const inf=spec.info[sel]; return `<span class="eyebrow">${seen.size}/${uniq.length} explorados</span><h3>${exEsc(inf.t)}</h3><p>${exEsc(inf.d)}</p>`;
  }
  function draw(){
    el.innerHTML=`<div class="hs-grid"><div class="hs-fig">${svg()}</div><div class="hs-panel" aria-live="polite">${panel()}</div></div>
      <div class="controls ex-ctrl">${spec.tour?`<button class="btn primary" data-a="tour" ${touring?"disabled":""}>▶ ${exEsc(spec.tourLabel||"Seguir o caminho")}</button>`:""}
      ${spec.challenge?`<button class="btn" data-a="ch" ${mode==="challenge"?"disabled":""}>Desafio: encontre na imagem</button>`:""}
      <span class="hint">${seen.size}/${uniq.length} partes exploradas</span></div>`;
    el.querySelectorAll(".hs").forEach(g=>{ const f=()=>pick(g.dataset.k); g.onclick=f; g.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();f();}}; });
    const t=el.querySelector('[data-a="tour"]'); if(t) t.onclick=tour;
    const c=el.querySelector('[data-a="ch"]'); if(c) c.onclick=()=>{mode="challenge";ch=0;chMsg="";sel=null;draw();};
    el.querySelectorAll('[data-a="explore"]').forEach(b=>b.onclick=()=>{mode="explore";draw();});
  }
  function pick(k){
    if(touring) return;
    if(mode==="challenge"){ const q=spec.challenge[ch]; const ok=[].concat(q.k).includes(k);
      if(ok){ ch++; chMsg=""; sel=k; } else { chMsg=`<span class="bad-t">Não é esse.</span> ${exEsc(q.hint||"Releia a pergunta e tente outra parte.")}`; }
      draw(); return; }
    sel=k; seen.add(k); if(seen.size>=uniq.length) done(); draw();
  }
  function tour(){
    touring=true; const path=spec.tour; let i=0; mode="explore";
    const step=()=>{ if(!el.isConnected){touring=false;return;}
      const k=path[i]; sel=k; seen.add(k); draw();
      const m=el.querySelector("#hs-mark"), a=byK(path[Math.max(0,i-1)]), b=byK(k);
      animateMark(m,a,b,i===0?0:700,()=>{ i++; if(i<path.length) setTimeout(step,1500); else { touring=false; if(seen.size>=uniq.length) done(); draw(); const mm=el.querySelector("#hs-mark"); if(mm){mm.setAttribute("cx",b.x);mm.setAttribute("cy",b.y-(b.my||0));} } });
    };
    step();
  }
  draw();
};
function animateMark(m,a,b,dur,cb){
  if(!m){cb();return;}
  const ay=a.y-(a.my||0), by=b.y-(b.my||0);
  if(!dur||RM()){ m.setAttribute("cx",b.x); m.setAttribute("cy",by); cb(); return; }
  const t0=performance.now();
  const f=t=>{ const p=Math.min(1,(t-t0)/dur), e=p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2;
    m.setAttribute("cx",a.x+(b.x-a.x)*e); m.setAttribute("cy",ay+(by-ay)*e);
    if(p<1) requestAnimationFrame(f); else cb(); };
  m.setAttribute("cx",a.x); m.setAttribute("cy",ay); requestAnimationFrame(f);
}

/* ---------- 3. Sequência animada (diagrama de mensagens) ---------- */
EXE.sequence=function(el,spec,done){
  const A=spec.actors, S=spec.steps, W=640, top=58, gap=40;
  let cur=-1, timer=null;
  const X=i=>A.length===1?W/2:80+i*(W-160)/(A.length-1);
  function draw(){
    const H=top+S.length*gap+24;
    let g=A.map((a,i)=>`<rect x="${X(i)-70}" y="8" width="140" height="34" rx="8" fill="var(--ink)"/><text x="${X(i)}" y="30" text-anchor="middle" font-size="12" font-weight="700" fill="var(--bg)" font-family="var(--f-body)">${exEsc(a)}</text><line x1="${X(i)}" y1="42" x2="${X(i)}" y2="${H-6}" stroke="var(--line)" stroke-width="2" stroke-dasharray="4 4"/>`).join("");
    S.forEach((s,i)=>{ if(i>cur) return; const y=top+i*gap+12, col=s.c==="bad"?"var(--bad)":s.c==="ok"?"var(--ok)":s.c==="blue"?"var(--blue)":"var(--accent)", act=i===cur;
      const op=act?1:.55;
      if(s.f===s.t||s.note){ const x=Math.max(122,Math.min(W-122,X(s.f))); g+=`<g opacity="${op}"><rect x="${x-110}" y="${y-13}" width="220" height="24" rx="12" fill="var(--panel2)" stroke="${col}"/><text x="${x}" y="${y+3}" text-anchor="middle" font-size="11" fill="var(--ink)" font-family="var(--f-mono)">${exEsc(s.l)}</text></g>`; return; }
      const targets=[].concat(s.t);
      targets.forEach(t=>{ const x1=X(s.f), x2=X(t), dir=x2>x1?1:-1, endX=s.lost?x1+(x2-x1)*.55:x2-dir*6;
        g+=`<g opacity="${op}"><line x1="${x1}" y1="${y}" x2="${endX}" y2="${y}" stroke="${col}" stroke-width="2.5" ${s.dash?'stroke-dasharray="6 4"':""}/>`+
          (s.lost?`<text x="${endX+dir*8}" y="${y+5}" text-anchor="middle" font-size="16" font-weight="700" fill="var(--bad)">✕</text>`:`<path d="M${endX} ${y} l${-dir*9} -5 v10 z" fill="${col}"/>`)+
          `<text x="${(x1+(s.lost?endX:x2))/2}" y="${y-7}" text-anchor="middle" font-size="11.5" font-weight="700" fill="${col}" font-family="var(--f-mono)">${exEsc(s.l)}</text>`+
          (act&&!RM()?`<circle r="6" fill="${col}"><animate attributeName="cx" from="${x1}" to="${endX}" dur="0.7s" fill="freeze"/><animate attributeName="cy" from="${y}" to="${y}" dur="0.7s" fill="freeze"/></circle>`:"")+`</g>`; });
    });
    const c=S[cur];
    el.innerHTML=`<div class="seq-wrap"><svg viewBox="0 0 ${W} ${H}" class="seq-svg" role="img" aria-label="${exEsc(spec.alt||"Sequência de mensagens")}">${g}</svg></div>
      <div class="seq-cap" aria-live="polite">${cur<0?`<span class="hint">${exEsc(spec.intro||"Clique em Próximo para ver a primeira mensagem.")}</span>`:`<span class="eyebrow">Passo ${cur+1} de ${S.length}</span><p><b>${exEsc(c.l)}.</b> ${exEsc(c.n)}</p>`}</div>
      <div class="controls ex-ctrl"><button class="btn" data-a="reset" ${cur<0?"disabled":""}>⟲ Do início</button><button class="btn" data-a="prev" ${cur<0?"disabled":""}>◀</button><button class="btn" data-a="play">${timer?"⏸ Pausar":"▶ Animar tudo"}</button><button class="btn primary" data-a="next" ${cur>=S.length-1?"disabled":""}>Próximo ▶</button></div>`;
    el.querySelector('[data-a="next"]').onclick=()=>go(cur+1);
    el.querySelector('[data-a="prev"]').onclick=()=>go(cur-1);
    el.querySelector('[data-a="reset"]').onclick=()=>{stop();cur=-1;draw();};
    el.querySelector('[data-a="play"]').onclick=()=>{ if(timer){stop();draw();return;} if(cur>=S.length-1) cur=-1;
      timer=setInterval(()=>{ if(!el.isConnected||cur>=S.length-1){stop(); if(el.isConnected) draw(); return;} go(cur+1); },2200); go(cur+1); };
  }
  function stop(){ clearInterval(timer); timer=null; }
  function go(i){ if(i<-1||i>=S.length) return; cur=i; if(cur===S.length-1) done(); draw(); }
  draw();
};

/* Comutação de circuitos × pacotes */
EXE.switching=function(el,spec,done){
  const N={A:[40,140],R1:[160,60],R2:[160,220],R3:[300,40],R4:[300,140],R5:[300,240],R6:[440,60],R7:[440,220],B:[560,140]};
  const E=[["A","R1"],["A","R2"],["R1","R3"],["R1","R4"],["R2","R4"],["R2","R5"],["R3","R6"],["R4","R6"],["R4","R7"],["R5","R7"],["R6","B"],["R7","B"]];
  const ROUTES=[["A","R1","R4","R6","B"],["A","R1","R3","R6","B"],["A","R2","R5","R7","B"],["A","R2","R4","R7","B"],["A","R1","R4","R7","B"],["A","R2","R4","R6","B"]];
  const COL=["var(--accent)","var(--blue)","var(--ok)","#B5407A","#8A6D1F","#4C6FA8"];
  let mode="pacotes", broken=false, arrivals=[], running=false, msg="", tried={pacotes:false,circuitos:false};
  const ek=(a,b)=>[a,b].sort().join("-"), BK=ek("R4","R6");
  const okRoute=r=>!broken||!r.some((n,i)=>i&&ek(r[i-1],n)===BK);
  const d=r=>"M"+r.map(n=>N[n].join(" ")).join(" L");
  function draw(){
    const reserved=ROUTES[0];
    const lines=E.map(([a,b])=>{ const k=ek(a,b), br=broken&&k===BK, res=mode==="circuitos"&&reserved.some((n,i)=>i&&ek(reserved[i-1],n)===k);
      return `<line x1="${N[a][0]}" y1="${N[a][1]}" x2="${N[b][0]}" y2="${N[b][1]}" stroke="${br?"var(--bad)":res?"var(--accent)":"var(--muted)"}" stroke-width="${res?7:2.5}" stroke-opacity="${res?.35:1}" ${br?'stroke-dasharray="6 5"':""}/>`; }).join("");
    const nodes=Object.entries(N).map(([k,[x,y]])=> k==="A"||k==="B"?icon({x,y,ic:"pc"})+`<text x="${x}" y="${y+34}" text-anchor="middle" font-size="11" font-weight="700" fill="var(--ink)">${k==="A"?"Ana":"Beto"}</text>`:icon({x,y,ic:"router"})).join("");
    el.innerHTML=`
      <div class="controls"><div class="seg" role="group" aria-label="Tipo de comutação">${[["pacotes","Comutação de pacotes"],["circuitos","Comutação de circuitos"]].map(([k,l])=>`<button class="btn ${k===mode?"primary":""}" data-m="${k}" ${running?"disabled":""}>${l}</button>`).join("")}</div>
      <label class="chk"><input type="checkbox" id="sw-br" ${broken?"checked":""} ${running?"disabled":""}> Romper o enlace do meio (obras na rua)</label></div>
      <div class="seq-wrap"><svg viewBox="0 0 600 290" class="seq-svg" id="sw-svg" role="img" aria-label="Rede com roteadores entre Ana e Beto">${lines}${broken?`<text x="${(N.R4[0]+N.R6[0])/2+16}" y="${(N.R4[1]+N.R6[1])/2}" font-size="18" fill="var(--bad)" font-weight="700">✕</text>`:""}${nodes}</svg></div>
      <div class="controls"><button class="btn primary" id="sw-go" ${running?"disabled":""}>Enviar a mensagem (6 pedaços)</button>
        <span class="pk-row">Chegada: ${arrivals.map(a=>`<span class="pk" style="background:${COL[a-1]}">${a}</span>`).join("")||`<span class="hint">—</span>`}</span></div>
      <p class="lab-msg" aria-live="polite">${msg}</p>`;
    el.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{mode=b.dataset.m;arrivals=[];msg="";draw();});
    el.querySelector("#sw-br").onchange=e=>{broken=e.target.checked;arrivals=[];msg="";draw();};
    el.querySelector("#sw-go").onclick=send;
  }
  function send(){
    arrivals=[]; msg=""; running=true; draw();
    const svg=el.querySelector("#sw-svg");
    if(mode==="circuitos"&&broken){ running=false; tried.circuitos=true; msg=`<span class="bad-t">A chamada caiu.</span> O circuito reservado passava pelo enlace rompido. É preciso estabelecer um novo circuito antes de transmitir.`; check(); draw(); return; }
    let left=6;
    for(let i=0;i<6;i++){
      const r=mode==="circuitos"?ROUTES[0]:(()=>{const opts=ROUTES.filter(okRoute);return opts[Math.floor(Math.random()*opts.length)];})();
      const delay=mode==="circuitos"?i*0.35:Math.random()*0.8, dur=mode==="circuitos"?1.6:1.4+Math.random()*1.2+(r.includes("R5")||r.includes("R3")?0.3:0);
      const c=document.createElementNS(SVGNS,"circle"); c.setAttribute("r","9"); c.setAttribute("fill",COL[i]); c.setAttribute("opacity","0");
      const t=document.createElementNS(SVGNS,"text"); t.textContent=i+1; t.setAttribute("font-size","10"); t.setAttribute("font-weight","700"); t.setAttribute("text-anchor","middle"); t.setAttribute("dy","3.5"); t.setAttribute("fill","#fff"); t.setAttribute("opacity","0");
      [c,t].forEach(n=>{ const am=document.createElementNS(SVGNS,"animateMotion"); am.setAttribute("dur",(RM()?0.01:dur)+"s"); am.setAttribute("begin","indefinite"); am.setAttribute("fill","freeze"); am.setAttribute("path",d(r)); n.appendChild(am); svg.appendChild(n); });
      setTimeout(()=>{ if(!el.isConnected) return; [c,t].forEach(n=>{n.setAttribute("opacity","1"); n.querySelector("animateMotion").beginElement();}); },delay*1000);
      setTimeout(()=>{ if(!el.isConnected) return; arrivals.push(i+1); const row=el.querySelector(".pk-row"); if(row) row.innerHTML="Chegada: "+arrivals.map(a=>`<span class="pk" style="background:${COL[a-1]}">${a}</span>`).join("");
        left--; if(!left){ running=false; tried[mode]=true;
          const inOrder=arrivals.every((a,k)=>a===k+1);
          msg=mode==="circuitos"?"Todos seguiram pelo mesmo caminho reservado e chegaram em ordem. Mas esse caminho ficou ocupado só para Ana e Beto durante toda a conversa."
            :`Cada pedaço escolheu sua rota${broken?", desviando do enlace rompido":""}. ${inOrder?"Desta vez chegaram em ordem, mas nem sempre é assim: envie de novo.":"Chegaram fora de ordem"}, e o computador de Beto remonta: 1 2 3 4 5 6.`;
          check(); draw(); } },(RM()?delay:(delay+dur))*1000+60);
    }
  }
  function check(){ if(tried.pacotes&&tried.circuitos) done(); }
  draw();
};

/* Escala de abrangência */

      <div class="ip-leg"><span><i class="sw net"></i>parte da rede (${p} bits)</span><span><i class="sw host"></i>parte do host (${32-p} bits)</span></div>
      <div class="controls ex-ctrl"><label class="hint" for="ip-p">Máscara /${p}</label><input type="range" id="ip-p" min="8" max="30" value="${p}"></div>
      <div class="ip-res"><div><span class="eyebrow">Máscara</span><b class="mono">${mask}</b></div><div><span class="eyebrow">Rede</span><b class="mono">${toIp(net)}</b></div><div><span class="eyebrow">Broadcast</span><b class="mono">${toIp(bc)}</b></div><div><span class="eyebrow">Hosts utilizáveis</span><b class="mono">${(size-2).toLocaleString("pt-BR")}</b></div></div>
      <p class="hint">Clique num bit para trocar 0 ↔ 1 ou mexa na máscara. Repare: zerando todos os bits de host você obtém a rede; com todos em 1, o broadcast.</p>`;
    el.querySelectorAll("[data-o]").forEach(inp=>inp.onchange=()=>{ let v=Math.max(0,Math.min(255,parseInt(inp.value)||0)); o[+inp.dataset.o]=v; act(); draw(); });
    el.querySelectorAll("[data-b]").forEach(b=>b.onclick=()=>{ const i=+b.dataset.b, oc=Math.floor(i/8), bit=7-i%8; o[oc]^=(1<<bit); act(); draw(); el.querySelector(`[data-b="${i}"]`).focus(); });
    el.querySelector("#ip-p").oninput=e=>{ p=+e.target.value; act(); draw(); el.querySelector("#ip-p").focus(); };
  }
  function act(){ acts++; if(acts>=5) done(); }
  draw();
};

/* Reflexão interna total na fibra */
EXE.fiber=function(el,spec,done){
  let ang=10, multi=true, tried={in:false,out:false};
  const CRIT=22;
  function draw(){
    const y0=multi?70:92, y1=multi?150:128, W=600, rad=ang*Math.PI/180;
    let pts=[[20,(y0+y1)/2]], x=20, y=(y0+y1)/2, dir=-1, escaped=false;
    if(ang===0){ pts.push([W-20,y]); }
    else { while(x<W-20){ const ty=dir<0?y0:y1, dx=Math.abs(ty-y)/Math.tan(rad); if(x+dx>W-20){ pts.push([W-20,y+dir*(W-20-x)*Math.tan(rad)]); break; }
      x+=dx; y=ty; pts.push([x,y]); if(ang>CRIT){ escaped=true; pts.push([x+26/Math.tan(rad*1.25),dir<0?y-26:y+26]); break; } dir*=-1; } }
    if(escaped) tried.out=true; else tried.in=true; if(tried.in&&tried.out) done();
    el.innerHTML=`
      <div class="seq-wrap"><svg viewBox="0 0 600 220" class="seq-svg" role="img" aria-label="Raio de luz dentro da fibra">
        <rect x="10" y="${y0-34}" width="580" height="${y1-y0+68}" rx="14" fill="var(--panel2)" stroke="var(--line)"/>
        <rect x="10" y="${y0}" width="580" height="${y1-y0}" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="1"/>
        <text x="20" y="${y0-14}" font-size="11" fill="var(--muted)" font-family="var(--f-mono)">casca (cladding) · reflete a luz</text>
        <text x="20" y="${(y0+y1)/2-12}" font-size="11" fill="var(--accent)" font-family="var(--f-mono)">núcleo · ${multi?"multimodo 50–62,5 µm":"monomodo 9 µm"}</text>
        <polyline points="${pts.map(p=>p.join(",")).join(" ")}" fill="none" stroke="${escaped?"var(--bad)":"var(--ok)"}" stroke-width="3" stroke-linejoin="round"/>
        <circle cx="20" cy="${(y0+y1)/2}" r="6" fill="var(--ok)"/>
        ${escaped?`<text x="${pts[pts.length-1][0]+8}" y="${pts[pts.length-1][1]+(dir<0?-4:12)}" font-size="12" font-weight="700" fill="var(--bad)">luz perdida</text>`:`<text x="${W-30}" y="${y1+22}" text-anchor="end" font-size="12" font-weight="700" fill="var(--ok)">chegou ao fim</text>`}
      </svg></div>
      <div class="controls ex-ctrl"><label class="hint" for="fb-a">Ângulo de entrada da luz: <b class="mono">${ang}°</b></label><input type="range" id="fb-a" min="0" max="40" value="${ang}">
        <div class="seg">${[["multi","Multimodo"],["mono","Monomodo"]].map(([k,l])=>`<button class="btn sm ${(k==="multi")===multi?"primary":""}" data-f="${k}">${l}</button>`).join("")}</div></div>
      <p class="lab-msg" aria-live="polite">${escaped?`<span class="bad-t">Ângulo grande demais.</span> A luz atravessa a casca e se perde: não há reflexão interna total.`:`<span class="ok-t">Reflexão interna total.</span> A luz bate na casca e volta para o núcleo, ricocheteando até o fim, sem sofrer interferência eletromagnética.`} ${multi?"No multimodo, raios com ângulos diferentes percorrem caminhos de tamanhos diferentes, o que limita a distância (até cerca de 2 km).":"No monomodo, o núcleo é tão fino que a luz segue quase reta: alcança dezenas de km."}</p>
      <p class="hint">Simulação ilustrativa: o ângulo-limite real depende dos materiais da fibra.</p>`;
    el.querySelector("#fb-a").oninput=e=>{ang=+e.target.value;draw();el.querySelector("#fb-a").focus();};
    el.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{multi=b.dataset.f==="multi";draw();});
  }
  draw();
};

/* Cobertura Wi-Fi */
EXE.wifi=function(el,spec,done){
  let dist=8, walls=1, band="2.4", tried=new Set();
  function rssi(){ const loss=band==="2.4"?0:6, wl=band==="2.4"?5:8; return Math.round(-30-10*3*Math.log10(Math.max(1,dist))-walls*wl-loss); }
  function draw(){
    const r=rssi(), q=r>=-50?["Excelente","ok"]:r>=-67?["Bom para vídeo e chamadas","ok"]:r>=-75?["Razoável: navegação simples","warn"]:r>=-82?["Fraco: conexão instável","bad"]:["Sem conexão útil","bad"];
    tried.add(band+(walls>0?"w":"")); if(tried.has("2.4w")&&tried.has("5w")) done();
    const px=60+Math.min(dist,40)/40*480, pct=Math.max(0,Math.min(100,(r+95)/65*100));
    const wallX=[...Array(walls)].map((_,i)=>60+(i+1)*(px-60)/(walls+1));
    el.innerHTML=`
      <div class="seq-wrap"><svg viewBox="0 0 600 190" class="seq-svg" role="img" aria-label="Ponto de acesso e celular separados por paredes">
        <rect x="10" y="20" width="580" height="150" rx="10" fill="var(--panel2)" stroke="var(--line)"/>
        ${[1,2,3].map(k=>`<circle cx="60" cy="100" r="${k*55}" fill="none" stroke="var(--accent)" stroke-opacity="${.5-k*.12}" stroke-width="2"/>`).join("")}
        ${wallX.map(x=>`<rect x="${x-5}" y="30" width="10" height="130" fill="var(--muted)"/><text x="${x}" y="182" text-anchor="middle" font-size="10" fill="var(--muted)">parede</text>`).join("")}
        ${icon({x:60,y:100,ic:"ap"})}<text x="60" y="140" text-anchor="middle" font-size="11" font-weight="700" fill="var(--ink)">AP</text>
        ${icon({x:px,y:100,ic:"phone"})}<text x="${px}" y="140" text-anchor="middle" font-size="11" font-weight="700" fill="var(--ink)">${dist} m</text>
      </svg></div>
      <div class="wf-ctl">
        <label class="hint">Distância: <b class="mono">${dist} m</b><input type="range" id="wf-d" min="1" max="40" value="${dist}"></label>
        <label class="hint">Paredes no caminho: <b class="mono">${walls}</b><input type="range" id="wf-w" min="0" max="3" value="${walls}"></label>
        <div class="seg" role="group" aria-label="Faixa">${["2.4","5"].map(b=>`<button class="btn sm ${b===band?"primary":""}" data-b="${b}">${b.replace(".",",")} GHz</button>`).join("")}</div>
      </div>
      <div class="sig"><span class="mono sig-v">${r} dBm</span><span class="bar sig-bar"><span style="width:${pct}%;background:var(--${q[1]==="warn"?"accent":q[1]})"></span></span><b class="${q[1]==="ok"?"ok-t":q[1]==="bad"?"bad-t":""}">${q[0]}</b></div>
      <p class="hint">Compare 2,4 GHz e 5 GHz com pelo menos uma parede. Modelo simplificado para fins didáticos.</p>`;
    el.querySelector("#wf-d").oninput=e=>{dist=+e.target.value;draw();el.querySelector("#wf-d").focus();};
    el.querySelector("#wf-w").oninput=e=>{walls=+e.target.value;draw();el.querySelector("#wf-w").focus();};
    el.querySelectorAll("[data-b]").forEach(b=>b.onclick=()=>{band=b.dataset.b;draw();});
  }
  draw();
};

<script>
/* Laboratórios interativos. Cada função recebe (el, api) com api.complete() e api.esc */
const LAB_INFO={
 encap:{t:"Encapsulamento passo a passo",d:"Monte e desmonte o pacote do Paco. A cada passo, escolha qual camada age agora."},
 dns:{t:"Resolução DNS",d:"Coloque as consultas DNS na ordem certa e veja a resolução acontecer. Depois teste o cache."},

 wifi:{t:"Planejador de canais Wi-Fi",d:"Escolha os canais de 2,4 GHz de três APs vizinhos até eliminar a sobreposição."}
};
