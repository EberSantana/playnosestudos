</head>
<body>
<title>Redes de Computadores · Console de Estudo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Chakra+Petch:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: console de estudo — trilho lateral com a pilha de camadas (módulos) + área de prática com abas por tipo de atividade */
:root{
  --bg:#ECF0EE; --panel:#FFFFFF; --panel2:#F5F8F6; --ink:#16211E; --muted:#58665F; --line:#D2DBD6;
  --accent:#1F5135; --accent-ink:#FFFFFF; --accent-soft:#E3EEE7;
  --ok:#2B7A50; --ok-soft:#DDF0E4; --bad:#AE3a30; --bad-soft:#F6DEDB; --blue:#2A5C8C;
  --f-display:"Chakra Petch", "Segoe UI", system-ui, sans-serif;
  --f-body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, Consolas, monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0F1513; --panel:#161F1C; --panel2:#1B2622; --ink:#E5ECE8; --muted:#97A69F; --line:#2B3833;
  --accent:#6BAA68; --accent-ink:#12241A; --accent-soft:#1A2D20;
  --ok:#63C48F; --ok-soft:#163327; --bad:#EC7B70; --bad-soft:#3A1B18; --blue:#7FB0E0; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0F1513; --panel:#161F1C; --panel2:#1B2622; --ink:#E5ECE8; --muted:#97A69F; --line:#2B3833;
  --accent:#6BAA68; --accent-ink:#12241A; --accent-soft:#1A2D20;
  --ok:#63C48F; --ok-soft:#163327; --bad:#EC7B70; --bad-soft:#3A1B18; --blue:#7FB0E0; color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;line-height:1.15;margin:0}
.mono{font-family:var(--f-mono)}
.eyebrow{font-family:var(--f-mono);font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--panel);border-bottom:1px solid var(--line)}
.top-in{max-width:1280px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{text-align:left;display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);cursor:pointer;background:none;border:0;padding:0}
.brand-mark{display:grid;grid-template-columns:repeat(8,4px);gap:2px;height:22px}
.brand-mark i{display:block;border-radius:1px}
.brand b{font-family:var(--f-display);font-size:1.05rem;letter-spacing:.01em}
.brand small{display:block;font-size:.75rem;color:var(--muted);font-family:var(--f-mono)}
.top .spacer{flex:1}
.overall{display:flex;align-items:center;gap:8px;font-family:var(--f-mono);font-size:.8rem;color:var(--muted)}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;min-width:80px}
.bar>span{display:block;height:100%;background:var(--accent);transition:width .3s}

.wrap{max-width:1280px;margin:0 auto;padding-inline:16px;padding-block:20px 60px;display:grid;grid-template-columns:270px minmax(0,1fr);gap:24px;align-items:start}
@media (max-width:860px){.wrap{grid-template-columns:minmax(0,1fr)}}

/* Pilha de módulos */
.rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 70px);display:flex;flex-direction:column;gap:6px}
@media (max-width:860px){.rail{position:static;flex-direction:row;overflow-x:auto;padding-bottom:6px}}
.rail-h{margin:0 0 4px 4px}
@media (max-width:860px){.rail-h{display:none}}
.mod-btn{display:grid;grid-template-columns:44px 1fr;gap:10px;align-items:center;text-align:left;width:100%;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:10px;cursor:pointer;transition:border-color .15s, transform .15s}
.mod-btn:hover{border-color:var(--accent)}
.mod-btn[aria-current="true"]{border-color:var(--accent);background:var(--accent-soft)}
@media (max-width:860px){.mod-btn{min-width:210px}}
.mod-num{font-family:var(--f-display);font-weight:700;font-size:1.1rem;display:grid;place-items:center;height:44px;border-radius:8px;background:var(--panel2);border:1px solid var(--line)}
.mod-btn[aria-current="true"] .mod-num{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.mod-t{font-weight:700;font-size:.9rem;line-height:1.25}
.mod-l{font-family:var(--f-mono);font-size:.7rem;color:var(--muted);letter-spacing:.04em}
.mod-p{margin-top:5px}
.mod-p .bar{min-width:0;height:4px}

main{min-width:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r)}

/* Início */
.hero{padding:28px;display:grid;gap:14px}
.hero h1{font-size:clamp(1.9rem,4vw,2.8rem);font-weight:700}
.hero p{max-width:65ch;margin:0;color:var(--muted)}
.how{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:6px}
@media (max-width:980px){.how{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:460px){.how{grid-template-columns:minmax(0,1fr)}}
.how div{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:12px}
.how b{font-family:var(--f-display);font-size:1rem;display:block}
.how span{font-size:.88rem;color:var(--muted)}
.how em{font-style:normal;font-family:var(--f-mono);font-size:.75rem;color:var(--accent)}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:28px 0 12px;flex-wrap:wrap}
.sec-h h2{font-size:1.35rem}
.grid-mods{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:1080px){.grid-mods{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.grid-mods{grid-template-columns:minmax(0,1fr)}}
.gm{padding:16px;display:flex;flex-direction:column;gap:8px;cursor:pointer;text-align:left;transition:border-color .15s}
.gm:hover{border-color:var(--accent)}
.gm h3{font-size:1.08rem}
.gm p{margin:0;font-size:.88rem;color:var(--muted)}
.gm .row{display:flex;align-items:center;gap:8px;margin-top:auto;font-family:var(--f-mono);font-size:.75rem;color:var(--muted)}
.gm .row .bar{flex:1}
.story{padding:20px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:18px;align-items:center}
@media (max-width:560px){.story{grid-template-columns:minmax(0,1fr)}}
.stack{display:flex;flex-direction:column;gap:3px;font-family:var(--f-mono);font-size:.72rem}
.stack span{padding:4px 10px;border-radius:4px;background:var(--panel2);border:1px solid var(--line);white-space:nowrap}
.stack span:first-child{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.story p{margin:6px 0 0;max-width:65ch}

/* Módulo */
.mhead{padding:22px;display:grid;gap:10px}
.mhead h1{font-size:clamp(1.6rem,3.4vw,2.2rem)}
.mhead p{margin:0;max-width:70ch}
.concepts{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;margin-top:6px}
.concepts div{border-top:2px solid var(--accent);background:var(--panel2);padding:10px 12px;border-radius:0 0 6px 6px}
.concepts b{display:block;font-size:.9rem}
.concepts span{font-size:.85rem;color:var(--muted)}
.paco{margin-top:4px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:start;background:var(--panel2);border:1px dashed var(--line);border-radius:8px;padding:12px 14px}
.paco .tag{font-family:var(--f-mono);font-size:.7rem;background:var(--blue);color:var(--panel);padding:3px 7px;border-radius:4px;white-space:nowrap}
.paco p{margin:0;font-size:.92rem}
@media (max-width:560px){.paco{grid-template-columns:minmax(0,1fr)}.paco .tag{justify-self:start}.brand small{display:none}.top .overall .bar{width:70px!important}}

.tabs{display:flex;gap:6px;margin:18px 0 12px;flex-wrap:wrap}
.tab{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:8px 14px;cursor:pointer;font-weight:700;font-size:.92rem}
.tab:hover{border-color:var(--accent)}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tab .cnt{font-family:var(--f-mono);font-size:.72rem;font-weight:500;opacity:.8}
.tab-intro{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px;color:var(--muted);font-size:.9rem}
.tab-intro p{margin:0;max-width:70ch}

.items{display:flex;flex-direction:column;gap:12px}
.item{padding:16px 18px;display:grid;gap:10px}
.item.done{border-color:color-mix(in srgb,var(--ok) 45%,var(--line))}
.qhead{display:flex;gap:12px;align-items:flex-start}
.qn{font-family:var(--f-mono);font-size:.75rem;color:var(--muted);padding-top:3px;min-width:32px}
.qtext{font-weight:700;flex:1;min-width:0}
.badge{font-family:var(--f-mono);font-size:.68rem;padding:2px 7px;border-radius:4px;white-space:nowrap}
.badge.ok{background:var(--ok-soft);color:var(--ok)}
.badge.bad{background:var(--bad-soft);color:var(--bad)}
textarea{width:100%;min-height:76px;resize:vertical;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;line-height:1.45}
textarea:focus{border-color:var(--accent);outline:none}
.controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.chk{display:flex;gap:8px;align-items:center;font-size:.9rem;color:var(--muted);cursor:pointer}
.chk input{width:18px;height:18px;accent-color:var(--accent)}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:700;font-size:.9rem}
.btn:hover:not(:disabled){border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.hint{font-size:.8rem;color:var(--muted)}
.answer{border-left:3px solid var(--ok);background:var(--ok-soft);padding:10px 14px;border-radius:0 8px 8px 0}
.answer.badl{border-left-color:var(--bad);background:var(--bad-soft)}
.answer .eyebrow{color:inherit;opacity:.85;margin-bottom:4px}
.answer p{margin:0}
.self{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:.85rem;color:var(--muted)}
.btn.sm{padding:5px 10px;font-size:.82rem}
.btn.sel-ok{background:var(--ok);border-color:var(--ok);color:var(--panel)}
.btn.sel-bad{background:var(--bad);border-color:var(--bad);color:var(--panel)}
.vfbtns{display:flex;gap:8px}
.vfbtn{min-width:120px}
.vfbtn[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.case{background:var(--panel2);border-radius:8px;padding:12px 14px;font-size:.95rem}
.case ul{margin:6px 0 0;padding-left:20px}
.pbl-t{font-family:var(--f-display);font-size:1.15rem}

/* Flashcards */
.deck{display:grid;gap:14px;justify-items:center}
.flip{width:min(560px,100%);aspect-ratio:16/10;max-width:100%;perspective:1200px;cursor:pointer;border:0;background:none;padding:0}
.flip-in{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.flip.on .flip-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:14px;border:1px solid var(--line);display:flex;flex-direction:column;justify-content:center;align-items:center;gap:10px;padding:24px;text-align:center}
.face.front{background:var(--panel)}
.face.back{background:var(--panel2);transform:rotateY(180deg);border-color:var(--accent)}
.face .big{font-family:var(--f-display);font-size:clamp(1.4rem,3.6vw,2rem);font-weight:700}
.face .def{font-size:clamp(.98rem,2.4vw,1.12rem);max-width:44ch}
.face .eyebrow{position:absolute;top:14px;left:16px}
.face .pos{position:absolute;top:14px;right:16px;font-family:var(--f-mono);font-size:.75rem;color:var(--muted)}
.deck-ctrl{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;align-items:center}
.dots{display:flex;gap:4px;flex-wrap:wrap;justify-content:center;max-width:560px}
.dots button{width:22px;height:8px;border-radius:4px;border:0;background:var(--line);cursor:pointer;padding:0}
.dots button.k{background:var(--ok)}
.dots button.n{background:var(--bad)}
.dots button.cur{outline:2px solid var(--accent);outline-offset:1px}

.score{font-family:var(--f-mono);font-size:.85rem;padding:6px 10px;border-radius:6px;background:var(--panel);border:1px solid var(--line)}
.reset{display:flex;gap:8px;align-items:center;justify-content:flex-end;margin-top:22px;flex-wrap:wrap;font-size:.85rem;color:var(--muted)}
footer{max-width:1280px;margin:0 auto;padding:0 16px 30px;color:var(--muted);font-size:.8rem}
.xp{display:flex;flex-direction:column;align-items:flex-end;line-height:1.15;font-size:.75rem;color:var(--muted)}
.xp b{color:var(--accent);font-size:.9rem}
.mod-btn.extra .mod-num{font-size:1rem}
.rail .extra:first-of-type{margin-top:8px}
.tab-lab{border-color:var(--accent);color:var(--accent)}
.tab-lab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.status{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:12px;margin-top:12px}
@media (max-width:760px){.status{grid-template-columns:minmax(0,1fr)}}
.status section{padding:18px;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.status .bar{width:100%}
.lv{font-family:var(--f-display);font-size:1.2rem;font-weight:700}
.bdgs{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.bdg{width:34px;height:34px;display:grid;place-items:center;border-radius:50%;border:1px dashed var(--line);font-family:var(--f-display);font-weight:700;font-size:.8rem;color:var(--muted)}
.bdg.on{background:var(--accent);color:var(--accent-ink);border:1px solid var(--accent)}
.ementa{padding:6px 18px}
.em{display:grid;grid-template-columns:minmax(0,220px) minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.em:last-child{border-bottom:0}
.em b{font-family:var(--f-display)}
.em span{font-size:.88rem;color:var(--muted)}
.em-l{display:flex;gap:6px;flex-wrap:wrap}
@media (max-width:700px){.em{grid-template-columns:minmax(0,1fr)}}
.pill{display:inline-block;font-size:.78rem;padding:3px 9px;border-radius:999px;border:1px solid var(--line);background:var(--panel2);color:var(--ink);cursor:pointer}
button.pill:hover{border-color:var(--accent)}
.toast{text-align:center;width:max-content;max-width:calc(100% - 32px);position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:700;z-index:20;box-shadow:0 6px 24px rgba(0,0,0,.25)}
.sel,.inp{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:7px 10px;font:inherit;color:var(--ink);max-width:100%}
.inp{width:100%}
.inp:focus,.sel:focus{border-color:var(--accent);outline:none}
.lab{padding:18px;display:grid;gap:12px}
.lab>*{min-width:0}
.lab-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.lab-head h2{font-size:1.3rem}
.lab-msg{margin:10px 0 0;min-height:1.5em}
.bad-t{color:var(--bad);font-weight:700}
.ok-t{color:var(--ok);font-weight:700}
.seg{display:flex;gap:4px}
.lab-split{display:grid;grid-template-columns:220px minmax(0,1fr);gap:18px}
.lab-split2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:18px;margin-top:14px}
@media (max-width:700px){.lab-split,.lab-split2{grid-template-columns:minmax(0,1fr)}}
.enc-btns{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.enc-l{text-align:left}
.enc-l.used{background:var(--ok-soft);border-color:var(--ok);opacity:1}
.enc-stage{margin-top:8px;min-height:150px;border:1px dashed var(--line);border-radius:10px;padding:12px;display:grid;place-items:center;overflow-x:auto}
.enc-box{border:2px solid;border-radius:8px;padding:8px;display:flex;flex-direction:column;gap:6px;align-items:stretch;min-width:0}
.enc-4{border-color:var(--ok)} .enc-3{border-color:var(--blue)} .enc-2{border-color:var(--accent)}
.enc-h{font-family:var(--f-mono);font-size:.72rem;padding:3px 8px;border-radius:4px;background:var(--panel2)}
.enc-4>.enc-h{color:var(--ok)} .enc-3>.enc-h{color:var(--blue)} .enc-2>.enc-h{color:var(--accent)}
.enc-t{align-self:flex-end}
.enc-data{background:var(--ink);color:var(--bg);padding:8px 12px;border-radius:6px;text-align:center;font-weight:700}
.enc-bits{font-size:.8rem;word-break:break-all;color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--panel2);border-radius:8px;padding:8px 12px;cursor:pointer;text-align:left;font-size:.9rem}
.chip:hover:not(:disabled){border-color:var(--accent)}
.chip.on{background:var(--ok-soft);border-color:var(--ok)}
.dns-flow{margin:12px 0 0;padding-left:20px;display:grid;gap:6px}
.dns-flow li{padding:6px 10px;background:var(--panel2);border-radius:6px}
.dns-flow li.ok{background:var(--ok-soft)}
.dns-flow .mono{color:var(--muted);font-size:.75rem;margin-right:6px}
.cache{margin-top:10px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.hs{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:12px}
.tl{display:grid;gap:4px;margin-top:12px}
.tl-row{display:grid;grid-template-columns:56px 150px minmax(0,1fr);gap:10px;align-items:center;font-size:.88rem}
@media (max-width:520px){.tl-row{grid-template-columns:50px 110px minmax(0,1fr);font-size:.8rem}}
.tl-tries{display:flex;gap:3px}
.tl-p{width:22px;height:22px;display:grid;place-items:center;border-radius:4px;font-size:.75rem;font-weight:700}
.tl-p.lost{background:var(--bad-soft);color:var(--bad)} .tl-p.okp{background:var(--ok-soft);color:var(--ok)}
.tl-n{color:var(--muted);font-size:.75rem}
.stats{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
input[type=range]{accent-color:var(--accent);max-width:160px}
.sn-q{display:grid;gap:2px}
.sn-ip{font-size:clamp(1.4rem,4vw,2rem);font-weight:500;color:var(--accent)}
.sn-f{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:12px 0}
.sn-f label{display:grid;gap:4px;font-size:.85rem;color:var(--muted)}
@media (max-width:620px){.sn-f{grid-template-columns:minmax(0,1fr)}}
.sw-net{display:grid;gap:14px;margin-top:14px}
.sw-dev{border:2px solid var(--ink);border-radius:10px;padding:10px 14px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.sw-ports{display:flex;gap:6px}
.sw-port{width:30px;height:24px;display:grid;place-items:center;border-radius:4px;background:var(--panel2);border:1px solid var(--line);font-family:var(--f-mono);font-size:.75rem}

caderno:[
{q:"Compare a arquitetura cliente-servidor com a ponto-a-ponto (P2P) e dê um exemplo de cada.",a:"Cliente-servidor: um servidor sempre ligado, com IP fixo e conhecido, atende requisições dos clientes (ex.: acessar o Google, e-mail). P2P: não há servidor central; os computadores se comunicam diretamente e cada um é cliente e servidor ao mesmo tempo (ex.: BitTorrent, chamadas de vídeo)."},
{q:"Descreva as três etapas que acontecem quando você digita uma URL no navegador, do ponto de vista do HTTP.",a:"1) O navegador (cliente) envia uma requisição HTTP ao servidor web. 2) O servidor processa e devolve uma resposta HTTP com o conteúdo (HTML, imagens, CSS, JavaScript). 3) O navegador renderiza o conteúdo e exibe a página."},
{q:"Indique o método HTTP mais adequado para: carregar uma página; enviar um formulário de matrícula; atualizar um cadastro existente; remover uma postagem.",a:"Carregar página = GET; enviar formulário = POST; atualizar cadastro = PUT; remover postagem = DELETE."},
{q:"Explique o significado dos códigos 200, 301, 404 e 500. Em quais deles o problema está no servidor?",a:"200 OK: sucesso. 301 Moved: recurso movido permanentemente. 404 Not Found: recurso não encontrado (em geral endereço errado ou página removida). 500 Internal Server Error: erro interno do servidor. O 500 indica falha no servidor; o 404 costuma ser endereço inexistente."},
{q:"Por que o FTP usa duas conexões TCP? Diga qual porta cada uma usa e quanto tempo cada uma dura.",a:"Para separar comandos de dados. Conexão de controle, porta 21: login, listagem, pedidos; fica ativa durante toda a sessão. Conexão de dados, porta 20: transfere arquivos; é aberta para cada arquivo e fechada ao final da transferência."},
{q:"Ana (Gmail) envia um e-mail para Beto (Outlook). Descreva o caminho da mensagem, indicando onde atuam SMTP e IMAP.",a:"1) O cliente de Ana envia ao servidor de correio dela usando SMTP. 2) O servidor de Ana entrega ao servidor de Beto, também por SMTP. 3) A mensagem fica armazenada no servidor de Beto. 4) Beto lê usando IMAP (ou POP3) a partir do seu agente de usuário."},
{q:"Uma pessoa lê e-mails no celular e no notebook. Ela deve usar POP3 ou IMAP? Justifique.",a:"IMAP, porque mantém as mensagens no servidor e permite acessá-las e organizá-las de vários dispositivos de forma sincronizada. O POP3 baixa para um computador e geralmente apaga do servidor, então o outro dispositivo não veria as mensagens."},
{q:"Descreva a resolução DNS de www.ifs.edu.br passando pelos quatro tipos de servidor e explique o papel do cache.",a:"1) O computador consulta o servidor DNS local (provedor). 2) Sem resposta, consulta-se um servidor raiz. 3) O raiz indica o servidor de domínio de topo (.br). 4) Este indica o servidor autoritativo do domínio, que devolve o IP. O resultado fica em cache para responder mais rápido às próximas consultas."}
],
flash:[
{f:"SSH × Telnet",b:"Protocolos de acesso remoto a outro computador pelo terminal. Telnet (23) não criptografa; SSH (22) criptografa e é o recomendado."},
{f:"Arquitetura cliente-servidor",b:"Servidor sempre ligado e com endereço conhecido atende requisições de clientes. Ex.: Web, e-mail."},
{f:"Arquitetura P2P",b:"Pares se comunicam diretamente, sem servidor central; cada um é cliente e servidor."},
{f:"HTTP",b:"HyperText Transfer Protocol: protocolo de transferência de páginas da Web, no modelo requisição e resposta."},
{f:"GET × POST",b:"GET solicita um recurso ao servidor; POST envia dados ao servidor, como um formulário."},
{f:"Código 404",b:"Not Found: o recurso solicitado não foi encontrado no servidor."},
{f:"Código 500",b:"Internal Server Error: erro interno no servidor."},
{f:"FTP: portas",b:"Porta 21 para a conexão de controle e porta 20 para a conexão de dados."},
{f:"SFTP e FTPS",b:"Alternativas seguras ao FTP que criptografam a transferência (SFTP via SSH; FTPS via SSL/TLS)."},
{f:"SMTP",b:"Simple Mail Transfer Protocol: envia e-mails do cliente ao servidor e entre servidores."},
{f:"IMAP",b:"Acessa e gerencia e-mails diretamente no servidor; ideal para vários dispositivos."},
{f:"DNS",b:"Domain Name System: traduz nomes de domínio em endereços IP; a lista telefônica da internet."}
],
pbl:[
{t:"O site do campus está com problemas",c:"Em um mesmo dia, o suporte recebe três reclamações sobre o site do campus: (1) a página de editais mostra 404; (2) o sistema de matrícula mostra 500; (3) um aluno em casa vê a mensagem de que o endereço do site não foi encontrado.",tasks:["Diagnostique a causa provável de cada caso.","Diga quem deve agir em cada situação (usuário, equipe do site, provedor).","Proponha um teste rápido para confirmar cada hipótese."],a:"(1) 404: a página foi removida ou o link está errado; a equipe do site corrige o link ou cria um redirecionamento 301. Teste: abrir a URL no DevTools e ver o status. (2) 500: falha interna na aplicação ou no banco; a equipe do servidor verifica os logs. Teste: repetir a requisição e checar logs. (3) Endereço não encontrado: falha de DNS (nome não resolvido), possivelmente no DNS do provedor do aluno. Teste: nslookup do domínio; se outro DNS (8.8.8.8) resolve, o problema é do DNS local."},
{t:"E-mail compartilhado da secretaria",c:"Três funcionários da secretaria usam a mesma conta de e-mail em computadores diferentes. Mensagens “somem”: quem abre primeiro fica com o e-mail, e os outros não o veem mais.",tasks:["Explique tecnicamente por que as mensagens somem.","Recomende os protocolos de envio e de recebimento.","Escreva as instruções de configuração para os funcionários."],a:"As contas provavelmente estão configuradas com POP3, que baixa as mensagens e as remove do servidor, então só o primeiro computador as recebe. A solução é IMAP para recebimento, mantendo tudo no servidor e sincronizado, e SMTP para envio. As instruções devem indicar o servidor IMAP e o servidor SMTP do provedor e orientar a usar as versões seguras (com TLS)."},
{t:"Recebendo trabalhos dos alunos",c:"Um professor quer que os alunos enviem projetos grandes (vídeos e código) para um servidor do campus. Um colega sugere abrir um FTP comum na internet.",tasks:["Avalie os riscos do FTP comum.","Compare FTP, SFTP/FTPS e envio por formulário web (POST sobre HTTPS).","Recomende uma solução e justifique."],a:"O FTP comum envia usuário, senha e arquivos sem criptografia, sujeitos a interceptação. SFTP e FTPS resolvem isso criptografando a transferência. Um formulário web com POST sobre HTTPS também é criptografado e mais simples para os alunos. Recomendação aceitável: HTTPS com upload (mais fácil para iniciantes) ou SFTP (melhor para arquivos grandes e uso técnico). Evitar FTP sem criptografia."},
{t:"O que acontece quando aperto Enter?",c:"Você vai gravar um vídeo de 3 minutos para o canal da turma explicando tudo o que acontece, na camada de aplicação, entre digitar www.ifs.edu.br e ver a página carregada.",tasks:["Escreva o roteiro em passos numerados.","Inclua DNS e HTTP com os nomes corretos das mensagens e servidores.","Crie uma analogia para fechar o vídeo."],a:"1) O navegador precisa do IP: consulta o DNS local. 2) Se não estiver em cache: raiz → TLD .br → autoritativo, que devolve o IP. 3) O navegador envia uma requisição HTTP GET ao servidor. 4) O servidor responde 200 OK com o HTML. 5) O navegador faz novas requisições GET para imagens, CSS e JS. 6) A página é renderizada. Analogia possível: o DNS é a agenda de contatos e o HTTP é o garçom levando o pedido à cozinha."}
],

{
id:"m3", num:"III", layer:"Camada 4 · Transporte", title:"A Camada de Transporte",
objetivo:"Compreender o papel da camada de transporte, explicar multiplexação e demultiplexação e comparar os protocolos TCP e UDP.",
conceitos:[
["Comunicação lógica entre processos","A rede leva de host a host; o transporte entrega à aplicação certa."],
["Portas","Identificam a aplicação: HTTP 80, HTTPS 443, FTP 21, SMTP 25, DNS 53, DHCP 67/68."],
["Multiplexação / demultiplexação","Na origem junta dados de várias aplicações; no destino entrega pelo número da porta."],
["UDP","Sem conexão, não confiável, leve e rápido: streaming, jogos, DNS, VoIP."],
["TCP","Orientado à conexão e confiável: handshake SYN, SYN-ACK, ACK; ACKs e retransmissão."],
["Fluxo × congestionamento","Fluxo protege o receptor (janela); congestionamento protege a rede."]
],
paco:"No Capítulo 2, Paco desce ao 4º andar e encontra o Sr. TCP (“Nenhum pacote fica para trás”) e o Sr. UDP (“Rápido e sem frescura”). Como faz parte de uma mensagem de texto, Paco vai com o TCP, que faz o three-way handshake e anota as portas de origem e destino no segmento.",
caderno:[
{q:"Qual a diferença entre a entrega feita pela camada de rede e a feita pela camada de transporte?",a:"A camada de rede leva os pacotes de um computador a outro (host a host). A camada de transporte entrega os dados à aplicação correta dentro do computador de destino, criando uma comunicação lógica entre processos."},
{q:"Você está com o navegador e o cliente de e-mail abertos ao mesmo tempo. Explique como multiplexação e demultiplexação fazem cada dado chegar ao programa certo.",a:"Na origem (multiplexação), cada segmento recebe um cabeçalho com porta de origem e porta de destino, e todos são entregues à camada de rede. No destino (demultiplexação), o computador examina a porta de destino de cada segmento e entrega os dados ao socket da aplicação correspondente."},
{q:"Complete a tabela com porta e protocolo de transporte: HTTP, HTTPS, FTP, SMTP, DNS e DHCP.",a:"HTTP 80/TCP; HTTPS 443/TCP; FTP 21/TCP; SMTP 25/TCP; DNS 53/UDP (e TCP); DHCP 67/68/UDP."},
{q:"Desenhe o three-way handshake do TCP com setas entre cliente e servidor e explique cada mensagem.",a:"Cliente → Servidor: SYN (pede para iniciar a conexão). Servidor → Cliente: SYN-ACK (confirma e pede sincronização de volta). Cliente → Servidor: ACK (confirma). A conexão está estabelecida e os dados podem ser enviados."},
{q:"Explique os três mecanismos que tornam o TCP confiável.",a:"1) Números de sequência e ACKs: cada byte é numerado e o receptor confirma; sem ACK no tempo limite, o remetente retransmite. 2) Controle de fluxo: o receptor informa sua janela de recepção e o remetente ajusta a velocidade. 3) Controle de congestionamento: o TCP reduz a taxa ao detectar perdas na rede."},
{q:"Diferencie controle de fluxo de controle de congestionamento: quem cada um protege?",a:"O controle de fluxo protege o receptor, evitando que um remetente rápido encha o buffer de um receptor lento. O controle de congestionamento protege a rede, reduzindo a taxa de envio quando há perda de pacotes, para evitar colapso."},
{q:"Indique TCP ou UDP e justifique: download de PDF de 50 MB; transmissão ao vivo de futebol; e-mail com anexo; jogo multiplayer em tempo real; consulta DNS.",a:"PDF: TCP (o arquivo precisa chegar íntegro). Futebol ao vivo: UDP (fluidez importa mais que perder um quadro). E-mail com anexo: TCP (integridade). Jogo multiplayer: UDP (atraso prejudica mais que perda ocasional). DNS: UDP (consultas pequenas; se perder, envia de novo)."},
{q:"Por que um serviço de streaming prefere perder um pacote a esperar sua retransmissão?",a:"Porque esperar a retransmissão pausaria o vídeo ou o áudio. Perder um pacote causa apenas um pixel borrado ou um instante de silêncio, que prejudica menos a experiência do que travar a transmissão."}
],
flash:[
{f:"Camada de transporte",b:"Fornece comunicação lógica entre processos de aplicação em hosts diferentes."},
{f:"Porta",b:"Número que identifica a aplicação dentro do host, como o número do apartamento num prédio."},
{f:"Socket",b:"Ponto de comunicação da aplicação; é para ele que a demultiplexação entrega os dados."},
{f:"Multiplexação",b:"Na origem, reunir dados de várias aplicações, adicionando portas de origem e destino a cada segmento."},
{f:"Demultiplexação",b:"No destino, usar a porta de destino para entregar cada segmento à aplicação correta."},
{f:"UDP",b:"User Datagram Protocol: sem conexão, não confiável, leve e rápido. Analogia: cartão-postal."},
{f:"TCP",b:"Transmission Control Protocol: orientado à conexão e confiável. Analogia: ligação telefônica."},
{f:"Three-way handshake",b:"SYN → SYN-ACK → ACK: estabelecimento da conexão TCP antes do envio de dados."},
{f:"ACK",b:"Acknowledgment: confirmação de recebimento de dados no TCP."},
{f:"Controle de fluxo",b:"O receptor anuncia sua janela de recepção para não ser sobrecarregado pelo remetente."},
{f:"Controle de congestionamento",b:"O TCP reduz a taxa de envio quando detecta perda de pacotes na rede."},
{f:"Overhead",b:"Sobrecarga de controle (conexão, confirmações, retransmissões). O TCP tem mais que o UDP."}
],
pbl:[
{t:"Lag no campeonato de e-sports",c:"No campeonato de jogos do campus, os jogadores reclamam de travadas. Um aluno propõe forçar o jogo a usar TCP “para não perder nada”.",tasks:["Avalie a proposta do aluno.","Explique o que aconteceria com a jogabilidade usando TCP numa rede com perdas.","Sugira medidas que realmente reduzam o lag."],a:"A proposta piora a situação: o TCP, ao perder um pacote, retransmite e segura os dados seguintes até completar a ordem, o que gera congelamentos. Jogos em tempo real usam UDP porque a posição antiga perde valor rapidamente; é melhor descartá-la e usar a próxima. Medidas reais: cabo em vez de Wi-Fi, reduzir o tráfego concorrente (downloads e streaming) durante as partidas e verificar congestionamento no link do campus."},
{t:"Um servidor, vários serviços",c:"O servidor do laboratório tem um único IP e roda ao mesmo tempo um site (80), o mesmo site em HTTPS (443), um FTP (21) e um DNS interno (53). Um estagiário pergunta como o servidor sabe para qual programa vai cada pacote.",tasks:["Explique o papel das portas e da demultiplexação nesse servidor.","Diga o que acontece se dois programas tentarem usar a mesma porta.","Indique o protocolo de transporte de cada serviço."],a:"Todos os segmentos chegam ao mesmo IP, e a camada de transporte lê a porta de destino de cada um e entrega ao socket do serviço correspondente. Se dois programas tentarem ouvir na mesma porta (mesmo protocolo), o segundo não consegue iniciar, pois a porta já está em uso, e o sistema não saberia para quem entregar. Transporte: HTTP 80/TCP, HTTPS 443/TCP, FTP 21/TCP, DNS 53/UDP (e TCP)."},
{t:"O arquivo que nunca chega corrompido",c:"Os alunos baixam um instalador de 2 GB pelo Wi-Fi do campus, que perde pacotes com frequência. Mesmo assim o arquivo chega perfeito. Uma aluna desconfia: “Se pacotes se perdem, como o arquivo chega inteiro?”",tasks:["Explique com os mecanismos do TCP como a integridade é garantida.","Simule no caderno o envio de 5 segmentos em que o 3º se perde.","Explique por que o download fica mais lento quando há perdas."],a:"O TCP numera os bytes (números de sequência), o receptor envia ACKs e, se o remetente não recebe a confirmação de um segmento no tempo limite, ele o retransmite. Simulação: os segmentos 1 e 2 são confirmados; o 3 se perde; o receptor não confirma além do 2; o temporizador expira e o 3 é reenviado; depois 4 e 5 seguem. O download fica mais lento porque as perdas causam retransmissões e o controle de congestionamento reduz a taxa de envio."},
{t:"Rede congestionada no intervalo",c:"No intervalo, 300 estudantes usam o Wi-Fi ao mesmo tempo: uns em vídeo, outros baixando arquivos, outros em chamadas. Downloads ficam lentos e chamadas ficam picotadas.",tasks:["Explique como o TCP reage ao congestionamento.","Explique por que as chamadas (UDP) ficam picotadas em vez de lentas.","Proponha duas políticas de uso para o horário de pico."],a:"Ao detectar perda de pacotes, o TCP diminui a taxa de transmissão (controle de congestionamento), por isso os downloads ficam lentos, mas completos. O UDP não reduz a taxa nem retransmite, então os pacotes perdidos simplesmente faltam e o áudio fica picotado. Políticas possíveis: limitar banda de downloads grandes e atualizações no pico, priorizar tráfego de aulas e chamadas, agendar atualizações fora do horário."}
],

{s:"O UDP é um protocolo orientado à conexão.",v:false,j:"Falso. O UDP não estabelece conexão antes de enviar; quem faz isso é o TCP."},
{s:"O UDP garante que os pacotes cheguem na ordem correta.",v:false,j:"Falso. O UDP não garante entrega nem ordem."},
{s:"O TCP estabelece a conexão com o three-way handshake antes de enviar dados.",v:true,j:"Verdadeiro."},
{s:"A sequência correta do handshake é SYN, ACK, SYN-ACK.",v:false,j:"Falso. A ordem correta é SYN, SYN-ACK e ACK."},
{s:"O HTTPS usa a porta 443.",v:true,j:"Verdadeiro. O HTTP usa a 80."},
{s:"O DNS usa principalmente UDP na porta 53.",v:true,j:"Verdadeiro. Também pode usar TCP em alguns casos."},
{s:"O DHCP usa TCP nas portas 67 e 68.",v:false,j:"Falso. O DHCP usa UDP nas portas 67 e 68."},

{s:"O controle de congestionamento existe para proteger apenas o receptor.",v:false,j:"Falso. Ele protege a rede, reduzindo a taxa quando há perdas. Quem protege o receptor é o controle de fluxo."},
{s:"Se o remetente TCP não recebe o ACK dentro do tempo limite, ele retransmite os dados.",v:true,j:"Verdadeiro."},

{s:"Chamadas VoIP costumam usar UDP.",v:true,j:"Verdadeiro. Elas priorizam a fluidez da conversa."},
{s:"Na demultiplexação, o host de destino examina a porta de destino do segmento.",v:true,j:"Verdadeiro."},
{s:"A camada de transporte é executada nos roteadores do núcleo, e não nos hosts.",v:false,j:"Falso. O transporte é fim a fim: roda nos hosts de origem e destino. Roteadores trabalham até a camada de rede."},
{s:"O TCP atribui números de sequência aos bytes enviados.",v:true,j:"Verdadeiro. É assim que o receptor confirma e reordena os dados."}
]
}

paco:"No Capítulo 2, a Sra. IP coloca o segmento de Paco num datagrama com IP de origem 10.0.1.50 e destino 189.12.34.56. Nos Capítulos 3 e 4, o roteador do campus consulta a tabela de roteamento e o envia ao provedor; em cada roteador do backbone o bilhete (o IP) continua o mesmo.",
caderno:[
{q:"Quais são os dois grandes problemas que a camada de rede precisa resolver? Explique cada um.",a:"Endereçamento: todo dispositivo precisa de um identificador lógico e global, o endereço IP. Roteamento: quando o pacote atravessa várias redes, é preciso determinar o melhor caminho; os algoritmos de roteamento calculam as rotas e preenchem as tabelas dos roteadores."},
{q:"Diferencie roteamento de encaminhamento (forwarding).",a:"Roteamento é o cálculo das rotas pela rede, feito pelos algoritmos que preenchem as tabelas. Encaminhamento é a ação local de cada roteador: ao receber um pacote, consultar a tabela pelo IP de destino e enviá-lo pela interface do próximo salto."},
{q:"Compare IPv4 e IPv6 em tamanho, notação e quantidade de endereços.",a:"IPv4: 32 bits, decimal com pontos (ex.: 192.168.1.100), cerca de 4,3 bilhões de endereços, praticamente esgotados. IPv6: 128 bits, hexadecimal (ex.: 2001:0db8:85a3::8a2e:0370:7334), quantidade astronomicamente maior."},
{q:"Classifique cada endereço: 127.0.0.1; 192.168.0.15; 10.1.2.3; 8.8.8.8; 255.255.255.255.",a:"127.0.0.1: loopback (o próprio computador). 192.168.0.15: privado. 10.1.2.3: privado. 8.8.8.8: público (servidor DNS do Google). 255.255.255.255: broadcast na rede local."},
{q:"Descreva as quatro mensagens do DHCP em ordem e indique qual é enviada em broadcast e por quê.",a:"Discover: o cliente pede um IP em broadcast, pois ainda não tem endereço nem conhece o servidor. Offer: o servidor oferece um IP e configurações. Request: o cliente aceita e solicita formalmente. Ack: o servidor confirma a atribuição."},
{q:"O laboratório tem 30 PCs com IPs 192.168.10.x e o campus tem um único IP público. Explique como o NAT permite que todos acessem a internet ao mesmo tempo.",a:"Endereços privados não são roteados na internet. Ao sair, o roteador com NAT troca o IP privado de origem pelo IP público e anota numa tabela qual conexão (porta) pertence a qual PC. Quando a resposta volta ao IP público, ele consulta a tabela e devolve ao PC certo. Assim 30 máquinas compartilham um único IP público."},
{q:"Para o host 192.168.10.37 com máscara /24 (255.255.255.0), indique: endereço de rede, endereço de broadcast, primeiro e último host válidos e quantos hosts a rede comporta.",a:"Rede: 192.168.10.0. Broadcast: 192.168.10.255. Primeiro host: 192.168.10.1. Último host: 192.168.10.254. Hosts: 2^8 − 2 = 254 (tiram-se o endereço de rede e o de broadcast)."},
{q:"Escreva a função de cada comando: ipconfig; ipconfig /all; ipconfig /release; ipconfig /renew; ping; tracert.",a:"ipconfig: IP, máscara e gateway. /all: tudo, incluindo MAC, DHCP e DNS. /release: libera o IP obtido por DHCP. /renew: pede novo IP ao servidor DHCP. ping: testa a conectividade com outro dispositivo. tracert: mostra os roteadores do caminho até o destino."}
],
flash:[
{f:"Simplex, half-duplex, full-duplex",b:"Simplex: um sentido só (TV). Half: os dois sentidos, um de cada vez (walkie-talkie). Full: os dois ao mesmo tempo (telefone, Ethernet com switch)."},
{f:"Endereço IP",b:"Identificador lógico e global de um dispositivo na rede, como um CEP da internet."},
{f:"IPv4",b:"Versão do IP com endereços de 32 bits em decimal com pontos; cerca de 4,3 bilhões de endereços."},
{f:"IPv6",b:"Versão do IP com endereços de 128 bits em hexadecimal, criada para resolver o esgotamento do IPv4."},
{f:"Tabela de encaminhamento",b:"Tabela do roteador que indica, para cada destino, a interface ou o próximo salto."},
{f:"NAT",b:"Network Address Translation: o roteador troca IPs privados por um IP público, permitindo que vários dispositivos compartilhem um endereço."},
{f:"Notação /24 (CIDR)",b:"Indica quantos bits da esquerda são da rede. /24 = 255.255.255.0, com 254 hosts utilizáveis."},
{f:"Endereço privado",b:"Faixas usadas em redes locais, como 10.x.x.x e 192.168.x.x; não são roteadas na internet pública."},
{f:"DHCP",b:"Dynamic Host Configuration Protocol: atribui IP, máscara, gateway e DNS automaticamente."},
{f:"DORA",b:"Sequência do DHCP: Discover, Offer, Request, Ack."},
{f:"Gateway padrão",b:"Roteador que conecta a rede local a outras redes; destino dos pacotes que saem da LAN."},
{f:"Máscara de sub-rede",b:"Define qual parte do IP identifica a rede e qual identifica o host."}
],
pbl:[
{t:"Laboratório sem internet",c:"Segunda-feira de manhã, nenhum dos 30 computadores do laboratório acessa a internet. Em todos, o ipconfig mostra endereços que começam com 169.254. Na sexta-feira estava tudo funcionando.",tasks:["Interprete o endereço 169.254.x.x.","Monte uma sequência de testes com os comandos estudados.","Indique a provável causa e a solução."],a:"O 169.254.x.x é um endereço que o Windows atribui a si mesmo quando não recebe resposta do DHCP (APIPA). Isso indica que o DHCP Discover não foi respondido. Testes: ipconfig /all (confirmar DHCP habilitado e ausência de servidor), ipconfig /release e /renew (nova tentativa), ping ao gateway. Causa provável: servidor DHCP (ou roteador) desligado, travado ou desconectado do switch. Solução: religar ou verificar o servidor e os cabos, depois ipconfig /renew nas máquinas."},
{t:"Onde está a lentidão?",c:"O site de um órgão público demora muito para abrir a partir do campus, mas outros sites abrem rápido. A direção quer saber se o problema está na rede da escola.",tasks:["Explique como usar ping e tracert para investigar.","Interprete um tracert em que os 3 primeiros saltos respondem em 5 ms e o 9º em 380 ms.","Escreva a conclusão para a direção."],a:"Use ping ao gateway (testa a LAN), ping a 8.8.8.8 (testa a saída para a internet) e tracert até o site (mostra cada roteador e o tempo). Se os primeiros saltos, dentro do campus e do provedor local, estão em 5 ms e o atraso surge no 9º salto, a lentidão está fora da rede da escola, num roteador distante ou no próprio servidor do site. Conclusão: a rede local está funcionando; o problema está no caminho externo ou no servidor do órgão."},
{t:"Plano de endereçamento do laboratório",c:"Você vai organizar a rede de um laboratório com 25 estações, 1 servidor de arquivos, 1 impressora de rede e 1 roteador, usando a faixa 192.168.10.0.",tasks:["Decida quais dispositivos terão IP fixo e quais usarão DHCP.","Monte uma tabela de endereços.","Justifique as escolhas pensando em manutenção."],a:"IP fixo: roteador/gateway (ex.: 192.168.10.1), servidor (192.168.10.10) e impressora (192.168.10.20), pois outros dispositivos precisam encontrá-los sempre no mesmo endereço. Estações: DHCP (ex.: faixa 192.168.10.100 a .150), evitando configurar 25 máquinas à mão e erros de IP duplicado. A faixa do DHCP não deve incluir os IPs fixos. Documentar a tabela facilita a manutenção."},
{t:"Campanha IPv6",c:"O grêmio estudantil quer fazer uma campanha explicando por que a internet está migrando para o IPv6.",tasks:["Explique o problema do esgotamento do IPv4 com números.","Compare a notação dos dois endereços com exemplos.","Liste dois desafios da transição."],a:"O IPv4 tem 32 bits, cerca de 4,3 bilhões de endereços, insuficientes para celulares, computadores e dispositivos de IoT, e já estão praticamente esgotados. O IPv6 tem 128 bits, um número astronomicamente maior. Exemplos: 192.168.1.100 (IPv4) e 2001:0db8:85a3::8a2e:0370:7334 (IPv6). Desafios: equipamentos e sistemas antigos sem suporte, necessidade de conviver com os dois protocolos durante a transição e capacitação de técnicos."}
],
vf:[
{s:"Na transmissão half-duplex, os dois lados transmitem ao mesmo tempo.",v:false,j:"Falso. No half-duplex os dois lados transmitem, mas um de cada vez. Transmitir ao mesmo tempo é full-duplex."},
{s:"O IPv4 usa endereços de 128 bits.",v:false,j:"Falso. O IPv4 usa 32 bits; o IPv6 é que usa 128 bits."},
{s:"Endereços IPv6 são escritos em notação hexadecimal.",v:true,j:"Verdadeiro."},
{s:"Uma rede /24 tem 254 endereços utilizáveis para hosts.",v:true,j:"Verdadeiro. São 256 endereços, menos o de rede e o de broadcast."},
{s:"Um computador com IP 192.168.1.10 pode ser acessado diretamente por qualquer pessoa na internet usando esse endereço.",v:false,j:"Falso. 192.168.x.x é uma faixa privada, usada apenas em redes locais."},
{s:"O roteador consulta sua tabela de encaminhamento usando o IP de destino do pacote.",v:true,j:"Verdadeiro."},

{s:"A mensagem DHCP Discover é enviada em broadcast.",v:true,j:"Verdadeiro. O computador ainda não conhece o servidor DHCP."},
{s:"A ordem das mensagens DHCP é Discover, Request, Offer e Ack.",v:false,j:"Falso. A ordem é Discover, Offer, Request e Ack (DORA)."},
{s:"O endereço recebido por DHCP é permanente.",v:false,j:"Falso. Ele tem um tempo de concessão (lease time) e precisa ser renovado."},

{s:"O comando ipconfig /renew libera o endereço IP do computador.",v:false,j:"Falso. Quem libera é o /release; o /renew solicita um novo IP ao DHCP."},

{s:"Se o ping ao gateway funciona mas o ping a 8.8.8.8 falha, o problema provavelmente está além da rede local.",v:true,j:"Verdadeiro. A LAN está funcionando; a falha está na saída para a internet."},
{s:"O NAT permite que vários dispositivos com IP privado compartilhem um mesmo IP público.",v:true,j:"Verdadeiro. É assim que funcionam praticamente todas as redes domésticas e escolares."},
{s:"O gateway padrão geralmente é o roteador que conecta a rede local a outras redes.",v:true,j:"Verdadeiro."}
]

{
id:"m5", num:"V", layer:"Camada 2 · Enlace", title:"A Camada de Enlace",
objetivo:"Compreender o papel da camada de enlace, explicar as redes locais comutadas, diferenciar endereços MAC e IP, descrever o ARP e comparar switches e roteadores.",
conceitos:[
["Salto a salto","A rede vê a rota inteira; o enlace cuida de cada salto entre nós vizinhos."],
["Serviços","Enquadramento (quadro), acesso ao meio e detecção de erros (CRC)."],
["Switch × hub","O switch aprende MACs e envia só à porta certa; o hub repete para todas."],
["MAC","48 bits, hexadecimal, gravado na placa de rede; os 3 primeiros bytes (OUI) indicam o fabricante."],
["ARP","Requisição em broadcast (“quem tem este IP?”), resposta direta, cache na tabela ARP."],
["Quadro Ethernet","Preâmbulo 8 · MAC destino 6 · MAC origem 6 · Tipo 2 · Dados 46–1500 · CRC 4 bytes."],
["Unicast · multicast · broadcast","Para um destino, para um grupo, para todos da rede local."],
["Domínios","Hub: um só domínio de colisão. Switch: um por porta. Roteador separa domínios de broadcast."]
],
paco:"No Capítulo 2, o Sr. Enlace usa o megafone ARP para descobrir o MAC do roteador e veste Paco com o quadro e o CRC. No Capítulo 3, o switch do laboratório consulta a tabela MAC e envia Paco só pela porta 1. Em cada roteador, Paco troca de quadro, mas mantém o mesmo IP.",
caderno:[
{q:"Explique a diferença entre a visão da camada de rede e a visão da camada de enlace sobre o caminho de um pacote.",a:"A camada de rede tem a visão global da rota completa, da origem ao destino. A camada de enlace cuida de cada salto individual, levando o datagrama de um nó ao próximo nó diretamente conectado."},
{q:"Descreva os três principais serviços da camada de enlace.",a:"Enquadramento: encapsula o datagrama em um quadro com cabeçalho (MACs) e trailer (verificação). Acesso ao meio: coordena quem transmite quando o meio é compartilhado, evitando colisões. Detecção e correção de erros: adiciona bits de verificação, como o CRC."},
{q:"Por que o switch é mais eficiente que o hub?",a:"O hub repete os dados para todas as portas, causando colisões e desperdício de banda. O switch aprende os MACs ligados a cada porta (tabela MAC) e encaminha o quadro apenas para a porta do destinatário."},
{q:"Compare endereço IP e endereço MAC: tamanho, tipo (lógico ou físico), camada e se pode mudar.",a:"IP: lógico, camada de rede, 32 bits no IPv4, pode mudar conforme a rede (como o endereço de casa). MAC: físico, camada de enlace, 48 bits, gravado de fábrica na placa e, em princípio, não muda (como o CPF)."},
{q:"O computador A (192.168.1.10) quer enviar a B (192.168.1.20) na mesma LAN e não conhece o MAC de B. Descreva o ARP passo a passo.",a:"1) A envia uma requisição ARP em broadcast: quem tem 192.168.1.20? 2) Todos recebem; só B reconhece o próprio IP. 3) B responde diretamente a A com seu MAC. 4) A guarda o par IP–MAC na tabela ARP (cache), monta o quadro com o MAC de B e o envia."},
{q:"Desenhe a estrutura do quadro Ethernet com o tamanho de cada campo.",a:"Preâmbulo (8 bytes) | MAC destino (6) | MAC origem (6) | Tipo (2) | Dados/payload (46 a 1500) | CRC (4)."},
{q:"Monte uma tabela comparando switch e roteador em: camada, unidade de dados, endereçamento, função, tabela usada e broadcast.",a:"Switch: camada 2; quadro; MAC; conecta dispositivos na mesma LAN; tabela MAC (MAC → porta); encaminha broadcasts na LAN. Roteador: camada 3; pacote/datagrama; IP; conecta redes diferentes; tabela de roteamento (rede → próximo salto); bloqueia broadcasts entre redes."},
{q:"Diferencie domínio de colisão e domínio de broadcast. Diga como hub, switch e roteador afetam cada um.",a:"Domínio de colisão: conjunto de dispositivos cujas transmissões podem colidir entre si. Domínio de broadcast: conjunto que recebe um broadcast enviado por qualquer um deles. Hub: todas as portas formam um único domínio de colisão. Switch: cada porta é um domínio de colisão separado, mas todas ficam no mesmo domínio de broadcast. Roteador: separa domínios de broadcast (cada interface é um domínio)."}
],
flash:[
{f:"Quadro (frame)",b:"Unidade de dados da camada de enlace: datagrama encapsulado com cabeçalho e trailer."},
{f:"Unicast, multicast, broadcast",b:"Unicast: para um único destino. Multicast: para um grupo inscrito. Broadcast: para todos da rede local (MAC FF:FF:FF:FF:FF:FF)."},
{f:"CRC",b:"Cyclic Redundancy Check: código no final do quadro usado para detectar erros de transmissão."},
{f:"Endereço MAC",b:"Endereço físico de 48 bits (6 bytes), em hexadecimal, gravado na placa de rede."},
{f:"OUI",b:"Os 3 primeiros bytes do MAC, que identificam o fabricante da placa de rede."},
{f:"ARP",b:"Address Resolution Protocol: descobre o MAC correspondente a um IP da rede local."},
{f:"Domínio de broadcast",b:"Conjunto de dispositivos que recebem um broadcast. Switches o estendem; roteadores o limitam."},
{f:"Switch (comutador)",b:"Dispositivo de camada 2 que encaminha quadros apenas para a porta do destinatário."},
{f:"Hub",b:"Dispositivo antigo que repete os dados para todas as portas, causando colisões."},
{f:"Tabela MAC",b:"Tabela do switch que associa cada endereço MAC à porta onde ele está conectado."},
{f:"Ethernet",b:"Tecnologia de rede local com fio mais usada; define cabeamento e formato do quadro. 10 Mbps a 10 Gbps ou mais."},
{f:"Domínio de colisão",b:"Trecho da rede onde transmissões simultâneas colidem. No hub é um só; no switch, cada porta é um domínio."}
],
pbl:[
{t:"A escola ainda usa hubs",c:"Uma escola municipal parceira tem 3 hubs antigos ligando 40 computadores. Em dias de prova online, a rede fica lentíssima. A direção tem verba para trocar só um tipo de equipamento.",tasks:["Explique por que os hubs causam lentidão.","Argumente a troca por switches com termos técnicos.","Escreva um parágrafo simples para convencer a direção."],a:"O hub repete cada quadro para todas as portas, então todo o tráfego disputa o mesmo meio, gerando colisões e desperdício de banda; com 40 máquinas o desempenho despenca. O switch aprende os MACs, envia cada quadro só para o destino e permite várias comunicações simultâneas. Parágrafo: trocar os hubs por switches faz cada computador receber apenas o que é dele, o que reduz o congestionamento e deixa as provas online estáveis com o mesmo cabeamento."},
{t:"Quem é esse dispositivo?",c:"Ao rodar arp -a no laboratório, você encontra um MAC que não pertence a nenhum computador do inventário: 3C:5A:B4:xx:xx:xx.",tasks:["Explique o que a tabela ARP mostra.","Descreva como identificar o fabricante pelo MAC.","Proponha uma ação de segurança para dispositivos desconhecidos."],a:"A tabela ARP mostra os pares IP–MAC com que o computador se comunicou recentemente na LAN. Os 3 primeiros bytes (OUI, aqui 3C:5A:B4) identificam o fabricante; pode-se consultar um site como macvendors.com. Ação: localizar a porta do switch onde o MAC aparece (em switch gerenciável), verificar fisicamente o equipamento e manter um inventário de MACs autorizados."},
{t:"Enviando para fora da LAN",c:"O computador A (192.168.1.10) quer acessar um servidor da internet (189.12.34.56). Um colega afirma que o quadro que sai de A leva o MAC do servidor como destino.",tasks:["Avalie a afirmação do colega.","Explique qual MAC vai no quadro e qual IP vai no datagrama.","Descreva o que muda em cada roteador do caminho."],a:"A afirmação está errada. Como o destino está em outra rede, A envia o quadro ao gateway: o MAC de destino é o do roteador (descoberto por ARP), enquanto o IP de destino no datagrama continua 189.12.34.56. Em cada roteador o quadro é retirado e um novo é criado com os MACs do próximo salto, mas os IPs de origem e destino permanecem. É a ideia de trocar de ônibus mantendo o mesmo bilhete, da história do Paco."},
{t:"Switch gerenciável ou não gerenciável?",c:"O campus vai comprar switches para um novo bloco com 4 laboratórios e a área administrativa. O não gerenciável custa menos da metade.",tasks:["Pesquise e liste as diferenças entre os dois tipos.","Indique vantagens do gerenciável em rede corporativa.","Recomende uma combinação para o bloco e justifique."],a:"O não gerenciável é plug-and-play, sem configuração. O gerenciável permite configurar VLANs (separar laboratórios e administração), monitorar portas e tráfego, desativar portas, identificar onde cada MAC está e aplicar prioridade de tráfego. Recomendação razoável: gerenciáveis no núcleo do bloco e onde há dados sensíveis (administração); não gerenciáveis podem atender pontos simples. O critério é equilibrar custo, segurança e facilidade de diagnóstico."}
],

{s:"A requisição ARP é enviada diretamente (unicast) ao computador de destino.",v:false,j:"Falso. A requisição vai em broadcast para toda a LAN; a resposta é que vai diretamente ao solicitante."},
{s:"O switch encaminha o quadro apenas para a porta onde está o destinatário conhecido.",v:true,j:"Verdadeiro. Ele usa a tabela MAC."},

{s:"O cabeçalho do quadro Ethernet contém os endereços MAC de origem e de destino.",v:true,j:"Verdadeiro."},
{s:"Cada porta de um switch forma um domínio de colisão separado.",v:true,j:"Verdadeiro. Por isso o switch praticamente elimina as colisões que existiam com o hub."}

},
{
id:"m6", num:"VI", layer:"Camada 1 · Física", title:"Meios Físicos e Cabeamento",
objetivo:"Identificar e comparar coaxial, par trançado e fibra óptica, conhecer o padrão T568B e realizar a crimpagem de um cabo de par trançado.",
conceitos:[
["Coaxial","Condutor central, dielétrico, malha de blindagem e capa. Usado em TV a cabo, não em LANs modernas."],
["Par trançado","4 pares trançados contra EMI e diafonia; UTP, STP, FTP; conector RJ-45; até 100 m."],
["Categorias","CAT5e 1 Gbps · CAT6 10 Gbps até 55 m · CAT6a 10 Gbps até 100 m · CAT7 10 Gbps."],
["Fibra óptica","Pulsos de luz, reflexão interna total; monomodo (9 µm, dezenas de km) e multimodo (50–62,5 µm, até 2 km)."],
["T568B","BrL · L · BrVd · Az · BrAz · Vd · BrM · M (pinos 1 a 8)."],
["Direto × crossover","Direto: mesmo padrão nas duas pontas. Crossover: A numa e B na outra. Auto-MDIX."],
["Cabeamento estruturado","Tomada na área de trabalho → cabo horizontal → patch panel no rack → patch cord → switch."]
],
paco:"No Capítulo 2, no térreo, Paco vira sinais elétricos num cabo de par trançado (“como viajar dentro de uma corda”). No Capítulo 4, ele vira pulso de luz na fibra óptica do backbone amazônico, rápido e imune a interferências. No Capítulo 5, um surto de energia corrompe o pacote vizinho, e o CRC denuncia o erro.",
caderno:[
{q:"Descreva as quatro camadas da estrutura do cabo coaxial, de dentro para fora.",a:"Condutor de cobre central; isolamento dielétrico; malha metálica (blindagem contra interferência); capa externa de plástico (jaqueta)."},
{q:"Por que os fios do cabo de par trançado são trançados?",a:"O trançado ajuda a cancelar a interferência eletromagnética de fontes externas e a diafonia (crosstalk) entre pares vizinhos."},
{q:"Diferencie UTP, STP e FTP quanto à blindagem e ao uso típico.",a:"UTP: sem blindagem, o mais comum em casas e escritórios. STP: blindagem metálica, para ambientes com muito ruído elétrico, como fábricas. FTP: folha metálica geral, proteção intermediária."},
{q:"Monte a tabela das categorias CAT5e, CAT6, CAT6a e CAT7 com velocidade, frequência e uso.",a:"CAT5e: 1 Gbps, 100 MHz, redes domésticas e pequenos escritórios. CAT6: 10 Gbps até 55 m, 250 MHz, redes corporativas. CAT6a: 10 Gbps até 100 m, 500 MHz, data centers. CAT7: 10 Gbps, 600 MHz, ambientes industriais com alta interferência."},
{q:"Explique a estrutura da fibra óptica e o princípio da reflexão interna total. Compare monomodo e multimodo.",a:"Núcleo de vidro ou plástico muito fino, revestimento (cladding) que reflete a luz de volta ao núcleo e capa protetora. A luz fica presa no núcleo por reflexão interna total. Monomodo: núcleo de cerca de 9 µm, dezenas de km, telecomunicações. Multimodo: núcleo de 50 a 62,5 µm, até 2 km, redes locais de alta velocidade."},
{q:"Escreva de memória a sequência de cores do padrão T568B, do pino 1 ao 8.",a:"1 branco-laranja; 2 laranja; 3 branco-verde; 4 azul; 5 branco-azul; 6 verde; 7 branco-marrom; 8 marrom."},
{q:"Diferencie cabo direto e cabo cruzado (crossover). O que é Auto-MDIX?",a:"Direto: mesmo padrão nas duas pontas (T568B–T568B), liga dispositivos diferentes, como PC a switch; é o mais comum. Crossover: T568A numa ponta e T568B na outra, ligava dispositivos iguais, como PC a PC. Auto-MDIX é a função dos equipamentos modernos que detecta e ajusta automaticamente, tornando o crossover menos necessário."},
{q:"Um laboratório tem 20 computadores, distância média de 8 m até o rack, folga de 2 m por cabo e 2 conectores extras por cabo. Calcule metros de cabo e conectores RJ-45.",a:"Cabo: 20 × (8 + 2) = 200 metros. Conectores: cada cabo usa 2 conectores + 2 extras = 4; 20 × 4 = 80 conectores RJ-45."}
],
flash:[
{f:"Cabeamento estruturado",b:"Sistema organizado e padronizado de cabos: tomadas, cabeamento horizontal, patch panel, rack e patch cords, com identificação de cada ponto."},
{f:"Cabo coaxial",b:"Condutor central blindado por malha metálica; usado em TV a cabo e internet via cabo."},
{f:"UTP",b:"Unshielded Twisted Pair: par trançado sem blindagem, o mais comum em LANs."},
{f:"STP",b:"Shielded Twisted Pair: par trançado com blindagem metálica, para ambientes com ruído elétrico."},
{f:"Diafonia (crosstalk)",b:"Interferência de sinal entre pares de fios vizinhos; reduzida pelo trançado."},
{f:"RJ-45",b:"Conector de 8 pinos usado nos cabos de par trançado em redes Ethernet."},
{f:"Distância máxima do UTP",b:"Até 100 metros por segmento em redes Ethernet."},

{f:"Cabo direto",b:"Mesmo padrão nas duas pontas; liga dispositivos diferentes, como PC a switch."},

],
pbl:[
{t:"A rede da oficina de solda",c:"O laboratório de mecânica, ao lado de máquinas de solda e motores, vai receber 6 computadores. Os cabos UTP instalados no ano passado apresentam quedas constantes.",tasks:["Explique por que o UTP falha nesse ambiente.","Compare STP e fibra óptica para o caso.","Recomende o meio físico e justifique custo e desempenho."],a:"Motores e máquinas de solda geram forte interferência eletromagnética, e o UTP não tem blindagem. STP tem blindagem metálica e resolve na maioria dos casos com custo moderado e mesmos conectores RJ-45 (blindados). A fibra tem imunidade total à EMI, mas custa mais e exige equipamentos específicos. Recomendação comum: STP para os 6 pontos; fibra se a interferência for extrema ou se o link até o rack for longo."},
{t:"Ligando dois blocos a 600 metros",c:"O campus vai ligar a rede do bloco de laboratórios à biblioteca, que fica a 600 m. Um aluno sugere um cabo CAT6 bem longo.",tasks:["Avalie a sugestão do aluno.","Escolha o tipo de fibra e justifique.","Liste o que mais será necessário na instalação."],a:"O par trançado tem limite de 100 m por segmento em Ethernet, então 600 m de CAT6 não funcionaria. Fibra multimodo atende até cerca de 2 km e é adequada para redes locais; a monomodo também funciona, mas é voltada a dezenas de km. Também serão necessários: equipamentos com portas ou módulos ópticos (ou conversores de mídia), passagem protegida para a fibra e mão de obra especializada para emendas e conectorização."},
{t:"O cabo que não passa no teste",c:"Ao testar um cabo recém-crimpado, os LEDs acendem na ordem 1, 2, 6, 4, 5, 3, 7, 8 no lado remoto.",tasks:["Interprete o resultado do testador.","Diga quais cores provavelmente foram trocadas no padrão T568B.","Descreva como refazer o cabo corretamente."],a:"Os pinos 3 e 6 estão invertidos: o cabo está fora do padrão e precisa ser refeito. No T568B, o pino 3 é branco-verde e o 6 é verde, então os fios do par verde foram colocados em posições trocadas numa das pontas. Correção: cortar o conector errado, decapar 2 a 3 cm, ordenar BrL, L, BrVd, Az, BrAz, Vd, BrM, M, cortar alinhado em cerca de 1,2 cm, inserir com o clipe para baixo, crimpar e testar novamente."},
{t:"Orçamento do novo laboratório",c:"Um laboratório com 30 computadores terá o switch num rack. A distância média de cada computador ao rack é 12 m. Use folga de 2 m por cabo e 2 conectores extras por cabo. O cabo é vendido em caixas de 305 m.",tasks:["Calcule os metros de cabo necessários.","Calcule a quantidade de conectores RJ-45.","Calcule quantas caixas de cabo comprar e escolha a categoria."],a:"Cabo: 30 × (12 + 2) = 420 m. Conectores: 30 × (2 + 2) = 120. Caixas: 420 ÷ 305 ≈ 1,38, então 2 caixas. Categoria: CAT6 é boa escolha para laboratório atual (1 Gbps com folga e 10 Gbps em trechos curtos); CAT5e atende 1 Gbps com custo menor."}
],

MODULES.push({
id:"m7", num:"VII", layer:"Enlace + Física · Sem fio", title:"Redes Sem Fio IEEE 802.11",
objetivo:"Compreender o funcionamento das redes locais sem fio, comparar os padrões IEEE 802.11, explicar o acesso ao meio com CSMA/CA, planejar canais e configurar a segurança de uma WLAN.",
conceitos:[
["WLAN e Wi-Fi","Rede local sem fio padronizada pelo IEEE 802.11; Wi-Fi é a marca da Wi-Fi Alliance."],
["Componentes","Estações (STA), ponto de acesso (AP), SSID (nome da rede). Modos infraestrutura e ad hoc."],
["Padrões","b e g (2,4 GHz), a (5 GHz), n/Wi-Fi 4, ac/Wi-Fi 5, ax/Wi-Fi 6 e 6E, be/Wi-Fi 7."],
["CSMA/CA","Escuta o meio e evita colisões com espera aleatória e ACK; o rádio não detecta colisão enquanto transmite."],
["Canais 2,4 GHz","Só 1, 6 e 11 não se sobrepõem. Em 5 GHz há mais canais e menos interferência, com menor alcance."],
["Segurança","WEP é inseguro; WPA2 (AES) é o mínimo aceitável; WPA3 (SAE) é o recomendado. Desativar WPS."]
],
paco:"Imagine o fim da viagem de Paco com Beto no celular, e não no computador. O roteador doméstico de Beto também é ponto de acesso Wi-Fi (Capítulo 6). Nesse caso, o último salto de Paco não seria por cobre: ele viraria ondas de rádio de 2,4 ou 5 GHz, esperando a vez de falar no ar com CSMA/CA e protegido pela criptografia WPA2 ou WPA3.",
caderno:[
{q:"Diferencie o modo infraestrutura do modo ad hoc em redes 802.11 e dê um exemplo de uso de cada.",a:"Infraestrutura: as estações se comunicam por meio de um ponto de acesso (AP), que geralmente liga a WLAN à rede cabeada; é o modo de casas, escolas e empresas. Ad hoc: as estações se comunicam diretamente entre si, sem AP; ex.: dois notebooks trocando arquivos sem roteador ou um celular servindo de ponto entre dispositivos."},
{q:"Monte uma tabela com os padrões 802.11b, a, g, n, ac e ax, informando faixa de frequência e nome comercial quando houver.",a:"802.11b: 2,4 GHz, até 11 Mbps. 802.11a: 5 GHz, até 54 Mbps. 802.11g: 2,4 GHz, até 54 Mbps. 802.11n (Wi-Fi 4): 2,4 e 5 GHz, até 600 Mbps com MIMO. 802.11ac (Wi-Fi 5): 5 GHz, taxas na casa dos Gbps. 802.11ax (Wi-Fi 6): 2,4 e 5 GHz; Wi-Fi 6E acrescenta 6 GHz. Os valores são taxas teóricas máximas."},
{q:"Por que o Wi-Fi usa CSMA/CA, e não CSMA/CD como a Ethernet antiga?",a:"Num rádio, a estação não consegue ouvir o meio enquanto transmite, então não detecta colisões (o que o CD exige). Por isso o 802.11 tenta evitá-las: escuta o canal, espera um tempo aleatório antes de transmitir e confirma cada quadro com ACK; se o ACK não chega, retransmite."},
{q:"Explique o problema do terminal oculto e como o RTS/CTS ajuda a resolvê-lo.",a:"Duas estações A e C alcançam o AP, mas não ouvem uma à outra (distância ou parede). Ambas acham o canal livre e transmitem juntas, colidindo no AP. Com RTS/CTS, a estação pede permissão (RTS) e o AP responde CTS para todos; quem ouve o CTS fica em silêncio pelo tempo reservado."},
{q:"No Brasil, a faixa de 2,4 GHz tem canais de 1 a 13. Quais canais não se sobrepõem e por que isso importa ao instalar vários APs?",a:"Os canais 1, 6 e 11 (com largura de 20 MHz). APs vizinhos em canais sobrepostos interferem entre si e perdem desempenho; distribuindo-os em 1, 6 e 11, cada AP usa uma fatia do espectro sem sobreposição com os vizinhos."},
{q:"Compare as faixas de 2,4 GHz e 5 GHz quanto a alcance, atravessar paredes, interferência e quantidade de canais.",a:"2,4 GHz: maior alcance e atravessa melhor paredes, mas tem só 3 canais não sobrepostos e sofre interferência de micro-ondas, Bluetooth e redes vizinhas. 5 GHz: alcance menor e atravessa pior obstáculos, mas tem muito mais canais, menos interferência e taxas maiores."},
{q:"Ordene do menos seguro ao mais seguro e justifique: WPA2-AES, rede aberta, WEP, WPA3.",a:"Rede aberta (sem criptografia) < WEP (criptografia quebrável em minutos) < WPA2-AES (seguro com senha forte) < WPA3 (usa SAE, mais resistente a ataques de dicionário contra a senha). Além disso, recomenda-se desativar o WPS, que tem vulnerabilidades."},
{q:"Liste cinco fatores que reduzem o sinal ou o desempenho de uma rede Wi-Fi em uma sala de aula.",a:"Distância até o AP; paredes e lajes de concreto ou metal; interferência de micro-ondas, Bluetooth e outros APs no mesmo canal; excesso de dispositivos conectados disputando o meio (half-duplex); AP mal posicionado (no chão, dentro de armário). Também conta usar padrões antigos na rede, que obrigam o AP a trabalhar mais devagar."}
],
flash:[
{f:"IEEE 802.11",b:"Família de padrões do IEEE para redes locais sem fio (WLAN)."},
{f:"Wi-Fi",b:"Marca da Wi-Fi Alliance que certifica a compatibilidade de equipamentos 802.11."},
{f:"Ponto de acesso (AP)",b:"Equipamento que cria a rede sem fio e liga as estações à rede cabeada."},
{f:"SSID",b:"Nome da rede sem fio anunciado pelo ponto de acesso."},
{f:"Modo ad hoc",b:"Estações sem fio que se comunicam diretamente, sem ponto de acesso."},
{f:"CSMA/CA",b:"Acesso ao meio com prevenção de colisões: escuta o canal, espera um tempo aleatório e confirma com ACK."},
{f:"Terminal oculto",b:"Duas estações que não se ouvem transmitem ao mesmo tempo e colidem no AP. Mitigado com RTS/CTS."},

{f:"dBm (intensidade do sinal)",b:"Medida da potência recebida. Perto de −30 dBm é excelente, −67 dBm é bom para voz e vídeo, abaixo de −80 dBm a conexão fica instável."}
],
pbl:[
{t:"Wi-Fi do bloco de salas",c:"Três salas vizinhas (A, B e C) terão cada uma um ponto de acesso de 2,4 GHz. Hoje os três vêm de fábrica no canal 6 e a internet fica péssima no horário das aulas.",tasks:["Explique por que o canal de fábrica causa problema.","Defina o canal de cada AP e justifique.","Proponha o que fazer se fosse necessário um quarto AP próximo."],a:"Três APs vizinhos no mesmo canal disputam o mesmo meio: com CSMA/CA, um espera o outro e a interferência aumenta as retransmissões. A distribuição correta é A no canal 1, B no 6 e C no 11, os únicos sem sobreposição em 2,4 GHz. Para um quarto AP, o melhor é usar a faixa de 5 GHz, que tem muito mais canais, ou reaproveitar o canal do AP mais distante, reduzindo a potência de transmissão."},
{t:"Rede de convidados na feira de ciências",c:"Na feira de ciências, visitantes vão precisar de internet. A coordenação quer usar a mesma rede Wi-Fi da secretaria, com a senha atual, para facilitar.",tasks:["Aponte os riscos da proposta.","Proponha uma configuração segura.","Escreva as orientações para colocar na entrada do evento."],a:"Compartilhar a rede da secretaria expõe computadores e sistemas administrativos aos visitantes e espalha a senha. Configuração segura: criar uma rede de convidados com SSID próprio, isolada da rede interna, com WPA2 ou WPA3 e senha temporária trocada após o evento; desativar o WPS e limitar a banda por dispositivo. A orientação para os visitantes traz apenas o nome da rede de convidados e a senha temporária."},
{t:"O sinal some no fundo da sala",c:"O roteador Wi-Fi da sala de informática fica dentro de um armário de metal, no chão, no canto da sala. Os alunos do fundo veem sinal de −82 dBm e a conexão cai.",tasks:["Interprete a medida de −82 dBm.","Liste as causas prováveis.","Proponha um novo posicionamento e outras melhorias."],a:"−82 dBm é um sinal fraco, abaixo do aceitável para uso estável (o ideal para voz e vídeo é algo melhor que −67 dBm). Causas: armário de metal bloqueia e reflete o sinal, posição no chão e no canto da sala, distância. Melhorias: instalar o AP no alto e no centro da sala, fora do armário; verificar o canal; se ainda faltar cobertura, adicionar um segundo AP cabeado, em vez de repetidor, para não dividir a banda."},
{t:"Escolhendo o roteador do laboratório",c:"O laboratório terá 35 notebooks usando a rede ao mesmo tempo. Há dois orçamentos: um roteador 802.11n (Wi-Fi 4) barato e um AP 802.11ax (Wi-Fi 6) mais caro.",tasks:["Compare os dois padrões para esse cenário.","Leve em conta as faixas de frequência e a quantidade de dispositivos.","Escreva a recomendação com justificativa."],a:"O Wi-Fi 4 atende poucos dispositivos e tende a sofrer com 35 notebooks disputando o meio. O Wi-Fi 6 (802.11ax) foi projetado para ambientes densos: usa OFDMA para atender vários dispositivos na mesma transmissão, opera em 2,4 e 5 GHz e oferece taxas maiores. Recomendação: o AP Wi-Fi 6, de preferência configurado para 5 GHz nos notebooks, desde que eles tenham placas compatíveis; caso contrário, o ganho será parcial."}
],

id:"m8", num:"I-B", layer:"Visão geral · parte 2", title:"Tipos de Rede, Topologias e Padrões da Internet",
objetivo:"Classificar as redes pela abrangência geográfica, comparar as topologias física e lógica, com vantagens e desvantagens de cada uma, e entender como a IETF padroniza os protocolos da internet por meio das RFCs.",
conceitos:[
["PAN","Rede pessoal de poucos metros (até cerca de 10 m): fone Bluetooth, relógio inteligente e celular."],
["LAN e WLAN","Rede local de casa, escola ou escritório; a WLAN é a LAN sem fio (Wi-Fi)."],
["MAN","Rede metropolitana: prédios de uma empresa ou escolas espalhadas por uma mesma cidade."],
["WAN","Longa distância, entre estados, países e continentes. A internet é o maior exemplo."],
["SAN","Rede de alta velocidade que liga servidores a sistemas de armazenamento (storages) em data centers."],
["Topologia física × lógica","A física é o desenho dos cabos e equipamentos; a lógica é o caminho que os dados percorrem."],
["Estrela · barramento · anel","Ponto central; cabo único compartilhado; circuito fechado de nó em nó."],

paco:"Paco atravessa vários tipos de rede: nasce na LAN do laboratório de Ana, ligada em estrela ao switch, segue pela rede metropolitana do provedor de Coari, entra na WAN do backbone amazônico e chega à LAN de Beto, em Manaus. As regras que ele obedece em cada andar foram escritas em RFCs da IETF: o IP na RFC 791 e o TCP na RFC 793, hoje atualizada pela RFC 9293.",
caderno:[
{q:"Classifique cada rede como PAN, LAN, MAN, WAN ou SAN: relógio inteligente ligado ao celular; Wi-Fi da sua casa; fibra que liga as escolas de uma prefeitura na mesma cidade; a internet; rede que liga os servidores de um data center aos storages. Diga o critério usado.",a:"Relógio + celular = PAN. Wi-Fi de casa = LAN (WLAN). Escolas da cidade = MAN. Internet = WAN. Servidores + storages = SAN. As quatro primeiras são classificadas pela abrangência geográfica; a SAN é classificada pela finalidade (armazenamento), não pelo tamanho."},
{q:"O que é uma SAN e por que ela costuma ser separada da LAN dos usuários?",a:"SAN (Storage Area Network) é uma rede de alta velocidade dedicada a ligar servidores a sistemas de armazenamento, como storages de data center. É separada da LAN para que o tráfego pesado de leitura e escrita de discos não congestione a rede dos usuários, e para garantir desempenho e confiabilidade ao armazenamento. Usa tecnologias como Fibre Channel ou iSCSI."},
{q:"Desenhe as topologias estrela, barramento, anel, árvore, malha e híbrida. Ao lado de cada desenho, escreva uma vantagem e uma desvantagem.",a:"Estrela: falha de um cabo afeta só um dispositivo | se o equipamento central parar, a rede cai. Barramento: barato e fácil de instalar | rompimento do cabo principal derruba tudo e há colisões. Anel: fluxo organizado, de nó em nó | no anel simples, a falha de um nó interrompe a comunicação. Árvore: escalável e hierárquica, boa para grandes empresas | depende do nó raiz e dos ramos superiores. Malha: muito confiável, com caminhos redundantes | cara e complexa. Híbrida: adapta-se a estruturas grandes combinando topologias | projeto e manutenção mais complexos."},
{q:"Explique a diferença entre topologia física e topologia lógica usando o exemplo de uma rede com hub.",a:"Fisicamente, todos os computadores estão ligados por cabos a um ponto central, então a topologia física é estrela. Porém o hub repete cada sinal para todas as portas, então os dados se comportam como num cabo compartilhado: a topologia lógica é barramento. Com um switch, a lógica deixa de ser barramento, porque cada quadro vai só para a porta de destino."},
{q:"Por que a falha de um único nó pode interromper um anel simples? Como o anel duplo resolve esse problema?",a:"No anel simples os dados circulam num único sentido, passando de nó em nó; se um nó ou trecho falha, o círculo se rompe e os dados não conseguem completar o caminho. No anel duplo existe um segundo anel no sentido contrário: quando um trecho falha, os nós vizinhos fecham o circuito pelo outro anel e a comunicação continua."},
{q:"Numa malha completa, cada nó se liga diretamente a todos os outros. Quantos enlaces são necessários para 5 nós? E para 10 nós? Use a fórmula n(n − 1) ÷ 2 e explique o impacto no custo.",a:"5 nós: 5 × 4 ÷ 2 = 10 enlaces. 10 nós: 10 × 9 ÷ 2 = 45 enlaces. O número de cabos e portas cresce muito mais rápido que o número de nós, por isso a malha completa é cara. Na prática usa-se malha parcial, ligando com redundância só os pontos críticos, como os roteadores do núcleo."},
{q:"O que é a IETF, como ela funciona e por que ela é importante para a internet?",a:"A IETF (Internet Engineering Task Force, ou Força-Tarefa de Engenharia da Internet) é a principal organização que cria e atualiza os padrões técnicos dos protocolos da internet, como TCP/IP, HTTP, DNS e IPv6. É uma comunidade aberta: qualquer pessoa pode participar das listas e reuniões, e as decisões são tomadas por consenso dentro de grupos de trabalho temáticos (segurança, roteamento, transporte, IoT). Sem padrões comuns, cada fabricante criaria suas próprias regras e a internet ficaria fragmentada."},
{q:"O que é uma RFC? Cite três exemplos de RFCs de protocolos estudados e explique por que uma RFC antiga é substituída por outra, em vez de ser editada.",a:"RFC (Request for Comments) é o documento em que a IETF publica especificações, padrões e informações sobre a internet, de forma pública e gratuita. Exemplos: RFC 791 (IP), RFC 793 (TCP, atualizada pela RFC 9293 em 2022), RFC 768 (UDP), RFC 2616 (HTTP/1.1, depois substituída pelas RFCs 7230 a 7235 e hoje pelas 9110 a 9112). Uma RFC publicada nunca é alterada: quando o protocolo evolui, sai uma nova RFC que a atualiza ou a torna obsoleta. Assim o histórico fica preservado e todos sabem exatamente qual versão estão seguindo."}
],
flash:[
{f:"PAN",b:"Personal Area Network: rede pessoal de poucos metros (até cerca de 10 m). Ex.: fone Bluetooth e celular."},
{f:"LAN",b:"Local Area Network: rede de um espaço restrito, como casa, escola ou escritório. O Wi-Fi doméstico é uma WLAN."},
{f:"MAN",b:"Metropolitan Area Network: abrange uma cidade ou região metropolitana, como prédios de uma empresa ou escolas de um município."},
{f:"WAN",b:"Wide Area Network: conecta redes entre estados, países e continentes. A internet é o maior exemplo."},
{f:"SAN",b:"Storage Area Network: rede de alta velocidade que liga servidores a sistemas de armazenamento em data centers."},
{f:"Topologia física × lógica",b:"Física: como cabos e equipamentos estão dispostos. Lógica: como os dados realmente circulam."},
{f:"Topologia em barramento",b:"Todos os dispositivos compartilham um único cabo principal. Barata, mas se o cabo romper a rede inteira para."},
{f:"Topologia em anel",b:"Os dados circulam de nó em nó num circuito fechado. No anel simples, a falha de um nó pode parar toda a comunicação."},
{f:"Topologia em árvore",b:"Estrutura hierárquica, como estrelas ligadas em níveis. Muito escalável, mas depende da raiz e dos ramos superiores."},
{f:"Topologia em malha (mesh)",b:"Cada nó se liga a vários ou a todos os outros. Altíssima confiabilidade, porém cara e complexa."},
{f:"IETF",b:"Internet Engineering Task Force: comunidade aberta que cria e evolui os padrões dos protocolos da internet por consenso."},
{f:"RFC",b:"Request for Comments: documento público e gratuito em que a IETF publica os padrões da internet. Ex.: RFC 791 (IP)."}
